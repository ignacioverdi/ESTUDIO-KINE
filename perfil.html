<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi perfil · Estudio</title>
<link rel="icon" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05070B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estudio">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="css/tema.css">
<link rel="stylesheet" href="css/estudio.css">
<script src="js/firebase.js" onerror="void 0"></script>
<script src="js/datos.js"></script><script src="js/plantillas.js"></script><script src="js/agenda.js"></script>
<script src="js/qr.js"></script><script src="js/historia.js"></script><script src="js/estudios.js"></script>
<script src="js/dinero.js"></script><script src="js/atender.js"></script><script src="js/mensajes.js"></script><script src="js/alertas.js"></script><script src="js/recordatorios.js"></script><script src="js/asistente.js"></script>
<script src="js/ayuda.js"></script><script src="js/acceso.js"></script><script src="js/base.js"></script>
<style>
  .retrato{width:120px;height:120px;border-radius:50%;object-fit:cover;
    border:2px solid var(--linea2);background:var(--sup2);display:block}
  .retrato-vacio{width:120px;height:120px;border-radius:50%;border:2px dashed var(--linea2);
    background:var(--sup2);display:flex;align-items:center;justify-content:center;
    color:var(--tinta3);font-family:var(--dat);font-size:11px;text-align:center;padding:10px}
  .logo-prev{max-width:170px;max-height:70px;object-fit:contain;display:block}
</style>
</head>
<body data-pag="perfil">
<div class="hoja angosta" id="todo"></div>
<script>
/* El perfil vive en config.json en producción. Acá se guarda igual que
   todo lo demás, para poder editarlo desde la app sin tocar archivos. */
/* El perfil vive en los datos y se guarda como todo lo demas. */
function perfil(){
  if(!BASE.perfil) BASE.perfil = {nombre:'', matricula:'', estudio:'', club:'',
    tel:'', email:'', clave:'estudio', direccion:'', presentacion:'', foto:null, logo:null};
  return BASE.perfil;
}

function pintar(){
  var P = perfil();
  document.getElementById('todo').innerHTML =
    '<h1 class="tit">Mi perfil</h1>'
    + '<p class="bajada">Esto es lo que ve el paciente cuando entra al portal, y lo que sale '
    + 'impreso en el cartel y en la historia clínica.</p>'
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Tu foto</h2>'
    + '<span class="eti">Se ve en el cartel y en el inicio</span></div>'
    + '<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">'
    + (P.foto ? '<img class="retrato" src="' + P.foto + '" alt="Tu foto">'
              : '<div class="retrato-vacio">Sin foto</div>')
    + '<div style="flex:1;min-width:200px">'
    + '<input type="file" id="fFoto" accept="image/*" style="display:none" '
    + 'onchange="subirImagen(this,\'foto\',400)">'
    + '<button class="bt hueco" onclick="document.getElementById(\'fFoto\').click()">'
    + (P.foto ? 'Cambiar la foto' : 'Elegir una foto') + '</button>'
    + (P.foto ? ' <button class="bt neutro" onclick="borrar(\'foto\')">Quitar</button>' : '')
    + '<p style="font-size:13px;color:var(--tinta3);margin-top:10px">Se achica sola a 400 '
    + 'píxeles antes de guardarse, así no pesa.</p></div></div></div>'
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">El logo del estudio</h2></div>'
    + '<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">'
    + (P.logo ? '<img class="logo-prev" src="' + P.logo + '" alt="Logo">'
              : '<div class="retrato-vacio" style="border-radius:var(--r);width:170px;height:70px">Sin logo</div>')
    + '<div style="flex:1;min-width:200px">'
    + '<input type="file" id="fLogo" accept="image/*" style="display:none" '
    + 'onchange="subirImagen(this,\'logo\',600)">'
    + '<button class="bt hueco" onclick="document.getElementById(\'fLogo\').click()">'
    + (P.logo ? 'Cambiar el logo' : 'Elegir un logo') + '</button>'
    + (P.logo ? ' <button class="bt neutro" onclick="borrar(\'logo\')">Quitar</button>' : '')
    + '</div></div></div>'
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Tus datos</h2></div>'
    + campo('nombre', 'Nombre y apellido')
    + campo('matricula', 'Matrícula y título')
    + '<div class="rejilla c2">' + campo('estudio', 'Nombre del estudio') + campo('club', 'Club') + '</div>'
    + '<div class="rejilla c2">' + campo('tel', 'Teléfono') + campo('email', 'Correo') + '</div>'
    + campo('direccion', 'Dirección')
    + '</div>'
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Tu acceso</h2>'
    + '<span class="eti">Con esto entrás vos</span></div>'
    + '<p style="color:var(--tinta2);font-size:14px;margin-bottom:14px">'
    + 'El correo de arriba y esta contraseña son los que usás para entrar al estudio. '
    + 'Los pacientes entran distinto: con su documento y su fecha de nacimiento, sin contraseña.</p>'
    + '<label class="campo" style="margin-bottom:0"><span class="eti">Contraseña</span>'
    + '<input type="password" id="c_clave" value="' + (P.clave || 'estudio') + '" '
    + 'oninput="tocar(\'clave\',this.value)"></label>'
    + '</div>'
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Quién sos</h2>'
    + '<span class="eti">Lo lee el paciente nuevo</span></div>'
    + '<textarea id="c_presentacion" style="min-height:120px" '
    + 'oninput="tocar(\'presentacion\',this.value)">' + (P.presentacion || '') + '</textarea>'
    + '<p style="font-size:13px;color:var(--tinta3);margin-top:8px">Escribilo como se lo '
    + 'contarías a alguien en la sala de espera, no como un currículum.</p></div>'
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Preguntas frecuentes</h2>'
    + '<span class="eti">Las contesta el portal</span></div>'
    + '<p style="color:var(--tinta2);font-size:14px;margin-bottom:14px">'
    + 'Cuando un paciente va a escribirte, primero ve estas preguntas y sus respuestas. '
    + 'Las de siempre se contestan solas y no te llegan.</p>'
    + '<div class="nota aviso">Son preguntas <b>administrativas</b>: dónde queda, qué llevar, '
    + 'cómo cancelar. Nada clínico. Si el paciente pregunta si puede entrenar o si un dolor es '
    + 'normal, eso te llega a vos: un texto automático no puede contestar eso sin haber visto '
    + 'nada.</div>'
    + preguntasFrecuentes().map(function(f, n){
        return '<div style="border:var(--borde) solid var(--linea);border-radius:var(--r);'
          + 'padding:12px;margin-bottom:9px">'
          + '<label class="campo"><span class="eti">Pregunta</span>'
          + '<input type="text" value="' + f.p.replace(/"/g,'&quot;') + '" '
          + 'onchange="editarFaq(' + n + ',\'p\',this.value)"></label>'
          + '<label class="campo" style="margin-bottom:0"><span class="eti">Respuesta</span>'
          + '<textarea onchange="editarFaq(' + n + ',\'r\',this.value)">' + f.r + '</textarea></label>'
          + '<button class="bt neutro chico" style="margin-top:8px" onclick="quitarFaq(' + n + ')">'
          + 'Quitar</button></div>';
      }).join('')
    + '<button class="bt hueco ancho" onclick="sumarFaq()">+ Agregar una pregunta</button>'
    + '</div>'

    + '<div id="aviso"></div>'
    + '<button class="bt ancho" onclick="guardarPerfil()">Guardar</button>'
    /* Vaciar es lo último de la pantalla y no se puede deshacer. Va
       separado, explicado, y pide escribir una palabra: un botón suelto
       que borra todo se toca sin querer. */
    + (esDemo()
        ? '<div class="tarjeta" style="margin-top:26px;border-color:var(--ambar-borde)">'
          + '<div class="tarjeta-cab"><h2 class="sub">Empezar de cero</h2>'
          + '<span class="eti">Una sola vez</span></div>'
          + '<p style="color:var(--tinta2);margin-bottom:14px">El portal viene con pacientes '
          + 'inventados para que se vea andando: Marcela Ríos, Diego Sosa y los demás no existen. '
          + '<b>Antes de cargar el primer paciente de verdad, vaciá todo.</b> Si no, dentro de un '
          + 'mes no vas a saber cuál es real y cuál no.</p>'
          + '<p style="color:var(--tinta2);margin-bottom:14px">Se borran los pacientes, las '
          + 'lesiones, las historias, los turnos y la caja. <b>No</b> se borran las plantillas de '
          + 'lesión, la biblioteca de ejercicios, tu perfil ni el horario del estudio: eso es la '
          + 'herramienta, no los datos.</p>'
          + '<div class="nota reserva">Esto no se puede deshacer.</div>'
          + '<label class="campo"><span class="eti">Escribí VACIAR para confirmar</span>'
          + '<input type="text" id="cVaciar" placeholder="VACIAR"></label>'
          + '<button class="bt ancho" style="background:var(--rojo);border-color:var(--rojo)" '
          + 'onclick="confirmarVaciado()">Vaciar y empezar de cero</button>'
          + '</div>'
        : '<div class="nota bien" style="margin-top:26px">El portal está limpio. Los datos de '
          + 'demostración se borraron y no vuelven.</div>');
}
function campo(k, l){
  var P = perfil();
  return '<label class="campo"><span class="eti">' + l + '</span>'
    + '<input type="text" id="c_' + k + '" value="' + (P[k] || '').replace(/"/g,'&quot;') + '" '
    + 'oninput="tocar(\'' + k + '\',this.value)"></label>';
}
function tocar(k, v){ perfil()[k] = v; }
/* Las imágenes se achican antes de guardarse. Una foto de celular pesa
   cuatro megas: guardada tal cual, la app tarda una eternidad en abrir
   y Firebase la rechaza. Reducida a 400 píxeles pesa cuarenta kilos. */
function subirImagen(input, destino, lado){
  var f = input.files && input.files[0];
  if(!f) return;
  var lector = new FileReader();
  lector.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var esc = Math.min(1, lado / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * esc);
      c.height = Math.round(img.height * esc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      perfil()[destino] = c.toDataURL('image/jpeg', 0.82);
      pintar();
    };
    img.src = ev.target.result;
  };
  lector.readAsDataURL(f);
}
function borrar(k){ perfil()[k] = null; pintar(); }
function sumarFaq(){
  preguntasFrecuentes().push({p:'Nueva pregunta', r:'La respuesta.'});
  pintar();
}
function editarFaq(n, campo, valor){
  preguntasFrecuentes()[n][campo] = valor;
  guardar('kine/faq', preguntasFrecuentes());
}
function quitarFaq(n){
  preguntasFrecuentes().splice(n, 1);
  guardar('kine/faq', preguntasFrecuentes());
  pintar();
}

function confirmarVaciado(){
  var t = (document.getElementById('cVaciar').value || '').trim().toUpperCase();
  if(t !== 'VACIAR'){
    document.getElementById('aviso').innerHTML =
      '<div class="nota aviso">Escribí VACIAR en el campo para confirmar.</div>';
    document.getElementById('cVaciar').focus();
    return;
  }
  var P = perfil();
  document.getElementById('aviso').innerHTML =
    '<div class="nota info">Borrando… no cierres esta pantalla.</div>';

  /* Se espera a que la base termine de verdad. Antes se mostraba "listo"
     al instante, aunque el borrado hubiera fallado. */
  vaciarLaBase().then(function(r){
    vaciarLocal();
    BASE.perfil = P;
    guardar('kine/perfil', P);
    if(r && r.fallaron && r.fallaron.length){
      document.getElementById('aviso').innerHTML =
        '<div class="nota reserva"><b>Quedaron ' + r.fallaron.length + ' cosas sin borrar.</b> '
        + 'Se borraron ' + r.borrados + '. Recargá y probá de nuevo.</div>';
      return;
    }
    mostrarVaciado(r);
  });
  return;
}

function mostrarVaciado(r){
  document.getElementById('todo').innerHTML =
    '<div class="tarjeta" style="margin-top:40px"><div class="vacio">'
    + '<b>Listo. El portal está en cero.</b>'
    + ((r && r.borrados) ? 'Se borraron ' + r.borrados + ' registros de la base. ' : '')
    + 'Ya podés cargar tu primer paciente de verdad. El cartel amarillo desapareció.</div>'
    + '<a class="bt ancho" href="cartel.html" style="text-decoration:none;text-align:center">'
    + 'Ver el cartel con el QR para repartir</a>'
    + '<a class="bt neutro ancho" href="pacientes.html" style="text-decoration:none;text-align:center;margin-top:8px">'
    + 'Ir al padrón</a></div>';
  var c = document.querySelector('.cartel-demo');
  if(c) c.remove();
  scrollTo(0, 0);
}
function guardarPerfil(){
  guardar('kine/perfil', perfil());
  guardar('kine/faq', preguntasFrecuentes());
  document.getElementById('aviso').innerHTML =
    '<div class="nota bien">Guardado. Ya se ve en el portal y en el cartel.</div>';
}
pintar();
</script>
<script>
/* Desinstala cualquier programa que haya quedado de versiones anteriores.
   Uno viejo guardaba el portal para funcionar sin internet y rompia
   Safari: la pagina directamente no abria. Como ademas quedaba instalado
   en el telefono, el arreglo no llegaba nunca. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(r){
    if(!r.length) return;
    Promise.all(r.map(function(x){ return x.unregister(); }))
      .then(function(){ return caches.keys(); })
      .then(function(c){ return Promise.all(c.map(function(k){ return caches.delete(k); })); })
      .then(function(){
        if(!sessionStorage.getItem('limpio')){
          sessionStorage.setItem('limpio','1'); location.reload();
        }
      }).catch(function(){});
  }).catch(function(){});
}
</script>
</body></html>
