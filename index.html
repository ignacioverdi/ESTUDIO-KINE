<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estudio · Kinesiología del club</title>
<link rel="icon" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05070B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estudio">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="css/tema.css">
<link rel="stylesheet" href="css/estudio.css">
<script src="js/firebase.js" onerror="void 0"></script>
<script src="js/datos.js"></script><script src="js/plantillas.js"></script><script src="js/agenda.js"></script><script src="js/qr.js"></script><script src="js/historia.js"></script><script src="js/dinero.js"></script><script src="js/atender.js"></script><script src="js/mensajes.js"></script><script src="js/alertas.js"></script><script src="js/ayuda.js"></script><script src="js/acceso.js"></script><script src="js/base.js"></script>
</head>
<style>
  /* La entrada no lleva menu ni encabezado: todavia no sabemos quien es. */
  .entrada{max-width:440px;margin:0 auto;padding:34px 18px 60px}
  .marca-grande{text-align:center;margin-bottom:28px}
  .marca-grande .sig{width:64px;height:64px;border-radius:16px;background:var(--acc);
    margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 34px rgba(0,216,232,.28)}
  .marca-grande .sig::after{content:'';width:30px;height:30px;
    background:linear-gradient(var(--sobre-acc),var(--sobre-acc)) center/30px 5px no-repeat,
               linear-gradient(var(--sobre-acc),var(--sobre-acc)) center/5px 30px no-repeat}
  .marca-grande b{display:block;font-family:var(--tit);font-size:30px;font-weight:var(--tit-peso);
    letter-spacing:var(--tit-track);text-transform:var(--tit-caja);line-height:1}
  .marca-grande span{display:block;font-family:var(--dat);font-size:11px;letter-spacing:2px;
    text-transform:uppercase;color:var(--tinta3);margin-top:6px}
  .puertas{display:flex;gap:8px;margin-bottom:20px}
  .puerta{flex:1;padding:16px 12px;border-radius:var(--r2);border:var(--borde) solid var(--linea2);
    background:var(--sup2);cursor:pointer;text-align:center;transition:.14s}
  .puerta:hover{border-color:var(--acc)}
  .puerta.on{border-color:var(--acc);background:var(--acc-suave);border-width:2px}
  .puerta .ic{font-size:24px;display:block;margin-bottom:6px;color:var(--acc-texto)}
  .puerta b{display:block;font-size:15px;font-weight:600}
  .puerta small{display:block;color:var(--tinta3);font-size:12.5px;margin-top:2px}
  .pie-entrada{text-align:center;color:var(--tinta3);font-size:13px;margin-top:20px;line-height:1.7}
  .pie-entrada a{color:var(--acc-texto)}
</style>
</head>
<!-- PANTALLA PUBLICA — es la puerta: no puede exigir haber entrado. -->
<body data-pag="inicio">

<div class="entrada" id="todo"></div>

<script>
var puerta = 'paciente';
var volver = new URLSearchParams(location.search).get('volver');

/* Si ya habia entrado, no se le pregunta de nuevo. */
(function(){
  var s = sesion();
  if(s) location.replace(s.tipo === 'kine' ? (volver || 'panel.html') : (volver || 'mi.html'));
})();

function pintar(){
  var P = BASE.perfil || {};
  document.getElementById('todo').innerHTML =

    '<div class="marca-grande">'
    + (P.logo ? '<img src="' + P.logo + '" style="max-width:180px;max-height:70px;margin:0 auto 12px;display:block">'
              : '<span class="sig"></span>')
    + '<b>' + (P.estudio || 'ESTUDIO') + '</b>'
    + '<span>' + (P.club || 'Kinesiología') + '</span></div>'

    + '<div class="puertas">'
    + '<button class="puerta' + (puerta === 'paciente' ? ' on' : '') + '" onclick="elegir(\'paciente\')">'
    + '<span class="ic">&#9679;</span><b>Soy paciente</b><small>Ver lo mío</small></button>'
    + '<button class="puerta' + (puerta === 'kine' ? ' on' : '') + '" onclick="elegir(\'kine\')">'
    + '<span class="ic">&#9635;</span><b>Soy el kinesiólogo</b><small>Entrar al estudio</small></button>'
    + '</div>'

    + (puerta === 'paciente' ? formPaciente() : formKine())

    + '<div id="aviso"></div>'

    + (puerta === 'paciente'
        ? '<p class="pie-entrada">¿Es tu primera vez en el estudio?<br>'
          + '<a href="alta.html">Cargá tus datos acá</a>, tarda dos minutos.</p>'
        : '<p class="pie-entrada">Si olvidaste la contraseña, se cambia desde Firebase.</p>')

    + (esDemo() ? demo() : '');

  ['pDoc','pNac','kMail','kClave'].forEach(function(id){
    var e = document.getElementById(id);
    if(e) e.addEventListener('keydown', function(ev){ if(ev.key === 'Enter') enviar(); });
  });
}

function formPaciente(){
  return '<div class="tarjeta">'
    + '<p style="color:var(--tinta2);font-size:14px;margin-bottom:16px">'
    + 'Entrá con los mismos datos que cargaste cuando te diste de alta. '
    + 'No hay contraseña que recordar.</p>'
    + '<label class="campo"><span class="eti">Tu documento</span>'
    + '<input type="text" id="pDoc" inputmode="numeric" placeholder="Sin puntos" autocomplete="off"></label>'
    + '<label class="campo" style="margin-bottom:0"><span class="eti">Tu fecha de nacimiento</span>'
    + '<input type="date" id="pNac"></label>'
    + '</div>'
    + '<button class="bt ancho" onclick="enviar()">Entrar</button>';
}

function formKine(){
  return '<div class="tarjeta">'
    + '<label class="campo"><span class="eti">Correo</span>'
    + '<input type="text" id="kMail" inputmode="email" autocomplete="username"></label>'
    + '<label class="campo" style="margin-bottom:0"><span class="eti">Contraseña</span>'
    + '<input type="password" id="kClave" autocomplete="current-password"></label>'
    + '</div>'
    + '<button class="bt ancho" onclick="enviar()">Entrar al estudio</button>';
}

/* Con datos de prueba, las credenciales a la vista: si no, nadie puede
   mirar el portal. Desaparece al vaciar los datos de demostracion. */
function demo(){
  var p = BASE.pacientes[0] || {};
  return '<div class="nota aviso" style="margin-top:22px;text-align:left">'
    + '<b>Datos de demostración.</b><br>'
    + 'Paciente: documento <b>' + p.doc + '</b>, nacimiento <b>'
    + (p.nacimiento || '').split('-').reverse().join('/') + '</b><br>'
    + 'Kinesiólogo: <b>' + ((BASE.perfil || {}).email || 'vero@estudiokine.com')
    + '</b>, contraseña <b>estudio</b></div>';
}

function elegir(p){ puerta = p; pintar(); }

function enviar(){
  var av = document.getElementById('aviso'), r;
  if(puerta === 'paciente'){
    r = entrarPaciente(document.getElementById('pDoc').value,
                       document.getElementById('pNac').value);
  }else{
    r = entrarKine(document.getElementById('kMail').value,
                   document.getElementById('kClave').value);
  }
  if(!r.ok){
    av.innerHTML = '<div class="nota reserva" style="margin-top:14px">' + r.motivo + '</div>';
    return;
  }
  av.innerHTML = '<div class="nota bien" style="margin-top:14px">Hola, '
    + r.nombre.split(' ')[0] + '.</div>';
  setTimeout(function(){ location.href = volver || r.destino; }, 400);
}

pintar();
</script>
</body></html>
