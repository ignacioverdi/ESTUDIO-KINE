<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Darse de alta · Estudio</title>
<link rel="icon" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05070B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estudio">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="css/tema.css">
<link rel="stylesheet" href="css/estudio.css">
<script src="js/firebase.js" onerror="void 0"></script>
<script src="js/datos.js"></script><script src="js/plantillas.js"></script><script src="js/qr.js"></script><script src="js/historia.js"></script><script src="js/dinero.js"></script><script src="js/atender.js"></script><script src="js/ayuda.js"></script>
</head>
<body data-pag="alta">
<!-- PANTALLA PUBLICA — no lleva base.js a propósito: es pública. El que entra
     todavía no es paciente y no tiene rol, así que no hay menú ni sesión.
     Se llega por un enlace o un código QR pegado en el estudio. -->
<div class="top"><div class="top-in">
  <a class="marca" href="index.html"><span class="sig"></span>
  <span><b>ESTUDIO</b><span>Kinesiología del club</span></span></a>
  <div class="quien" style="margin-left:auto">
    <button class="ayuda-bt" onclick="abrirAyuda('alta')" title="Cómo funciona">?</button>
  </div>
</div></div>
<div class="hoja angosta" id="todo"></div>
<script>
var F = {};

/* La misma pantalla sirve para las dos formas de dar de alta: el paciente
   cargandose solo desde el QR, o el kinesiologo cargandolo con la persona
   adelante. Los campos son los mismos; lo que cambia es como se habla.
   Al paciente se le dice "tus datos"; al kine, "sus datos". */
var LOCARGA_EL_KINE = (typeof rol === 'function' && rol() === 'kine');
function vos(a, b){ return LOCARGA_EL_KINE ? b : a; }
function pintar(){
  document.getElementById('todo').innerHTML =
    '<h1 class="tit">' + vos('Darse de alta', 'Nuevo paciente') + '</h1>'
    + '<p class="bajada">'
    + vos('Completá esto una sola vez. Después vas a poder pedir turno, ver tus ejercicios '
          + 'y seguir tu recuperación desde el celular.',
          'Cargalo una sola vez. Después va a poder pedir turno y ver sus ejercicios desde '
          + 'el celular. Si preferís que lo complete él, mandale el enlace del QR: no tipeás '
          + 'nada y no hay errores de dictado.')
    + '</p>'
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Quién sos</h2></div>'
    + '<label class="campo"><span class="eti">' + vos('¿Sos del plantel del club?', '¿Es del plantel del club?') + '</span>'
    + '<div class="pestanias" id="tipo" style="margin-bottom:0">'
    + '<button class="pest" data-t="plantel">' + vos('Sí, juego en el club', 'Sí, del plantel') + '</button>'
    + '<button class="pest" data-t="particular">' + vos('No, vengo por mi cuenta', 'No, particular') + '</button>'
    + '</div></label>'
    + '<div id="camposTipo"></div>'
    + '<div style="display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap">'
    + (F.foto ? '<img src="' + F.foto + '" style="width:86px;height:86px;border-radius:50%;'
        + 'object-fit:cover;border:2px solid var(--acc)">'
        : '<div style="width:86px;height:86px;border-radius:50%;border:2px dashed var(--linea2);'
        + 'background:var(--sup2);display:flex;align-items:center;justify-content:center;'
        + 'color:var(--tinta3);font-family:var(--dat);font-size:10px">SIN FOTO</div>')
    + '<div style="flex:1;min-width:180px">'
    + '<input type="file" id="f_foto" accept="image/*" capture="user" style="display:none" '
    + 'onchange="subirFoto(this)">'
    + '<button class="bt hueco chico" onclick="document.getElementById(\'f_foto\').click()">'
    + (F.foto ? 'Cambiar la foto' : 'Sacate una foto') + '</button>'
    + '<p style="font-size:12.5px;color:var(--tinta3);margin-top:8px">Es optativa. Sirve para '
    + 'que el kinesiólogo te reconozca cuando llegás.</p></div></div>'
    + '<label class="campo"><span class="eti">Nombre y apellido</span>'
    + '<input type="text" id="f_nombre" placeholder="Como figura en tu documento"></label>'
    + '<div class="rejilla c2">'
    + '<label class="campo"><span class="eti">Documento</span>'
    + '<input type="text" id="f_doc" inputmode="numeric" placeholder="Sin puntos"></label>'
    + '<label class="campo"><span class="eti">Fecha de nacimiento</span>'
    + '<input type="date" id="f_nac" onchange="revisarEdad()"></label>'
    + '</div>'
    + '<div id="cajaTutor"></div>'
    + '</div>'
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">' + vos('Cómo te ubicamos', 'Cómo ubicarlo') + '</h2>'
    + '<span class="eti">Para el aviso del turno</span></div>'
    + '<div class="rejilla c2">'
    + '<label class="campo"><span class="eti">Teléfono</span>'
    + '<input type="text" id="f_tel" inputmode="tel" placeholder="11 5555 0000"></label>'
    + '<label class="campo"><span class="eti">Correo</span>'
    + '<input type="text" id="f_mail" inputmode="email" placeholder="vos@mail.com"></label>'
    + '</div>'
    + '<label class="campo"><span class="eti">' + vos('¿Por qué venís? (en tus palabras)', 'Motivo de consulta, con sus palabras') + '</span>'
    + '<textarea id="f_motivo" placeholder="Me duele el hombro cuando levanto el brazo, hace tres semanas..."></textarea></label>'
    + '</div>'
    /* Admisión. Estos datos cambian el tratamiento: no es lo mismo un
       dolor lumbar en alguien que pasa ocho horas sentado que en un
       jugador de hockey. Y los antecedentes quirúrgicos pueden
       contraindicar ejercicios enteros. */
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">' + vos('Tu vida y tu deporte', 'Su vida y su deporte') + '</h2>'
    + '<span class="eti">Cambia el tratamiento</span></div>'
    + '<div class="rejilla c2">'
    + '<label class="campo"><span class="eti">¿De qué trabajás?</span>'
    + '<input type="text" id="f_ocupacion" placeholder="Contador, docente, albañil..."></label>'
    + '<label class="campo"><span class="eti">¿Qué deporte hacés?</span>'
    + '<input type="text" id="f_deporte" placeholder="Fútbol, natación, ninguno..."></label>'
    + '</div>'
    + '<label class="campo"><span class="eti">¿Con qué frecuencia?</span>'
    + '<div class="pestanias" id="frec" style="margin-bottom:0">'
    + ['Sedentario','1 a 2 por semana','3 a 4 por semana','5 o más','Todos los días'].map(function(x){
        return '<button class="pest" data-f="' + x + '">' + x + '</button>';
      }).join('') + '</div></label>'
    + '<label class="campo"><span class="eti">Cirugías o lesiones anteriores</span>'
    + '<textarea id="f_antecedentes" placeholder="Operación de menisco en 2019, esguinces de tobillo a repetición... Si no tuviste, poné ninguna."></textarea></label>'
    + '<label class="campo"><span class="eti">¿Qué querés poder volver a hacer?</span>'
    + '<textarea id="f_objetivos" placeholder="Correr 10 kilómetros, levantar a mi hija, jugar el torneo de primavera..."></textarea></label>'
    + '<div class="nota info" style="margin-bottom:0">Esta última es la más importante. '
    + 'Es contra lo que se va a medir si el tratamiento sirvió.</div>'
    + '</div>'
    /* El consentimiento no es un trámite: son datos de salud y sin esto
       no se pueden guardar. Va explicado en castellano, no en jurídico. */
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">' + vos('Tus datos', 'Consentimiento') + '</h2></div>'
    + '<p style="color:var(--tinta2);font-size:14px;margin-bottom:14px">'
    + vos('Lo que cargues acá es información de salud y se trata como tal. '
          + 'Lo ve el kinesiólogo que te atiende y lo ves vos. Nadie más: ni el entrenador, '
          + 'ni los otros pacientes. Si sos del plantel, el cuerpo técnico ve solamente si '
          + 'estás disponible para entrenar, nunca tu diagnóstico.',
          'Leele esto y que lo confirme. Es información de salud: sin consentimiento no se '
          + 'puede registrar nada. La ve el kinesiólogo que lo atiende y el propio paciente. '
          + 'Nadie más: ni el entrenador ni los otros pacientes.')
    + '</p>'
    + '<label class="crit"><input type="checkbox" id="f_ok"><span>'
    + vos('Entiendo y autorizo al estudio a guardar mis datos para mi tratamiento.',
          'El paciente entiende y autoriza al estudio a guardar sus datos para su tratamiento.')
    + '</span></label>'
    + '</div>'
    + '<div id="aviso"></div>'
    + '<button class="bt ancho" onclick="enviar()">'
    + vos('Darme de alta', 'Guardar el paciente') + '</button>'
    + (LOCARGA_EL_KINE
        ? '<a class="bt neutro ancho" href="pacientes.html" style="text-decoration:none;'
          + 'text-align:center;margin-top:8px">Cancelar</a>'
        : '<p style="text-align:center;color:var(--tinta3);font-size:13px;margin-top:14px">'
          + '¿Ya te diste de alta antes? <a href="index.html" style="color:var(--acc-texto)">'
          + 'Entrá por acá</a></p>');
  document.querySelectorAll('#frec .pest').forEach(function(b){
    if(F.frecuencia === b.dataset.f) b.classList.add('on');
    b.onclick = function(){
      document.querySelectorAll('#frec .pest').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on'); F.frecuencia = b.dataset.f;
    };
  });
  document.querySelectorAll('#tipo .pest').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('#tipo .pest').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on'); F.tipo = b.dataset.t; pintarTipo();
    };
  });
  if(F.tipo){
    var sel = document.querySelector('#tipo .pest[data-t=' + F.tipo + ']');
    if(sel) sel.classList.add('on');
    pintarTipo();
  }
  ['nombre','doc','nac','tel','mail','motivo','ocupacion','deporte','antecedentes','objetivos'].forEach(function(k){
    var e = document.getElementById('f_' + k);
    if(e && F[k]) e.value = F[k];
    if(e) e.oninput = function(){ F[k] = e.value; };
  });
  if(F.nac) revisarEdad();
}
function pintarTipo(){
  var c = document.getElementById('camposTipo');
  if(F.tipo === 'plantel'){
    c.innerHTML = '<label class="campo"><span class="eti">Tu número de camiseta</span>'
      + '<input type="number" id="f_dorsal" inputmode="numeric" placeholder="Ej: 7"></label>';
    var e = document.getElementById('f_dorsal');
    if(F.dorsal) e.value = F.dorsal;
    e.oninput = function(){ F.dorsal = e.value; };
  }else if(F.tipo === 'particular'){
    c.innerHTML = '<label class="campo"><span class="eti">Obra social o prepaga</span>'
      + '<input type="text" id="f_obra" placeholder="Si no tenés, poné Particular"></label>';
    var o = document.getElementById('f_obra');
    if(F.obra) o.value = F.obra;
    o.oninput = function(){ F.obra = o.value; };
  }else{
    c.innerHTML = '';
  }
}
/* Si el paciente es menor, hacen falta los datos de quien lo autoriza.
   No es opcional: un menor no puede consentir su propio tratamiento. */
function revisarEdad(){
  var e = document.getElementById('f_nac');
  F.nac = e.value;
  var caja = document.getElementById('cajaTutor');
  if(F.nac && esMenor(F.nac)){
    if(caja.innerHTML) return;
    caja.innerHTML =
      '<div class="nota info">Sos menor de edad, así que necesitamos los datos '
      + 'de tu mamá, tu papá o quien te acompañe.</div>'
      + '<div class="rejilla c2">'
      + '<label class="campo"><span class="eti">Nombre del adulto</span>'
      + '<input type="text" id="f_tutor"></label>'
      + '<label class="campo"><span class="eti">Su teléfono</span>'
      + '<input type="text" id="f_tutortel" inputmode="tel"></label></div>'
      + '<label class="campo"><span class="eti">¿Qué es tuyo?</span>'
      + '<input type="text" id="f_vinculo" placeholder="Madre, padre, tutor..."></label>';
    ['tutor','tutortel','vinculo'].forEach(function(k){
      var x = document.getElementById('f_' + k);
      if(F[k]) x.value = F[k];
      x.oninput = function(){ F[k] = x.value; };
    });
  }else{
    caja.innerHTML = '';
  }
}
/* Al enviar, TODO se lee del formulario y nada de la memoria.
   Guardar en memoria depende de que el usuario tipee, y el celular
   muchas veces autocompleta sin disparar ese aviso: el campo se ve
   lleno en pantalla y el sistema lo cree vacío. */
function leer(id){ var e = document.getElementById(id); return e ? (e.value || '').trim() : ''; }
/* La foto se achica a 300 píxeles antes de guardarse. Una foto de
   celular pesa cuatro megas; así pesa treinta kilos. */
function subirFoto(input){
  var f = input.files && input.files[0];
  if(!f) return;
  var lector = new FileReader();
  lector.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var esc = Math.min(1, 300 / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * esc);
      c.height = Math.round(img.height * esc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      F.foto = c.toDataURL('image/jpeg', 0.8);
      pintar();
    };
    img.src = ev.target.result;
  };
  lector.readAsDataURL(f);
}
function enviar(){
  var av = document.getElementById('aviso'), falta = [];
  F.nombre   = leer('f_nombre');
  F.doc      = leer('f_doc');
  F.nac      = leer('f_nac');
  F.tel      = leer('f_tel');
  F.motivo   = leer('f_motivo');
  F.dorsal   = leer('f_dorsal');
  F.obra     = leer('f_obra');
  F.tutor    = leer('f_tutor');
  F.tutortel = leer('f_tutortel');
  F.vinculo  = leer('f_vinculo');
  F.ocupacion    = leer('f_ocupacion');
  F.deporte      = leer('f_deporte');
  F.antecedentes = leer('f_antecedentes');
  F.objetivos    = leer('f_objetivos');
  if(!F.tipo)             falta.push('si sos del plantel o venís por tu cuenta');
  if(F.nombre.length < 4) falta.push('tu nombre y apellido');
  if(F.doc.length < 6)    falta.push('tu documento');
  if(!F.nac)              falta.push('tu fecha de nacimiento');
  if(F.tel.length < 6)    falta.push('un teléfono');
  if(F.nac && esMenor(F.nac) && !F.tutor)
    falta.push('el nombre del adulto responsable');
  if(!document.getElementById('f_ok').checked)
    falta.push('tu autorización para guardar los datos');
  if(falta.length){
    av.innerHTML = '<div class="nota aviso">Falta ' + falta.join(', ') + '.</div>';
    av.scrollIntoView({block:'center'});
    return;
  }
  /* Mismo documento = misma persona. Evita que alguien se cargue dos veces
     y termine con dos historias clínicas partidas al medio. */
  var repetido = null;
  BASE.pacientes.forEach(function(p){ if(p.doc === F.doc) repetido = p; });
  if(repetido){
    av.innerHTML = '<div class="nota info">Ya estás en el sistema, ' + repetido.nombre.split(' ')[0]
      + '. No hace falta que te des de alta de nuevo — '
      + '<a href="index.html" style="color:var(--acc-texto)">entrá por acá</a>.</div>';
    av.scrollIntoView({block:'center'});
    return;
  }
  var nuevo = {
    id: nuevoIdPaciente(),
    tipo: F.tipo,
    nombre: F.nombre,
    nacimiento: F.nac,
    doc: F.doc,
    tel: F.tel,
    email: leer('f_mail'),
    motivo: F.motivo,
    estado: 'pendiente',
    alta: HOY,
    ocupacion: F.ocupacion || '—',
    deporte: F.deporte || '—',
    frecuencia: F.frecuencia || '—',
    antecedentes: F.antecedentes || 'No declaró.',
    objetivos: F.objetivos || '—',
    plan: 'sesion', creditos: 0,
    foto: F.foto || null,
    consentimiento: {aceptado:true, fecha:HOY}
  };
  if(F.tipo === 'plantel' && F.dorsal) nuevo.dorsal = +F.dorsal;
  if(F.tipo === 'particular') nuevo.obra_social = F.obra || 'Particular';
  if(esMenor(F.nac)) nuevo.tutor = {nombre:F.tutor, tel:F.tutortel || F.tel, vinculo:F.vinculo || '—'};
  BASE.pacientes.push(nuevo);
  guardar('kine/pacientes/' + nuevo.id, nuevo);
  /* Primeros dos asientos de la historia: el alta y el consentimiento.
     El consentimiento es un asiento propio porque la ley pide que conste
     de forma expresa y destacada, con fecha. */
  if(!LOCARGA_EL_KINE){
    try{ ponerRol('jugador'); localStorage.setItem('estudio_pid', nuevo.id); }catch(e){}
  }
  asentar(nuevo.id, 'alta_paciente',
          'Se dio de alta en el padrón como ' + (nuevo.tipo === 'plantel' ? 'jugador del plantel' : 'paciente particular')
          + '. Ocupación: ' + nuevo.ocupacion + '. Deporte: ' + nuevo.deporte
          + ' (' + nuevo.frecuencia + '). Antecedentes: ' + nuevo.antecedentes
          + ' Motivo de consulta declarado: ' + (nuevo.motivo || 'no lo indicó')
          + '. Objetivo del paciente: ' + nuevo.objetivos);
  asentar(nuevo.id, 'consentimiento',
          'Otorgó consentimiento informado para el tratamiento de sus datos de salud'
          + (esMenor(nuevo.nac || F.nac) && nuevo.tutor
             ? ', con autorización de ' + nuevo.tutor.nombre + ' (' + nuevo.tutor.vinculo + ')' : '')
          + '.');
  document.getElementById('todo').innerHTML = LOCARGA_EL_KINE
    ? '<div class="tarjeta" style="margin-top:30px">'
      + '<div class="vacio"><b>' + F.nombre + ' quedó cargado</b>'
      + 'Ya figura en el padrón como sin atender. Podés abrirle una lesión o darle turno.</div>'
      + '<a class="bt ancho" href="pacientes.html" style="text-decoration:none;text-align:center">Ir al padrón</a>'
      + '<a class="bt neutro ancho" href="alta.html" style="text-decoration:none;text-align:center;margin-top:8px">Cargar otro</a>'
      + '</div>'
    : '<div class="tarjeta" style="margin-top:30px">'
      + '<div class="vacio"><b>Listo, ' + F.nombre.split(' ')[0] + '</b>'
      + 'Ya estás en el sistema. El kinesiólogo te va a ver en la lista y '
      + 'podés pedir turno cuando quieras.</div>'
      + '<a class="bt ancho" href="agenda.html" style="text-decoration:none;text-align:center">Pedir mi primer turno</a>'
      + '<a class="bt neutro ancho" href="index.html" style="text-decoration:none;text-align:center;margin-top:8px">Ir al inicio</a>'
      + '</div>';
  scrollTo(0, 0);
}
pintar();
</script>
<script>
/* Desinstala cualquier programa que haya quedado de versiones anteriores.
   Uno viejo guardaba el portal para funcionar sin internet y rompia
   Safari: la pagina directamente no abria. Como ademas quedaba instalado
   en el telefono, el arreglo no llegaba nunca. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(r){
    if(!r.length) return;
    Promise.all(r.map(function(x){ return x.unregister(); }))
      .then(function(){ return caches.keys(); })
      .then(function(c){ return Promise.all(c.map(function(k){ return caches.delete(k); })); })
      .then(function(){
        if(!sessionStorage.getItem('limpio')){
          sessionStorage.setItem('limpio','1'); location.reload();
        }
      }).catch(function(){});
  }).catch(function(){});
}
</script>
</body></html>
