<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi recuperación · Estudio</title>
<link rel="icon" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05070B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estudio">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="css/tema.css">
<link rel="stylesheet" href="css/estudio.css">
<script src="js/firebase.js" onerror="void 0"></script>
<script src="js/datos.js"></script><script src="js/plantillas.js"></script><script src="js/qr.js"></script><script src="js/historia.js"></script><script src="js/dinero.js"></script><script src="js/atender.js"></script><script src="js/mensajes.js"></script><script src="js/alertas.js"></script><script src="js/ayuda.js"></script><script src="js/base.js"></script>
</head>
<body data-pag="mi">
<div class="hoja angosta" id="todo"></div>
<script>
var L = lesionDe(miDorsal());
var hechos = {}, dolor = null, esfuerzo = null;
if(!L){
  document.getElementById('todo').innerHTML =
    '<h1 class="tit">Estás al día</h1>'
    + '<p class="bajada">No tenés ninguna lesión abierta. Si te empezó a molestar algo, '
    + 'pedí un turno y lo vemos.</p>'
    + '<a class="bt" href="agenda.html" style="text-decoration:none;display:inline-block">Pedir un turno</a>';
}else{
  pintar();
}
function pintar(){
  var prog = programaDe(L);
  var prox = null;
  (BASE.agenda[HOY] || []).concat(BASE.agenda['2026-08-31'] || []).forEach(function(t){
    if(!prox && t.dorsal === miDorsal() && t.estado === 'reservado') prox = t;
  });
  document.getElementById('todo').innerHTML =
    '<h1 class="tit">' + L.zona + ' ' + (L.lado === '—' ? '' : L.lado) + '</h1>'
    + '<p class="bajada">' + L.diagnostico + '. Llevás ' + diasDeLesion(L) + ' días desde '
    + (L.cirugia ? 'la operación' : 'la lesión') + ' y ' + diasDeRehab(L)
    + ' de tratamiento. Faltan ' + faltan(L.alta) + ' para el alta prevista.</p>'
    /* dónde estás */
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Dónde estás</h2>'
    + '<span class="eti">Día ' + dias(L.fecha) + '</span></div>'
    + pista(L.fase)
    + '<p style="margin-top:14px">' + FASES[L.fase-1].d + '</p>'
    + '<div class="nota info" style="margin-top:14px">'
    + 'Para pasar a <b>' + FASES[Math.min(L.fase,4)].t.toLowerCase() + '</b> te falta: '
    + L.criterios.filter(function(c){ return !c.ok; }).map(function(c){ return c.t.toLowerCase(); }).join('; ')
    + '.</div></div>'
    /* mensajes */
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Hablar con Vero</h2>'
    + (sinLeerPaciente(miPid())
        ? '<span class="pin ausente">' + sinLeerPaciente(miPid()) + ' sin leer</span>'
        : '<span class="eti">Responde antes de tu turno</span>') + '</div>'
    + '<p style="color:var(--tinta2);font-size:14px;margin-bottom:12px">'
    + 'Si algo te duele o no entendés un ejercicio, escribile. También podés consultar '
    + 'sobre un ejercicio puntual, con el botón que está al lado de cada uno.</p>'
    + '<button class="bt hueco ancho" onclick="abrirConversacion(miPid())">Escribirle a Vero'
    + (mensajesDe(miPid()).length ? ' (' + mensajesDe(miPid()).length + ')' : '') + '</button></div>'

    /* turno */
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Tu próximo turno</h2>'
    + '<a class="eti" href="agenda.html" style="text-decoration:none">Cambiar →</a></div>'
    + (prox
        ? '<div class="fila" style="cursor:default;border-color:var(--azul)">'
          + '<span class="hh">' + prox.h + '</span>'
          + '<span class="cu"><b>' + prox.tipo + ' con Vero</b>'
          + '<small>En el estudio. Te avisamos una hora antes.</small></span>'
          + '<span class="pin ' + (prox.confirmado ? 'atendido' : 'reservado') + '">'
          + (prox.confirmado ? 'confirmado' : 'reservado') + '</span></div>'
          + (prox.confirmado
              ? '<button class="bt neutro ancho" style="margin-top:10px" onclick="cancelarTurno()">No voy a poder ir</button>'
              : '<div style="display:flex;gap:8px;margin-top:10px">'
                + '<button class="bt" style="flex:1" onclick="confirmarTurno()">Ahí voy</button>'
                + '<button class="bt neutro" style="flex:1" onclick="cancelarTurno()">No puedo</button></div>')
          + '<p style="font-size:13px;color:var(--tinta3);margin-top:8px">'
          + 'Si no vas a poder, avisá con tiempo: el turno se lo damos a otro.</p>'
        : '<div class="vacio"><b>No tenés turno reservado</b>Pedilo desde la agenda.</div>')
    + '</div>'
    /* programa */
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Tus ejercicios de hoy</h2>'
    + '<span class="eti" id="cuenta">0 de ' + prog.length + '</span></div>'
    + (prog.length
        ? prog.map(function(e, i){
            return '<div class="fila" style="align-items:flex-start;cursor:pointer" onclick="marcar(' + i + ')" id="ej' + i + '">'
              + '<input type="checkbox" style="width:19px;height:19px;accent-color:var(--azul);margin-top:3px" '
              + 'onclick="event.stopPropagation();marcar(' + i + ')">'
              + '<span class="cu"><b>' + e.n + '</b>'
              + '<small class="mono" style="color:var(--acc-texto)">' + dosis(e) + '</small>'
              + '<small>' + e.nota + '</small></span>'
              + '<span class="pin ' + (e.video ? 'reservado' : 'gris') + '" '
              + 'onclick="event.stopPropagation();verEjercicio(' + i + ')">'
              + (e.video ? 'Ver video' : 'Sin video') + '</span>'
              + '<span class="pin gris" style="margin-top:5px;display:inline-block" '
              + 'onclick="event.stopPropagation();consultar(' + i + ')">Consultar</span>'
              + '</div>';
          }).join('')
        : '<div class="vacio"><b>Todavía no hay programa</b>Vero lo carga después de tu próximo turno.</div>')
    + (prog.length
        ? '<label class="campo" style="margin-top:18px"><span class="eti">Cuánto te dolió mientras los hacías</span>'
          + '<div id="esDolor"></div></label>'
          + '<label class="campo"><span class="eti">Qué tan exigente te resultó</span>'
          + '<div id="esEsf"></div></label>'
          + '<button class="bt ancho" onclick="enviar()">Enviar al kinesiólogo</button>'
          + '<div class="nota bien" id="listo" style="display:none;margin-top:12px">'
          + 'Enviado. Vero lo ve antes de tu próximo turno.</div>'
        : '')
    + '</div>'
    /* historial */
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Lo que llevás hecho</h2>'
    + '<span class="eti">' + L.sesiones.length + ' sesiones</span></div>'
    + L.sesiones.map(function(s){
        return '<div class="fila" style="cursor:default"><span class="hh">' + fechaCorta(s.f) + '</span>'
          + '<span class="cu"><b>' + s.t + '</b></span>'
          + '<span class="pin ' + (s.post < s.pre ? 'atendido' : 'gris') + '">dolor ' + s.pre + ' → ' + s.post + '</span></div>';
      }).join('')
    + '</div>';
  if(prog.length){
    escala(document.getElementById('esDolor'), function(v){ dolor = v; }, dolor);
    escala(document.getElementById('esEsf'),  function(v){ esfuerzo = v; }, esfuerzo);
  }
  actualizarCuenta();
}
/* Consultar sobre UN ejercicio, no un chat suelto. "Esto me duele acá"
   colgado del ejercicio concreto vale diez veces más. */
function consultar(i){
  var e = programaDe(L)[i];
  abrirConversacion(miPid(), {tipo:'ejercicio', detalle:e.n});
}
function verEjercicio(i){
  var e = programaDe(L)[i];
  abrirVideo(e.n, e.video, dosis(e) + ' — ' + e.nota);
}
function marcar(i){
  hechos[i] = !hechos[i];
  var f = document.getElementById('ej' + i);
  f.querySelector('input').checked = hechos[i];
  f.style.background = hechos[i] ? 'var(--verde-suave)' : '';
  f.style.borderColor = hechos[i] ? '#BCDCC9' : '';
  actualizarCuenta();
}
function actualizarCuenta(){
  var c = document.getElementById('cuenta');
  if(!c) return;
  var n = 0; for(var k in hechos) if(hechos[k]) n++;
  c.textContent = n + ' de ' + programaDe(L).length;
}
function turnoProximo(){
  var r = null;
  Object.keys(BASE.agenda).sort().forEach(function(d){
    BASE.agenda[d].forEach(function(t){
      if(!r && t.pid === miPid() && t.estado === 'reservado') r = {d:d, t:t};
    });
  });
  return r;
}
function confirmarTurno(){
  var x = turnoProximo(); if(!x) return;
  x.t.confirmado = true;
  guardar('kine/agenda/turnos/' + x.d + '/' + x.t.h + '/confirmado', true);
  asentar(miPid(), 'turno', 'Confirmó que asiste al turno del ' + fechaLarga(x.d) + ' a las ' + x.t.h + '.');
  pintar();
}
function cancelarTurno(){
  var x = turnoProximo(); if(!x) return;
  if(!confirm('¿Seguro que no vas a poder ir? El turno queda libre para otra persona.')) return;
  delete x.t.pid; delete x.t.dorsal; delete x.t.tipo; delete x.t.confirmado;
  x.t.estado = 'cancelado';
  guardar('kine/agenda/turnos/' + x.d + '/' + x.t.h, {estado:'cancelado'});
  asentar(miPid(), 'turno', 'Canceló el turno del ' + fechaLarga(x.d) + ' a las ' + x.t.h + '.');
  pintar();
}

function enviar(){
  if(dolor === null || esfuerzo === null){
    alert('Marcá cuánto te dolió y qué tan exigente te resultó.'); return;
  }
  guardar('kine/adherencia/' + miDorsal() + '/' + HOY,
          {hechos:hechos, dolor:dolor, esfuerzo:esfuerzo});
  document.getElementById('listo').style.display = 'block';
}
</script>
<script>
/* Desinstala cualquier programa que haya quedado de versiones anteriores.
   Uno viejo guardaba el portal para funcionar sin internet y rompia
   Safari: la pagina directamente no abria. Como ademas quedaba instalado
   en el telefono, el arreglo no llegaba nunca. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(r){
    if(!r.length) return;
    Promise.all(r.map(function(x){ return x.unregister(); }))
      .then(function(){ return caches.keys(); })
      .then(function(c){ return Promise.all(c.map(function(k){ return caches.delete(k); })); })
      .then(function(){
        if(!sessionStorage.getItem('limpio')){
          sessionStorage.setItem('limpio','1'); location.reload();
        }
      }).catch(function(){});
  }).catch(function(){});
}
</script>
</body></html>
