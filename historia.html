<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Historia clínica · Estudio</title>
<link rel="icon" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05070B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estudio">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="css/tema.css">
<link rel="stylesheet" href="css/estudio.css">
<script src="js/firebase.js" onerror="void 0"></script>
<script src="js/datos.js"></script><script src="js/plantillas.js"></script><script src="js/agenda.js"></script>
<script src="js/qr.js"></script><script src="js/historia.js"></script><script src="js/estudios.js"></script><script src="js/dinero.js"></script><script src="js/atender.js"></script><script src="js/mensajes.js"></script><script src="js/alertas.js"></script>
<script src="js/ayuda.js"></script><script src="js/acceso.js"></script><script src="js/base.js"></script>
<style>
  .estudios{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
  .est{border:var(--borde) solid var(--linea);border-radius:var(--r);background:var(--sup2);
    padding:0;overflow:hidden;cursor:pointer;text-align:left;color:inherit;font-family:inherit}
  .est:hover{border-color:var(--acc)}
  .est-ver{display:block;height:96px;background:var(--negro);overflow:hidden;
    display:flex;align-items:center;justify-content:center}
  .est-ver img{width:100%;height:96px;object-fit:cover;display:block}
  .est-ico{font-family:var(--dat);font-size:15px;font-weight:700;color:var(--acc-texto);
    letter-spacing:1px}
  .est-txt{display:block;padding:10px 11px}
  .est-txt b{display:block;font-size:14px}
  .est-txt small{display:block;color:var(--tinta3);font-size:12px;font-family:var(--dat)}
  @media print{ .estudios{grid-template-columns:repeat(3,1fr)} }
  /* En pantalla se ve con los colores del portal. Impresa sale en blanco
     y negro: es un documento legal, no una captura de pantalla. */
  .asiento{border-left:2px solid var(--linea2);padding:0 0 18px 16px;position:relative;margin-left:8px}
  .asiento::before{content:'';position:absolute;left:-6px;top:4px;width:10px;height:10px;
    border-radius:50%;background:var(--acc);border:2px solid var(--fondo)}
  .asiento.rect::before{background:var(--ambar)}
  .asiento-cab{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px}
  .folio{font-family:var(--dat);font-size:12px;font-weight:600;color:var(--acc-texto);
    border:1px solid var(--acc-borde);background:var(--acc-suave);border-radius:4px;padding:1px 7px}
  .asiento b{font-size:15px}
  .asiento .cuando{font-family:var(--dat);font-size:11.5px;color:var(--tinta3);margin-left:auto}
  .asiento .cuerpo{font-size:14.5px;color:var(--tinta2);margin-top:3px}
  .asiento .huella{font-family:var(--dat);font-size:10px;color:var(--tinta3);margin-top:6px;
    overflow-wrap:anywhere}
  @media print{
    body{background:#fff;color:#000;background-image:none;padding:0}
    .no-imprimir{display:none!important}
    .tarjeta{border:none;box-shadow:none;padding:0;margin-bottom:18px}
    .asiento{border-left:1px solid #999;break-inside:avoid;page-break-inside:avoid}
    .asiento::before{background:#000}
    .folio{border-color:#999;background:#eee;color:#000}
    .asiento .cuando,.asiento .cuerpo,.asiento .huella{color:#333}
    .hoja{max-width:none;padding:0}
    h1.tit{font-size:24px}
  }
</style>
</head>
<body data-pag="historia">
<div class="hoja angosta" id="todo"></div>
<script>
var pid = new URLSearchParams(location.search).get('p') || (rol() === 'kine' ? null : miPid());
/* Mirar una historia clínica ya es un acceso, y queda registrado. */
if(pid) registrarAcceso(pid, 'lectura de historia clínica');
function pintar(){
  var caja = document.getElementById('todo');
  if(!pid){
    caja.innerHTML = '<h1 class="tit">Historia clínica</h1>'
      + '<p class="bajada">Elegí un paciente para ver su historia completa.</p>'
      + '<div class="tarjeta">' + BASE.pacientes.map(function(p){
          return '<button class="fila" onclick="irA(\'historia.html?p=' + p.id + '\')">'
            + '<span class="hh">' + (p.dorsal ? '#' + p.dorsal : 'P') + '</span>'
            + '<span class="cu"><b>' + p.nombre + '</b><small>'
            + historiaDe(p.id).length + ' asientos</small></span></button>';
        }).join('') + '</div>';
    return;
  }
  var p = paciente(pid);
  if(!p){ caja.innerHTML = '<div class="vacio"><b>No existe ese paciente</b></div>'; return; }
  var h = historiaDe(pid);
  var v = verificarHistoria(pid);
  var acc = accesosDe(pid);
  var esKine = rol() === 'kine';
  caja.innerHTML =
    '<h1 class="tit">Historia clínica</h1>'
    + '<p class="bajada">' + p.nombre + ' · documento ' + p.doc
    + ' · nacido el ' + fechaLarga(p.nacimiento) + '</p>'
    + '<div class="no-imprimir" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px">'
    + '<button class="bt" onclick="window.print()">Descargar en PDF</button>'
    + (esKine ? '<button class="bt hueco" onclick="agregarNota()">Agregar una nota</button>' : '')
    + (esKine ? '<button class="bt neutro" onclick="irA(\'historia.html\')">Otro paciente</button>' : '')
    + '</div>'
    /* La verificación de integridad es lo que convierte esto en un
       documento defendible y no en una lista de textos. */
    + (v.ok
        ? '<div class="nota bien"><b>Historia íntegra.</b> ' + v.asientos + ' asientos correlativos, '
          + 'encadenados y sin modificaciones. Cada uno guarda la huella del anterior.</div>'
        : '<div class="nota reserva"><b>Atención:</b> ' + v.motivo
          + ' Esta historia fue alterada después de escrita.</div>')
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Datos del paciente</h2></div>'
    + '<div class="rejilla c2">'
    + dato('Documento', p.doc)
    + dato('Fecha de nacimiento', fechaLarga(p.nacimiento) + ' (' + edad(p.nacimiento) + ' años)')
    + dato('Teléfono', p.tel)
    + dato('Correo', p.email || '—')
    + dato('Condición', p.tipo === 'plantel' ? 'Plantel del club, camiseta ' + (p.dorsal || '?')
                                             : (p.obra_social || 'Particular'))
    + dato('En el padrón desde', fechaLarga(p.alta))
    + '</div>'
    + '</div>'
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Admisión</h2></div>'
    + '<div class="rejilla c2">'
    + dato('Ocupación', p.ocupacion || '—')
    + dato('Deporte', (p.deporte || '—') + (p.frecuencia ? ' · ' + p.frecuencia : ''))
    + '</div>'
    + '<label class="campo"><span class="eti">Motivo de consulta</span>'
    + '<p style="color:var(--tinta2)">' + (p.motivo || '—') + '</p></label>'
    + '<label class="campo"><span class="eti">Antecedentes: cirugías y lesiones previas</span>'
    + '<p style="color:var(--tinta2)">' + (p.antecedentes || 'No declaró.') + '</p></label>'
    + '<label class="campo" style="margin-bottom:0"><span class="eti">Objetivo del paciente</span>'
    + '<p style="color:var(--tinta2)">' + (p.objetivos || '—') + '</p></label>'
    + '</div>'
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Plan y sesiones</h2></div>'
    + '<div class="rejilla c2">'
    + dato('Plan', planDe(p).nombre)
    + dato('Sesiones que le quedan', (p.creditos || 0) + '')
    + '</div>'
    + (p.tutor ? '<div class="nota info">Menor de edad. Autoriza ' + p.tutor.nombre
        + ' (' + p.tutor.vinculo + '), teléfono ' + p.tutor.tel + '.</div>' : '')
    + (p.consentimiento && p.consentimiento.aceptado
        ? '<div class="nota bien" style="margin-bottom:0">Consentimiento otorgado el '
          + fechaCorta(p.consentimiento.fecha) + '.'
          + (esKine ? '' : ' <a href="#" onclick="revocar();return false" style="color:inherit;'
            + 'text-decoration:underline">Revocarlo</a>')
          + '</div>'
        : '<div class="nota aviso" style="margin-bottom:0">Sin consentimiento vigente. '
          + 'No se pueden registrar datos clínicos nuevos.</div>')
    + '</div>'
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Estudios complementarios</h2>'
    + '<span class="eti">' + estudiosDe(pid).length + ' cargados</span></div>'
    + (estudiosDe(pid).length
        ? '<div class="estudios">' + estudiosDe(pid).map(function(e){
            return '<button class="est" onclick="abrirEstudio(\'' + pid + '\',\'' + e.id + '\')">'
              + '<span class="est-ver">'
              + (e.formato === 'imagen'
                  ? '<img src="' + e.dato + '" alt="">'
                  : '<span class="est-ico">' + (e.formato === 'pdf' ? 'PDF' : 'WEB') + '</span>')
              + '</span>'
              + '<span class="est-txt"><b>' + e.tipo + '</b>'
              + '<small>' + (e.fecha ? fechaCorta(e.fecha) : fechaCorta(e.cargado))
              + (e.peso ? ' · ' + pesoLegible(e.peso) : '') + '</small></span></button>';
          }).join('') + '</div>'
        : '<div class="vacio"><b>Sin estudios cargados</b>'
          + 'Una ecografía, una resonancia o un informe.</div>')
    + (esKine
        ? '<button class="bt hueco ancho" style="margin-top:12px" onclick="agregarEstudio()">'
          + 'Agregar un estudio</button>'
        : '')
    + '</div>'

    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Evolución</h2>'
    + '<span class="eti">' + h.length + ' asientos</span></div>'
    + (h.length
        ? h.slice().reverse().map(asientoHTML).join('')
        : '<div class="vacio"><b>Sin asientos</b>Todavía no se registró ninguna actuación.</div>')
    + '</div>'
    + (esKine
        ? '<div class="tarjeta no-imprimir">'
          + '<div class="tarjeta-cab"><h2 class="sub">Quién vio esta historia</h2>'
          + '<span class="eti">' + acc.length + ' accesos</span></div>'
          + (acc.length
              ? acc.slice().reverse().slice(0, 20).map(function(a){
                  return '<div class="fila" style="cursor:default"><span class="hh">'
                    + a.sello.slice(11,16) + '</span>'
                    + '<span class="cu"><b>' + a.quien + '</b><small>' + a.que + '</small></span>'
                    + '<span class="pin gris">' + fechaCorta(a.sello.slice(0,10)) + '</span></div>';
                }).join('')
              : '<div class="vacio">Sin accesos registrados.</div>')
          + '</div>'
        : '')
    + '<p style="font-size:12px;color:var(--tinta3);margin-top:20px;text-align:center">'
    + 'Documento emitido el ' + fechaLarga(HOY) + '. El paciente es el titular de su historia '
    + 'clínica y puede pedir copia en cualquier momento (Ley 26.529, artículo 14).</p>';
}
function asientoHTML(a){
  return '<div class="asiento' + (a.rectifica ? ' rect' : '') + '">'
    + '<div class="asiento-cab"><span class="folio">' + a.n + '</span>'
    + '<b>' + tituloAsiento(a) + '</b>'
    + '<span class="cuando">' + fechaLarga(a.fecha) + ' · ' + a.hora + ' · ' + a.autor + '</span></div>'
    + (a.rectifica ? '<div class="nota aviso" style="margin:4px 0 6px;padding:7px 11px;font-size:13px">'
        + 'Rectifica el asiento ' + a.rectifica + '. El original no se borra.</div>' : '')
    + '<div class="cuerpo">' + a.contenido + '</div>'
    + '<div class="huella">huella ' + a.huella.slice(0, 32) + '…</div>'
    + '</div>';
}
function dato(l, v){
  return '<div style="margin-bottom:12px"><span class="eti">' + l + '</span>'
       + '<div class="mono" style="font-size:15px;margin-top:3px">' + v + '</div></div>';
}
/* ── CARGAR UN ESTUDIO ───────────────────────────────────────────── */
var EST = {tipo:'Ecografía', fecha:'', nota:'', archivo:null, enlace:''};

function agregarEstudio(){
  EST = {tipo:'Ecografía', fecha:'', nota:'', archivo:null, enlace:''};
  var caja = document.createElement('div');
  caja.className = 'ayuda-fondo'; caja.id = 'cajaNuevoEst';
  caja.innerHTML = '<div class="ayuda-caja"><div id="cuerpoEst"></div></div>';
  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarNuevoEst(); });
  document.body.appendChild(caja);
  document.body.style.overflow = 'hidden';
  pintarNuevoEst();
}

function pintarNuevoEst(){
  document.getElementById('cuerpoEst').innerHTML =
    '<button class="cerrar" onclick="cerrarNuevoEst()" aria-label="Cerrar">&times;</button>'
    + '<span class="eti">Estudio complementario</span>'
    + '<h2>Agregar un estudio</h2>'

    + '<label class="campo"><span class="eti">Qué es</span>'
    + '<div class="pestanias" id="eTipo" style="margin-bottom:0">'
    + TIPOS_ESTUDIO.map(function(t){
        return '<button class="pest' + (t === EST.tipo ? ' on' : '') + '" data-t="' + t + '">'
             + t + '</button>';
      }).join('') + '</div></label>'

    + '<label class="campo"><span class="eti">Fecha del estudio</span>'
    + '<input type="date" id="eFecha" value="' + (EST.fecha || '') + '"></label>'

    + '<div class="nota info">Lo más práctico es una <b>foto del estudio</b> o un recorte de '
    + 'la imagen que importa: se ve al instante y pesa poco. Un PDF sirve si es un informe '
    + 'de texto; las resonancias completas suelen ser demasiado pesadas.</div>'

    + '<input type="file" id="eArchivo" accept="image/*,application/pdf" style="display:none" '
    + 'onchange="elegirArchivo(this)">'
    + '<button class="bt hueco ancho" onclick="document.getElementById(\'eArchivo\').click()">'
    + (EST.archivo ? 'Cambiar el archivo' : 'Elegir foto o PDF') + '</button>'

    + '<div id="estVista">' + (EST.archivo ? vistaPrevia() : '') + '</div>'

    + '<label class="campo" style="margin-top:14px"><span class="eti">O pegá un enlace</span>'
    + '<input type="text" id="eEnlace" value="' + (EST.enlace || '') + '" '
    + 'placeholder="https://... del centro de imágenes o de un Drive"></label>'

    + '<label class="campo"><span class="eti">Qué dice, en una línea (opcional)</span>'
    + '<input type="text" id="eNota" value="' + (EST.nota || '') + '" '
    + 'placeholder="Rotura parcial del supraespinoso"></label>'

    + '<div id="avisoEst"></div>'
    + '<button class="bt ancho" onclick="guardarNuevoEst()">Agregar a la historia</button>';

  document.querySelectorAll('#eTipo .pest').forEach(function(b){
    b.onclick = function(){
      EST.fecha = document.getElementById('eFecha').value;
      EST.enlace = document.getElementById('eEnlace').value;
      EST.nota = document.getElementById('eNota').value;
      EST.tipo = b.dataset.t; pintarNuevoEst();
    };
  });
}

function vistaPrevia(){
  var a = EST.archivo;
  if(!a) return '';
  return '<div class="nota bien" style="margin-top:12px">'
    + '<b>' + a.nombre + '</b> — ' + pesoLegible(a.peso)
    + (a.formato === 'imagen' ? ', achicada para que pese poco.' : '') + '</div>'
    + (a.formato === 'imagen'
        ? '<img src="' + a.dato + '" style="width:100%;border-radius:var(--r);'
          + 'background:var(--negro);margin-top:10px;display:block">'
        : '');
}

function elegirArchivo(input){
  var av = document.getElementById('avisoEst');
  av.innerHTML = '<div class="nota info">Preparando el archivo…</div>';
  prepararEstudio(input.files && input.files[0], function(listo, motivo){
    if(!listo){
      if(motivo && motivo.indexOf('PESADO:') === 0){
        av.innerHTML = '<div class="nota aviso"><b>Ese PDF pesa '
          + motivo.split(':')[1] + ' y es demasiado.</b><br>'
          + 'Subilo a un Drive y pegá el enlace acá abajo, o sacale una foto a la '
          + 'imagen que te interesa: suele ser más útil que las trescientas '
          + 'imágenes de la resonancia completa.</div>';
      }else{
        av.innerHTML = '<div class="nota reserva">' + motivo + '</div>';
      }
      return;
    }
    av.innerHTML = '';
    EST.fecha = document.getElementById('eFecha').value;
    EST.enlace = document.getElementById('eEnlace').value;
    EST.nota = document.getElementById('eNota').value;
    EST.archivo = listo;
    pintarNuevoEst();
  });
}

function guardarNuevoEst(){
  var av = document.getElementById('avisoEst');
  var enlace = (document.getElementById('eEnlace').value || '').trim();
  if(!EST.archivo && !enlace){
    av.innerHTML = '<div class="nota aviso">Elegí un archivo o pegá un enlace.</div>';
    return;
  }
  var est = {
    tipo: EST.tipo,
    fecha: document.getElementById('eFecha').value || '',
    nota: (document.getElementById('eNota').value || '').trim()
  };
  if(EST.archivo){
    est.formato = EST.archivo.formato;
    est.dato = EST.archivo.dato;
    est.nombre = EST.archivo.nombre;
    est.peso = EST.archivo.peso;
  }else{
    est.formato = 'enlace';
    est.enlace = enlace;
  }
  guardarEstudio(pid, est);
  cerrarNuevoEst();
  pintar();
}

function cerrarNuevoEst(){
  var c = document.getElementById('cajaNuevoEst');
  if(c) c.remove();
  document.body.style.overflow = '';
}

function agregarNota(){
  var t = prompt('¿Qué querés dejar asentado?');
  if(!t || !t.trim()) return;
  asentar(pid, 'nota', t.trim());
  pintar();
}
/* El consentimiento es revocable por ley. Revocarlo no borra la historia
   (que hay que conservar), pero corta el registro de datos nuevos. */
function revocar(){
  if(!confirm('Al revocar el consentimiento el estudio deja de registrar datos nuevos '
    + 'sobre tu tratamiento. La historia ya escrita se conserva, porque la ley obliga a '
    + 'guardarla. ¿Confirmás?')) return;
  var p = paciente(pid);
  p.consentimiento = {aceptado:false, fecha:HOY, revocado:HOY};
  guardar('kine/pacientes/' + pid + '/consentimiento', p.consentimiento);
  asentar(pid, 'revocacion', 'El paciente revocó el consentimiento para el tratamiento de sus datos.');
  pintar();
}
pintar();
</script>
<script>
/* Desinstala cualquier programa que haya quedado de versiones anteriores.
   Uno viejo guardaba el portal para funcionar sin internet y rompia
   Safari: la pagina directamente no abria. Como ademas quedaba instalado
   en el telefono, el arreglo no llegaba nunca. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(r){
    if(!r.length) return;
    Promise.all(r.map(function(x){ return x.unregister(); }))
      .then(function(){ return caches.keys(); })
      .then(function(c){ return Promise.all(c.map(function(k){ return caches.delete(k); })); })
      .then(function(){
        if(!sessionStorage.getItem('limpio')){
          sessionStorage.setItem('limpio','1'); location.reload();
        }
      }).catch(function(){});
  }).catch(function(){});
}
</script>
</body></html>
