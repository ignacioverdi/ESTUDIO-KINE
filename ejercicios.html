<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ejercicios · Estudio</title>
<link rel="icon" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05070B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estudio">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="css/tema.css">
<link rel="stylesheet" href="css/estudio.css">
<script src="js/firebase.js" onerror="void 0"></script>
<script src="js/datos.js"></script><script src="js/plantillas.js"></script><script src="js/qr.js"></script><script src="js/historia.js"></script><script src="js/dinero.js"></script><script src="js/atender.js"></script><script src="js/ayuda.js"></script><script src="js/base.js"></script>
<style>
  .ejs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .ej{border:1px solid var(--linea);border-radius:var(--r);background:var(--hoja);overflow:hidden;
      text-align:left;font-family:inherit;color:inherit;cursor:pointer;transition:.13s;padding:0}
  .ej:hover{border-color:var(--linea2);box-shadow:var(--sombra);transform:translateY(-1px)}
  .ej .mini{height:112px;background:#3F8F42;position:relative;display:flex;align-items:center;justify-content:center}
  .ej .mini.gym{background:#2F3542}
  .ej .mini span{font-family:var(--dat);font-size:10px;letter-spacing:1.4px;text-transform:uppercase;
    color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.4);padding:4px 9px;border-radius:20px}
  .ej .cu{padding:12px 13px}
  .ej .cu b{display:block;font-size:14.5px;font-weight:600;line-height:1.25}
  .ej .cu small{display:block;color:var(--tinta2);font-size:12.5px;margin-top:3px}
</style>
</head>
<body data-pag="ejercicios">
<div class="hoja">
  <h1 class="tit">Biblioteca del estudio</h1>
  <p class="bajada">Los circuitos que se dibujan en el pizarrón y los ejercicios sueltos con su
  video. Se filma una vez y se reusa en cada programa.</p>
  <div class="pestanias">
    <button class="pest on" data-f="todos">Todos</button>
    <button class="pest" data-f="Tobillo">Tobillo</button>
    <button class="pest" data-f="Rodilla">Rodilla</button>
    <button class="pest" data-f="Hombro">Hombro</button>
    <button class="pest" data-f="Lumbar">Lumbar</button>
  </div>
  <div class="tarjeta">
    <div class="tarjeta-cab"><h2 class="sub">Circuitos en cancha</h2>
      <a class="eti" href="pizarron.html" style="text-decoration:none">Dibujar uno nuevo →</a></div>
    <div class="ejs" id="circuitos"></div>
  </div>
  <div class="tarjeta">
    <div class="tarjeta-cab"><h2 class="sub">Ejercicios sueltos</h2>
      <span class="eti" id="cuenta"></span></div>
    <div class="ejs" id="sueltos"></div>
  </div>
</div>
<script>
var SUELTOS = [
  {n:'Movilidad de tobillo con banda', z:'Tobillo', f:2, lugar:'gym', video:true},
  {n:'Eversión con banda',             z:'Tobillo', f:2, lugar:'gym', video:true},
  {n:'Elevación de talones sentado',   z:'Tobillo', f:2, lugar:'gym', video:false},
  {n:'Apoyo en un pie',                z:'Tobillo', f:2, lugar:'gym', video:true},
  {n:'Saltos con aterrizaje',          z:'Rodilla', f:3, lugar:'cancha', video:true},
  {n:'Sentadilla búlgara',             z:'Rodilla', f:3, lugar:'gym', video:true},
  {n:'Nórdico de isquiotibiales',      z:'Rodilla', f:3, lugar:'gym', video:true},
  {n:'Rotación externa con banda',     z:'Hombro',  f:3, lugar:'gym', video:true},
  {n:'Remo con banda',                 z:'Hombro',  f:2, lugar:'gym', video:false},
  {n:'Elevación en Y boca abajo',      z:'Hombro',  f:3, lugar:'gym', video:true},
  {n:'Puente de glúteo',               z:'Lumbar',  f:2, lugar:'gym', video:true},
  {n:'Plancha lateral',                z:'Lumbar',  f:3, lugar:'gym', video:false},
  {n:'Bird dog',                       z:'Lumbar',  f:2, lugar:'gym', video:true}
];
var filtro = 'todos';
document.querySelectorAll('.pest[data-f]').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('.pest[data-f]').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); filtro = b.dataset.f; pintar();
  };
});
function tarjeta(e){
  return '<button class="ej" onclick="verSuelto(\'' + e.n.replace(/'/g,"") + '\')">'
    + '<div class="mini ' + (e.lugar === 'gym' ? 'gym' : '') + '">'
    + '<span>' + (e.video ? 'Con video' : 'Sin video') + '</span></div>'
    + '<div class="cu"><b>' + e.n + '</b>'
    + '<small class="mono">' + e.z.toUpperCase() + ' · DESDE FASE ' + e.f + '</small></div></button>';
}
/* Un video de ejemplo para los que lo tienen cargado. En producción
   el enlace sale de kine/ejercicios/<id>/video. */
var VIDEO_DEMO = 'https://www.youtube.com/watch?v=IODxDxX7oi4';
function verSuelto(nom){
  var e = null;
  SUELTOS.forEach(function(x){ if(x.n.replace(/'/g,"") === nom) e = x; });
  if(!e) return;
  abrirVideo(e.n, e.video ? VIDEO_DEMO : null,
             e.z + ' · desde fase ' + e.f + '. Se suma al programa desde la ficha del paciente.');
}
function pintar(){
  var c = BASE.ejercicios.filter(function(e){ return filtro === 'todos' || e.zona === filtro; });
  document.getElementById('circuitos').innerHTML = c.length
    ? c.map(function(e){
        return '<button class="ej" onclick="irA(\'pizarron.html\')">'
          + '<div class="mini"><span>4 postas</span></div>'
          + '<div class="cu"><b>' + e.nombre + '</b>'
          + '<small class="mono">' + e.zona.toUpperCase() + ' · FASE ' + e.fase + '</small></div></button>';
      }).join('')
    : '<div class="vacio" style="grid-column:1/-1"><b>Sin circuitos para esa zona</b>'
      + 'Dibujá uno en el pizarrón y queda guardado acá.</div>';
  var s = SUELTOS.filter(function(e){ return filtro === 'todos' || e.z === filtro; });
  document.getElementById('sueltos').innerHTML = s.map(tarjeta).join('');
  document.getElementById('cuenta').textContent = s.length + ' ejercicios · '
    + s.filter(function(e){ return e.video; }).length + ' con video';
}
pintar();
</script>
<script>
/* Desinstala cualquier programa que haya quedado de versiones anteriores.
   Uno viejo guardaba el portal para funcionar sin internet y rompia
   Safari: la pagina directamente no abria. Como ademas quedaba instalado
   en el telefono, el arreglo no llegaba nunca. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(r){
    if(!r.length) return;
    Promise.all(r.map(function(x){ return x.unregister(); }))
      .then(function(){ return caches.keys(); })
      .then(function(c){ return Promise.all(c.map(function(k){ return caches.delete(k); })); })
      .then(function(){
        if(!sessionStorage.getItem('limpio')){
          sessionStorage.setItem('limpio','1'); location.reload();
        }
      }).catch(function(){});
  }).catch(function(){});
}
</script>
</body></html>
