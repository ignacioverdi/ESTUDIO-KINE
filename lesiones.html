<html lang="es"><head>

<body data-pag="ficha">
<div class="hoja">
  <h1 class="tit" id="titulo">Lesiones</h1>
  <p class="bajada" id="bajada">Cada ficha avanza por criterios, no por calendario.</p>
  <div id="lista"></div>
  <div id="ficha"></div>
</div>
<script>
var abierta = new URLSearchParams(location.search).get('f');
var ALTA_DADA = null;
function pintar(){
  var lista = document.getElementById('lista'), ficha = document.getElementById('ficha');
  if(!abierta){
    document.getElementById('titulo').textContent = 'Lesiones';
    document.getElementById('bajada').textContent =
      'Tres en tratamiento. Cada ficha avanza por criterios cumplidos, no por días transcurridos.';
    ficha.innerHTML = '';
    var activas = sanearTodasLasLesiones().filter(function(L){ return L.estado === 'activa'; });
    lista.innerHTML = (ALTA_DADA
        ? '<div class="nota bien"><b>' + ALTA_DADA + '</b> recibió el alta. '
          + 'Ya figura disponible en el parte médico y su ficha pasó al historial.</div>'
        : '')
      + '<div class="tarjeta">' + activas.map(function(L){
      var listos = criteriosListos(L);
      return '<button class="fila" style="align-items:flex-start" onclick="abrir(\'' + L.id + '\')">'
        + '<span class="hh">' + (L.dorsal ? '#' + L.dorsal : 'P') + '</span>'
        + '<span class="cu"><b>' + nombrePaciente(L) + ' — ' + L.zona + ' ' + L.lado + '</b>'
        + '<small>' + L.diagnostico + ' · día ' + diasDeLesion(L) + ', ' + diasDeRehab(L)
        + ' de rehabilitación</small>' + pista(L.fase, false) + '</span>'
        + '<span class="pin reservado">' + listos + '/' + L.criterios.length + '</span></button>';
    }).join('') + '</div>';
    return;
  }
  var L = lesionPorId(abierta);
  if(!L){
    /* Los datos de la base llegan medio segundo despues de que carga la
       pantalla. Antes esto ponia "abierta" en null y volvia al listado:
       cuando los datos llegaban, ya no habia a que lesion volver y el
       enlace directo a una ficha nunca funcionaba. Ahora espera. */
    lista.innerHTML = '<div class="vacio"><b>Buscando la ficha…</b>'
      + 'Si no aparece, volvé a Pacientes y entrá desde ahí.</div>';
    return;
  }
  lista.innerHTML = '<button class="bt neutro chico" style="margin-bottom:16px" onclick="abrir(null)">← Todas las lesiones</button>';
  document.getElementById('titulo').textContent = nombrePaciente(L) + ' · ' + L.zona.toLowerCase() + ' ' + L.lado;
  document.getElementById('bajada').textContent = L.diagnostico
    + (L.cirugia ? '. Operado el ' + fechaLarga(L.cirugia) : '. Lesionado el ' + fechaLarga(L.fecha))
    + (inicioRehab(L) ? '. Empezó a tratarse el ' + fechaLarga(inicioRehab(L)) + '.' : '.');
  var sigue  = Math.min(L.fase + 1, 5);
  var faltanC = L.criterios.length - criteriosListos(L);
  ficha.innerHTML =
    /* estado */
    '<div class="tarjeta">'
    + '<div class="rejilla c4" style="margin-bottom:18px">'
    + '<div class="dato"><div class="v">' + diasDeLesion(L) + '</div><div class="l">'
    + (L.cirugia ? 'Días de la cirugía' : 'Días de la lesión') + '</div></div>'
    + '<div class="dato"><div class="v" style="color:var(--acc)">' + diasDeRehab(L)
    + '</div><div class="l">Días de rehabilitación</div></div>'
    + '<div class="dato"><div class="v">' + faltan(L.alta) + '</div><div class="l">Días para el alta</div></div>'
    + '<div class="dato"><div class="v">' + L.sesiones.length + '</div><div class="l">Sesiones</div></div>'
    + '</div>'
    + '<div class="rejilla c3" style="margin-bottom:18px">'
    + '<div class="dato"><div class="v" style="color:var(--acc)">' + L.fase + '</div><div class="l">Fase actual</div></div>'
    + '<div class="dato"><div class="v" style="font-size:20px">'
    + (L.cirugia ? fechaCorta(L.cirugia) : fechaCorta(L.fecha)) + '</div><div class="l">'
    + (L.cirugia ? 'Fecha de cirugía' : 'Fecha de lesión') + '</div></div>'
    + '<div class="dato"><div class="v" style="font-size:20px">'
    + (inicioRehab(L) ? fechaCorta(inicioRehab(L)) : '—') + '</div><div class="l">Empezó a tratarse</div></div>'
    + '</div>'
    /* Una espera larga entre la lesion y la primera sesion explica por que
       alguien va lento. Sin verla, se lo apura de mas. */
    + (diasDeEspera(L) !== null && diasDeEspera(L) > 7
        ? '<div class="nota aviso">Pasaron ' + diasDeEspera(L) + ' días entre '
          + (L.cirugia ? 'la cirugía' : 'la lesión') + ' y la primera sesión. '
          + 'Tenerlo en cuenta al comparar contra los plazos habituales.</div>'
        : '')
    + pista(L.fase)
    + '<p style="font-size:14px;color:var(--tinta2);margin-top:14px">' + FASES[L.fase-1].d + '</p>'
    + '</div>'
    /* criterios */
    + '<div class="tarjeta">'
    + '<div class="tarjeta-cab"><h2 class="sub">Para pasar a fase ' + sigue + ' — ' + FASES[sigue-1].t + '</h2></div>'
    + (faltanC
        ? '<div class="nota aviso">Falta' + (faltanC > 1 ? 'n ' + faltanC + ' criterios' : ' un criterio') + '. Hasta que estén, no avanza.</div>'
        : '<div class="nota bien">Todos los criterios cumplidos. Se puede avanzar.</div>')
    + L.criterios.map(function(c, i){
        return '<label class="crit ' + (c.ok ? '' : 'falta') + '">'
          + '<input type="checkbox" ' + (c.ok ? 'checked' : '') + ' onchange="tildar(' + i + ',this.checked)">'
          + '<span>' + c.t + '</span></label>';
      }).join('')
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">'
    + '<button class="bt" ' + (faltanC ? 'disabled' : '') + ' onclick="avanzar()">Pasar a fase ' + sigue + '</button>'
    + '<button class="bt hueco" onclick="abrirConversacion(\'' + L.pid + '\')">Mensajes'
    + (sinLeer(L.pid) ? ' (' + sinLeer(L.pid) + ')' : '') + '</button>'
    + '<a class="bt neutro" href="historia.html?p=' + L.pid + '" style="text-decoration:none">Historia clínica</a>'
    + '<button class="bt hueco" onclick="editarLesion()">Corregir la lesión</button>'
    + '<button class="bt neutro" onclick="borrarLesion()">Borrar</button>'
    + '</div></div>'
    /* mecanismo */
    + '<div class="tarjeta"><div class="tarjeta-cab"><h2 class="sub">Cómo se lesionó</h2></div>'
    + '<p style="color:var(--tinta2)">' + L.mecanismo + '</p></div>'
    /* programa */
    + '<div class="tarjeta"><div class="tarjeta-cab"><h2 class="sub">Programa de esta fase</h2>'
    + '<a class="eti" href="ejercicios.html" style="text-decoration:none">Biblioteca →</a></div>'
    + (programaDe(L).length
        ? programaDe(L).map(function(e){
            return '<div class="fila" style="cursor:default"><span class="cu"><b>' + e.n + '</b>'
              + '<small>' + dosis(e) + ' — ' + e.nota + '</small></span></div>';
          }).join('')
        : '<div class="vacio"><b>Sin programa cargado para la fase ' + L.fase + '</b>'
          + 'Armalo desde la biblioteca o dibujá un circuito en el pizarrón.</div>')
    + '</div>'
    /* sesiones */
    + '<div class="tarjeta"><div class="tarjeta-cab"><h2 class="sub">Sesiones</h2>'
    + '<span class="eti">Dolor antes → después</span></div>'
    + L.sesiones.map(function(s){
        var baja = s.post < s.pre;
        return '<div class="fila" style="cursor:default;align-items:flex-start">'
          + '<span class="hh">' + fechaCorta(s.f) + '</span>'
          + '<span class="cu"><b>' + s.t + '</b><small>' + s.nota + '</small></span>'
          + '<span class="pin ' + (baja ? 'atendido' : 'gris') + '">' + s.pre + ' → ' + s.post + '</span></div>';
      }).join('')
    + '<button class="bt hueco ancho" style="margin-top:12px" onclick="abrirSesion()">Cargar sesión de hoy</button>'
    + '</div>';
}
/* ── Cargar la sesión del día ──────────────────────────────────────
   Es la pantalla que el kinesiólogo usa quince veces por día, así que
   tiene que ser rápida: el tipo y las dos escalas de dolor se tocan,
   no se escriben. Solo la nota se tipea, y es opcional.
   El dolor antes y después es el dato que importa: la diferencia entre
   los dos es lo que muestra si la sesión sirvió. Por eso los dos son
   obligatorios y la nota no.                                          */
var sesionNueva = null;
/* ══════════════════════════════════════════════════════════════════════
   CORREGIR UNA LESION YA CARGADA

   No habia forma. Si el diagnostico se cargaba mal, o la zona, o la
   fecha, quedaba asi para siempre: la unica salida era borrar al
   paciente entero y cargarlo de nuevo, perdiendo su historia.

   Como en la historia clinica, corregir NO borra lo anterior: se agrega
   un asiento de rectificacion que dice que cambio. Es un documento
   legal y se edita como en papel, tachando y firmando al lado.
   ══════════════════════════════════════════════════════════════════════ */
function editarLesion(){
  var caja = document.createElement('div');
  caja.className = 'ayuda-fondo'; caja.id = 'cajaEditar';
  caja.innerHTML = '<div class="ayuda-caja"><div id="cuerpoEd"></div></div>';
  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarEditar(); });
  document.body.appendChild(caja);
  document.body.style.overflow = 'hidden';
  pintarEditar();
}

function pintarEditar(){
  var L = lesionPorId(abierta);
  if(!L) return;
  var pl = PLANTILLAS[L.zona] || PLANTILLAS.Otra;
  document.getElementById('cuerpoEd').innerHTML =
    '<button class="cerrar" onclick="cerrarEditar()" aria-label="Cerrar">&times;</button>'
    + '<span class="eti">Corregir</span><h2>' + L.zona + ' ' + (L.lado === '—' ? '' : L.lado) + '</h2>'
    + '<div class="nota info">Lo que corrijas queda asentado en la historia clínica: '
    + 'no se borra lo anterior, se agrega la corrección.</div>'

    + '<label class="campo"><span class="eti">Zona</span>'
    + '<div class="pestanias" id="eZona" style="margin-bottom:0">'
    + ZONAS.map(function(z){
        return '<button class="pest' + (z === L.zona ? ' on' : '') + '" data-z="' + z + '">' + z + '</button>';
      }).join('') + '</div></label>'

    + '<label class="campo"><span class="eti">Lado</span>'
    + '<div class="pestanias" id="eLado" style="margin-bottom:0">'
    + ['derecho','izquierdo','—'].map(function(x){
        return '<button class="pest' + (x === L.lado ? ' on' : '') + '" data-l="' + x + '">' + x + '</button>';
      }).join('') + '</div></label>'

    + '<label class="campo"><span class="eti">Qué tiene — el diagnóstico</span>'
    + '<input type="text" id="eDiag" list="sugEd" autocomplete="off" value="'
    + (L.diagnostico || '').replace(/"/g, '&quot;') + '">'
    + '<datalist id="sugEd">'
    + pl.diagnosticos.map(function(d){ return '<option value="' + d + '">'; }).join('')
    + '</datalist></label>'

    + '<label class="campo"><span class="eti">Gravedad</span>'
    + '<div class="pestanias" id="eGrav" style="margin-bottom:0">'
    + GRAVEDAD.map(function(g){
        return '<button class="pest' + (g.n === L.gravedad ? ' on' : '') + '" data-g="' + g.n + '">'
             + g.t + '</button>';
      }).join('') + '</div></label>'

    + '<label class="campo"><span class="eti">Cómo se lesionó</span>'
    + '<textarea id="eMec">' + (L.mecanismo === '—' ? '' : (L.mecanismo || '')) + '</textarea></label>'

    + '<div class="rejilla c2">'
    + '<label class="campo"><span class="eti">Cuándo se lesionó</span>'
    + '<input type="date" id="eFecha" value="' + L.fecha + '"></label>'
    + '<label class="campo"><span class="eti">Alta estimada</span>'
    + '<input type="date" id="eAlta" value="' + L.alta + '"></label></div>'

    + '<label class="campo"><span class="eti">Fecha de cirugía (si hubo)</span>'
    + '<input type="date" id="eCir" value="' + (L.cirugia || '') + '"></label>'

    + '<div id="avisoEd"></div>'
    + '<button class="bt ancho" onclick="guardarEdicion()">Guardar la corrección</button>';

  document.querySelectorAll('#eZona .pest').forEach(function(b){
    b.onclick = function(){
      /* Cambiar de zona cambia los criterios de la fase: hay que avisarlo. */
      L.zona = b.dataset.z;
      document.getElementById('avisoEd').innerHTML =
        '<div class="nota aviso">Al cambiar la zona, los criterios de la fase ' + L.fase
        + ' se reemplazan por los de ' + L.zona.toLowerCase() + '. Lo ya tildado se pierde.</div>';
      pintarEditar();
    };
  });
  document.querySelectorAll('#eLado .pest').forEach(function(b){
    b.onclick = function(){ L.lado = b.dataset.l; pintarEditar(); };
  });
  document.querySelectorAll('#eGrav .pest').forEach(function(b){
    b.onclick = function(){ L.gravedad = +b.dataset.g; pintarEditar(); };
  });
}

function guardarEdicion(){
  var L = lesionPorId(abierta);
  if(!L) return;
  var antes = {zona:L.zona, lado:L.lado, diagnostico:L.diagnostico,
               gravedad:L.gravedad, fecha:L.fecha, alta:L.alta, cirugia:L.cirugia};
  var diag = (document.getElementById('eDiag').value || '').trim();
  if(!diag){
    document.getElementById('avisoEd').innerHTML =
      '<div class="nota aviso">El diagnóstico no puede quedar vacío.</div>';
    return;
  }
  L.diagnostico = diag;
  L.mecanismo = (document.getElementById('eMec').value || '').trim() || '—';
  L.fecha = document.getElementById('eFecha').value || L.fecha;
  L.alta = document.getElementById('eAlta').value || L.alta;
  L.cirugia = document.getElementById('eCir').value || null;

  /* Si cambió la zona, los criterios de la fase actual ya no aplican. */
  if(antes.zona !== L.zona){
    L.criterios = criteriosDe(L.zona, L.fase);
  }

  var cambios = [];
  ['zona','lado','diagnostico','gravedad','fecha','alta','cirugia'].forEach(function(k){
    if(String(antes[k] || '') !== String(L[k] || '')){
      cambios.push(k + ': "' + (antes[k] || 'vacío') + '" pasa a "' + (L[k] || 'vacío') + '"');
    }
  });

  guardar('kine/lesiones/' + L.id, L);
  if(cambios.length){
    asentar(L.pid, 'rectificacion', 'Se corrigieron datos de la lesión. ' + cambios.join('. ') + '.');
  }
  cerrarEditar();
  pintar();
}

function cerrarEditar(){
  var c = document.getElementById('cajaEditar');
  if(c) c.remove();
  document.body.style.overflow = '';
}


/* ── BORRAR UNA LESION ──────────────────────────────────────────────
   Se lleva sus sesiones y su programa de ejercicios. La historia clinica
   del paciente NO se toca: lo que paso, paso.                        */
function borrarLesion(){
  var L = lesionPorId(abierta);
  if(!L) return;
  var p = paciente(L.pid);
  var caja = document.createElement('div');
  caja.className = 'ayuda-fondo'; caja.id = 'cajaBorrarL';
  caja.innerHTML = '<div class="ayuda-caja">'
    + '<button class="cerrar" onclick="cerrarBorrarL()" aria-label="Cerrar">&times;</button>'
    + '<span class="eti">Borrar la lesión</span>'
    + '<h2>' + L.zona + ' ' + (L.lado === '—' ? '' : L.lado) + '</h2>'
    + '<p>' + (p ? p.nombre : '') + ' · ' + L.diagnostico + '</p>'
    + '<div class="nota reserva">Esto no se puede deshacer.</div>'
    + '<div class="fila" style="cursor:default"><span class="cu">Sesiones cargadas</span>'
    + '<span class="pin gris">' + sesionesDe(L).length + '</span></div>'
    + '<div class="fila" style="cursor:default"><span class="cu">Ejercicios del programa</span>'
    + '<span class="pin gris">' + programaDe(L).length + '</span></div>'
    + '<div class="nota info">La historia clínica del paciente NO se toca: lo que pasó, pasó. '
    + 'Si la lesión terminó, mejor darle el alta en vez de borrarla: así queda en su historial.</div>'
    + (sesionesDe(L).length
        ? '<label class="campo"><span class="eti">Escribí BORRAR para confirmar</span>'
          + '<input type="text" id="cBorrarL" placeholder="BORRAR"></label>'
        : '')
    + '<div id="avisoBorrarL"></div>'
    + '<button class="bt ancho" style="background:var(--rojo);border-color:var(--rojo)" '
    + 'onclick="confirmarBorrarL()">Borrar la lesión</button>'
    + '<button class="bt neutro ancho" style="margin-top:8px" onclick="cerrarBorrarL()">Cancelar</button>'
    + '</div>';
  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarBorrarL(); });
  document.body.appendChild(caja);
  document.body.style.overflow = 'hidden';
}

function confirmarBorrarL(){
  var L = lesionPorId(abierta);
  if(!L) return;
  var campo = document.getElementById('cBorrarL');
  if(campo && (campo.value || '').trim().toUpperCase() !== 'BORRAR'){
    document.getElementById('avisoBorrarL').innerHTML =
      '<div class="nota aviso">Escribí BORRAR para confirmar.</div>';
    return;
  }
  var pid = L.pid, desc = L.zona + ' ' + L.lado + ' — ' + L.diagnostico;

  if(BASE.programas) delete BASE.programas[L.id];
  guardar('kine/programas/' + L.id, null);
  if(L.dorsal){
    delete BASE.disponibilidad[L.dorsal];
    guardar('kine/disponibilidad/' + L.dorsal, null);
  }
  BASE.lesiones = lista(BASE.lesiones).filter(function(x){ return x.id !== L.id; });
  guardar('kine/lesiones/' + L.id, null);

  asentar(pid, 'rectificacion', 'Se borró la ficha de lesión: ' + desc + '.');
  location.href = 'pacientes.html';
}

function cerrarBorrarL(){
  var c = document.getElementById('cajaBorrarL');
  if(c) c.remove();
  document.body.style.overflow = '';
}

function abrirSesion(){
  var L = lesionPorId(abierta);
  if(!L) return;
  sesionNueva = {tipo:'Tratamiento', pre:null, post:null, nota:''};
  var caja = document.createElement('div');
  caja.className = 'ayuda-fondo';
  caja.id = 'cajaSesion';
  caja.innerHTML =
    '<div class="ayuda-caja">'
    + '<button class="cerrar" onclick="cerrarSesion()" aria-label="Cerrar">&times;</button>'
    + '<span class="eti">Sesión de hoy</span>'
    + '<h2>' + nombrePaciente(L) + ' · ' + L.zona.toLowerCase() + '</h2>'
    + '<p>Día ' + dias(L.fecha) + ' · fase ' + L.fase + ', ' + FASES[L.fase-1].t.toLowerCase() + '</p>'
    + '<label class="campo"><span class="eti">Qué tipo de sesión</span>'
    + '<div class="pestanias" id="tipoSes" style="margin-bottom:0">'
    + ['Evaluación','Tratamiento','Gimnasio','Campo'].map(function(t){
        return '<button class="pest' + (t === 'Tratamiento' ? ' on' : '') + '" data-t="' + t + '">' + t + '</button>';
      }).join('')
    + '</div></label>'
    + '<label class="campo"><span class="eti">Dolor al llegar</span><div id="esPre"></div></label>'
    + '<label class="campo"><span class="eti">Dolor al terminar</span><div id="esPost"></div></label>'
    + '<label class="campo"><span class="eti">Qué se hizo (opcional)</span>'
    + '<textarea id="notaSes" placeholder="Movilidad articular, isométricos de eversión..."></textarea></label>'
    + '<div id="avisoSes"></div>'
    + '<button class="bt ancho" onclick="guardarSesion()">Guardar sesión</button>'
    + '</div>';
  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarSesion(); });
  document.body.appendChild(caja);
  document.body.style.overflow = 'hidden';
  var tipos = document.getElementById('tipoSes');
  tipos.querySelectorAll('.pest').forEach(function(b){
    b.onclick = function(){
      tipos.querySelectorAll('.pest').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on'); sesionNueva.tipo = b.dataset.t;
    };
  });
  escala(document.getElementById('esPre'),  function(v){ sesionNueva.pre = v; });
  escala(document.getElementById('esPost'), function(v){ sesionNueva.post = v; });
}
function cerrarSesion(){
  var c = document.getElementById('cajaSesion');
  if(c) c.remove();
  document.body.style.overflow = '';
}
function guardarSesion(){
  var av = document.getElementById('avisoSes');
  if(sesionNueva.pre === null || sesionNueva.post === null){
    av.innerHTML = '<div class="nota aviso">Marcá el dolor al llegar y al terminar. '
      + 'La diferencia entre los dos es el dato que sirve.</div>';
    return;
  }
  var L = lesionPorId(abierta);
  sesionNueva.nota = document.getElementById('notaSes').value.trim() || '—';
  L.sesiones.unshift({f:HOY, t:sesionNueva.tipo, pre:sesionNueva.pre,
                      post:sesionNueva.post, nota:sesionNueva.nota});
  asentar(L.pid, 'sesion',
    sesionNueva.tipo + '. Dolor al llegar ' + sesionNueva.pre + '/10, al terminar '
    + sesionNueva.post + '/10. Fase ' + L.fase + '. ' + sesionNueva.nota);
  guardar('kine/sesiones/' + L.id + '/' + HOY, {
    dorsal:L.dorsal, fecha:HOY, tipo:sesionNueva.tipo,
    dolor_pre:sesionNueva.pre, dolor_post:sesionNueva.post,
    notas:sesionNueva.nota, fase:L.fase
  });
  var pac = L.pid ? paciente(L.pid) : null;
  if(pac && pac.estado === 'pendiente'){
    pac.estado = 'activo';
    guardar('kine/pacientes/' + pac.id + '/estado', 'activo');
  }
  cerrarSesion();
  pintar();
}
function abrir(id){
  abierta = id;
  history.replaceState(null, '', id ? '?f=' + id : location.pathname);
  pintar(); scrollTo(0, 0);
}
function tildar(i, v){
  var L = lesionPorId(abierta);
  L.criterios[i].ok = v;
  guardar('kine/lesiones/' + L.id + '/criterios/' + i + '/ok', v);
  asentar(L.pid, 'criterio',
    (v ? 'Cumple' : 'Deja de cumplir') + ' el criterio de fase ' + L.fase
    + ': ' + L.criterios[i].t + '.');
  pintar();
}
function avanzar(){
  var L = lesionPorId(abierta);
  if(L.fase >= 5) return;
  L.fase++;
  /* Los criterios de la fase nueva salen de la plantilla de esa zona.
     El kine no los escribe: aparecen. */
  L.criterios = (L.fase <= 4) ? criteriosDe(L.zona, L.fase) : [];
  /* El parte médico se mueve solo con la fase. De baja hasta la 3,
     limitado en la 4, disponible al llegar a la 5. Nadie lo carga a
     mano, así que no se puede quedar viejo. */
  var d = L.dorsal;
  if(d){
    if(L.fase >= 5){
      delete BASE.disponibilidad[d];
      guardar('kine/disponibilidad/' + d, null);
    }else{
      BASE.disponibilidad[d] = {
        estado: estadoPorFase(L.fase), motivo: L.zona.toLowerCase(),
        desde: L.fecha, hasta: L.alta
      };
      guardar('kine/disponibilidad/' + d, BASE.disponibilidad[d]);
    }
  }
  /* Fase 5 es el alta. La lesión se cierra y deja de figurar entre las
     activas, pero queda en el historial del paciente. */
  if(L.fase >= 5){
    L.estado = 'alta';
    L.alta_real = HOY;
    guardar('kine/lesiones/' + L.id, L);
    asentar(L.pid, 'alta_medica',
      'Alta. ' + L.diagnostico + ', ' + dias(L.fecha) + ' días de tratamiento y '
      + L.sesiones.length + ' sesiones. Completó las cinco fases cumpliendo los criterios '
      + 'de cada una. Queda disponible sin restricciones.');
    ALTA_DADA = nombrePaciente(L);
    abrir(null);
    return;
  }
  asentar(L.pid, 'cambio_fase',
    'Pasa a fase ' + L.fase + ', ' + FASES[L.fase-1].t.toLowerCase()
    + ', tras cumplir todos los criterios de la anterior. '
    + 'Se cargan ' + L.criterios.length + ' criterios nuevos. '
    + 'Disponibilidad: ' + estadoPorFase(L.fase) + '.');
  guardar('kine/lesiones/' + L.id, L);
  pintar();
}
pintar();
</script>
<script>
/* Desinstala cualquier programa que haya quedado de versiones anteriores.
   Uno viejo guardaba el portal para funcionar sin internet y rompia
   Safari: la pagina directamente no abria. Como ademas quedaba instalado
   en el telefono, el arreglo no llegaba nunca. */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(r){
    if(!r.length) return;
    Promise.all(r.map(function(x){ return x.unregister(); }))
      .then(function(){ return caches.keys(); })
      .then(function(c){ return Promise.all(c.map(function(k){ return caches.delete(k); })); })
      .then(function(){
        if(!sessionStorage.getItem('limpio')){
          sessionStorage.setItem('limpio','1'); location.reload();
        }
      }).catch(function(){});
  }).catch(function(){});
}
</script>
