le=\"border-radius:var(--r);width:170px;height:70px\">Sin logo</div>')\n    + '<div style=\"flex:1;min-width:200px\">'\n    + '<input type=\"file\" id=\"fLogo\" accept=\"image/*\" style=\"display:none\" '\n    + 'onchange=\"subirImagen(this,\\'logo\\',600)\">'\n    + '<button class=\"bt hueco\" onclick=\"document.getElementById(\\'fLogo\\').click()\">'\n    + (P.logo ? 'Cambiar el logo' : 'Elegir un logo') + '</button>'\n    + (P.logo ? ' <button class=\"bt neutro\" onclick=\"borrar(\\'logo\\')\">Quitar</button>' : '')\n    + '</div></div></div>'\n\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Tus datos</h2></div>'\n    + campo('nombre', 'Nombre y apellido')\n    + campo('matricula', 'Matrícula y título')\n    + '<div class=\"rejilla c2\">' + campo('estudio', 'Nombre del estudio') + campo('club', 'Club') + '</div>'\n    + '<div class=\"rejilla c2\">' + campo('tel', 'Teléfono') + campo('email', 'Correo') + '</div>'\n    + campo('direccion', 'Dirección')\n    + '</div>'\n\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Quién sos</h2>'\n    + '<span class=\"eti\">Lo lee el paciente nuevo</span></div>'\n    + '<textarea id=\"c_presentacion\" style=\"min-height:120px\" '\n    + 'oninput=\"tocar(\\'presentacion\\',this.value)\">' + (P.presentacion || '') + '</textarea>'\n    + '<p style=\"font-size:13px;color:var(--tinta3);margin-top:8px\">Escribilo como se lo '\n    + 'contarías a alguien en la sala de espera, no como un currículum.</p></div>'\n\n    + '<div id=\"aviso\"></div>'\n    + '<button class=\"bt ancho\" onclick=\"guardarPerfil()\">Guardar</button>'\n\n    /* Vaciar es lo último de la pantalla y no se puede deshacer. Va\n       separado, explicado, y pide escribir una palabra: un botón suelto\n       que borra todo se toca sin querer. */\n    + (esDemo()\n        ? '<div class=\"tarjeta\" style=\"margin-top:26px;border-color:var(--ambar-borde)\">'\n          + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Empezar de cero</h2>'\n          + '<span class=\"eti\">Una sola vez</span></div>'\n          + '<p style=\"color:var(--tinta2);margin-bottom:14px\">El portal viene con pacientes '\n          + 'inventados para que se vea andando: Marcela Ríos, Diego Sosa y los demás no existen. '\n          + '<b>Antes de cargar el primer paciente de verdad, vaciá todo.</b> Si no, dentro de un '\n          + 'mes no vas a saber cuál es real y cuál no.</p>'\n          + '<p style=\"color:var(--tinta2);margin-bottom:14px\">Se borran los pacientes, las '\n          + 'lesiones, las historias, los turnos y la caja. <b>No</b> se borran las plantillas de '\n          + 'lesión, la biblioteca de ejercicios, tu perfil ni el horario del estudio: eso es la '\n          + 'herramienta, no los datos.</p>'\n          + '<div class=\"nota reserva\">Esto no se puede deshacer.</div>'\n          + '<label class=\"campo\"><span class=\"eti\">Escribí VACIAR para confirmar</span>'\n          + '<input type=\"text\" id=\"cVaciar\" placeholder=\"VACIAR\"></label>'\n          + '<button class=\"bt ancho\" style=\"background:var(--rojo);border-color:var(--rojo)\" '\n          + 'onclick=\"confirmarVaciado()\">Vaciar y empezar de cero</button>'\n          + '</div>'\n        : '<div class=\"nota bien\" style=\"margin-top:26px\">El portal está limpio. Los datos de '\n          + 'demostración se borraron y no vuelven.</div>');\n}\n\nfunction campo(k, l){\n  var P = perfil();\n  return '<label class=\"campo\"><span class=\"eti\">' + l + '</span>'\n    + '<input type=\"text\" id=\"c_' + k + '\" value=\"' + (P[k] || '').replace(/\"/g,'&quot;') + '\" '\n    + 'oninput=\"tocar(\\'' + k + '\\',this.value)\"></label>';\n}\n\nfunction tocar(k, v){ perfil()[k] = v; }\n\n/* Las imágenes se achican antes de guardarse. Una foto de celular pesa\n   cuatro megas: guardada tal cual, la app tarda una eternidad en abrir\n   y Firebase la rechaza. Reducida a 400 píxeles pesa cuarenta kilos. */\nfunction subirImagen(input, destino, lado){\n  var f = input.files && input.files[0];\n  if(!f) return;\n  var lector = new FileReader();\n  lector.onload = function(ev){\n    var img = new Image();\n    img.onload = function(){\n      var esc = Math.min(1, lado / Math.max(img.width, img.height));\n      var c = document.createElement('canvas');\n      c.width = Math.round(img.width * esc);\n      c.height = Math.round(img.height * esc);\n      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);\n      perfil()[destino] = c.toDataURL('image/jpeg', 0.82);\n      pintar();\n    };\n    img.src = ev.target.result;\n  };\n  lector.readAsDataURL(f);\n}\n\nfunction borrar(k){ perfil()[k] = null; pintar(); }\n\nfunction confirmarVaciado(){\n  var t = (document.getElementById('cVaciar').value || '').trim().toUpperCase();\n  if(t !== 'VACIAR'){\n    document.getElementById('aviso').innerHTML =\n      '<div class=\"nota aviso\">Escribí VACIAR en el campo para confirmar.</div>';\n    document.getElementById('cVaciar').focus();\n    return;\n  }\n  var P = perfil();\n  vaciarTodo();\n  BASE.perfil = P;\n  guardar('kine/perfil', P);\n  document.getElementById('todo').innerHTML =\n    '<div class=\"tarjeta\" style=\"margin-top:40px\"><div class=\"vacio\">'\n    + '<b>Listo. El portal está en cero.</b>'\n    + 'Ya podés cargar tu primer paciente de verdad. El cartel amarillo desapareció.</div>'\n    + '<a class=\"bt ancho\" href=\"cartel.html\" style=\"text-decoration:none;text-align:center\">'\n    + 'Ver el cartel con el QR para repartir</a>'\n    + '<a class=\"bt neutro ancho\" href=\"pacientes.html\" style=\"text-decoration:none;text-align:center;margin-top:8px\">'\n    + 'Ir al padrón</a></div>';\n  var c = document.querySelector('.cartel-demo');\n  if(c) c.remove();\n  scrollTo(0, 0);\n}\n\nfunction guardarPerfil(){\n  guardar('kine/perfil', perfil());\n  document.getElementById('aviso').innerHTML =\n    '<div class=\"nota bien\">Guardado. Ya se ve en el portal y en el cartel.</div>';\n}\n\npintar();\n"}, "pizarron": {"pag": "pizarron", "cuerpo": "<div class=\"hoja\">\n  <h1 class=\"tit\">Pizarrón de circuitos</h1>\n  <p class=\"bajada\">Armá el circuito en la cancha, numerá las postas y escribí qué se hace en cada\n  una. Se guarda como datos, no como imagen: por eso después se puede animar, traducir y mostrar\n  en el celular del jugador con el video al lado.</p>\n\n  <div class=\"taller\">\n\n    <div class=\"tarjeta\">\n      <div class=\"tarjeta-cab\" style=\"margin-bottom:12px\"><h2 class=\"sub\">Elementos</h2></div>\n      <div id=\"paleta\"></div>\n    </div>\n\n    <div class=\"tarjeta\">\n      <div class=\"pestanias\" style=\"margin-bottom:10px\">\n        <button class=\"pest on\" data-h=\"colocar\">Colocar</button>\n        <button class=\"pest\" data-h=\"mover\">Mover</button>\n        <button class=\"pest\" data-h=\"correr\">Correr</button>\n        <button class=\"pest\" data-h=\"conducir\">Conducir</button>\n        <button class=\"pest\" data-h=\"pase\">Pase</button>\n        <button class=\"pest rojo\" data-h=\"borrar\">Borrar</button>\n      </div>\n      <div class=\"pestanias\">\n        <button class=\"pest\" data-c=\"completa\">Cancha entera</button>\n        <button class=\"pest on\" data-c=\"media\">Media cancha</button>\n        <button class=\"pest\" data-c=\"reducido\">Reducido</button>\n        <button class=\"pest\" data-c=\"gimnasio\">Gimnasio</button>\n      </div>\n      <svg id=\"campo\" viewBox=\"0 0 1050 680\" xmlns=\"http://www.w3.org/2000/svg\">\n        <g id=\"fondo\"></g><g id=\"capaTrazos\"></g><g id=\"capaPiezas\"></g><g id=\"capaTemp\"></g>\n      </svg>\n      <p style=\"margin-top:10px;font-size:13px;color:var(--tinta2)\">\n        <b>Colocar:</b> elegí un elemento a la izquierda y tocá la cancha.\n        <b>Mover:</b> arrastrá lo que ya está puesto.\n        <b>Correr, conducir y pase:</b> arrastrá de un punto a otro.\n      </p>\n    </div>\n\n    <div class=\"tarjeta\">\n      <div class=\"tarjeta-cab\" style=\"margin-bottom:12px\"><h2 class=\"sub\">El ejercicio</h2></div>\n      <label class=\"campo\"><span class=\"eti\">Nombre</span><input type=\"text\" id=\"nom\"></label>\n      <label class=\"campo\"><span class=\"eti\">Para qué sirve</span><input type=\"text\" id=\"obj\"></label>\n      <span class=\"eti\" style=\"display:block;margin-bottom:8px\">Postas</span>\n      <div id=\"postas\"></div>\n      <button class=\"bt neutro ancho\" onclick=\"agregarPosta()\">+ Agregar posta</button>\n      <button class=\"bt ancho\" style=\"margin-top:8px\" onclick=\"guardarEj()\">Guardar en la biblioteca</button>\n      <button class=\"bt hueco ancho\" style=\"margin-top:8px\" onclick=\"bajarPNG()\">Bajar imagen</button>\n    </div>\n\n  </div>\n</div>", "js": "\n/* ══════════════════════════════════════════════════════════════════\n   CATÁLOGO — dibujado centrado en 0,0.\n   Sumar un elemento nuevo es sumar una línea acá. Nada más cambia.\n   ══════════════════════════════════════════════════════════════════ */\nvar ITEMS = {\n  cono:     {g:'Marcas', d:'<polygon points=\"0,-15 11,12 -11,12\" fill=\"#F97316\" stroke=\"#C2410C\" stroke-width=\"1.5\"/><ellipse cy=\"12\" rx=\"14\" ry=\"4\" fill=\"#EA580C\"/>'},\n  conoAmar: {g:'Marcas', d:'<polygon points=\"0,-15 11,12 -11,12\" fill=\"#FACC15\" stroke=\"#A16207\" stroke-width=\"1.5\"/><ellipse cy=\"12\" rx=\"14\" ry=\"4\" fill=\"#EAB308\"/>'},\n  plato:    {g:'Marcas', d:'<ellipse rx=\"14\" ry=\"6\" fill=\"#38BDF8\" stroke=\"#0284C7\" stroke-width=\"1.5\"/><ellipse rx=\"7\" ry=\"3\" fill=\"#0EA5E9\"/>'},\n  marca:    {g:'Marcas', d:'<circle r=\"7\" fill=\"#fff\" stroke=\"#94A3B8\" stroke-width=\"1.5\"/>'},\n\n  pica:     {g:'Obstáculos', d:'<rect x=\"-2\" y=\"-22\" width=\"4\" height=\"40\" fill=\"#DC2626\"/><rect x=\"-9\" y=\"16\" width=\"18\" height=\"4\" rx=\"2\" fill=\"#7F1D1D\"/>'},\n  valla:    {g:'Obstáculos', d:'<rect x=\"-16\" y=\"-14\" width=\"32\" height=\"4\" rx=\"2\" fill=\"#FACC15\"/><rect x=\"-16\" y=\"-14\" width=\"4\" height=\"26\" fill=\"#EAB308\"/><rect x=\"12\" y=\"-14\" width=\"4\" height=\"26\" fill=\"#EAB308\"/><rect x=\"-20\" y=\"10\" width=\"40\" height=\"4\" rx=\"2\" fill=\"#A16207\"/>'},\n  vallaBaja:{g:'Obstáculos', d:'<rect x=\"-15\" y=\"-4\" width=\"30\" height=\"4\" rx=\"2\" fill=\"#F97316\"/><rect x=\"-15\" y=\"-4\" width=\"3\" height=\"14\" fill=\"#EA580C\"/><rect x=\"12\" y=\"-4\" width=\"3\" height=\"14\" fill=\"#EA580C\"/>'},\n  escalera: {g:'Obstáculos', d:'<rect x=\"-13\" y=\"-30\" width=\"26\" height=\"60\" fill=\"none\" stroke=\"#FBBF24\" stroke-width=\"2.5\"/><line x1=\"-13\" y1=\"-15\" x2=\"13\" y2=\"-15\" stroke=\"#FBBF24\" stroke-width=\"2.5\"/><line x1=\"-13\" y1=\"0\" x2=\"13\" y2=\"0\" stroke=\"#FBBF24\" stroke-width=\"2.5\"/><line x1=\"-13\" y1=\"15\" x2=\"13\" y2=\"15\" stroke=\"#FBBF24\" stroke-width=\"2.5\"/>'},\n  aro:      {g:'Obstáculos', d:'<ellipse rx=\"17\" ry=\"9\" fill=\"none\" stroke=\"#22C55E\" stroke-width=\"4\"/>'},\n\n  arco:     {g:'Cancha', d:'<rect x=\"-30\" y=\"-16\" width=\"60\" height=\"22\" fill=\"rgba(255,255,255,.22)\" stroke=\"#fff\" stroke-width=\"2.5\"/><path d=\"M-30,-16 L-30,6 M-15,-16 L-15,6 M0,-16 L0,6 M15,-16 L15,6 M30,-16 L30,6\" stroke=\"rgba(255,255,255,.55)\" stroke-width=\"1\"/>'},\n  pelota:   {g:'Cancha', d:'<circle r=\"9\" fill=\"#fff\" stroke=\"#1E293B\" stroke-width=\"1.5\"/><polygon points=\"0,-4.5 4.3,-1.4 2.6,3.6 -2.6,3.6 -4.3,-1.4\" fill=\"#1E293B\"/>'},\n  jugador:  {g:'Cancha', d:'<circle r=\"13\" fill=\"#1D3E6E\" stroke=\"#fff\" stroke-width=\"2.5\"/>'},\n  kine:     {g:'Cancha', d:'<circle r=\"13\" fill=\"#0F766E\" stroke=\"#fff\" stroke-width=\"2.5\"/><path d=\"M-5,0 H5 M0,-5 V5\" stroke=\"#fff\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>'},\n\n  colchon:  {g:'Gimnasio', d:'<rect x=\"-26\" y=\"-14\" width=\"52\" height=\"28\" rx=\"5\" fill=\"#3B82F6\" stroke=\"#1D4ED8\" stroke-width=\"2\"/>'},\n  step:     {g:'Gimnasio', d:'<rect x=\"-22\" y=\"-8\" width=\"44\" height=\"12\" rx=\"3\" fill=\"#94A3B8\" stroke=\"#475569\" stroke-width=\"2\"/><rect x=\"-18\" y=\"4\" width=\"8\" height=\"9\" fill=\"#64748B\"/><rect x=\"10\" y=\"4\" width=\"8\" height=\"9\" fill=\"#64748B\"/>'},\n  bosu:     {g:'Gimnasio', d:'<path d=\"M-20,10 A20,18 0 0 1 20,10 Z\" fill=\"#60A5FA\" stroke=\"#2563EB\" stroke-width=\"2\"/><rect x=\"-22\" y=\"9\" width=\"44\" height=\"5\" rx=\"2\" fill=\"#1E293B\"/>'},\n  banda:    {g:'Gimnasio', d:'<path d=\"M-22,0 Q-14,-11 -6,0 T10,0 T22,0\" fill=\"none\" stroke=\"#A855F7\" stroke-width=\"4\" stroke-linecap=\"round\"/>'}\n};\n\nvar piezas = [], trazos = [], postas = [], cancha = 'media';\nvar herramienta = 'colocar', elegido = 'cono', selId = null, contador = 1;\n\nvar svg = document.getElementById('campo'),\n    gPz = document.getElementById('capaPiezas'),\n    gTr = document.getElementById('capaTrazos'),\n    gTm = document.getElementById('capaTemp'),\n    gBg = document.getElementById('fondo');\n\nvar LINEA = 'rgba(255,255,255,.75)';\nfunction pintarFondo(){\n  var L = 'stroke=\"' + LINEA + '\" stroke-width=\"3\" fill=\"none\"', rayas = '';\n  for(var i = 0; i < 10; i++)\n    rayas += '<rect x=\"' + (i*105) + '\" y=\"0\" width=\"105\" height=\"680\" fill=\"'\n           + (i % 2 ? 'rgba(255,255,255,.045)' : 'transparent') + '\"/>';\n  var h = '<rect width=\"1050\" height=\"680\" fill=\"#3F8F42\"/>' + rayas;\n\n  if(cancha === 'completa'){\n    h += '<rect x=\"40\" y=\"40\" width=\"970\" height=\"600\" ' + L + '/>'\n       + '<line x1=\"525\" y1=\"40\" x2=\"525\" y2=\"640\" ' + L + '/>'\n       + '<circle cx=\"525\" cy=\"340\" r=\"88\" ' + L + '/><circle cx=\"525\" cy=\"340\" r=\"4\" fill=\"' + LINEA + '\"/>'\n       + '<rect x=\"40\" y=\"180\" width=\"150\" height=\"320\" ' + L + '/><rect x=\"40\" y=\"255\" width=\"55\" height=\"170\" ' + L + '/>'\n       + '<rect x=\"860\" y=\"180\" width=\"150\" height=\"320\" ' + L + '/><rect x=\"955\" y=\"255\" width=\"55\" height=\"170\" ' + L + '/>';\n  }else if(cancha === 'media'){\n    h += '<rect x=\"40\" y=\"40\" width=\"970\" height=\"600\" ' + L + '/>'\n       + '<rect x=\"40\" y=\"150\" width=\"300\" height=\"380\" ' + L + '/>'\n       + '<rect x=\"40\" y=\"245\" width=\"110\" height=\"190\" ' + L + '/>'\n       + '<path d=\"M340,250 A110,110 0 0 1 340,430\" ' + L + '/>'\n       + '<circle cx=\"230\" cy=\"340\" r=\"5\" fill=\"' + LINEA + '\"/>';\n  }else if(cancha === 'reducido'){\n    h += '<rect x=\"120\" y=\"70\" width=\"810\" height=\"540\" ' + L + '/>'\n       + '<line x1=\"525\" y1=\"70\" x2=\"525\" y2=\"610\" ' + L + '/><circle cx=\"525\" cy=\"340\" r=\"70\" ' + L + '/>';\n  }else{\n    h = '<rect width=\"1050\" height=\"680\" fill=\"#2F3542\"/>';\n    for(var x = 0; x <= 1050; x += 70) h += '<line x1=\"'+x+'\" y1=\"0\" x2=\"'+x+'\" y2=\"680\" stroke=\"rgba(255,255,255,.08)\"/>';\n    for(var y = 0; y <= 680; y += 70) h += '<line x1=\"0\" y1=\"'+y+'\" x2=\"1050\" y2=\"'+y+'\" stroke=\"rgba(255,255,255,.08)\"/>';\n  }\n  gBg.innerHTML = h;\n  svg.style.background = cancha === 'gimnasio' ? '#2F3542' : '#3F8F42';\n}\n\n/* paleta */\n(function(){\n  var gr = {}, orden = [];\n  for(var k in ITEMS){ var g = ITEMS[k].g; if(!gr[g]){ gr[g] = []; orden.push(g); } gr[g].push(k); }\n  document.getElementById('paleta').innerHTML = orden.map(function(g){\n    return '<div class=\"grupo\"><span class=\"eti\">' + g + '</span><div class=\"paleta\">'\n      + gr[g].map(function(k){\n          return '<button class=\"pz' + (k === elegido ? ' on' : '') + (g === 'Gimnasio' ? ' gym' : '') + '\" data-k=\"' + k + '\" title=\"' + k + '\">'\n               + '<svg viewBox=\"-32 -32 64 64\">' + ITEMS[k].d + '</svg></button>';\n        }).join('') + '</div></div>';\n  }).join('');\n  document.querySelectorAll('.pz').forEach(function(p){\n    p.onclick = function(){\n      document.querySelectorAll('.pz').forEach(function(x){ x.classList.remove('on'); });\n      p.classList.add('on'); elegido = p.dataset.k; herramienta = 'colocar';\n      document.querySelectorAll('.pest[data-h]').forEach(function(x){ x.classList.toggle('on', x.dataset.h === 'colocar'); });\n    };\n  });\n})();\n\ndocument.querySelectorAll('.pest[data-h]').forEach(function(t){\n  t.onclick = function(){\n    document.querySelectorAll('.pest[data-h]').forEach(function(x){ x.classList.remove('on'); });\n    t.classList.add('on'); herramienta = t.dataset.h; selId = null; pintarPiezas();\n  };\n});\ndocument.querySelectorAll('.pest[data-c]').forEach(function(t){\n  t.onclick = function(){\n    document.querySelectorAll('.pest[data-c]').forEach(function(x){ x.classList.remove('on'); });\n    t.classList.add('on'); cancha = t.dataset.c; pintarFondo();\n  };\n});\n\nfunction pintarPiezas(){\n  gPz.innerHTML = piezas.map(function(p){\n    var cuerpo = p.tipo === '_posta'\n      ? '<circle r=\"16\" fill=\"#fff\" stroke=\"#1D3E6E\" stroke-width=\"3\"/>'\n        + '<text y=\"5.5\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-weight=\"600\" font-size=\"16\" fill=\"#1D3E6E\">' + p.n + '</text>'\n      : ITEMS[p.tipo].d;\n    return '<g class=\"pieza' + (p.id === selId ? ' sel' : '') + '\" data-id=\"' + p.id + '\" '\n      + 'transform=\"translate(' + p.x + ',' + p.y + ')\">'\n      + (p.id === selId ? '<circle class=\"halo\" r=\"26\"/>' : '')\n      + '<circle r=\"24\" fill=\"transparent\"/>' + cuerpo + '</g>';\n  }).join('');\n}\nfunction pintarTrazos(){\n  gTr.innerHTML = trazos.map(dibujar).join('')\n    + '<defs><marker id=\"pta\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\">'\n    + '<path d=\"M0,0 L10,5 L0,10 z\" fill=\"#fff\"/></marker></defs>';\n}\nfunction dibujar(t){\n  var com = 'stroke=\"#fff\" stroke-width=\"3.5\" fill=\"none\" marker-end=\"url(#pta)\" stroke-linecap=\"round\"';\n  if(t.tipo === 'pase')\n    return '<line x1=\"'+t.x1+'\" y1=\"'+t.y1+'\" x2=\"'+t.x2+'\" y2=\"'+t.y2+'\" stroke-dasharray=\"10 7\" ' + com + '/>';\n  if(t.tipo === 'conducir'){\n    var dx = t.x2-t.x1, dy = t.y2-t.y1, L = Math.hypot(dx,dy)||1, n = Math.max(3, Math.round(L/22));\n    var px = -dy/L*8, py = dx/L*8, d = 'M'+t.x1+','+t.y1;\n    for(var i = 1; i <= n; i++){\n      var s = (i%2?1:-1), a = (i-.5)/n, b = i/n;\n      d += ' Q'+(t.x1+dx*a+px*s)+','+(t.y1+dy*a+py*s)+' '+(t.x1+dx*b)+','+(t.y1+dy*b);\n    }\n    return '<path d=\"'+d+'\" ' + com + '/>';\n  }\n  return '<line x1=\"'+t.x1+'\" y1=\"'+t.y1+'\" x2=\"'+t.x2+'\" y2=\"'+t.y2+'\" ' + com + '/>';\n}\nfunction pos(e){\n  var r = svg.getBoundingClientRect();\n  return {x:(e.clientX-r.left)/r.width*1050, y:(e.clientY-r.top)/r.height*680};\n}\nfunction distSeg(px,py,x1,y1,x2,y2){\n  var dx = x2-x1, dy = y2-y1, L2 = dx*dx+dy*dy;\n  var t = L2 ? Math.max(0, Math.min(1, ((px-x1)*dx+(py-y1)*dy)/L2)) : 0;\n  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));\n}\n\nvar arrastre = null, trazando = null;\nsvg.addEventListener('pointerdown', function(e){\n  var p = pos(e), g = e.target.closest('.pieza');\n  if(herramienta === 'borrar'){\n    if(g){ var id = +g.dataset.id; piezas = piezas.filter(function(x){ return x.id !== id; }); pintarPiezas(); }\n    else{\n      var mejor = -1, dm = 30;\n      trazos.forEach(function(t,i){ var d = distSeg(p.x,p.y,t.x1,t.y1,t.x2,t.y2); if(d<dm){dm=d;mejor=i;} });\n      if(mejor >= 0){ trazos.splice(mejor,1); pintarTrazos(); }\n    }\n    return;\n  }\n  if(herramienta === 'colocar'){\n    piezas.push({id:contador++, tipo:elegido, x:Math.round(p.x), y:Math.round(p.y)});\n    pintarPiezas(); return;\n  }\n  if(herramienta === 'mover'){\n    if(g){\n      var i2 = +g.dataset.id;\n      piezas.forEach(function(x){ if(x.id === i2) arrastre = {p:x, dx:x.x-p.x, dy:x.y-p.y}; });\n      selId = i2; pintarPiezas(); svg.setPointerCapture(e.pointerId);\n    }else{ selId = null; pintarPiezas(); }\n    return;\n  }\n  trazando = {tipo:herramienta, x1:p.x, y1:p.y, x2:p.x, y2:p.y};\n  svg.setPointerCapture(e.pointerId);\n});\nsvg.addEventListener('pointermove', function(e){\n  var p = pos(e);\n  if(arrastre){ arrastre.p.x = Math.round(p.x+arrastre.dx); arrastre.p.y = Math.round(p.y+arrastre.dy); pintarPiezas(); }\n  else if(trazando){ trazando.x2 = p.x; trazando.y2 = p.y; gTm.innerHTML = dibujar(trazando); }\n});\nsvg.addEventListener('pointerup', function(){\n  if(trazando){\n    if(Math.hypot(trazando.x2-trazando.x1, trazando.y2-trazando.y1) > 20){ trazos.push(trazando); pintarTrazos(); }\n    gTm.innerHTML = ''; trazando = null;\n  }\n  arrastre = null;\n});\n\n/* postas */\nfunction agregarPosta(){\n  var n = postas.length + 1;\n  postas.push({n:n, txt:''});\n  piezas.push({id:contador++, tipo:'_posta', n:n, x:130+n*80, y:600});\n  pintarPostas(); pintarPiezas();\n}\nfunction borrarPosta(n){\n  postas = postas.filter(function(p){ return p.n !== n; });\n  piezas = piezas.filter(function(p){ return !(p.tipo === '_posta' && p.n === n); });\n  postas.forEach(function(p,i){\n    var v = p.n; p.n = i+1;\n    piezas.forEach(function(z){ if(z.tipo === '_posta' && z.n === v) z.n = i+1; });\n  });\n  pintarPostas(); pintarPiezas();\n}\nfunction pintarPostas(){\n  var c = document.getElementById('postas');\n  if(!postas.length){\n    c.innerHTML = '<p style=\"font-size:14px;color:var(--tinta2);margin-bottom:10px\">'\n      + 'Agregá la primera posta y escribí qué se hace ahí.</p>';\n    return;\n  }\n  c.innerHTML = postas.map(function(p){\n    return '<div class=\"posta\"><div class=\"posta-h\"><span class=\"posta-n\">'+p.n+'</span>'\n      + '<b>Posta '+p.n+'</b><span class=\"x\" onclick=\"borrarPosta('+p.n+')\">×</span></div>'\n      + '<textarea placeholder=\"Qué se hace acá\" oninput=\"postas['+(p.n-1)+'].txt=this.value;crecer(this)\">'+p.txt+'</textarea></div>';\n  }).join('');\n}\n\nfunction crecer(t){ t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px'; }\nfunction guardarEj(){\n  var n = document.getElementById('nom').value.trim();\n  if(!n){ alert('Ponele un nombre al circuito antes de guardar.'); return; }\n  var ej = {nombre:n, objetivo:document.getElementById('obj').value.trim(),\n            cancha:cancha, piezas:piezas, trazos:trazos, postas:postas};\n  guardar('kine/ejercicios/' + n.replace(/[^a-zA-Z0-9]+/g,'_'), ej);\n  var a = document.createElement('a');\n  a.href = URL.createObjectURL(new Blob([JSON.stringify(ej,null,2)], {type:'application/json'}));\n  a.download = n.replace(/[^a-zA-Z0-9]+/g,'_') + '.json';\n  a.click();\n}\nfunction bajarPNG(){\n  var c2 = svg.cloneNode(true);\n  c2.setAttribute('width', 2100); c2.setAttribute('height', 1360);\n  var img = new Image();\n  img.onload = function(){\n    var cv = document.createElement('canvas'); cv.width = 2100; cv.height = 1360;\n    cv.getContext('2d').drawImage(img, 0, 0);\n    var a = document.createElement('a');\n    a.href = cv.toDataURL('image/png');\n    a.download = (document.getElementById('nom').value.trim() || 'circuito') + '.png';\n    a.click();\n  };\n  img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(new XMLSerializer().serializeToString(c2))));\n}\n\n/* ── ejemplo cargado: el circuito de cuatro postas ── */\npintarFondo();\ndocument.getElementById('nom').value = 'Circuito de reintegro — 4 postas';\ndocument.getElementById('obj').value = 'Tobillo · fase 4 · reintegro a la cancha';\n[\n /* carril 1 — skipping con devolución */\n [250,150,'arco'],[360,120,'plato'],[360,150,'plato'],[360,180,'plato'],\n [470,150,'pelota'],[560,120,'valla'],[560,180,'valla'],[680,150,'conoAmar'],\n /* carril 2 — zig zag */\n [250,300,'arco'],[370,270,'pica'],[420,330,'pica'],[470,270,'pica'],[520,330,'pica'],\n [570,270,'pica'],[660,300,'conoAmar'],[730,300,'pelota'],\n /* carril 3 — desplazamiento lateral */\n [250,450,'arco'],[380,450,'vallaBaja'],[450,450,'vallaBaja'],[520,450,'vallaBaja'],\n [610,450,'conoAmar'],[690,420,'pelota'],[690,480,'pelota'],\n /* carril 4 — escalera y definición */\n [250,590,'arco'],[380,590,'escalera'],[500,590,'plato'],[570,590,'plato'],\n [650,558,'valla'],[730,590,'pelota']\n].forEach(function(p){ piezas.push({id:contador++, tipo:p[2], x:p[0], y:p[1]}); });\n[[1,120,590],[2,120,450],[3,120,300],[4,120,150]].forEach(function(p){\n  piezas.push({id:contador++, tipo:'_posta', n:p[0], x:p[1], y:p[2]});\n});\npostas = [\n  {n:1, txt:'Skipping de un lado con devolución, skipping del otro con devolución (4 en total). En la última, control y conducción lineal.'},\n  {n:2, txt:'Zig zag, devolución en ambos lados del cono. Vuelvo en zig zag y definición.'},\n  {n:3, txt:'Desplazamiento lateral, paso por detrás del cono, defino de un lado y del otro.'},\n  {n:4, txt:'Skipping frontal, giro a la figura, anticipo de un lado, paso por atrás y defino de primera.'}\n];\npintarPiezas(); pintarTrazos(); pintarPostas();\ndocument.querySelectorAll('.posta textarea').forEach(crecer);\n\n\n/* Registra el sw para que el portal ande sin internet. Falla en silencio\n   si se abre con doble clic desde el disco: eso es normal. */\nif('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});\n"}, "programa": {"pag": "programa", "cuerpo": "<div class=\"hoja angosta\" id=\"todo\"></div>", "js": "\nvar pid = PARAMOK('p'), fase = null, prog = [], L = null, cargado = null;\n\n/* En el kit real esto es URLSearchParams. Se envuelve para que el\n   archivo único también lo entienda. */\nfunction PARAMOK(k){\n  if(typeof PARAM === 'function') return PARAM(k);\n  return new URLSearchParams(location.search).get(k);\n}\n\n/* Solo relee el programa guardado cuando cambia el paciente o la fase.\n   Antes lo releía en cada redibujado, y eso descartaba en silencio lo que\n   el kinesiólogo estaba escribiendo: sumabas un ejercicio y desaparecía. */\nfunction cargar(){\n  if(!pid) return;\n  L = null;\n  BASE.lesiones.forEach(function(x){\n    if(x.pid === pid && x.estado === 'activa') L = x;\n  });\n  if(!L) return;\n  if(fase === null) fase = L.fase;\n  var clave = pid + '|' + fase;\n  if(cargado === clave) return;              /* ya está en pantalla, no pisar */\n  cargado = clave;\n  var g = BASE.programas[L.id] && BASE.programas[L.id][fase];\n  prog = g ? JSON.parse(JSON.stringify(g)) : [];\n}\n\nfunction pintar(){\n  var caja = document.getElementById('todo');\n\n  if(!pid){\n    caja.innerHTML = '<h1 class=\"tit\">Programa de ejercicios</h1>'\n      + '<p class=\"bajada\">Elegí a quién le vas a cargar el programa. Después lo ve en su '\n      + 'celular con el video de cada ejercicio.</p>'\n      + '<div class=\"tarjeta\">' + BASE.pacientes.map(function(p){\n          var l = null;\n          BASE.lesiones.forEach(function(x){ if(x.pid === p.id && x.estado === 'activa') l = x; });\n          return '<button class=\"fila\" onclick=\"elegir(\\'' + p.id + '\\')\"'\n            + (l ? '' : ' disabled style=\"opacity:.4\"') + '>'\n            + '<span class=\"hh\">' + (p.dorsal ? '#' + p.dorsal : 'P') + '</span>'\n            + '<span class=\"cu\"><b>' + p.nombre + '</b><small>'\n            + (l ? l.zona.toLowerCase() + ' · fase ' + l.fase : 'sin lesión abierta')\n            + '</small></span>'\n            + (l ? '<span class=\"pin reservado\">Cargar</span>' : '<span class=\"pin gris\">—</span>')\n            + '</button>';\n        }).join('') + '</div>';\n    return;\n  }\n\n  cargar();\n  var p = paciente(pid);\n  if(!L){\n    caja.innerHTML = '<div class=\"tarjeta\"><div class=\"vacio\"><b>' + p.nombre + ' no tiene lesión abierta</b>'\n      + 'Abrile una desde su ficha y después volvé.</div>'\n      + '<a class=\"bt ancho\" href=\"pacientes.html\" style=\"text-decoration:none;text-align:center\">Ir al padrón</a></div>';\n    return;\n  }\n\n  caja.innerHTML =\n    '<button class=\"bt neutro chico\" style=\"margin-bottom:14px\" onclick=\"elegir(null)\">← Otro paciente</button>'\n    + '<h1 class=\"tit\">' + p.nombre + '</h1>'\n    + '<p class=\"bajada\">' + L.diagnostico + ' · ' + L.zona.toLowerCase() + ' ' + L.lado + '</p>'\n\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">¿Para qué fase?</h2>'\n    + '<span class=\"eti\">Hoy está en la ' + L.fase + '</span></div>'\n    + '<div class=\"pestanias\" id=\"selFase\" style=\"margin-bottom:0\">'\n    + [1,2,3,4].map(function(f){\n        var tiene = BASE.programas[L.id] && BASE.programas[L.id][f];\n        return '<button class=\"pest' + (f === fase ? ' on' : '') + '\" data-f=\"' + f + '\">'\n          + 'Fase ' + f + (tiene ? ' ·' + tiene.length : '') + '</button>';\n      }).join('') + '</div>'\n    + '<p style=\"font-size:14px;color:var(--tinta2);margin-top:12px\">'\n    + FASES[fase-1].t + '. ' + FASES[fase-1].d + '</p></div>'\n\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Los ejercicios</h2>'\n    + '<span class=\"eti\">' + prog.length + ' cargados</span></div>'\n    + (prog.length ? prog.map(ejercicioHTML).join('')\n        : '<div class=\"vacio\"><b>Todavía no hay nada</b>Sumá el primero desde la biblioteca '\n          + 'o creá uno a mano.</div>')\n    + '<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:12px\">'\n    + '<button class=\"bt hueco\" onclick=\"abrirBiblioteca()\">Sumar de la biblioteca</button>'\n    + '<button class=\"bt neutro\" onclick=\"sumarVacio()\">Crear uno nuevo</button>'\n    + '</div></div>'\n\n    + '<div id=\"aviso\"></div>'\n    + '<button class=\"bt ancho\" onclick=\"guardarProg()\">Guardar el programa</button>'\n    + '<p style=\"text-align:center;color:var(--tinta3);font-size:13px;margin-top:12px\">'\n    + 'En cuanto lo guardes, ' + p.nombre.split(' ')[0] + ' lo ve en su celular.</p>';\n\n  document.querySelectorAll('#selFase .pest').forEach(function(b){\n    b.onclick = function(){ fase = +b.dataset.f; cargado = null; pintar(); };\n  });\n}\n\nfunction ejercicioHTML(e, i){\n  return '<div class=\"ejer\">'\n    + '<div class=\"ejer-cab\"><span class=\"orden\">' + (i+1) + '</span>'\n    + '<input class=\"nom\" type=\"text\" value=\"' + (e.n || '').replace(/\"/g,'&quot;') + '\" '\n    + 'placeholder=\"Nombre del ejercicio\" oninput=\"campo(' + i + ',\\'n\\',this.value)\">'\n    + '<span class=\"mover\">'\n    + '<button onclick=\"mover(' + i + ',-1)\" title=\"Subir\">▲</button>'\n    + '<button onclick=\"mover(' + i + ',1)\" title=\"Bajar\">▼</button></span>'\n    + '<button class=\"quitar\" onclick=\"quitar(' + i + ')\" title=\"Quitar\">&times;</button></div>'\n\n    + '<div class=\"tres\">'\n    + '<label><span class=\"eti\">Series</span>'\n    + '<input type=\"number\" inputmode=\"numeric\" value=\"' + (e.series || '') + '\" '\n    + 'oninput=\"campo(' + i + ',\\'series\\',+this.value)\"></label>'\n    + '<label><span class=\"eti\">Repeticiones</span>'\n    + '<input type=\"text\" value=\"' + (e.reps || '').replace(/\"/g,'&quot;') + '\" '\n    + 'placeholder=\"12, o 30 seg\" oninput=\"campo(' + i + ',\\'reps\\',this.value)\"></label>'\n    + '<label><span class=\"eti\">Carga</span>'\n    + '<input type=\"text\" value=\"' + (e.carga || '').replace(/\"/g,'&quot;') + '\" '\n    + 'placeholder=\"Banda verde, 5 kg\" oninput=\"campo(' + i + ',\\'carga\\',this.value)\"></label>'\n    + '</div>'\n\n    + '<label class=\"campo\" style=\"margin-bottom:8px\"><span class=\"eti\">Cómo hacerlo</span>'\n    + '<input type=\"text\" value=\"' + (e.nota || '').replace(/\"/g,'&quot;') + '\" '\n    + 'placeholder=\"Rodilla adelante sin despegar el talón\" oninput=\"campo(' + i + ',\\'nota\\',this.value)\"></label>'\n\n    + '<label class=\"campo\" style=\"margin-bottom:0\"><span class=\"eti\">Enlace del video</span>'\n    + '<div style=\"display:flex;gap:8px\">'\n    + '<input type=\"text\" value=\"' + (e.video || '').replace(/\"/g,'&quot;') + '\" '\n    + 'placeholder=\"Pegá el enlace de YouTube o Vimeo\" oninput=\"campo(' + i + ',\\'video\\',this.value)\">'\n    + (e.video ? '<button class=\"bt hueco chico\" onclick=\"verlo(' + i + ')\">Ver</button>' : '')\n    + '</div></label>'\n    + '</div>';\n}\n\nfunction campo(i, k, v){ prog[i][k] = v; }\nfunction quitar(i){ prog.splice(i, 1); pintar(); }\nfunction mover(i, d){\n  var j = i + d;\n  if(j < 0 || j >= prog.length) return;\n  var t = prog[i]; prog[i] = prog[j]; prog[j] = t;\n  pintar();\n}\nfunction sumarVacio(){\n  prog.push({n:'', series:3, reps:'12', carga:'', nota:'', video:''});\n  pintar();\n}\nfunction verlo(i){ abrirVideo(prog[i].n || 'Ejercicio', prog[i].video, dosis(prog[i])); }\nfunction elegir(id){\n  pid = id; fase = null; cargado = null;\n  if(typeof PARAMSET === 'function') PARAMSET('p', id);\n  pintar(); scrollTo(0, 0);\n}\n\n/* Sumar desde la biblioteca es lo que hace que cargar un programa sea\n   cuestión de segundos y no de tipear todo cada vez. */\nvar BIBLIOTECA = [\n  {n:'Movilidad de tobillo con banda', z:'Tobillo', series:3, reps:'15', carga:'Banda verde', nota:'Rodilla adelante sin despegar el talón.'},\n  {n:'Eversión con banda',             z:'Tobillo', series:3, reps:'12', carga:'Banda roja', nota:'Volvé lento. Sin dolor.'},\n  {n:'Elevación de talones sentado',   z:'Tobillo', series:3, reps:'20', carga:'5 kg', nota:'Subí en 2 segundos, bajá en 4.'},\n  {n:'Apoyo en un pie',                z:'Tobillo', series:4, reps:'30 seg', carga:'Sin peso', nota:'Si te sale fácil, cerrá los ojos.'},\n  {n:'Elevación de talones de pie',    z:'Tobillo', series:4, reps:'12', carga:'20 kg', nota:'Apoyo completo.'},\n  {n:'Sentadilla búlgara',             z:'Rodilla', series:3, reps:'10 por pierna', carga:'8 kg', nota:'Rodilla alineada con el pie.'},\n  {n:'Nórdico de isquiotibiales',      z:'Rodilla', series:3, reps:'6', carga:'Peso corporal', nota:'Bajá lo más lento que puedas.'},\n  {n:'Saltos con aterrizaje',          z:'Rodilla', series:3, reps:'8', carga:'Peso corporal', nota:'Aterrizaje silencioso, rodilla no se mete adentro.'},\n  {n:'Rotación externa con banda',     z:'Hombro',  series:4, reps:'12', carga:'Banda azul', nota:'Codo pegado al cuerpo.'},\n  {n:'Remo con banda',                 z:'Hombro',  series:3, reps:'15', carga:'Banda verde', nota:'Junto los omóplatos.'},\n  {n:'Elevación en Y boca abajo',      z:'Hombro',  series:3, reps:'10', carga:'1 kg', nota:'Sin subir el hombro a la oreja.'},\n  {n:'Puente de glúteo',               z:'Lumbar',  series:3, reps:'15', carga:'Peso corporal', nota:'Apretar arriba 2 segundos.'},\n  {n:'Plancha lateral',                z:'Lumbar',  series:3, reps:'30 seg', carga:'—', nota:'Cadera alineada.'},\n  {n:'Bird dog',                       z:'Lumbar',  series:3, reps:'10 por lado', carga:'—', nota:'Sin mover la pelvis.'}\n];\n\nfunction abrirBiblioteca(){\n  var caja = document.createElement('div');\n  caja.className = 'ayuda-fondo'; caja.id = 'cajaBib';\n  var zona = L ? L.zona : 'Tobillo';\n  var suge = BIBLIOTECA.filter(function(e){ return e.z === zona; });\n  var resto = BIBLIOTECA.filter(function(e){ return e.z !== zona; });\n\n  caja.innerHTML = '<div class=\"ayuda-caja\">'\n    + '<button class=\"cerrar\" onclick=\"cerrarBib()\" aria-label=\"Cerrar\">&times;</button>'\n    + '<span class=\"eti\">Biblioteca</span><h2>Sumar ejercicios</h2>'\n    + '<p>Tocá los que quieras. Se agregan con la dosis sugerida y después la ajustás.</p>'\n    + (suge.length\n        ? '<span class=\"eti\" style=\"display:block;margin-bottom:8px\">Para ' + zona.toLowerCase() + '</span>'\n          + suge.map(fila).join('')\n        : '')\n    + '<span class=\"eti\" style=\"display:block;margin:16px 0 8px\">Todos los demás</span>'\n    + resto.map(fila).join('')\n    + '<button class=\"bt ancho\" style=\"margin-top:14px\" onclick=\"cerrarBib()\">Listo</button></div>';\n  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarBib(); });\n  document.body.appendChild(caja);\n  document.body.style.overflow = 'hidden';\n}\nfunction fila(e){\n  var i = BIBLIOTECA.indexOf(e);\n  return '<button class=\"fila\" onclick=\"sumarDeBib(' + i + ')\">'\n    + '<span class=\"cu\"><b>' + e.n + '</b><small>' + e.series + ' series · ' + e.reps\n    + (e.carga && e.carga !== '—' ? ' · ' + e.carga : '') + '</small></span>'\n    + '<span class=\"pin reservado\">+</span></button>';\n}\nfunction sumarDeBib(i){\n  var e = BIBLIOTECA[i];\n  prog.push({n:e.n, series:e.series, reps:e.reps, carga:e.carga, nota:e.nota, video:''});\n  cerrarBib(); pintar();\n}\nfunction cerrarBib(){\n  var c = document.getElementById('cajaBib');\n  if(c) c.remove();\n  document.body.style.overflow = '';\n}\n\nfunction guardarProg(){\n  var vacios = prog.filter(function(e){ return !(e.n || '').trim(); });\n  if(vacios.length){\n    document.getElementById('aviso').innerHTML =\n      '<div class=\"nota aviso\">Hay ' + vacios.length + ' ejercicio' + (vacios.length > 1 ? 's' : '')\n      + ' sin nombre. Ponéselo o quitalo.</div>';\n    return;\n  }\n  if(!BASE.programas[L.id]) BASE.programas[L.id] = {};\n  BASE.programas[L.id][fase] = prog;\n  guardar('kine/programas/' + L.id + '/' + fase, prog);\n  cargado = pid + '|' + fase;\n  asentar(pid, 'nota', 'Se le cargó el programa de fase ' + fase + ' con ' + prog.length\n    + ' ejercicios: ' + prog.map(function(e){ return e.n; }).join(', ') + '.');\n  document.getElementById('aviso').innerHTML =\n    '<div class=\"nota bien\">Guardado. ' + paciente(pid).nombre.split(' ')[0]\n    + ' ya lo ve en su celular.</div>';\n  pintar();\n  document.getElementById('aviso').innerHTML =\n    '<div class=\"nota bien\">Guardado. Ya lo ve en su celular.</div>';\n}\n\npintar();\n"}};
var MAPA = {"agenda.html": "agenda", "alta.html": "alta", "caja.html": "caja", "cartel.html": "cartel", "diario.html": "diario", "ejercicios.html": "ejercicios", "historia.html": "historia", "index.html": "inicio", "lesiones.html": "ficha", "mi.html": "mi", "pacientes.html": "pacientes", "panel.html": "panel", "perfil.html": "perfil", "pizarron.html": "pizarron", "programa.html": "programa"};
var _params = {};
function PARAM(k){ return _params[k] || null; }
function PARAMSET(k, v){ if(v){ _params[k] = v; } else { delete _params[k]; } }

function irA(url){
  var p = String(url).split('?');
  var clave = MAPA[p[0]];
  if(!clave) return;
  _params = {};
  if(p[1]) p[1].split('&').forEach(function(x){ var y = x.split('='); _params[y[0]] = y[1]; });
  mostrar(clave);
}

function cabecera(pag){
  var r = rol();
  var items = MENU[r === 'kine' ? 'kine' : 'jugador'];
  var quien = r === 'kine' ? {ini:'VR', txt:'Vero · kinesióloga'}
                           : {ini:'#' + miDorsal(), txt:nombre(miDorsal())};
  document.getElementById('armazon').innerHTML =
    '<div class="top"><div class="top-in">'
    + '<a class="marca" href="#" onclick="irA(\'index.html\');return false"><span class="sig"></span>'
    + '<span><b>ESTUDIO</b><span>Kinesiología del club</span></span></a>'
    + '<div class="quien">'
    + '<span class="av">' + quien.ini + '</span>' + quien.txt
    + '&nbsp;' + botonAyuda(pag) + '</div>'
    + '</div></div>'
    + '<div class="nav"><div class="nav-in">' + items.map(function(i){
        return '<a href="#" onclick="irA(\'' + i.a + '\');return false"'
             + (i.id === pag ? ' class="on"' : '') + '>' + i.t + '</a>';
      }).join('') + '</div></div>';

  if(typeof esDemo === 'function' && esDemo() && !document.querySelector('.cartel-demo'))
    document.body.insertBefore(cartelDemo(), document.body.firstChild);

  var vieja = document.querySelector('.barra-abajo');
  if(vieja) vieja.remove();
  var ab = document.createElement('nav');
  ab.className = 'barra-abajo';
  ab.innerHTML = items.map(function(i){
      return '<a href="#" onclick="irA(\'' + i.a + '\');return false"'
           + (i.id === pag ? ' class="on"' : '') + '>'
           + '<span class="ic">' + i.ic + '</span>' + i.t + '</a>';
    }).join('');
  document.body.appendChild(ab);
}

function mostrar(clave){
  var p = PAGINAS[clave];
  if(!p) return;
  document.body.dataset.pag = p.pag;
  cabecera(p.pag);
  var v = document.getElementById('vista');
  v.innerHTML = p.cuerpo;
  /* La pantalla corre en el ámbito global, NO en una burbuja.
     Tiene que ser así: los botones usan onclick="miFuncion()" y eso se
     busca siempre en el ámbito global. Metido en una burbuja, ningún
     botón de ninguna pantalla funciona.
     Que dos pantallas tengan una función pintar() no molesta: solo hay
     una pantalla viva por vez y el código se vuelve a correr entero en
     cada navegación. */
  var sc = document.createElement('script');
  sc.textContent = p.js;
  document.getElementById('vista').appendChild(sc);
  scrollTo(0, 0);
}

/* los enlaces sueltos que quedaron dentro de las pantallas */
document.addEventListener('click', function(e){
  var a = e.target.closest('a[href$=".html"]');
  if(a){ e.preventDefault(); irA(a.getAttribute('href')); }
});

mostrar('inicio');
