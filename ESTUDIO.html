var PAGINAS = {"agenda": {"pag": "agenda", "cuerpo": "<div class=\"hoja\">\n  <h1 class=\"tit\" id=\"tit\">Agenda</h1>\n  <p class=\"bajada\" id=\"baj\"></p>\n\n  <div class=\"pestanias\">\n    <button class=\"pest on\" data-d=\"2026-08-28\">Viernes 28</button>\n    <button class=\"pest\" data-d=\"2026-08-31\">Lunes 31</button>\n  </div>\n\n  <div class=\"tarjeta\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\" id=\"subDia\"></h2>\n      <span class=\"eti\" id=\"cuenta\"></span></div>\n    <div id=\"grilla\"></div>\n  </div>\n\n  <div class=\"tarjeta\" id=\"cajaCfg\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">Horario del estudio</h2>\n      <span class=\"eti\">Se aplica a toda la semana</span></div>\n    <div class=\"rejilla c3\">\n      <label class=\"campo\"><span class=\"eti\">Abre</span><input type=\"text\" value=\"08:30\"></label>\n      <label class=\"campo\"><span class=\"eti\">Cierra</span><input type=\"text\" value=\"12:30\"></label>\n      <label class=\"campo\"><span class=\"eti\">Minutos por turno</span><input type=\"number\" value=\"30\"></label>\n    </div>\n    <button class=\"bt hueco\" onclick=\"alert('Guardado. La grilla se rearma con estos horarios.')\">Guardar horario</button>\n  </div>\n</div>", "js": "\nvar dia = HOY, esKine = rol() === 'kine';\n\nif(!esKine){\n  document.getElementById('cajaCfg').style.display = 'none';\n  document.getElementById('tit').textContent = 'Mis turnos';\n}\n\ndocument.querySelectorAll('.pest[data-d]').forEach(function(b){\n  b.onclick = function(){\n    document.querySelectorAll('.pest[data-d]').forEach(function(x){ x.classList.remove('on'); });\n    b.classList.add('on'); dia = b.dataset.d; pintar();\n  };\n});\n\nfunction pintar(){\n  var lista = BASE.agenda[dia] || [];\n  var tomados = lista.filter(function(t){ return t.dorsal; }).length;\n  var M = ['viernes 28 de agosto','lunes 31 de agosto'];\n  document.getElementById('subDia').textContent = dia === HOY ? M[0] : M[1];\n  document.getElementById('cuenta').textContent = tomados + ' de ' + lista.length + ' ocupados';\n  document.getElementById('baj').textContent = esKine\n    ? 'Tocá un turno ocupado para abrir la ficha, o uno libre para asignarlo.'\n    : 'Tocá un horario libre para reservarlo. Te llega un aviso una hora antes.';\n\n  document.getElementById('grilla').innerHTML = lista.map(function(t, i){\n    if(!t.dorsal){\n      return '<button class=\"fila libre\" onclick=\"reservar(' + i + ')\">'\n        + '<span class=\"hh\">' + t.h + '</span>'\n        + '<span class=\"cu\"><b>' + (esKine ? 'Libre — asignar' : 'Libre — reservar') + '</b></span></button>';\n    }\n    if(!esKine && t.dorsal !== miDorsal()){\n      return '<div class=\"fila libre\" style=\"opacity:.5\"><span class=\"hh\">' + t.h + '</span>'\n        + '<span class=\"cu\"><b>Ocupado</b></span></div>';\n    }\n    var L = lesionDe(t.dorsal);\n    var mio = t.dorsal === miDorsal();\n    return '<button class=\"fila\" onclick=\"' + (esKine && L ? 'irA(\\'lesiones.html?f=' + L.id + '\\')' : 'void 0') + '\">'\n      + '<span class=\"hh\">' + t.h + '</span>'\n      + '<span class=\"cu\"><b>' + (esKine ? nombre(t.dorsal) : 'Tu turno') + '</b>'\n      + '<small>' + t.tipo + (esKine && L ? ' · ' + L.zona.toLowerCase() : ' · con Vero') + '</small></span>'\n      + '<span class=\"pin ' + (mio && !esKine ? 'reservado' : t.estado) + '\">'\n      + (mio && !esKine ? 'tuyo' : t.estado) + '</span></button>';\n  }).join('');\n}\n\nfunction reservar(i){\n  var t = (BASE.agenda[dia] || [])[i];\n  if(!t) return;\n  if(esKine){\n    var d = prompt('¿Qué dorsal asignás a las ' + t.h + '?');\n    if(!d) return;\n    t.dorsal = +d; t.tipo = 'Tratamiento'; t.estado = 'reservado';\n  }else{\n    t.dorsal = miDorsal(); t.tipo = 'Tratamiento'; t.estado = 'reservado';\n  }\n  guardar('kine/agenda/turnos/' + dia + '/' + t.h, {dorsal:t.dorsal, estado:'reservado'});\n  pintar();\n}\npintar();\n\n\n/* Registra el sw para que el portal ande sin internet. Falla en silencio\n   si se abre con doble clic desde el disco: eso es normal. */\nif('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});\n"}, "alta": {"pag": "alta", "cuerpo": "<!-- PANTALLA PUBLICA — no lleva base.js a propósito: es pública. El que entra\n     todavía no es paciente y no tiene rol, así que no hay menú ni sesión.\n     Se llega por un enlace o un código QR pegado en el estudio. -->\n\n<div class=\"top\"><div class=\"top-in\">\n  <a class=\"marca\" href=\"index.html\"><span class=\"sig\"></span>\n  <span><b>ESTUDIO</b><span>Kinesiología del club</span></span></a>\n  <div class=\"quien\" style=\"margin-left:auto\">\n    <button class=\"ayuda-bt\" onclick=\"abrirAyuda('alta')\" title=\"Cómo funciona\">?</button>\n  </div>\n</div></div>\n\n<div class=\"hoja angosta\" id=\"todo\"></div>", "js": "\nvar F = {};\n\nfunction pintar(){\n  document.getElementById('todo').innerHTML =\n\n    '<h1 class=\"tit\">Darse de alta</h1>'\n    + '<p class=\"bajada\">Completá esto una sola vez. Después vas a poder pedir turno, '\n    + 'ver tus ejercicios y seguir tu recuperación desde el celular.</p>'\n\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Quién sos</h2></div>'\n\n    + '<label class=\"campo\"><span class=\"eti\">¿Sos del plantel del club?</span>'\n    + '<div class=\"pestanias\" id=\"tipo\" style=\"margin-bottom:0\">'\n    + '<button class=\"pest\" data-t=\"plantel\">Sí, juego en el club</button>'\n    + '<button class=\"pest\" data-t=\"particular\">No, vengo por mi cuenta</button>'\n    + '</div></label>'\n\n    + '<div id=\"camposTipo\"></div>'\n\n    + '<label class=\"campo\"><span class=\"eti\">Nombre y apellido</span>'\n    + '<input type=\"text\" id=\"f_nombre\" placeholder=\"Como figura en tu documento\"></label>'\n\n    + '<div class=\"rejilla c2\">'\n    + '<label class=\"campo\"><span class=\"eti\">Documento</span>'\n    + '<input type=\"text\" id=\"f_doc\" inputmode=\"numeric\" placeholder=\"Sin puntos\"></label>'\n    + '<label class=\"campo\"><span class=\"eti\">Fecha de nacimiento</span>'\n    + '<input type=\"date\" id=\"f_nac\" onchange=\"revisarEdad()\"></label>'\n    + '</div>'\n\n    + '<div id=\"cajaTutor\"></div>'\n    + '</div>'\n\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Cómo te ubicamos</h2>'\n    + '<span class=\"eti\">Para el aviso del turno</span></div>'\n    + '<div class=\"rejilla c2\">'\n    + '<label class=\"campo\"><span class=\"eti\">Teléfono</span>'\n    + '<input type=\"text\" id=\"f_tel\" inputmode=\"tel\" placeholder=\"11 5555 0000\"></label>'\n    + '<label class=\"campo\"><span class=\"eti\">Correo</span>'\n    + '<input type=\"text\" id=\"f_mail\" inputmode=\"email\" placeholder=\"vos@mail.com\"></label>'\n    + '</div>'\n    + '<label class=\"campo\"><span class=\"eti\">¿Por qué venís? (en tus palabras)</span>'\n    + '<textarea id=\"f_motivo\" placeholder=\"Me duele el hombro cuando levanto el brazo, hace tres semanas...\"></textarea></label>'\n    + '</div>'\n\n    /* El consentimiento no es un trámite: son datos de salud y sin esto\n       no se pueden guardar. Va explicado en castellano, no en jurídico. */\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Tus datos</h2></div>'\n    + '<p style=\"color:var(--tinta2);font-size:14px;margin-bottom:14px\">'\n    + 'Lo que cargues acá es información de salud y se trata como tal. '\n    + 'Lo ve el kinesiólogo que te atiende y lo ves vos. Nadie más: ni el entrenador, '\n    + 'ni los otros pacientes. Si sos del plantel, el cuerpo técnico ve solamente si '\n    + 'estás disponible para entrenar, nunca tu diagnóstico.</p>'\n    + '<label class=\"crit\"><input type=\"checkbox\" id=\"f_ok\">'\n    + '<span>Entiendo y autorizo al estudio a guardar mis datos para mi tratamiento.</span></label>'\n    + '</div>'\n\n    + '<div id=\"aviso\"></div>'\n    + '<button class=\"bt ancho\" onclick=\"enviar()\">Darme de alta</button>'\n    + '<p style=\"text-align:center;color:var(--tinta3);font-size:13px;margin-top:14px\">'\n    + '¿Ya te diste de alta antes? <a href=\"index.html\" style=\"color:var(--acc-texto)\">Entrá por acá</a></p>';\n\n  document.querySelectorAll('#tipo .pest').forEach(function(b){\n    b.onclick = function(){\n      document.querySelectorAll('#tipo .pest').forEach(function(x){ x.classList.remove('on'); });\n      b.classList.add('on'); F.tipo = b.dataset.t; pintarTipo();\n    };\n  });\n  if(F.tipo){\n    var sel = document.querySelector('#tipo .pest[data-t=' + F.tipo + ']');\n    if(sel) sel.classList.add('on');\n    pintarTipo();\n  }\n  ['nombre','doc','nac','tel','mail','motivo'].forEach(function(k){\n    var e = document.getElementById('f_' + k);\n    if(e && F[k]) e.value = F[k];\n    if(e) e.oninput = function(){ F[k] = e.value; };\n  });\n  if(F.nac) revisarEdad();\n}\n\nfunction pintarTipo(){\n  var c = document.getElementById('camposTipo');\n  if(F.tipo === 'plantel'){\n    c.innerHTML = '<label class=\"campo\"><span class=\"eti\">Tu número de camiseta</span>'\n      + '<input type=\"number\" id=\"f_dorsal\" inputmode=\"numeric\" placeholder=\"Ej: 7\"></label>';\n    var e = document.getElementById('f_dorsal');\n    if(F.dorsal) e.value = F.dorsal;\n    e.oninput = function(){ F.dorsal = e.value; };\n  }else if(F.tipo === 'particular'){\n    c.innerHTML = '<label class=\"campo\"><span class=\"eti\">Obra social o prepaga</span>'\n      + '<input type=\"text\" id=\"f_obra\" placeholder=\"Si no tenés, poné Particular\"></label>';\n    var o = document.getElementById('f_obra');\n    if(F.obra) o.value = F.obra;\n    o.oninput = function(){ F.obra = o.value; };\n  }else{\n    c.innerHTML = '';\n  }\n}\n\n/* Si el paciente es menor, hacen falta los datos de quien lo autoriza.\n   No es opcional: un menor no puede consentir su propio tratamiento. */\nfunction revisarEdad(){\n  var e = document.getElementById('f_nac');\n  F.nac = e.value;\n  var caja = document.getElementById('cajaTutor');\n  if(F.nac && esMenor(F.nac)){\n    if(caja.innerHTML) return;\n    caja.innerHTML =\n      '<div class=\"nota info\">Sos menor de edad, así que necesitamos los datos '\n      + 'de tu mamá, tu papá o quien te acompañe.</div>'\n      + '<div class=\"rejilla c2\">'\n      + '<label class=\"campo\"><span class=\"eti\">Nombre del adulto</span>'\n      + '<input type=\"text\" id=\"f_tutor\"></label>'\n      + '<label class=\"campo\"><span class=\"eti\">Su teléfono</span>'\n      + '<input type=\"text\" id=\"f_tutortel\" inputmode=\"tel\"></label></div>'\n      + '<label class=\"campo\"><span class=\"eti\">¿Qué es tuyo?</span>'\n      + '<input type=\"text\" id=\"f_vinculo\" placeholder=\"Madre, padre, tutor...\"></label>';\n    ['tutor','tutortel','vinculo'].forEach(function(k){\n      var x = document.getElementById('f_' + k);\n      if(F[k]) x.value = F[k];\n      x.oninput = function(){ F[k] = x.value; };\n    });\n  }else{\n    caja.innerHTML = '';\n  }\n}\n\n/* Al enviar, TODO se lee del formulario y nada de la memoria.\n   Guardar en memoria depende de que el usuario tipee, y el celular\n   muchas veces autocompleta sin disparar ese aviso: el campo se ve\n   lleno en pantalla y el sistema lo cree vacío. */\nfunction leer(id){ var e = document.getElementById(id); return e ? (e.value || '').trim() : ''; }\n\nfunction enviar(){\n  var av = document.getElementById('aviso'), falta = [];\n  F.nombre   = leer('f_nombre');\n  F.doc      = leer('f_doc');\n  F.nac      = leer('f_nac');\n  F.tel      = leer('f_tel');\n  F.motivo   = leer('f_motivo');\n  F.dorsal   = leer('f_dorsal');\n  F.obra     = leer('f_obra');\n  F.tutor    = leer('f_tutor');\n  F.tutortel = leer('f_tutortel');\n  F.vinculo  = leer('f_vinculo');\n\n  if(!F.tipo)             falta.push('si sos del plantel o venís por tu cuenta');\n  if(F.nombre.length < 4) falta.push('tu nombre y apellido');\n  if(F.doc.length < 6)    falta.push('tu documento');\n  if(!F.nac)              falta.push('tu fecha de nacimiento');\n  if(F.tel.length < 6)    falta.push('un teléfono');\n  if(F.nac && esMenor(F.nac) && !F.tutor)\n    falta.push('el nombre del adulto responsable');\n  if(!document.getElementById('f_ok').checked)\n    falta.push('tu autorización para guardar los datos');\n\n  if(falta.length){\n    av.innerHTML = '<div class=\"nota aviso\">Falta ' + falta.join(', ') + '.</div>';\n    av.scrollIntoView({block:'center'});\n    return;\n  }\n\n  /* Mismo documento = misma persona. Evita que alguien se cargue dos veces\n     y termine con dos historias clínicas partidas al medio. */\n  var repetido = null;\n  BASE.pacientes.forEach(function(p){ if(p.doc === F.doc) repetido = p; });\n  if(repetido){\n    av.innerHTML = '<div class=\"nota info\">Ya estás en el sistema, ' + repetido.nombre.split(' ')[0]\n      + '. No hace falta que te des de alta de nuevo — '\n      + '<a href=\"index.html\" style=\"color:var(--acc-texto)\">entrá por acá</a>.</div>';\n    av.scrollIntoView({block:'center'});\n    return;\n  }\n\n  var nuevo = {\n    id: nuevoIdPaciente(),\n    tipo: F.tipo,\n    nombre: F.nombre,\n    nacimiento: F.nac,\n    doc: F.doc,\n    tel: F.tel,\n    email: leer('f_mail'),\n    motivo: F.motivo,\n    estado: 'pendiente',\n    alta: HOY,\n    consentimiento: {aceptado:true, fecha:HOY}\n  };\n  if(F.tipo === 'plantel' && F.dorsal) nuevo.dorsal = +F.dorsal;\n  if(F.tipo === 'particular') nuevo.obra_social = F.obra || 'Particular';\n  if(esMenor(F.nac)) nuevo.tutor = {nombre:F.tutor, tel:F.tutortel || F.tel, vinculo:F.vinculo || '—'};\n\n  BASE.pacientes.push(nuevo);\n  guardar('kine/pacientes/' + nuevo.id, nuevo);\n  try{ ponerRol('jugador'); localStorage.setItem('estudio_pid', nuevo.id); }catch(e){}\n\n  document.getElementById('todo').innerHTML =\n    '<div class=\"tarjeta\" style=\"margin-top:30px\">'\n    + '<div class=\"vacio\"><b>Listo, ' + F.nombre.split(' ')[0] + '</b>'\n    + 'Ya estás en el sistema. El kinesiólogo te va a ver en la lista y '\n    + 'podés pedir turno cuando quieras.</div>'\n    + '<a class=\"bt ancho\" href=\"agenda.html\" style=\"text-decoration:none;text-align:center\">Pedir mi primer turno</a>'\n    + '<a class=\"bt neutro ancho\" href=\"index.html\" style=\"text-decoration:none;text-align:center;margin-top:8px\">Ir al inicio</a>'\n    + '</div>';\n  scrollTo(0, 0);\n}\n\npintar();\n"}, "diario": {"pag": "diario", "cuerpo": "<div class=\"hoja angosta\">\n  <h1 class=\"tit\">Cómo estás hoy</h1>\n  <p class=\"bajada\">Cinco preguntas, medio minuto. Se completa <b>después</b> de entrenar,\n  no antes. Es la señal más temprana que tiene el kinesiólogo: si el dolor sube tres días\n  seguidos lo ve antes de que se lo cuentes.</p>\n\n  <div class=\"tarjeta\" id=\"preguntas\"></div>\n\n  <button class=\"bt ancho\" onclick=\"enviar()\">Guardar</button>\n  <div class=\"nota bien\" id=\"listo\" style=\"display:none;margin-top:12px\">\n    Guardado. Gracias — con esto se ajusta tu carga de mañana.</div>\n\n  <div class=\"tarjeta\" style=\"margin-top:20px\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">Tus últimos días</h2>\n      <span class=\"eti\">1 mal · 5 muy bien</span></div>\n    <div id=\"historial\"></div>\n  </div>\n</div>", "js": "\n/* Las cinco métricas son las del índice de Hooper, las mismas que ya usa la app\n   del club. Si los dos sistemas usan las mismas cinco, el día que se quieran\n   cruzar los datos hablan el mismo idioma. */\nvar PREGUNTAS = [\n  {id:'sueno',  t:'Cómo dormiste',        ext:['Malísimo','Regular','Normal','Bien','Muy bien']},\n  {id:'fatiga', t:'Qué tan cansado estás', ext:['Agotado','Bastante','Normal','Descansado','Como nuevo']},\n  {id:'dolor',  t:'Dolor muscular',        ext:['Mucho','Bastante','Algo','Poco','Nada']},\n  {id:'animo',  t:'Cómo andás de ánimo',   ext:['Bajón','Flojo','Normal','Bien','Muy bien']},\n  {id:'estres', t:'Nivel de estrés',       ext:['Altísimo','Alto','Normal','Bajo','Nada']}\n];\nvar HISTORIAL = [\n  {f:'2026-08-27', v:3.6}, {f:'2026-08-26', v:3.2}, {f:'2026-08-25', v:2.8},\n  {f:'2026-08-24', v:3.0}, {f:'2026-08-23', v:3.8}\n];\nvar resp = {};\n\ndocument.getElementById('preguntas').innerHTML = PREGUNTAS.map(function(p){\n  return '<label class=\"campo\"><span class=\"eti\">' + p.t + '</span>'\n    + '<div class=\"escala palabras\" id=\"e_' + p.id + '\">'\n    + p.ext.map(function(x, i){\n        return '<button type=\"button\" data-v=\"' + (i+1) + '\">'\n             + x + '</button>';\n      }).join('')\n    + '</div></label>';\n}).join('');\n\nPREGUNTAS.forEach(function(p){\n  var caja = document.getElementById('e_' + p.id);\n  caja.querySelectorAll('button').forEach(function(b){\n    b.onclick = function(){\n      caja.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });\n      b.classList.add('on'); resp[p.id] = +b.dataset.v;\n    };\n  });\n});\n\ndocument.getElementById('historial').innerHTML = HISTORIAL.map(function(h){\n  var col = h.v >= 3.5 ? 'atendido' : (h.v >= 3 ? 'reservado' : 'ausente');\n  return '<div class=\"fila\" style=\"cursor:default\"><span class=\"hh\">' + fechaCorta(h.f) + '</span>'\n    + '<span class=\"cu\"><b>' + (h.v >= 3.5 ? 'Bien' : h.v >= 3 ? 'Normal' : 'Flojo') + '</b></span>'\n    + '<span class=\"pin ' + col + '\">' + h.v.toFixed(1) + '</span></div>';\n}).join('');\n\nfunction enviar(){\n  if(Object.keys(resp).length < 5){ alert('Contestá las cinco antes de guardar.'); return; }\n  guardar('kine/wellness/' + miDorsal() + '/' + HOY, resp);\n  document.getElementById('listo').style.display = 'block';\n}\n\n\n/* Registra el sw para que el portal ande sin internet. Falla en silencio\n   si se abre con doble clic desde el disco: eso es normal. */\nif('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});\n"}, "ejercicios": {"pag": "ejercicios", "cuerpo": "<div class=\"hoja\">\n  <h1 class=\"tit\">Biblioteca del estudio</h1>\n  <p class=\"bajada\">Los circuitos que se dibujan en el pizarrón y los ejercicios sueltos con su\n  video. Se filma una vez y se reusa en cada programa.</p>\n\n  <div class=\"pestanias\">\n    <button class=\"pest on\" data-f=\"todos\">Todos</button>\n    <button class=\"pest\" data-f=\"Tobillo\">Tobillo</button>\n    <button class=\"pest\" data-f=\"Rodilla\">Rodilla</button>\n    <button class=\"pest\" data-f=\"Hombro\">Hombro</button>\n    <button class=\"pest\" data-f=\"Lumbar\">Lumbar</button>\n  </div>\n\n  <div class=\"tarjeta\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">Circuitos en cancha</h2>\n      <a class=\"eti\" href=\"pizarron.html\" style=\"text-decoration:none\">Dibujar uno nuevo →</a></div>\n    <div class=\"ejs\" id=\"circuitos\"></div>\n  </div>\n\n  <div class=\"tarjeta\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">Ejercicios sueltos</h2>\n      <span class=\"eti\" id=\"cuenta\"></span></div>\n    <div class=\"ejs\" id=\"sueltos\"></div>\n  </div>\n</div>", "js": "\nvar SUELTOS = [\n  {n:'Movilidad de tobillo con banda', z:'Tobillo', f:2, lugar:'gym', video:true},\n  {n:'Eversión con banda',             z:'Tobillo', f:2, lugar:'gym', video:true},\n  {n:'Elevación de talones sentado',   z:'Tobillo', f:2, lugar:'gym', video:false},\n  {n:'Apoyo en un pie',                z:'Tobillo', f:2, lugar:'gym', video:true},\n  {n:'Saltos con aterrizaje',          z:'Rodilla', f:3, lugar:'cancha', video:true},\n  {n:'Sentadilla búlgara',             z:'Rodilla', f:3, lugar:'gym', video:true},\n  {n:'Nórdico de isquiotibiales',      z:'Rodilla', f:3, lugar:'gym', video:true},\n  {n:'Rotación externa con banda',     z:'Hombro',  f:3, lugar:'gym', video:true},\n  {n:'Remo con banda',                 z:'Hombro',  f:2, lugar:'gym', video:false},\n  {n:'Elevación en Y boca abajo',      z:'Hombro',  f:3, lugar:'gym', video:true},\n  {n:'Puente de glúteo',               z:'Lumbar',  f:2, lugar:'gym', video:true},\n  {n:'Plancha lateral',                z:'Lumbar',  f:3, lugar:'gym', video:false},\n  {n:'Bird dog',                       z:'Lumbar',  f:2, lugar:'gym', video:true}\n];\nvar filtro = 'todos';\n\ndocument.querySelectorAll('.pest[data-f]').forEach(function(b){\n  b.onclick = function(){\n    document.querySelectorAll('.pest[data-f]').forEach(function(x){ x.classList.remove('on'); });\n    b.classList.add('on'); filtro = b.dataset.f; pintar();\n  };\n});\n\nfunction tarjeta(e){\n  return '<button class=\"ej\" onclick=\"alert(\\'Acá se abre el ejercicio: video, dosis y a qué programa sumarlo.\\')\">'\n    + '<div class=\"mini ' + (e.lugar === 'gym' ? 'gym' : '') + '\">'\n    + '<span>' + (e.video ? 'Con video' : 'Sin video') + '</span></div>'\n    + '<div class=\"cu\"><b>' + e.n + '</b>'\n    + '<small class=\"mono\">' + e.z.toUpperCase() + ' · DESDE FASE ' + e.f + '</small></div></button>';\n}\n\nfunction pintar(){\n  var c = BASE.ejercicios.filter(function(e){ return filtro === 'todos' || e.zona === filtro; });\n  document.getElementById('circuitos').innerHTML = c.length\n    ? c.map(function(e){\n        return '<button class=\"ej\" onclick=\"irA(\\'pizarron.html\\')\">'\n          + '<div class=\"mini\"><span>4 postas</span></div>'\n          + '<div class=\"cu\"><b>' + e.nombre + '</b>'\n          + '<small class=\"mono\">' + e.zona.toUpperCase() + ' · FASE ' + e.fase + '</small></div></button>';\n      }).join('')\n    : '<div class=\"vacio\" style=\"grid-column:1/-1\"><b>Sin circuitos para esa zona</b>'\n      + 'Dibujá uno en el pizarrón y queda guardado acá.</div>';\n\n  var s = SUELTOS.filter(function(e){ return filtro === 'todos' || e.z === filtro; });\n  document.getElementById('sueltos').innerHTML = s.map(tarjeta).join('');\n  document.getElementById('cuenta').textContent = s.length + ' ejercicios · '\n    + s.filter(function(e){ return e.video; }).length + ' con video';\n}\npintar();\n\n\n/* Registra el sw para que el portal ande sin internet. Falla en silencio\n   si se abre con doble clic desde el disco: eso es normal. */\nif('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});\n"}, "inicio": {"pag": "inicio", "cuerpo": "<div class=\"hoja angosta\">\n\n  <h1 class=\"tit\">El estudio, en un solo lugar</h1>\n  <p class=\"bajada\">Turnos, fichas de lesión, circuitos de readaptación y el programa de cada\n  jugador. El kinesiólogo carga una vez; el jugador ve lo suyo desde el celular.</p>\n\n  <div class=\"rejilla c3\" style=\"margin-bottom:26px\">\n    <div class=\"dato\"><div class=\"v\" id=\"dOk\">—</div><div class=\"l\">Disponibles</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"dLim\" style=\"color:var(--ambar)\">—</div><div class=\"l\">Limitados</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"dBaja\" style=\"color:var(--rojo)\">—</div><div class=\"l\">De baja</div></div>\n  </div>\n\n  <div class=\"tarjeta\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">Entrar</h2>\n      <span class=\"eti\">Elegí cómo mirar</span></div>\n\n    <button class=\"fila\" onclick=\"entrar('kine')\">\n      <span class=\"hh\">▤</span>\n      <span class=\"cu\"><b>Soy el kinesiólogo</b>\n        <small>Agenda del día, fichas, pizarrón de circuitos y biblioteca.</small></span>\n      <span class=\"pin reservado\">Panel</span>\n    </button>\n\n    <button class=\"fila\" onclick=\"entrar('jugador')\">\n      <span class=\"hh\">◉</span>\n      <span class=\"cu\"><b>Estoy lesionado</b>\n        <small>Mi fase, mi turno, mis ejercicios de hoy y cómo me siento.</small></span>\n      <span class=\"pin gris\">Mi vista</span>\n    </button>\n\n    <a class=\"fila\" href=\"alta.html\" style=\"text-decoration:none;color:inherit\">\n      <span class=\"hh\">+</span>\n      <span class=\"cu\"><b>Es mi primera vez</b>\n        <small>Darme de alta. Dos minutos, una sola vez.</small></span>\n      <span class=\"pin limitado\">Alta</span>\n    </a>\n\n    <label class=\"campo\" style=\"margin-top:16px\">\n      <span class=\"eti\">Si entrás como jugador, ¿cuál sos?</span>\n      <select id=\"quien\"></select>\n    </label>\n\n    <p style=\"font-size:13px;color:var(--tinta2)\">\n      Esta pantalla existe para probar las dos vistas sin crear cuentas. En el portal\n      publicado el rol viene de la cuenta y no se puede elegir.\n    </p>\n  </div>\n\n  <div class=\"tarjeta\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">Quién ve qué</h2></div>\n    <p style=\"font-size:14px;color:var(--tinta2);margin-bottom:14px\">\n      El diagnóstico es un dato de salud y vive separado de la disponibilidad. El cuerpo\n      técnico ve si un jugador está, no qué tiene.</p>\n    <div class=\"fila\" style=\"cursor:default\">\n      <span class=\"cu\"><b>Kinesiólogo</b><small>Todo: fichas, sesiones, agenda, programas.</small></span></div>\n    <div class=\"fila\" style=\"cursor:default\">\n      <span class=\"cu\"><b>Jugador</b><small>Su ficha, su turno, su programa. Nada de los demás.</small></span></div>\n    <div class=\"fila\" style=\"cursor:default\">\n      <span class=\"cu\"><b>Cuerpo técnico</b><small>Solo el semáforo de disponibilidad y la fecha estimada.</small></span></div>\n  </div>\n\n</div>", "js": "\n/* contadores */\nvar c = {ok:0, limitado:0, baja:0};\nBASE.plantel.forEach(function(j){ c[estadoDe(j.d).estado]++; });\ndocument.getElementById('dOk').textContent   = c.ok;\ndocument.getElementById('dLim').textContent  = c.limitado;\ndocument.getElementById('dBaja').textContent = c.baja;\n\n/* quién */\ndocument.getElementById('quien').innerHTML = BASE.plantel.map(function(j){\n  var e = estadoDe(j.d);\n  var t = e.estado === 'ok' ? 'sin lesión' : e.motivo;\n  return '<option value=\"' + j.d + '\"' + (j.d === miDorsal() ? ' selected' : '') + '>'\n       + j.d + ' · ' + j.n + ' — ' + t + '</option>';\n}).join('');\n\nfunction entrar(r){\n  ponerRol(r);\n  if(r === 'jugador'){\n    ponerDorsal(+document.getElementById('quien').value);\n    irA('mi.html');\n  }else{\n    irA('panel.html');\n  }\n}\n\n\n/* Registra el sw para que el portal ande sin internet. Falla en silencio\n   si se abre con doble clic desde el disco: eso es normal. */\nif('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});\n"}, "ficha": {"pag": "ficha", "cuerpo": "<div class=\"hoja\">\n  <h1 class=\"tit\" id=\"titulo\">Lesiones</h1>\n  <p class=\"bajada\" id=\"bajada\">Cada ficha avanza por criterios, no por calendario.</p>\n\n  <div id=\"lista\"></div>\n  <div id=\"ficha\"></div>\n</div>", "js": "\nvar abierta = PARAM('f');\n\nfunction pintar(){\n  var lista = document.getElementById('lista'), ficha = document.getElementById('ficha');\n\n  if(!abierta){\n    document.getElementById('titulo').textContent = 'Lesiones';\n    document.getElementById('bajada').textContent =\n      'Tres en tratamiento. Cada ficha avanza por criterios cumplidos, no por días transcurridos.';\n    ficha.innerHTML = '';\n    lista.innerHTML = '<div class=\"tarjeta\">' + BASE.lesiones.map(function(L){\n      var listos = criteriosListos(L);\n      return '<button class=\"fila\" style=\"align-items:flex-start\" onclick=\"abrir(\\'' + L.id + '\\')\">'\n        + '<span class=\"hh\">#' + L.dorsal + '</span>'\n        + '<span class=\"cu\"><b>' + nombre(L.dorsal) + ' — ' + L.zona + ' ' + L.lado + '</b>'\n        + '<small>' + L.diagnostico + '</small>' + pista(L.fase, false) + '</span>'\n        + '<span class=\"pin reservado\">' + listos + '/' + L.criterios.length + '</span></button>';\n    }).join('') + '</div>';\n    return;\n  }\n\n  var L = lesionPorId(abierta);\n  if(!L){ abierta = null; return pintar(); }\n  lista.innerHTML = '<button class=\"bt neutro chico\" style=\"margin-bottom:16px\" onclick=\"abrir(null)\">← Todas las lesiones</button>';\n\n  document.getElementById('titulo').textContent = nombre(L.dorsal) + ' · ' + L.zona.toLowerCase() + ' ' + L.lado;\n  document.getElementById('bajada').textContent = L.diagnostico + '. Lesionado el ' + fechaCorta(L.fecha) + '.';\n\n  var sigue  = Math.min(L.fase + 1, 5);\n  var faltanC = L.criterios.length - criteriosListos(L);\n\n  ficha.innerHTML =\n\n    /* estado */\n    '<div class=\"tarjeta\">'\n    + '<div class=\"rejilla c4\" style=\"margin-bottom:18px\">'\n    + '<div class=\"dato\"><div class=\"v\">' + dias(L.fecha) + '</div><div class=\"l\">Días de baja</div></div>'\n    + '<div class=\"dato\"><div class=\"v\" style=\"color:var(--azul)\">' + L.fase + '</div><div class=\"l\">Fase actual</div></div>'\n    + '<div class=\"dato\"><div class=\"v\">' + faltan(L.alta) + '</div><div class=\"l\">Días para el alta</div></div>'\n    + '<div class=\"dato\"><div class=\"v\">' + L.sesiones.length + '</div><div class=\"l\">Sesiones</div></div>'\n    + '</div>'\n    + pista(L.fase)\n    + '<p style=\"font-size:14px;color:var(--tinta2);margin-top:14px\">' + FASES[L.fase-1].d + '</p>'\n    + '</div>'\n\n    /* criterios */\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Para pasar a fase ' + sigue + ' — ' + FASES[sigue-1].t + '</h2></div>'\n    + (faltanC\n        ? '<div class=\"nota aviso\">Falta' + (faltanC > 1 ? 'n ' + faltanC + ' criterios' : ' un criterio') + '. Hasta que estén, no avanza.</div>'\n        : '<div class=\"nota bien\">Todos los criterios cumplidos. Se puede avanzar.</div>')\n    + L.criterios.map(function(c, i){\n        return '<label class=\"crit ' + (c.ok ? '' : 'falta') + '\">'\n          + '<input type=\"checkbox\" ' + (c.ok ? 'checked' : '') + ' onchange=\"tildar(' + i + ',this.checked)\">'\n          + '<span>' + c.t + '</span></label>';\n      }).join('')\n    + '<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:16px\">'\n    + '<button class=\"bt\" ' + (faltanC ? 'disabled' : '') + ' onclick=\"avanzar()\">Pasar a fase ' + sigue + '</button>'\n    + '<button class=\"bt neutro\" onclick=\"window.print()\">Imprimir ficha</button>'\n    + '</div></div>'\n\n    /* mecanismo */\n    + '<div class=\"tarjeta\"><div class=\"tarjeta-cab\"><h2 class=\"sub\">Cómo se lesionó</h2></div>'\n    + '<p style=\"color:var(--tinta2)\">' + L.mecanismo + '</p></div>'\n\n    /* programa */\n    + '<div class=\"tarjeta\"><div class=\"tarjeta-cab\"><h2 class=\"sub\">Programa de esta fase</h2>'\n    + '<a class=\"eti\" href=\"ejercicios.html\" style=\"text-decoration:none\">Biblioteca →</a></div>'\n    + (programaDe(L).length\n        ? programaDe(L).map(function(e){\n            return '<div class=\"fila\" style=\"cursor:default\"><span class=\"cu\"><b>' + e.n + '</b>'\n              + '<small>' + e.d + ' — ' + e.nota + '</small></span></div>';\n          }).join('')\n        : '<div class=\"vacio\"><b>Sin programa cargado para la fase ' + L.fase + '</b>'\n          + 'Armalo desde la biblioteca o dibujá un circuito en el pizarrón.</div>')\n    + '</div>'\n\n    /* sesiones */\n    + '<div class=\"tarjeta\"><div class=\"tarjeta-cab\"><h2 class=\"sub\">Sesiones</h2>'\n    + '<span class=\"eti\">Dolor antes → después</span></div>'\n    + L.sesiones.map(function(s){\n        var baja = s.post < s.pre;\n        return '<div class=\"fila\" style=\"cursor:default;align-items:flex-start\">'\n          + '<span class=\"hh\">' + fechaCorta(s.f) + '</span>'\n          + '<span class=\"cu\"><b>' + s.t + '</b><small>' + s.nota + '</small></span>'\n          + '<span class=\"pin ' + (baja ? 'atendido' : 'gris') + '\">' + s.pre + ' → ' + s.post + '</span></div>';\n      }).join('')\n    + '<button class=\"bt hueco ancho\" style=\"margin-top:12px\" onclick=\"abrirSesion()\">Cargar sesión de hoy</button>'\n    + '</div>';\n}\n\n/* ── Cargar la sesión del día ──────────────────────────────────────\n   Es la pantalla que el kinesiólogo usa quince veces por día, así que\n   tiene que ser rápida: el tipo y las dos escalas de dolor se tocan,\n   no se escriben. Solo la nota se tipea, y es opcional.\n\n   El dolor antes y después es el dato que importa: la diferencia entre\n   los dos es lo que muestra si la sesión sirvió. Por eso los dos son\n   obligatorios y la nota no.                                          */\nvar sesionNueva = null;\n\nfunction abrirSesion(){\n  var L = lesionPorId(abierta);\n  if(!L) return;\n  sesionNueva = {tipo:'Tratamiento', pre:null, post:null, nota:''};\n\n  var caja = document.createElement('div');\n  caja.className = 'ayuda-fondo';\n  caja.id = 'cajaSesion';\n  caja.innerHTML =\n    '<div class=\"ayuda-caja\">'\n    + '<button class=\"cerrar\" onclick=\"cerrarSesion()\" aria-label=\"Cerrar\">&times;</button>'\n    + '<span class=\"eti\">Sesión de hoy</span>'\n    + '<h2>' + nombre(L.dorsal) + ' · ' + L.zona.toLowerCase() + '</h2>'\n    + '<p>Día ' + dias(L.fecha) + ' · fase ' + L.fase + ', ' + FASES[L.fase-1].t.toLowerCase() + '</p>'\n\n    + '<label class=\"campo\"><span class=\"eti\">Qué tipo de sesión</span>'\n    + '<div class=\"pestanias\" id=\"tipoSes\" style=\"margin-bottom:0\">'\n    + ['Evaluación','Tratamiento','Gimnasio','Campo'].map(function(t){\n        return '<button class=\"pest' + (t === 'Tratamiento' ? ' on' : '') + '\" data-t=\"' + t + '\">' + t + '</button>';\n      }).join('')\n    + '</div></label>'\n\n    + '<label class=\"campo\"><span class=\"eti\">Dolor al llegar</span><div id=\"esPre\"></div></label>'\n    + '<label class=\"campo\"><span class=\"eti\">Dolor al terminar</span><div id=\"esPost\"></div></label>'\n    + '<label class=\"campo\"><span class=\"eti\">Qué se hizo (opcional)</span>'\n    + '<textarea id=\"notaSes\" placeholder=\"Movilidad articular, isométricos de eversión...\"></textarea></label>'\n\n    + '<div id=\"avisoSes\"></div>'\n    + '<button class=\"bt ancho\" onclick=\"guardarSesion()\">Guardar sesión</button>'\n    + '</div>';\n\n  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarSesion(); });\n  document.body.appendChild(caja);\n  document.body.style.overflow = 'hidden';\n\n  var tipos = document.getElementById('tipoSes');\n  tipos.querySelectorAll('.pest').forEach(function(b){\n    b.onclick = function(){\n      tipos.querySelectorAll('.pest').forEach(function(x){ x.classList.remove('on'); });\n      b.classList.add('on'); sesionNueva.tipo = b.dataset.t;\n    };\n  });\n  escala(document.getElementById('esPre'),  function(v){ sesionNueva.pre = v; });\n  escala(document.getElementById('esPost'), function(v){ sesionNueva.post = v; });\n}\n\nfunction cerrarSesion(){\n  var c = document.getElementById('cajaSesion');\n  if(c) c.remove();\n  document.body.style.overflow = '';\n}\n\nfunction guardarSesion(){\n  var av = document.getElementById('avisoSes');\n  if(sesionNueva.pre === null || sesionNueva.post === null){\n    av.innerHTML = '<div class=\"nota aviso\">Marcá el dolor al llegar y al terminar. '\n      + 'La diferencia entre los dos es el dato que sirve.</div>';\n    return;\n  }\n  var L = lesionPorId(abierta);\n  sesionNueva.nota = document.getElementById('notaSes').value.trim() || '—';\n\n  L.sesiones.unshift({f:HOY, t:sesionNueva.tipo, pre:sesionNueva.pre,\n                      post:sesionNueva.post, nota:sesionNueva.nota});\n  guardar('kine/sesiones/' + L.id + '/' + HOY, {\n    dorsal:L.dorsal, fecha:HOY, tipo:sesionNueva.tipo,\n    dolor_pre:sesionNueva.pre, dolor_post:sesionNueva.post,\n    notas:sesionNueva.nota, fase:L.fase\n  });\n  cerrarSesion();\n  pintar();\n}\n\nfunction abrir(id){\n  abierta = id;\n  PARAMSET('f', id);\n  pintar(); scrollTo(0, 0);\n}\nfunction tildar(i, v){\n  var L = lesionPorId(abierta);\n  L.criterios[i].ok = v;\n  guardar('kine/lesiones/' + L.id + '/criterios/' + i + '/ok', v);\n  pintar();\n}\nfunction avanzar(){\n  var L = lesionPorId(abierta);\n  if(L.fase >= 5) return;\n  L.fase++;\n  L.criterios.forEach(function(c){ c.ok = false; });\n  guardar('kine/lesiones/' + L.id + '/fase', L.fase);\n  pintar();\n}\npintar();\n\n\n/* Registra el sw para que el portal ande sin internet. Falla en silencio\n   si se abre con doble clic desde el disco: eso es normal. */\nif('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});\n"}, "mi": {"pag": "mi", "cuerpo": "<div class=\"hoja angosta\" id=\"todo\"></div>", "js": "\nvar L = lesionDe(miDorsal());\nvar hechos = {}, dolor = null, esfuerzo = null;\n\nif(!L){\n  document.getElementById('todo').innerHTML =\n    '<h1 class=\"tit\">Estás al día</h1>'\n    + '<p class=\"bajada\">No tenés ninguna lesión abierta. Si te empezó a molestar algo, '\n    + 'pedí un turno y lo vemos.</p>'\n    + '<a class=\"bt\" href=\"agenda.html\" style=\"text-decoration:none;display:inline-block\">Pedir un turno</a>';\n}else{\n  pintar();\n}\n\nfunction pintar(){\n  var prog = programaDe(L);\n  var prox = null;\n  (BASE.agenda[HOY] || []).concat(BASE.agenda['2026-08-31'] || []).forEach(function(t){\n    if(!prox && t.dorsal === miDorsal() && t.estado === 'reservado') prox = t;\n  });\n\n  document.getElementById('todo').innerHTML =\n\n    '<h1 class=\"tit\">' + L.zona + ' ' + (L.lado === '—' ? '' : L.lado) + '</h1>'\n    + '<p class=\"bajada\">' + L.diagnostico + '. Llevás ' + dias(L.fecha)\n    + ' días y faltan ' + faltan(L.alta) + ' para el alta prevista.</p>'\n\n    /* dónde estás */\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Dónde estás</h2>'\n    + '<span class=\"eti\">Día ' + dias(L.fecha) + '</span></div>'\n    + pista(L.fase)\n    + '<p style=\"margin-top:14px\">' + FASES[L.fase-1].d + '</p>'\n    + '<div class=\"nota info\" style=\"margin-top:14px\">'\n    + 'Para pasar a <b>' + FASES[Math.min(L.fase,4)].t.toLowerCase() + '</b> te falta: '\n    + L.criterios.filter(function(c){ return !c.ok; }).map(function(c){ return c.t.toLowerCase(); }).join('; ')\n    + '.</div></div>'\n\n    /* turno */\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Tu próximo turno</h2>'\n    + '<a class=\"eti\" href=\"agenda.html\" style=\"text-decoration:none\">Cambiar →</a></div>'\n    + (prox\n        ? '<div class=\"fila\" style=\"cursor:default;border-color:var(--azul)\">'\n          + '<span class=\"hh\">' + prox.h + '</span>'\n          + '<span class=\"cu\"><b>' + prox.tipo + ' con Vero</b>'\n          + '<small>En el estudio. Te avisamos una hora antes.</small></span>'\n          + '<span class=\"pin reservado\">reservado</span></div>'\n        : '<div class=\"vacio\"><b>No tenés turno reservado</b>Pedilo desde la agenda.</div>')\n    + '</div>'\n\n    /* programa */\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Tus ejercicios de hoy</h2>'\n    + '<span class=\"eti\" id=\"cuenta\">0 de ' + prog.length + '</span></div>'\n    + (prog.length\n        ? prog.map(function(e, i){\n            return '<div class=\"fila\" style=\"align-items:flex-start;cursor:pointer\" onclick=\"marcar(' + i + ')\" id=\"ej' + i + '\">'\n              + '<input type=\"checkbox\" style=\"width:19px;height:19px;accent-color:var(--azul);margin-top:3px\" '\n              + 'onclick=\"event.stopPropagation();marcar(' + i + ')\">'\n              + '<span class=\"cu\"><b>' + e.n + '</b>'\n              + '<small class=\"mono\" style=\"color:var(--azul)\">' + e.d + '</small>'\n              + '<small>' + e.nota + '</small></span>'\n              + '<span class=\"pin gris\" onclick=\"event.stopPropagation();alert(\\'Acá abre el video filmado en el estudio.\\')\">Ver video</span>'\n              + '</div>';\n          }).join('')\n        : '<div class=\"vacio\"><b>Todavía no hay programa</b>Vero lo carga después de tu próximo turno.</div>')\n\n    + (prog.length\n        ? '<label class=\"campo\" style=\"margin-top:18px\"><span class=\"eti\">Cuánto te dolió mientras los hacías</span>'\n          + '<div id=\"esDolor\"></div></label>'\n          + '<label class=\"campo\"><span class=\"eti\">Qué tan exigente te resultó</span>'\n          + '<div id=\"esEsf\"></div></label>'\n          + '<button class=\"bt ancho\" onclick=\"enviar()\">Enviar al kinesiólogo</button>'\n          + '<div class=\"nota bien\" id=\"listo\" style=\"display:none;margin-top:12px\">'\n          + 'Enviado. Vero lo ve antes de tu próximo turno.</div>'\n        : '')\n    + '</div>'\n\n    /* historial */\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Lo que llevás hecho</h2>'\n    + '<span class=\"eti\">' + L.sesiones.length + ' sesiones</span></div>'\n    + L.sesiones.map(function(s){\n        return '<div class=\"fila\" style=\"cursor:default\"><span class=\"hh\">' + fechaCorta(s.f) + '</span>'\n          + '<span class=\"cu\"><b>' + s.t + '</b></span>'\n          + '<span class=\"pin ' + (s.post < s.pre ? 'atendido' : 'gris') + '\">dolor ' + s.pre + ' → ' + s.post + '</span></div>';\n      }).join('')\n    + '</div>';\n\n  if(prog.length){\n    escala(document.getElementById('esDolor'), function(v){ dolor = v; }, dolor);\n    escala(document.getElementById('esEsf'),  function(v){ esfuerzo = v; }, esfuerzo);\n  }\n  actualizarCuenta();\n}\n\nfunction marcar(i){\n  hechos[i] = !hechos[i];\n  var f = document.getElementById('ej' + i);\n  f.querySelector('input').checked = hechos[i];\n  f.style.background = hechos[i] ? 'var(--verde-suave)' : '';\n  f.style.borderColor = hechos[i] ? '#BCDCC9' : '';\n  actualizarCuenta();\n}\nfunction actualizarCuenta(){\n  var c = document.getElementById('cuenta');\n  if(!c) return;\n  var n = 0; for(var k in hechos) if(hechos[k]) n++;\n  c.textContent = n + ' de ' + programaDe(L).length;\n}\nfunction enviar(){\n  if(dolor === null || esfuerzo === null){\n    alert('Marcá cuánto te dolió y qué tan exigente te resultó.'); return;\n  }\n  guardar('kine/adherencia/' + miDorsal() + '/' + HOY,\n          {hechos:hechos, dolor:dolor, esfuerzo:esfuerzo});\n  document.getElementById('listo').style.display = 'block';\n}\n\n\n/* Registra el sw para que el portal ande sin internet. Falla en silencio\n   si se abre con doble clic desde el disco: eso es normal. */\nif('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});\n"}, "pacientes": {"pag": "pacientes", "cuerpo": "<div class=\"hoja\">\n  <h1 class=\"tit\">Pacientes</h1>\n  <p class=\"bajada\">Todos los que pasaron por el estudio. Se dan de alta solos desde el\n  enlace de abajo: vos no cargás datos a mano, solo atendés.</p>\n\n  <div class=\"rejilla c4\" style=\"margin-bottom:20px\">\n    <div class=\"dato\"><div class=\"v\" id=\"kTotal\">—</div><div class=\"l\">En el padrón</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kPlantel\">—</div><div class=\"l\">Del plantel</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kPart\">—</div><div class=\"l\">Particulares</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kPend\" style=\"color:var(--ambar)\">—</div><div class=\"l\">Sin atender</div></div>\n  </div>\n\n  <div class=\"tarjeta\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">El enlace para darse de alta</h2>\n      <span class=\"eti\">Pegalo en la puerta del estudio</span></div>\n    <p style=\"color:var(--tinta2);font-size:14px;margin-bottom:12px\">\n      Mandáselo por WhatsApp al paciente nuevo, o dejalo a la vista en la recepción.\n      Se completa en dos minutos desde el celular y queda cargado acá solo.</p>\n    <div class=\"fila\" style=\"cursor:default\">\n      <span class=\"cu mono\" id=\"enlace\" style=\"overflow-wrap:anywhere;font-size:14px\"></span>\n      <button class=\"bt hueco chico\" onclick=\"copiarEnlace()\">Copiar</button>\n    </div>\n    <div class=\"nota bien\" id=\"copiado\" style=\"display:none\">Copiado. Pegalo donde quieras.</div>\n  </div>\n\n  <div class=\"pestanias\">\n    <button class=\"pest on\" data-f=\"todos\">Todos</button>\n    <button class=\"pest\" data-f=\"pendiente\">Sin atender</button>\n    <button class=\"pest\" data-f=\"plantel\">Plantel</button>\n    <button class=\"pest\" data-f=\"particular\">Particulares</button>\n  </div>\n\n  <div class=\"tarjeta\">\n    <label class=\"campo\"><span class=\"eti\">Buscar</span>\n      <input type=\"text\" id=\"buscar\" placeholder=\"Nombre o documento\"></label>\n    <div id=\"lista\"></div>\n  </div>\n\n  <div id=\"detalle\"></div>\n</div>", "js": "\nvar filtro = 'todos', abierto = null;\n\ndocument.getElementById('enlace').textContent = enlaceAlta();\nfunction enlaceAlta(){\n  var u = location.href.split('?')[0].replace(/[^\\/]*$/, 'alta.html');\n  return u.indexOf('file:') === 0 ? 'https://estudio-kine.vercel.app/alta.html' : u;\n}\nfunction copiarEnlace(){\n  var t = enlaceAlta();\n  if(navigator.clipboard) navigator.clipboard.writeText(t);\n  document.getElementById('copiado').style.display = 'block';\n}\n\ndocument.querySelectorAll('.pest[data-f]').forEach(function(b){\n  b.onclick = function(){\n    document.querySelectorAll('.pest[data-f]').forEach(function(x){ x.classList.remove('on'); });\n    b.classList.add('on'); filtro = b.dataset.f; pintar();\n  };\n});\ndocument.getElementById('buscar').oninput = pintar;\n\nfunction pintar(){\n  var q = (document.getElementById('buscar').value || '').toLowerCase().trim();\n  var todos = BASE.pacientes;\n\n  document.getElementById('kTotal').textContent   = todos.length;\n  document.getElementById('kPlantel').textContent = todos.filter(function(p){ return p.tipo === 'plantel'; }).length;\n  document.getElementById('kPart').textContent    = todos.filter(function(p){ return p.tipo === 'particular'; }).length;\n  document.getElementById('kPend').textContent    = todos.filter(function(p){ return p.estado === 'pendiente'; }).length;\n\n  var l = todos.filter(function(p){\n    if(filtro === 'pendiente' && p.estado !== 'pendiente') return false;\n    if((filtro === 'plantel' || filtro === 'particular') && p.tipo !== filtro) return false;\n    if(q && (p.nombre + ' ' + p.doc).toLowerCase().indexOf(q) < 0) return false;\n    return true;\n  });\n\n  document.getElementById('lista').innerHTML = l.length\n    ? l.map(function(p){\n        var L = lesionesDe(p);\n        var marca = p.estado === 'pendiente' ? '<span class=\"pin limitado\">sin atender</span>'\n                  : (L ? '<span class=\"pin reservado\">en tratamiento</span>'\n                       : '<span class=\"pin gris\">al día</span>');\n        return '<button class=\"fila\" onclick=\"abrir(\\'' + p.id + '\\')\">'\n          + '<span class=\"hh\">' + (p.tipo === 'plantel' ? '#' + (p.dorsal || '?') : 'P') + '</span>'\n          + '<span class=\"cu\"><b>' + p.nombre + '</b><small>'\n          + (edad(p.nacimiento) !== null ? edad(p.nacimiento) + ' años · ' : '')\n          + (p.tipo === 'plantel' ? 'plantel del club' : (p.obra_social || 'particular'))\n          + '</small></span>' + marca + '</button>';\n      }).join('')\n    : '<div class=\"vacio\"><b>Nadie con ese filtro</b>Probá con otro, o borrá la búsqueda.</div>';\n}\n\nfunction lesionesDe(p){\n  for(var i=0;i<BASE.lesiones.length;i++)\n    if(BASE.lesiones[i].pid === p.id && BASE.lesiones[i].estado === 'activa') return BASE.lesiones[i];\n  return null;\n}\n\nfunction abrir(id){\n  abierto = id;\n  var p = paciente(id), L = lesionesDe(p);\n  var menor = esMenor(p.nacimiento);\n\n  document.getElementById('detalle').innerHTML =\n    '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">' + p.nombre + '</h2>'\n    + '<span class=\"eti\">' + p.id + '</span></div>'\n\n    + (p.estado === 'pendiente'\n        ? '<div class=\"nota aviso\">Se dio de alta solo el ' + fechaCorta(p.alta)\n          + ' y todavía no lo atendiste. Cuando le cargues la primera sesión pasa a activo.</div>'\n        : '')\n    + (menor\n        ? '<div class=\"nota info\">Es menor de edad. Autoriza <b>' + (p.tutor ? p.tutor.nombre : '—')\n          + '</b> (' + (p.tutor ? p.tutor.vinculo : '—') + '), tel ' + (p.tutor ? p.tutor.tel : '—') + '.</div>'\n        : '')\n\n    + '<div class=\"rejilla c2\">'\n    + campo('Documento', p.doc) + campo('Edad', edad(p.nacimiento) + ' años')\n    + campo('Teléfono', p.tel) + campo('Correo', p.email || '—')\n    + campo(p.tipo === 'plantel' ? 'Camiseta' : 'Obra social',\n            p.tipo === 'plantel' ? '#' + (p.dorsal || '?') : (p.obra_social || 'Particular'))\n    + campo('En el padrón desde', fechaCorta(p.alta))\n    + '</div>'\n\n    + (p.motivo ? '<label class=\"campo\"><span class=\"eti\">Por qué vino, en sus palabras</span>'\n        + '<p style=\"color:var(--tinta2)\">' + p.motivo + '</p></label>' : '')\n\n    + '<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:14px\">'\n    + (L ? '<a class=\"bt\" href=\"lesiones.html?f=' + L.id + '\" style=\"text-decoration:none\">Ver su ficha</a>'\n         : '<button class=\"bt\" onclick=\"alert(\\'Acá se abre el alta de lesión para este paciente.\\')\">Abrir una lesión</button>')\n    + '<a class=\"bt neutro\" href=\"agenda.html\" style=\"text-decoration:none\">Darle un turno</a>'\n    + '<button class=\"bt neutro\" onclick=\"cerrar()\">Cerrar</button>'\n    + '</div></div>';\n  document.getElementById('detalle').scrollIntoView({behavior:'smooth', block:'start'});\n}\nfunction campo(l, v){\n  return '<div style=\"margin-bottom:12px\"><span class=\"eti\">' + l + '</span>'\n       + '<div class=\"mono\" style=\"font-size:15px;margin-top:3px\">' + v + '</div></div>';\n}\nfunction cerrar(){ abierto = null; document.getElementById('detalle').innerHTML = ''; }\n\npintar();\n"}, "panel": {"pag": "panel", "cuerpo": "<div class=\"hoja\">\n  <h1 class=\"tit\">Viernes 28 de agosto</h1>\n  <p class=\"bajada\">Lo que hay que resolver hoy, y cómo está el plantel.</p>\n\n  <div class=\"rejilla c4\" style=\"margin-bottom:20px\">\n    <div class=\"dato\"><div class=\"v\" id=\"kTurnos\">—</div><div class=\"l\">Turnos hoy</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kOk\" style=\"color:var(--verde)\">—</div><div class=\"l\">Disponibles</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kLim\" style=\"color:var(--ambar)\">—</div><div class=\"l\">Limitados</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kBaja\" style=\"color:var(--rojo)\">—</div><div class=\"l\">De baja</div></div>\n  </div>\n\n  <div class=\"rejilla c2\">\n    <div>\n      <div class=\"tarjeta\">\n        <div class=\"tarjeta-cab\"><h2 class=\"sub\">Turnos de hoy</h2>\n          <a class=\"eti\" href=\"agenda.html\" style=\"text-decoration:none\">Ver agenda →</a></div>\n        <div id=\"turnos\"></div>\n      </div>\n    </div>\n\n    <div>\n      <div class=\"tarjeta\">\n        <div class=\"tarjeta-cab\"><h2 class=\"sub\">En tratamiento</h2>\n          <a class=\"eti\" href=\"lesiones.html\" style=\"text-decoration:none\">Todas →</a></div>\n        <div id=\"activas\"></div>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"tarjeta\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">Parte médico</h2>\n      <span class=\"eti\">Lo único que ve el cuerpo técnico</span></div>\n    <div class=\"plantel\" id=\"plantel\"></div>\n  </div>\n</div>", "js": "\n/* ── contadores ── */\nvar c = {ok:0, limitado:0, baja:0};\nBASE.plantel.forEach(function(j){ c[estadoDe(j.d).estado]++; });\nvar turnos = BASE.agenda[HOY] || [];\ndocument.getElementById('kTurnos').textContent = turnos.filter(function(t){ return t.dorsal; }).length;\ndocument.getElementById('kOk').textContent   = c.ok;\ndocument.getElementById('kLim').textContent  = c.limitado;\ndocument.getElementById('kBaja').textContent = c.baja;\n\n/* ── turnos ── */\ndocument.getElementById('turnos').innerHTML = turnos.map(function(t){\n  if(!t.dorsal)\n    return '<div class=\"fila libre\"><span class=\"hh\">' + t.h + '</span>'\n         + '<span class=\"cu\"><b>Libre</b></span></div>';\n  var L = lesionDe(t.dorsal);\n  return '<button class=\"fila\" onclick=\"irA(\\'lesiones.html?f=' + (L ? L.id : '') + '\\')\">'\n       + '<span class=\"hh\">' + t.h + '</span>'\n       + '<span class=\"cu\"><b>' + nombre(t.dorsal) + '</b>'\n       + '<small>#' + t.dorsal + ' · ' + t.tipo + (L ? ' · ' + L.zona.toLowerCase() : '') + '</small></span>'\n       + '<span class=\"pin ' + t.estado + '\">' + t.estado + '</span></button>';\n}).join('');\n\n/* ── lesiones activas ── */\ndocument.getElementById('activas').innerHTML = BASE.lesiones.map(function(L){\n  var listos = criteriosListos(L), tot = L.criterios.length;\n  return '<button class=\"fila\" style=\"align-items:flex-start\" onclick=\"irA(\\'lesiones.html?f=' + L.id + '\\')\">'\n    + '<span class=\"cu\"><b>' + nombre(L.dorsal) + ' · ' + L.zona.toLowerCase() + '</b>'\n    + '<small>' + L.diagnostico + ' — día ' + dias(L.fecha) + '</small>'\n    + pista(L.fase, false)\n    + '<small class=\"mono\" style=\"margin-top:6px\">FASE ' + L.fase + ' · ' + FASES[L.fase-1].t.toUpperCase()\n    + ' · ' + listos + '/' + tot + ' CRITERIOS</small></span></button>';\n}).join('');\n\n/* ── semáforo ── */\ndocument.getElementById('plantel').innerHTML = BASE.plantel.map(function(j){\n  var e = estadoDe(j.d), L = lesionDe(j.d);\n  var txt = e.estado === 'ok' ? 'Disponible'\n          : e.motivo + ' · vuelve en ' + faltan(e.hasta) + ' d';\n  return '<button class=\"at ' + e.estado + '\" onclick=\"' + (L ? 'irA(\\'lesiones.html?f=' + L.id + '\\')' : 'void 0') + '\">'\n    + '<span class=\"d\">' + j.d + '</span><div class=\"n\">' + j.n + '</div>'\n    + '<div class=\"e\">' + txt + '</div></button>';\n}).join('');\n\n\n/* Registra el sw para que el portal ande sin internet. Falla en silencio\n   si se abre con doble clic desde el disco: eso es normal. */\nif('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});\n"}, "pizarron": {"pag": "pizarron", "cuerpo": "<div class=\"hoja\">\n  <h1 class=\"tit\">Pizarrón de circuitos</h1>\n  <p class=\"bajada\">Armá el circuito en la cancha, numerá las postas y escribí qué se hace en cada\n  una. Se guarda como datos, no como imagen: por eso después se puede animar, traducir y mostrar\n  en el celular del jugador con el video al lado.</p>\n\n  <div class=\"taller\">\n\n    <div class=\"tarjeta\">\n      <div class=\"tarjeta-cab\" style=\"margin-bottom:12px\"><h2 class=\"sub\">Elementos</h2></div>\n      <div id=\"paleta\"></div>\n    </div>\n\n    <div class=\"tarjeta\">\n      <div class=\"pestanias\" style=\"margin-bottom:10px\">\n        <button class=\"pest on\" data-h=\"colocar\">Colocar</button>\n        <button class=\"pest\" data-h=\"mover\">Mover</button>\n        <button class=\"pest\" data-h=\"correr\">Correr</button>\n        <button class=\"pest\" data-h=\"conducir\">Conducir</button>\n        <button class=\"pest\" data-h=\"pase\">Pase</button>\n        <button class=\"pest rojo\" data-h=\"borrar\">Borrar</button>\n      </div>\n      <div class=\"pestanias\">\n        <button class=\"pest\" data-c=\"completa\">Cancha entera</button>\n        <button class=\"pest on\" data-c=\"media\">Media cancha</button>\n        <button class=\"pest\" data-c=\"reducido\">Reducido</button>\n        <button class=\"pest\" data-c=\"gimnasio\">Gimnasio</button>\n      </div>\n      <svg id=\"campo\" viewBox=\"0 0 1050 680\" xmlns=\"http://www.w3.org/2000/svg\">\n        <g id=\"fondo\"></g><g id=\"capaTrazos\"></g><g id=\"capaPiezas\"></g><g id=\"capaTemp\"></g>\n      </svg>\n      <p style=\"margin-top:10px;font-size:13px;color:var(--tinta2)\">\n        <b>Colocar:</b> elegí un elemento a la izquierda y tocá la cancha.\n        <b>Mover:</b> arrastrá lo que ya está puesto.\n        <b>Correr, conducir y pase:</b> arrastrá de un punto a otro.\n      </p>\n    </div>\n\n    <div class=\"tarjeta\">\n      <div class=\"tarjeta-cab\" style=\"margin-bottom:12px\"><h2 class=\"sub\">El ejercicio</h2></div>\n      <label class=\"campo\"><span class=\"eti\">Nombre</span><input type=\"text\" id=\"nom\"></label>\n      <label class=\"campo\"><span class=\"eti\">Para qué sirve</span><input type=\"text\" id=\"obj\"></label>\n      <span class=\"eti\" style=\"display:block;margin-bottom:8px\">Postas</span>\n      <div id=\"postas\"></div>\n      <button class=\"bt neutro ancho\" onclick=\"agregarPosta()\">+ Agregar posta</button>\n      <button class=\"bt ancho\" style=\"margin-top:8px\" onclick=\"guardarEj()\">Guardar en la biblioteca</button>\n      <button class=\"bt hueco ancho\" style=\"margin-top:8px\" onclick=\"bajarPNG()\">Bajar imagen</button>\n    </div>\n\n  </div>\n</div>", "js": "\n/* ══════════════════════════════════════════════════════════════════\n   CATÁLOGO — dibujado centrado en 0,0.\n   Sumar un elemento nuevo es sumar una línea acá. Nada más cambia.\n   ══════════════════════════════════════════════════════════════════ */\nvar ITEMS = {\n  cono:     {g:'Marcas', d:'<polygon points=\"0,-15 11,12 -11,12\" fill=\"#F97316\" stroke=\"#C2410C\" stroke-width=\"1.5\"/><ellipse cy=\"12\" rx=\"14\" ry=\"4\" fill=\"#EA580C\"/>'},\n  conoAmar: {g:'Marcas', d:'<polygon points=\"0,-15 11,12 -11,12\" fill=\"#FACC15\" stroke=\"#A16207\" stroke-width=\"1.5\"/><ellipse cy=\"12\" rx=\"14\" ry=\"4\" fill=\"#EAB308\"/>'},\n  plato:    {g:'Marcas', d:'<ellipse rx=\"14\" ry=\"6\" fill=\"#38BDF8\" stroke=\"#0284C7\" stroke-width=\"1.5\"/><ellipse rx=\"7\" ry=\"3\" fill=\"#0EA5E9\"/>'},\n  marca:    {g:'Marcas', d:'<circle r=\"7\" fill=\"#fff\" stroke=\"#94A3B8\" stroke-width=\"1.5\"/>'},\n\n  pica:     {g:'Obstáculos', d:'<rect x=\"-2\" y=\"-22\" width=\"4\" height=\"40\" fill=\"#DC2626\"/><rect x=\"-9\" y=\"16\" width=\"18\" height=\"4\" rx=\"2\" fill=\"#7F1D1D\"/>'},\n  valla:    {g:'Obstáculos', d:'<rect x=\"-16\" y=\"-14\" width=\"32\" height=\"4\" rx=\"2\" fill=\"#FACC15\"/><rect x=\"-16\" y=\"-14\" width=\"4\" height=\"26\" fill=\"#EAB308\"/><rect x=\"12\" y=\"-14\" width=\"4\" height=\"26\" fill=\"#EAB308\"/><rect x=\"-20\" y=\"10\" width=\"40\" height=\"4\" rx=\"2\" fill=\"#A16207\"/>'},\n  vallaBaja:{g:'Obstáculos', d:'<rect x=\"-15\" y=\"-4\" width=\"30\" height=\"4\" rx=\"2\" fill=\"#F97316\"/><rect x=\"-15\" y=\"-4\" width=\"3\" height=\"14\" fill=\"#EA580C\"/><rect x=\"12\" y=\"-4\" width=\"3\" height=\"14\" fill=\"#EA580C\"/>'},\n  escalera: {g:'Obstáculos', d:'<rect x=\"-13\" y=\"-30\" width=\"26\" height=\"60\" fill=\"none\" stroke=\"#FBBF24\" stroke-width=\"2.5\"/><line x1=\"-13\" y1=\"-15\" x2=\"13\" y2=\"-15\" stroke=\"#FBBF24\" stroke-width=\"2.5\"/><line x1=\"-13\" y1=\"0\" x2=\"13\" y2=\"0\" stroke=\"#FBBF24\" stroke-width=\"2.5\"/><line x1=\"-13\" y1=\"15\" x2=\"13\" y2=\"15\" stroke=\"#FBBF24\" stroke-width=\"2.5\"/>'},\n  aro:      {g:'Obstáculos', d:'<ellipse rx=\"17\" ry=\"9\" fill=\"none\" stroke=\"#22C55E\" stroke-width=\"4\"/>'},\n\n  arco:     {g:'Cancha', d:'<rect x=\"-30\" y=\"-16\" width=\"60\" height=\"22\" fill=\"rgba(255,255,255,.22)\" stroke=\"#fff\" stroke-width=\"2.5\"/><path d=\"M-30,-16 L-30,6 M-15,-16 L-15,6 M0,-16 L0,6 M15,-16 L15,6 M30,-16 L30,6\" stroke=\"rgba(255,255,255,.55)\" stroke-width=\"1\"/>'},\n  pelota:   {g:'Cancha', d:'<circle r=\"9\" fill=\"#fff\" stroke=\"#1E293B\" stroke-width=\"1.5\"/><polygon points=\"0,-4.5 4.3,-1.4 2.6,3.6 -2.6,3.6 -4.3,-1.4\" fill=\"#1E293B\"/>'},\n  jugador:  {g:'Cancha', d:'<circle r=\"13\" fill=\"#1D3E6E\" stroke=\"#fff\" stroke-width=\"2.5\"/>'},\n  kine:     {g:'Cancha', d:'<circle r=\"13\" fill=\"#0F766E\" stroke=\"#fff\" stroke-width=\"2.5\"/><path d=\"M-5,0 H5 M0,-5 V5\" stroke=\"#fff\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>'},\n\n  colchon:  {g:'Gimnasio', d:'<rect x=\"-26\" y=\"-14\" width=\"52\" height=\"28\" rx=\"5\" fill=\"#3B82F6\" stroke=\"#1D4ED8\" stroke-width=\"2\"/>'},\n  step:     {g:'Gimnasio', d:'<rect x=\"-22\" y=\"-8\" width=\"44\" height=\"12\" rx=\"3\" fill=\"#94A3B8\" stroke=\"#475569\" stroke-width=\"2\"/><rect x=\"-18\" y=\"4\" width=\"8\" height=\"9\" fill=\"#64748B\"/><rect x=\"10\" y=\"4\" width=\"8\" height=\"9\" fill=\"#64748B\"/>'},\n  bosu:     {g:'Gimnasio', d:'<path d=\"M-20,10 A20,18 0 0 1 20,10 Z\" fill=\"#60A5FA\" stroke=\"#2563EB\" stroke-width=\"2\"/><rect x=\"-22\" y=\"9\" width=\"44\" height=\"5\" rx=\"2\" fill=\"#1E293B\"/>'},\n  banda:    {g:'Gimnasio', d:'<path d=\"M-22,0 Q-14,-11 -6,0 T10,0 T22,0\" fill=\"none\" stroke=\"#A855F7\" stroke-width=\"4\" stroke-linecap=\"round\"/>'}\n};\n\nvar piezas = [], trazos = [], postas = [], cancha = 'media';\nvar herramienta = 'colocar', elegido = 'cono', selId = null, contador = 1;\n\nvar svg = document.getElementById('campo'),\n    gPz = document.getElementById('capaPiezas'),\n    gTr = document.getElementById('capaTrazos'),\n    gTm = document.getElementById('capaTemp'),\n    gBg = document.getElementById('fondo');\n\nvar LINEA = 'rgba(255,255,255,.75)';\nfunction pintarFondo(){\n  var L = 'stroke=\"' + LINEA + '\" stroke-width=\"3\" fill=\"none\"', rayas = '';\n  for(var i = 0; i < 10; i++)\n    rayas += '<rect x=\"' + (i*105) + '\" y=\"0\" width=\"105\" height=\"680\" fill=\"'\n           + (i % 2 ? 'rgba(255,255,255,.045)' : 'transparent') + '\"/>';\n  var h = '<rect width=\"1050\" height=\"680\" fill=\"#3F8F42\"/>' + rayas;\n\n  if(cancha === 'completa'){\n    h += '<rect x=\"40\" y=\"40\" width=\"970\" height=\"600\" ' + L + '/>'\n       + '<line x1=\"525\" y1=\"40\" x2=\"525\" y2=\"640\" ' + L + '/>'\n       + '<circle cx=\"525\" cy=\"340\" r=\"88\" ' + L + '/><circle cx=\"525\" cy=\"340\" r=\"4\" fill=\"' + LINEA + '\"/>'\n       + '<rect x=\"40\" y=\"180\" width=\"150\" height=\"320\" ' + L + '/><rect x=\"40\" y=\"255\" width=\"55\" height=\"170\" ' + L + '/>'\n       + '<rect x=\"860\" y=\"180\" width=\"150\" height=\"320\" ' + L + '/><rect x=\"955\" y=\"255\" width=\"55\" height=\"170\" ' + L + '/>';\n  }else if(cancha === 'media'){\n    h += '<rect x=\"40\" y=\"40\" width=\"970\" height=\"600\" ' + L + '/>'\n       + '<rect x=\"40\" y=\"150\" width=\"300\" height=\"380\" ' + L + '/>'\n       + '<rect x=\"40\" y=\"245\" width=\"110\" height=\"190\" ' + L + '/>'\n       + '<path d=\"M340,250 A110,110 0 0 1 340,430\" ' + L + '/>'\n       + '<circle cx=\"230\" cy=\"340\" r=\"5\" fill=\"' + LINEA + '\"/>';\n  }else if(cancha === 'reducido'){\n    h += '<rect x=\"120\" y=\"70\" width=\"810\" height=\"540\" ' + L + '/>'\n       + '<line x1=\"525\" y1=\"70\" x2=\"525\" y2=\"610\" ' + L + '/><circle cx=\"525\" cy=\"340\" r=\"70\" ' + L + '/>';\n  }else{\n    h = '<rect width=\"1050\" height=\"680\" fill=\"#2F3542\"/>';\n    for(var x = 0; x <= 1050; x += 70) h += '<line x1=\"'+x+'\" y1=\"0\" x2=\"'+x+'\" y2=\"680\" stroke=\"rgba(255,255,255,.08)\"/>';\n    for(var y = 0; y <= 680; y += 70) h += '<line x1=\"0\" y1=\"'+y+'\" x2=\"1050\" y2=\"'+y+'\" stroke=\"rgba(255,255,255,.08)\"/>';\n  }\n  gBg.innerHTML = h;\n  svg.style.background = cancha === 'gimnasio' ? '#2F3542' : '#3F8F42';\n}\n\n/* paleta */\n(function(){\n  var gr = {}, orden = [];\n  for(var k in ITEMS){ var g = ITEMS[k].g; if(!gr[g]){ gr[g] = []; orden.push(g); } gr[g].push(k); }\n  document.getElementById('paleta').innerHTML = orden.map(function(g){\n    return '<div class=\"grupo\"><span class=\"eti\">' + g + '</span><div class=\"paleta\">'\n      + gr[g].map(function(k){\n          return '<button class=\"pz' + (k === elegido ? ' on' : '') + (g === 'Gimnasio' ? ' gym' : '') + '\" data-k=\"' + k + '\" title=\"' + k + '\">'\n               + '<svg viewBox=\"-32 -32 64 64\">' + ITEMS[k].d + '</svg></button>';\n        }).join('') + '</div></div>';\n  }).join('');\n  document.querySelectorAll('.pz').forEach(function(p){\n    p.onclick = function(){\n      document.querySelectorAll('.pz').forEach(function(x){ x.classList.remove('on'); });\n      p.classList.add('on'); elegido = p.dataset.k; herramienta = 'colocar';\n      document.querySelectorAll('.pest[data-h]').forEach(function(x){ x.classList.toggle('on', x.dataset.h === 'colocar'); });\n    };\n  });\n})();\n\ndocument.querySelectorAll('.pest[data-h]').forEach(function(t){\n  t.onclick = function(){\n    document.querySelectorAll('.pest[data-h]').forEach(function(x){ x.classList.remove('on'); });\n    t.classList.add('on'); herramienta = t.dataset.h; selId = null; pintarPiezas();\n  };\n});\ndocument.querySelectorAll('.pest[data-c]').forEach(function(t){\n  t.onclick = function(){\n    document.querySelectorAll('.pest[data-c]').forEach(function(x){ x.classList.remove('on'); });\n    t.classList.add('on'); cancha = t.dataset.c; pintarFondo();\n  };\n});\n\nfunction pintarPiezas(){\n  gPz.innerHTML = piezas.map(function(p){\n    var cuerpo = p.tipo === '_posta'\n      ? '<circle r=\"16\" fill=\"#fff\" stroke=\"#1D3E6E\" stroke-width=\"3\"/>'\n        + '<text y=\"5.5\" text-anchor=\"middle\" font-family=\"IBM Plex Mono\" font-weight=\"600\" font-size=\"16\" fill=\"#1D3E6E\">' + p.n + '</text>'\n      : ITEMS[p.tipo].d;\n    return '<g class=\"pieza' + (p.id === selId ? ' sel' : '') + '\" data-id=\"' + p.id + '\" '\n      + 'transform=\"translate(' + p.x + ',' + p.y + ')\">'\n      + (p.id === selId ? '<circle class=\"halo\" r=\"26\"/>' : '')\n      + '<circle r=\"24\" fill=\"transparent\"/>' + cuerpo + '</g>';\n  }).join('');\n}\nfunction pintarTrazos(){\n  gTr.innerHTML = trazos.map(dibujar).join('')\n    + '<defs><marker id=\"pta\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\">'\n    + '<path d=\"M0,0 L10,5 L0,10 z\" fill=\"#fff\"/></marker></defs>';\n}\nfunction dibujar(t){\n  var com = 'stroke=\"#fff\" stroke-width=\"3.5\" fill=\"none\" marker-end=\"url(#pta)\" stroke-linecap=\"round\"';\n  if(t.tipo === 'pase')\n    return '<line x1=\"'+t.x1+'\" y1=\"'+t.y1+'\" x2=\"'+t.x2+'\" y2=\"'+t.y2+'\" stroke-dasharray=\"10 7\" ' + com + '/>';\n  if(t.tipo === 'conducir'){\n    var dx = t.x2-t.x1, dy = t.y2-t.y1, L = Math.hypot(dx,dy)||1, n = Math.max(3, Math.round(L/22));\n    var px = -dy/L*8, py = dx/L*8, d = 'M'+t.x1+','+t.y1;\n    for(var i = 1; i <= n; i++){\n      var s = (i%2?1:-1), a = (i-.5)/n, b = i/n;\n      d += ' Q'+(t.x1+dx*a+px*s)+','+(t.y1+dy*a+py*s)+' '+(t.x1+dx*b)+','+(t.y1+dy*b);\n    }\n    return '<path d=\"'+d+'\" ' + com + '/>';\n  }\n  return '<line x1=\"'+t.x1+'\" y1=\"'+t.y1+'\" x2=\"'+t.x2+'\" y2=\"'+t.y2+'\" ' + com + '/>';\n}\nfunction pos(e){\n  var r = svg.getBounding (){\n  var n = postas.length + 1;\n  postas.push({n:n, txt:''});\n  piezas.push({id:contador++, tipo:'_posta', n:n, x:130+n*80, y:600});\n  pintarPostas(); pintarPiezas();\n}\nfunction borrarPosta(n){\n  postas = postas.filter(function(p){ return p.n !== n; });\n  piezas = piezas.filter(function(p){ return !(p.tipo === '_posta' && p.n === n); });\n  postas.forEach(function(p,i){\n    var v = p.n; p.n = i+1;\n    piezas.forEach(function(z){ if(z.tipo === '_posta' && z.n === v) z.n = i+1; });\n  });\n  pintarPostas(); pintarPiezas();\n}\nfunction pintarPostas(){\n  var c = document.getElementById('postas');\n  if(!postas.length){\n    c.innerHTML = '<p style=\"font-size:14px;color:var(--tinta2);margin-bottom:10px\">'\n      + 'Agregá la primera posta y escribí qué se hace ahí.</p>';\n    return;\n  }\n  c.innerHTML = postas.map(function(p){\n    return '<div class=\"posta\"><div class=\"posta-h\"><span class=\"posta-n\">'+p.n+'</span>'\n      + '<b>Posta '+p.n+'</b><span class=\"x\" onclick=\"borrarPosta('+p.n+')\">×</span></div>'\n      + '<textarea placeholder=\"Qué se hace acá\" oninput=\"postas['+(p.n-1)+'].txt=this.value;crecer(this)\">'+p.txt+'</textarea></div>';\n  }).join('');\n}\n\nfunction crecer(t){ t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px'; }\nfunction guardarEj(){\n  var n = document.getElementById('nom').value.trim();\n  if(!n){ alert('Ponele un nombre al circuito antes de guardar.'); return; }\n  var ej = {nombre:n, objetivo:document.getElementById('obj').value.trim(),\n            cancha:cancha, piezas:piezas, trazos:trazos, postas:postas};\n  guardar('kine/ejercicios/' + n.replace(/[^a-zA-Z0-9]+/g,'_'), ej);\n  var a = document.createElement('a');\n  a.href = URL.createObjectURL(new Blob([JSON.stringify(ej,null,2)], {type:'application/json'}));\n  a.download = n.replace(/[^a-zA-Z0-9]+/g,'_') + '.json';\n  a.click();\n}\nfunction bajarPNG(){\n  var c2 = svg.cloneNode(true);\n  c2.setAttribute('width', 2100); c2.setAttribute('height', 1360);\n  var img = new Image();\n  img.onload = function(){\n    var cv = document.createElement('canvas'); cv.width = 2100; cv.height = 1360;\n    cv.getContext('2d').drawImage(img, 0, 0);\n    var a = document.createElement('a');\n    a.href = cv.toDataURL('image/png');\n    a.download = (document.getElementById('nom').value.trim() || 'circuito') + '.png';\n    a.click();\n  };\n  img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(new XMLSerializer().serializeToString(c2))));\n}\n\n/* ── ejemplo cargado: el circuito de cuatro postas ── */\npintarFondo();\ndocument.getElementById('nom').value = 'Circuito de reintegro — 4 postas';\ndocument.getElementById('obj').value = 'Tobillo · fase 4 · reintegro a la cancha';\n[\n /* carril 1 — skipping con devolución */\n [250,150,'arco'],[360,120,'plato'],[360,150,'plato'],[360,180,'plato'],\n [470,150,'pelota'],[560,120,'valla'],[560,180,'valla'],[680,150,'conoAmar'],\n /* carril 2 — zig zag */\n [250,300,'arco'],[370,270,'pica'],[420,330,'pica'],[470,270,'pica'],[520,330,'pica'],\n [570,270,'pica'],[660,300,'conoAmar'],[730,300,'pelota'],\n /* carril 3 — desplazamiento lateral */\n [250,450,'arco'],[380,450,'vallaBaja'],[450,450,'vallaBaja'],[520,450,'vallaBaja'],\n [610,450,'conoAmar'],[690,420,'pelota'],[690,480,'pelota'],\n /* carril 4 — escalera y definición */\n [250,590,'arco'],[380,590,'escalera'],[500,590,'plato'],[570,590,'plato'],\n [650,558,'valla'],[730,590,'pelota']\n].forEach(function(p){ piezas.push({id:contador++, tipo:p[2], x:p[0], y:p[1]}); });\n[[1,120,590],[2,120,450],[3,120,300],[4,120,150]].forEach(function(p){\n  piezas.push({id:contador++, tipo:'_posta', n:p[0], x:p[1], y:p[2]});\n});\npostas = [\n  {n:1, txt:'Skipping de un lado con devolución, skipping del otro con devolución (4 en total). En la última, control y conducción lineal.'},\n  {n:2, txt:'Zig zag, devolución en ambos lados del cono. Vuelvo en zig zag y definición.'},\n  {n:3, txt:'Desplazamiento lateral, paso por detrás del cono, defino de un lado y del otro.'},\n  {n:4, txt:'Skipping frontal, giro a la figura, anticipo de un lado, paso por atrás y defino de primera.'}\n];\npintarPiezas(); pintarTrazos(); pintarPostas();\ndocument.querySelectorAll('.posta textarea').forEach(crecer);\n\n\n/* Registra el sw para que el portal ande sin internet. Falla en silencio\n   si se abre con doble clic desde el disco: eso es normal. */\nif('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});\n"}};
var MAPA = {"agenda.html": "agenda", "alta.html": "alta", "diario.html": "diario", "ejercicios.html": "ejercicios", "index.html": "inicio", "lesiones.html": "ficha", "mi.html": "mi", "pacientes.html": "pacientes", "panel.html": "panel", "pizarron.html": "pizarron"};
var _params = {};
function PARAM(k){ return _params[k] || null; }
function PARAMSET(k, v){ if(v){ _params[k] = v; } else { delete _params[k]; } }

function irA(url){
  var p = String(url).split('?');
  var clave = MAPA[p[0]];
  if(!clave) return;
  _params = {};
  if(p[1]) p[1].split('&').forEach(function(x){ var y = x.split('='); _params[y[0]] = y[1]; });
  mostrar(clave);
}

function cabecera(pag){
  var r = rol();
  var items = MENU[r === 'kine' ? 'kine' : 'jugador'];
  var quien = r === 'kine' ? {ini:'VR', txt:'Vero · kinesióloga'}
                           : {ini:'#' + miDorsal(), txt:nombre(miDorsal())};
  document.getElementById('armazon').innerHTML =
    '<div class="top"><div class="top-in">'
    + '<a class="marca" href="#" onclick="irA(\'index.html\');return false"><span class="sig"></span>'
    + '<span><b>ESTUDIO</b><span>Kinesiología del club</span></span></a>'
    + '<div class="quien">'
    + '<span class="av">' + quien.ini + '</span>' + quien.txt
    + '&nbsp;' + botonAyuda(pag) + '</div>'
    + '</div></div>'
    + '<div class="nav"><div class="nav-in">' + items.map(function(i){
        return '<a href="#" onclick="irA(\'' + i.a + '\');return false"'
             + (i.id === pag ? ' class="on"' : '') + '>' + i.t + '</a>';
      }).join('') + '</div></div>';

  var vieja = document.querySelector('.barra-abajo');
  if(vieja) vieja.remove();
  var ab = document.createElement('nav');
  ab.className = 'barra-abajo';
  ab.innerHTML = items.map(function(i){
      return '<a href="#" onclick="irA(\'' + i.a + '\');return false"'
           + (i.id === pag ? ' class="on"' : '') + '>'
           + '<span class="ic">' + i.ic + '</span>' + i.t + '</a>';
    }).join('');
  document.body.appendChild(ab);
}

function mostrar(clave){
  var p = PAGINAS[clave];
  if(!p) return;
  document.body.dataset.pag = p.pag;
  cabecera(p.pag);
  var v = document.getElementById('vista');
  v.innerHTML = p.cuerpo;
  /* La pantalla corre en el ámbito global, NO en una burbuja.
     Tiene que ser así: los botones usan onclick="miFuncion()" y eso se
     busca siempre en el ámbito global. Metido en una burbuja, ningún
     botón de ninguna pantalla funciona.
     Que dos pantallas tengan una función pintar() no molesta: solo hay
     una pantalla viva por vez y el código se vuelve a correr entero en
     cada navegación. */
  var sc = document.createElement('script');
  sc.textContent = p.js;
  document.getElementById('vista').appendChild(sc);
  scrollTo(0, 0);
}

/* los enlaces sueltos que quedaron dentro de las pantallas */
document.addEventListener('click', function(e){
  var a = e.target.closest('a[href$=".html"]');
  if(a){ e.preventDefault(); irA(a.getAttribute('href')); }
});

mostrar('inicio');
</script>
