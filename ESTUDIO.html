<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estudio · Kinesiología del club</title>
<meta name="theme-color" content="#1D3E6E">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════
   TEMA: TELEMETRÍA — consola de datos, casi negro, cian eléctrico.

   La referencia es el muro de telemetría de un box de Fórmula 1 y la
   pantalla de un ecógrafo: fondo profundo, retícula finísima, números
   grandes en monoespaciada, un solo color vivo.

   El cian se eligió porque el verde, el ámbar y el rojo ya significan
   disponible, limitado y de baja. El acento tiene que quedar afuera de
   esa terna o el semáforo deja de leerse.
   ══════════════════════════════════════════════════════════════════════ */

:root{
  --fondo:#05070B; --sup:#0C1016; --sup2:#12181F;
  --linea:rgba(120,200,225,.13); --linea2:rgba(120,200,225,.26); --borde:1px;
  --tinta:#E4F2F8; --tinta2:#8FA6B4; --tinta3:#5F7280;

  --acc:#00D8E8; --acc2:#4CE9F5; --acc-suave:rgba(0,216,232,.12);
  --acc-borde:rgba(0,216,232,.42); --acc-texto:#3FE3F0; --sobre-acc:#03161A;

  --verde:#3BE08A; --verde-suave:rgba(59,224,138,.11); --verde-borde:rgba(59,224,138,.36);
  --ambar:#FFB531; --ambar-suave:rgba(255,181,49,.11); --ambar-borde:rgba(255,181,49,.36);
  --rojo:#FF5C57;  --rojo-suave:rgba(255,92,87,.11);   --rojo-borde:rgba(255,92,87,.36);

  --tit:'Rajdhani',system-ui,sans-serif; --txt:'IBM Plex Sans',system-ui,sans-serif;
  --dat:'JetBrains Mono',ui-monospace,monospace;
  --tit-tam:34px; --tit-peso:700; --tit-track:1.5px; --sub-track:.8px; --tit-caja:uppercase;

  --r:6px; --r2:8px; --r-chico:5px; --r-min:1px;
  --sombra:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 26px rgba(0,0,0,.5);
  --sombra-alta:0 30px 80px rgba(0,0,0,.75);
  --fulgor:0 0 14px rgba(0,216,232,.35);
  --velo-fondo:rgba(3,6,10,.82);

  /* la retícula del fondo: dos líneas de 1px cada 46px */
  --trama:linear-gradient(rgba(120,200,225,.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120,200,225,.045) 1px, transparent 1px);
}
body{background-size:46px 46px}

/* ══════════════════════════════════════════════════════════════════════
   ESTUDIO — LOS COMPONENTES

   Acá viven las FORMAS: tamaños, espacios, estructura.
   Acá NO vive ningún color ni ninguna tipografía.

   Todo eso sale de los tokens que define css/tema.css. Por eso cambiar
   el aspecto entero del portal es cambiar un archivo de 40 líneas y no
   tocar estas 400.

   Si alguna vez tenés que escribir un #hexadecimal en este archivo, es
   señal de que falta un token. Agregalo al tema en vez de pegarlo acá.
   ══════════════════════════════════════════════════════════════════════ */

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--fondo); color:var(--tinta);
  font-family:var(--txt); font-size:15px; line-height:1.5;
  min-height:100vh; padding-bottom:76px;
  background-image:var(--trama); background-attachment:fixed;
}

/* ── CARTEL DE DEMOSTRACION ─────────────────────────────────────
   Tiene que ser imposible de pasar por alto: el riesgo es cargar un
   paciente real y que quede mezclado con los inventados.            */
.cartel-demo{background:var(--ambar-suave);border-bottom:var(--borde) solid var(--ambar-borde);
  color:var(--ambar);font-size:13.5px;padding:9px 18px;display:flex;gap:14px;
  align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.cartel-demo a{color:var(--ambar);font-family:var(--dat);font-size:11px;font-weight:600;
  letter-spacing:1px;text-transform:uppercase;border:1px solid var(--ambar-borde);
  border-radius:var(--r);padding:6px 12px;text-decoration:none;white-space:nowrap}
.cartel-demo a:hover{background:var(--ambar);color:var(--sobre-acc)}
@media print{ .cartel-demo{display:none} }

/* ── ENCABEZADO ─────────────────────────────────────────────────── */
.top{background:var(--sup);border-bottom:var(--borde) solid var(--linea);position:sticky;top:0;z-index:40}
.top-in{max-width:1240px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.marca .sig{width:30px;height:30px;border-radius:var(--r-chico);background:var(--acc);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;box-shadow:var(--fulgor)}
.marca .sig::after{content:'';width:14px;height:14px;
  background:linear-gradient(var(--sobre-acc),var(--sobre-acc)) center/14px 2.5px no-repeat,
             linear-gradient(var(--sobre-acc),var(--sobre-acc)) center/2.5px 14px no-repeat}
.marca b{font-family:var(--tit);font-size:16px;font-weight:var(--tit-peso);
  letter-spacing:var(--tit-track);line-height:1.1;text-transform:var(--tit-caja)}
.marca span{display:block;font-family:var(--dat);font-size:9.5px;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--tinta3);font-weight:500}
.quien{margin-left:auto;display:flex;align-items:center;gap:9px;font-family:var(--dat);
  font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--tinta2)}
.quien .av{width:28px;height:28px;border-radius:50%;background:var(--acc-suave);color:var(--acc-texto);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px}

.ayuda-bt{width:29px;height:29px;border-radius:50%;border:var(--borde) solid var(--linea2);
  background:transparent;color:var(--tinta2);font-family:var(--tit);font-size:15px;font-weight:600;
  cursor:pointer;flex-shrink:0;line-height:1;display:flex;align-items:center;justify-content:center}
.ayuda-bt:hover{border-color:var(--acc);color:var(--acc);box-shadow:var(--fulgor)}

/* ── NAVEGACIÓN ─────────────────────────────────────────────────── */
.nav{background:var(--sup);border-bottom:var(--borde) solid var(--linea);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-in{max-width:1240px;margin:0 auto;padding:0 18px;display:flex;gap:2px}
.nav a{font-family:var(--dat);font-size:11.5px;font-weight:500;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--tinta2);text-decoration:none;padding:13px 14px;border-bottom:2px solid transparent;white-space:nowrap}
.nav a:hover{color:var(--tinta)}
.nav a.on{color:var(--acc);border-bottom-color:var(--acc)}

/* ── ESTRUCTURA ─────────────────────────────────────────────────── */
.hoja{max-width:1240px;margin:0 auto;padding:22px 18px}
.hoja.angosta{max-width:760px}
h1.tit{font-family:var(--tit);font-size:var(--tit-tam);font-weight:var(--tit-peso);
  letter-spacing:var(--tit-track);line-height:1.1;text-transform:var(--tit-caja)}
.bajada{font-size:15px;color:var(--tinta2);margin-top:6px;margin-bottom:20px;max-width:62ch}
h2.sub{font-family:var(--tit);font-size:17px;font-weight:var(--tit-peso);
  letter-spacing:var(--sub-track);text-transform:var(--tit-caja)}
.eti{font-family:var(--dat);font-size:10.5px;font-weight:500;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--tinta3)}

.tarjeta{background:var(--sup);border:var(--borde) solid var(--linea);border-radius:var(--r2);
  padding:20px;margin-bottom:16px;box-shadow:var(--sombra)}
.tarjeta-cab{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.tarjeta-cab .eti{margin-left:auto}
.rejilla{display:grid;gap:16px}
.rejilla.c2{grid-template-columns:1fr 1fr}
.rejilla.c3{grid-template-columns:repeat(3,1fr)}
.rejilla.c4{grid-template-columns:repeat(4,1fr)}

/* ── DATOS ──────────────────────────────────────────────────────── */
.dato{background:var(--sup2);border:var(--borde) solid var(--linea);border-radius:var(--r);padding:15px 16px}
.dato .v{font-family:var(--dat);font-size:29px;font-weight:600;line-height:1;letter-spacing:-1.5px;
  font-variant-numeric:tabular-nums}
.dato .l{font-family:var(--dat);font-size:10px;font-weight:500;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--tinta3);margin-top:7px}
.mono{font-family:var(--dat);font-variant-numeric:tabular-nums}

/* ── LA PISTA DE RECUPERACIÓN — el elemento firma ───────────────── */
.pista{margin:6px 0 4px}
.pista-vias{display:flex;gap:3px}
.pista-vias i{flex:1;height:9px;border-radius:var(--r-min);background:var(--sup2);
  border:var(--borde) solid var(--linea2);position:relative}
.pista-vias i.hecho{background:var(--verde);border-color:var(--verde)}
.pista-vias i.ahora{background:var(--acc);border-color:var(--acc);box-shadow:var(--fulgor)}
.pista-vias i.ahora::after{content:'';position:absolute;left:50%;top:-7px;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--acc)}
.pista-nom{display:flex;gap:3px;margin-top:7px}
.pista-nom span{flex:1;font-family:var(--dat);font-size:10.5px;font-weight:500;letter-spacing:.6px;
  text-transform:uppercase;color:var(--tinta3);text-align:center;line-height:1.25}
.pista-nom span.ahora{color:var(--acc);font-weight:600}
.pista-solo{display:none;font-family:var(--dat);font-size:10.5px;font-weight:500;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--acc);margin-top:8px}

/* ── SEMÁFORO ───────────────────────────────────────────────────── */
.plantel{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:9px}
.at{background:var(--sup2);border:var(--borde) solid var(--linea);border-left:4px solid var(--linea2);
  border-radius:var(--r);padding:11px 13px;cursor:pointer;transition:.13s;text-align:left;
  font-family:inherit;font-size:inherit;color:inherit;width:100%;display:block}
.at:hover{border-color:var(--linea2);box-shadow:var(--sombra);transform:translateY(-1px)}
.at .d{font-family:var(--dat);font-size:19px;font-weight:600;letter-spacing:-1px;line-height:1}
.at .n{font-weight:600;font-size:15px;margin-top:1px}
.at .e{font-family:var(--dat);font-size:10px;font-weight:500;letter-spacing:1.1px;
  text-transform:uppercase;margin-top:7px}
.at.ok{border-left-color:var(--verde)}
.at.ok .e{color:var(--verde)}
.at.limitado{border-left-color:var(--ambar)}
.at.limitado .e{color:var(--ambar)} .at.limitado .d{color:var(--ambar)}
.at.baja{border-left-color:var(--rojo)}
.at.baja .e{color:var(--rojo)} .at.baja .d{color:var(--rojo)}

.pin{display:inline-block;font-family:var(--dat);font-size:10px;font-weight:500;letter-spacing:1.1px;
  text-transform:uppercase;padding:4px 9px;border-radius:20px;border:var(--borde) solid}
.pin.ok,.pin.atendido{background:var(--verde-suave);border-color:var(--verde-borde);color:var(--verde)}
.pin.limitado,.pin.reservado{background:var(--acc-suave);border-color:var(--acc-borde);color:var(--acc-texto)}
.pin.baja,.pin.ausente{background:var(--rojo-suave);border-color:var(--rojo-borde);color:var(--rojo)}
.pin.gris{background:var(--sup2);border-color:var(--linea);color:var(--tinta3)}

/* ── FILAS ──────────────────────────────────────────────────────── */
.fila{display:flex;align-items:center;gap:13px;padding:12px 14px;border:var(--borde) solid var(--linea);
  border-radius:var(--r);background:var(--sup2);margin-bottom:7px;text-align:left;width:100%;
  font-family:inherit;font-size:inherit;color:inherit}
button.fila{cursor:pointer;transition:.13s}
button.fila:hover{border-color:var(--acc);box-shadow:var(--sombra)}
.fila .hh{font-family:var(--dat);font-size:15px;font-weight:600;letter-spacing:-.4px;
  color:var(--acc-texto);min-width:52px}
.fila .cu{flex:1;min-width:0}
.fila .cu b{font-weight:600;font-size:15px}
.fila .cu small{display:block;color:var(--tinta2);font-size:13px}
.fila.libre{background:transparent;border-style:dashed;color:var(--tinta3)}
.fila.libre .cu b{font-weight:400;font-style:italic;color:var(--tinta3)}

/* ── CONTROLES ──────────────────────────────────────────────────── */
.bt{font-family:var(--dat);font-size:11.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
  padding:11px 18px;border-radius:var(--r);border:var(--borde) solid var(--acc);background:var(--acc);
  color:var(--sobre-acc);cursor:pointer;transition:.13s}
.bt:hover{background:var(--acc2);border-color:var(--acc2);box-shadow:var(--fulgor)}
.bt:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.bt.hueco{background:transparent;color:var(--acc-texto)}
.bt.hueco:hover{background:var(--acc-suave);color:var(--acc-texto)}
.bt.neutro{background:transparent;border-color:var(--linea2);color:var(--tinta2)}
.bt.neutro:hover{background:var(--sup2);color:var(--tinta);box-shadow:none}
.bt.ancho{width:100%;display:block}
.bt.chico{padding:8px 13px;font-size:10.5px}

input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;background:var(--sup2);border:var(--borde) solid var(--linea2);border-radius:var(--r);
  padding:10px 12px;font-family:var(--txt);font-size:15px;color:var(--tinta)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-suave)}
textarea{resize:vertical;min-height:66px}
label.campo{display:block;margin-bottom:12px}
label.campo>.eti{display:block;margin-bottom:5px}

.pestanias{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.pest{font-family:var(--dat);font-size:11px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;
  padding:9px 15px;border-radius:var(--r);border:var(--borde) solid var(--linea2);background:var(--sup2);
  color:var(--tinta2);cursor:pointer}
.pest:hover{color:var(--tinta)}
.pest.on{background:var(--acc);border-color:var(--acc);color:var(--sobre-acc);box-shadow:var(--fulgor)}
.pest.rojo.on{background:var(--rojo);border-color:var(--rojo);color:var(--sobre-acc)}
.panel{display:none}.panel.on{display:block}

.escala{display:flex;gap:5px;flex-wrap:wrap}
.escala button{width:38px;height:38px;border-radius:var(--r);border:var(--borde) solid var(--linea2);
  background:var(--sup2);font-family:var(--dat);font-size:13px;font-weight:600;color:var(--tinta2);cursor:pointer}
.escala button:hover{border-color:var(--acc);color:var(--acc-texto)}
.escala button.on{background:var(--acc);border-color:var(--acc);color:var(--sobre-acc);box-shadow:var(--fulgor)}
/* variante con palabras en lugar de numeros (el diario diario) */
.escala.palabras button{width:auto;flex:1;min-width:74px;height:auto;min-height:44px;
  font-family:var(--txt);font-size:13px;font-weight:500;padding:9px 6px;line-height:1.2}

.crit{display:flex;align-items:flex-start;gap:11px;padding:11px 0;
  border-bottom:var(--borde) solid var(--linea);cursor:pointer}
.crit:last-child{border-bottom:none}
.crit input{width:19px;height:19px;accent-color:var(--acc);margin-top:2px;flex-shrink:0}
.crit.falta{color:var(--tinta2)}

.nota{border-radius:var(--r);padding:12px 15px;font-size:14px;margin-bottom:14px;border:var(--borde) solid}
.nota.aviso{background:var(--ambar-suave);border-color:var(--ambar-borde);color:var(--ambar)}
.nota.bien{background:var(--verde-suave);border-color:var(--verde-borde);color:var(--verde)}
.nota.info{background:var(--acc-suave);border-color:var(--acc-borde);color:var(--acc-texto)}
.nota.reserva{background:var(--rojo-suave);border-color:var(--rojo-borde);color:var(--rojo)}

.vacio{text-align:center;padding:40px 20px;color:var(--tinta2)}
.vacio b{display:block;font-family:var(--tit);font-size:17px;font-weight:var(--tit-peso);
  color:var(--tinta);margin-bottom:6px}

/* ── PANEL DE AYUDA ─────────────────────────────────────────────── */
.ayuda-fondo{position:fixed;inset:0;background:var(--velo-fondo);z-index:90;
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.ayuda-caja{background:var(--sup);border:var(--borde) solid var(--linea2);border-radius:var(--r2);
  max-width:620px;width:100%;padding:26px;box-shadow:var(--sombra-alta);margin:auto;position:relative}
.ayuda-caja .cerrar{position:absolute;top:18px;right:18px;background:transparent;border:none;
  color:var(--tinta3);font-size:24px;line-height:1;cursor:pointer;padding:4px}
.ayuda-caja .cerrar:hover{color:var(--tinta)}
.ayuda-caja h2{font-family:var(--tit);font-size:23px;font-weight:var(--tit-peso);
  letter-spacing:var(--tit-track);text-transform:var(--tit-caja);margin:6px 0 10px}
.ayuda-caja>p{color:var(--tinta2);margin-bottom:18px;padding-right:30px}
.ayuda-paso{display:flex;gap:13px;padding:13px 0;border-top:var(--borde) solid var(--linea)}
.ayuda-paso .nn{font-family:var(--dat);font-size:12px;font-weight:600;color:var(--acc-texto);
  border:var(--borde) solid var(--acc-borde);background:var(--acc-suave);border-radius:50%;
  width:25px;height:25px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ayuda-paso b{display:block;font-size:15px;font-weight:600;margin-bottom:2px}
.ayuda-paso span{color:var(--tinta2);font-size:14px}

/* ── BARRA INFERIOR (celular) ───────────────────────────────────── */
.barra-abajo{display:none}
@media(max-width:860px){
  .nav{display:none}
  .barra-abajo{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--sup);
    border-top:var(--borde) solid var(--linea);z-index:50;padding:6px 4px 8px}
  .barra-abajo a{flex:1;text-align:center;text-decoration:none;color:var(--tinta3);
    font-family:var(--dat);font-size:9px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;padding:5px 2px}
  .barra-abajo a .ic{display:block;font-size:17px;line-height:1.3}
  .barra-abajo a.on{color:var(--acc)}
  .rejilla.c2,.rejilla.c3,.rejilla.c4{grid-template-columns:1fr 1fr}
  h1.tit{font-size:calc(var(--tit-tam) * .82)}
}
@media(max-width:640px){
  /* Una sola columna. Con dos, las filas de turnos no entran y la
     pagina se desborda hacia el costado. */
  .rejilla.c2{grid-template-columns:1fr}
  .rejilla.c3,.rejilla.c4{grid-template-columns:1fr 1fr}
  .fila{gap:10px;padding:11px 12px}
  .fila .hh{min-width:44px}
  .hoja{padding:18px 14px}
  .tarjeta{padding:16px}
}
@media(max-width:560px){
  .pista-nom{display:none}
  .pista-solo{display:block}

  /* El encabezado se partia en dos lineas. En pantalla angosta
     alcanza con la marca, las iniciales y el boton de ayuda: el
     subtitulo y el nombre completo se caen sin perder nada. */
  .marca>span:last-child>span{display:none}
  .quien{font-size:0;gap:8px}
  .quien .av{font-size:12px}
  .top-in{gap:10px}
}

/* ── DEDO ───────────────────────────────────────────────────────
   En pantalla tactil todo lo que se toca sube a 44px de alto, que es
   el minimo con el que se acierta sin errores. En monitor no hace
   falta: el mouse apunta fino y agrandar solo ocupa lugar.          */
@media(pointer:coarse){
  .bt{min-height:44px}
  .bt.chico{min-height:44px}
  .pest{min-height:44px;display:flex;align-items:center}
  .escala button{min-width:44px;height:44px;font-size:15px}
  .ayuda-bt{width:44px;height:44px;font-size:18px}
  .marca{min-height:44px}
  /* los enlaces chiquitos del encabezado de tarjeta ("Ver agenda →")
     median 16px de alto: imposibles de acertar con el dedo */
  a.eti{padding:14px 0;display:inline-block}
  .nav a{min-height:44px;display:flex;align-items:center}
  .barra-abajo a{min-height:50px}
  .crit{padding:14px 0}
  .crit input{width:22px;height:22px}
  input,select,textarea{min-height:44px;font-size:16px}
  .quien .av{width:34px;height:34px}
  button.fila,.at{min-height:52px}
}
@media print{
  .top,.nav,.barra-abajo,.bt,.pestanias,.ayuda-fondo{display:none!important}
  body{background:#fff;color:#000;padding:0;background-image:none}
  .tarjeta{box-shadow:none;break-inside:avoid}

}

  var M = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function fechaLarga(f){
  var M = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* La dosis escrita en una línea, a partir de las tres partes. Antes era
   un texto suelto; separado se puede editar, filtrar y comparar. */
function dosis(e){
  if(e.d) return e.d;                       /* ejercicios viejos */
  var p = [];
  if(e.series) p.push(e.series + (e.series === 1 ? ' serie' : ' series'));
  if(e.reps)   p.push(e.reps);
  if(e.carga && e.carga !== '—') p.push(e.carga);
  return p.join(' · ');
}

   Los videos NO viven en el portal: pesan demasiado y el repositorio se
   vuelve inmanejable. Viven en un servicio de video y acá se guarda solo
   el enlace, en kine/ejercicios/<id>/video.

   Acepta los tres caminos posibles, así la decisión de dónde alojarlos
   no frena el desarrollo y se puede cambiar sin tocar el código:

     YouTube oculto  gratis e ilimitado. El video no aparece en
                     búsquedas, pero quien tenga el enlace lo ve.

                     desde el dominio del portal y en ningún otro lado.
     Archivo directo cualquier .mp4 accesible por enlace.

   Para arrancar conviene YouTube oculto con los primeros ejercicios:
   se valida que el kine y los pacientes realmente los usen, y recién
   ahí se paga por algo que ya se sabe que tiene uso.
   ══════════════════════════════════════════════════════════════════════ */

function videoIncrustado(url){
  if(!url) return null;
  var m;

  m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  if(m) return {tipo:'iframe', src:'https://www.youtube-nocookie.com/embed/' + m[1] + '?rel=0'};

  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m) return {tipo:'iframe', src:'https://player.vimeo.com/video/' + m[1]};

  if(/\.(mp4|webm|mov)(\?|$)/i.test(url)) return {tipo:'archivo', src:url};

  return {tipo:'enlace', src:url};
}

function abrirVideo(nombre, url, nota){
  var v = videoIncrustado(url);
  var caja = document.createElement('div');
  caja.className = 'ayuda-fondo';
  caja.id = 'cajaVideo';

  var reproductor;
  if(!v){
    reproductor = '<div class="vacio"><b>Todavía sin video</b>'
      + 'Este ejercicio no tiene video cargado. Pedíselo al kinesiólogo '
      + 'o seguí la descripción de abajo.</div>';
  }else if(v.tipo === 'iframe'){
    reproductor = '<div style="position:relative;padding-top:56.25%;border-radius:var(--r);overflow:hidden">'
      + '<iframe src="' + v.src + '" style="position:absolute;inset:0;width:100%;height:100%;border:0" '
      + 'allow="accelerometer;autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe></div>';
  }else if(v.tipo === 'archivo'){
    reproductor = '<video src="' + v.src + '" controls playsinline preload="metadata" '
      + 'style="width:100%;border-radius:var(--r);background:#000"></video>';
  }else{
    reproductor = '<a class="bt ancho" href="' + v.src + '" target="_blank" rel="noopener" '
      + 'style="text-decoration:none;text-align:center">Abrir el video</a>';
  }

  caja.innerHTML =
    '<div class="ayuda-caja">'
    + '<button class="cerrar" onclick="cerrarVideo()" aria-label="Cerrar">&times;</button>'
    + '<span class="eti">Cómo se hace</span>'
    + '<h2>' + nombre + '</h2>'
    + reproductor
    + (nota ? '<div class="nota info" style="margin-top:16px">' + nota + '</div>' : '')
    + '<button class="bt ancho" style="margin-top:14px" onclick="cerrarVideo()">Listo</button>'
    + '</div>';

  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarVideo(); });
  document.body.appendChild(caja);
  document.body.style.overflow = 'hidden';
}

function cerrarVideo(){
  var c = document.getElementById('cajaVideo');
  if(c) c.remove();               /* al sacarlo del documento el video se detiene */
  document.body.style.overflow = '';
}

/* ── El botón y el panel ─────────────────────────────────────────── */

function botonAyuda(pag){
  if(!AYUDA[pag]) return '';
  return '<button class="ayuda-bt" onclick="abrirAyuda(\'' + pag + '\')" '
       + 'title="Cómo funciona esta pantalla" aria-label="Ayuda">?</button>';
}

function abrirAyuda(pag){
  var a = AYUDA[pag];
  if(!a) return;
  cerrarAyuda();

  var caja = document.createElement('div');
  caja.className = 'ayuda-fondo';
  caja.id = 'ayudaFondo';
  caja.setAttribute('role', 'dialog');
  caja.setAttribute('aria-modal', 'true');
  caja.innerHTML =
    '<div class="ayuda-caja">'
    + '<button class="cerrar" onclick="cerrarAyuda()" aria-label="Cerrar">&times;</button>'
    + '<span class="eti">Cómo funciona</span>'
    + '<h2>' + a.titulo + '</h2>'
    + '<p>' + a.que_es + '</p>'
    + a.pasos.map(function(p, i){
        return '<div class="ayuda-paso"><span class="nn">' + (i + 1) + '</span>'
             + '<div><b>' + p[0] + '</b><span>' + p[1] + '</span></div></div>';
      }).join('')
    + (a.ojo ? '<div class="nota aviso" style="margin:18px 0 0">' + a.ojo + '</div>' : '')
    + '<button class="bt ancho" style="margin-top:16px" onclick="cerrarAyuda()">Entendido</button>'
    + '</div>';

  /* cerrar tocando afuera, pero no adentro */
  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarAyuda(); });
  document.body.appendChild(caja);
  document.body.style.overflow = 'hidden';
  var b = caja.querySelector('.cerrar'); if(b) b.focus();
}

function cerrarAyuda(){
  var v = document.getElementById('ayudaFondo');
  if(v) v.remove();
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') cerrarAyuda();
});

/* ══════════════════════════════════════════════════════════════════════
   ATENDER — todo lo de una sesión, en un solo lugar

   Antes, atender a una persona eran diez pasos repartidos en tres
   pantallas: abrir la ficha, cargar la sesión, ir a la agenda a marcar
   que vino, ir a programas a ajustarle los ejercicios, volver a la
   agenda a darle el próximo turno.

   El kinesiólogo hace eso quince veces por día. Diez pasos por quince
   pacientes son ciento cincuenta navegaciones diarias.

   Acá es uno: se toca el turno y se hace todo en la misma pantalla, en
   el orden en que pasan las cosas de verdad. Al confirmar, en una sola
   acción se marca la asistencia, se descuenta el crédito, se cobra si
   corresponde, se asienta en la historia clínica y se deja el próximo
   turno reservado.
   ══════════════════════════════════════════════════════════════════════ */

var AT = null;

function atender(dia, hora){
  var t = null;
  (BASE.agenda[dia] || []).forEach(function(x){ if(x.h === hora) t = x; });
  if(!t || !t.pid) return;

  var p = paciente(t.pid);
  var L = null;
  BASE.lesiones.forEach(function(x){
    if(x.pid === t.pid && x.estado === 'activa') L = x;
  });

  AT = {dia:dia, hora:hora, turno:t, p:p, L:L,
        vino:true, tipo:t.tipo || 'Tratamiento',
        pre:null, post:null, nota:'', proximo:null, paso:1};
  pintarAtender();
}

function pintarAtender(){
  cerrarAtender(true);
  var caja = document.createElement('div');
  caja.className = 'ayuda-fondo';
  caja.id = 'cajaAtender';
  caja.innerHTML = '<div class="ayuda-caja"><div id="cuerpoAtender"></div></div>';
  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarAtender(); });
  document.body.appendChild(caja);
  document.body.style.overflow = 'hidden';
  cuerpoAtender();
}

function cuerpoAtender(){
  var p = AT.p, L = AT.L, pl = planDe(p), av = avisoCreditos(p);

  var libres = (BASE.agenda[proximoDia()] || []).filter(function(x){ return !x.pid && !x.dorsal; });

  document.getElementById('cuerpoAtender').innerHTML =
    '<button class="cerrar" onclick="cerrarAtender()" aria-label="Cerrar">&times;</button>'
    + '<span class="eti">' + AT.hora + ' · ' + fechaLarga(AT.dia) + '</span>'
    + '<h2>' + p.nombre + '</h2>'
    + '<p>' + (L ? L.diagnostico + ' · fase ' + L.fase + ', ' + FASES[L.fase-1].t.toLowerCase()
                 : 'Sin lesión abierta') + '</p>'

    /* 1. vino o no vino */
    + '<label class="campo"><span class="eti">¿Vino?</span>'
    + '<div class="pestanias" id="atVino" style="margin-bottom:0">'
    + '<button class="pest' + (AT.vino ? ' on' : '') + '" data-v="1">Sí, vino</button>'
    + '<button class="pest rojo' + (AT.vino ? '' : ' on') + '" data-v="0">Faltó</button>'
    + '</div></label>'

    + (AT.vino ? bloqueSesion() : bloqueAusente())

    /* estado del plan, siempre a la vista */
    + (av ? '<div class="nota ' + (av.nivel === 'reserva' ? 'reserva'
            : av.nivel === 'aviso' ? 'aviso' : 'bien') + '">' + av.txt
            + (pl.sesiones === 1 && pl.precio ? ' Paga por sesión: se cobra ' + plata(pl.precio) + '.' : '')
            + '</div>'
          : '')

    /* próximo turno, en la misma pantalla */
    + '<label class="campo"><span class="eti">Próximo turno — ' + fechaLarga(proximoDia()) + '</span>'
    + (libres.length
        ? '<div class="pestanias" id="atProx" style="margin-bottom:0">'
          + '<button class="pest' + (AT.proximo === null ? ' on' : '') + '" data-h="">Ahora no</button>'
          + libres.slice(0, 6).map(function(x){
              return '<button class="pest' + (AT.proximo === x.h ? ' on' : '') + '" data-h="'
                   + x.h + '">' + x.h + '</button>';
            }).join('') + '</div>'
        : '<p style="color:var(--tinta3);font-size:14px">No quedan horarios libres ese día.</p>')
    + '</label>'

    + '<div id="atAviso"></div>'
    + '<button class="bt ancho" onclick="confirmarAtencion()">' + textoBoton() + '</button>'
    + (L ? '<button class="bt neutro ancho" style="margin-top:8px" '
         + 'onclick="cerrarAtender();irA(\'programa.html?p=' + p.id + '\')">'
         + 'Cambiarle los ejercicios</button>' : '');

  document.querySelectorAll('#atVino .pest').forEach(function(b){
    b.onclick = function(){ AT.vino = b.dataset.v === '1'; cuerpoAtender(); };
  });
  document.querySelectorAll('#atProx .pest').forEach(function(b){
    b.onclick = function(){ AT.proximo = b.dataset.h || null; cuerpoAtender(); };
  });
  if(AT.vino){
    escala(document.getElementById('atPre'),  function(v){ AT.pre = v; }, AT.pre);
    escala(document.getElementById('atPost'), function(v){ AT.post = v; }, AT.post);
    var n = document.getElementById('atNota');
    if(n){ n.value = AT.nota; n.oninput = function(){ AT.nota = n.value; }; }
    document.querySelectorAll('#atTipo .pest').forEach(function(b){
      b.onclick = function(){
        document.querySelectorAll('#atTipo .pest').forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on'); AT.tipo = b.dataset.t;
      };
    });
  }
}

function bloqueSesion(){
  return '<label class="campo"><span class="eti">Qué tipo de sesión</span>'
    + '<div class="pestanias" id="atTipo" style="margin-bottom:0">'
    + ['Evaluación','Tratamiento','Gimnasio','Campo'].map(function(t){
        return '<button class="pest' + (t === AT.tipo ? ' on' : '') + '" data-t="' + t + '">' + t + '</button>';
      }).join('') + '</div></label>'
    + '<label class="campo"><span class="eti">Dolor al llegar</span><div id="atPre"></div></label>'
    + '<label class="campo"><span class="eti">Dolor al terminar</span><div id="atPost"></div></label>'
    + '<label class="campo"><span class="eti">Qué se hizo (opcional)</span>'
    + '<textarea id="atNota" placeholder="Movilidad articular, isométricos..."></textarea></label>';
}

function bloqueAusente(){
  return '<div class="nota aviso">No se le descuenta la sesión ni se cobra. '
    + 'Queda contado en el porcentaje de ausencias del mes.</div>';
}

function textoBoton(){
  if(!AT.vino) return 'Marcar que faltó';
  var n = 2 + (AT.proximo ? 1 : 0);
  return 'Confirmar (' + n + ' cosas de una)';
}

function proximoDia(){
  var d = Object.keys(BASE.agenda).filter(function(x){ return x > AT.dia; }).sort();
  return d.length ? d[0] : AT.dia;
}

function confirmarAtencion(){
  var t = AT.turno, p = AT.p, L = AT.L;

  if(!AT.vino){
    t.estado = 'ausente';
    guardar('kine/agenda/turnos/' + AT.dia + '/' + AT.hora + '/estado', 'ausente');
    asentar(p.id, 'turno', 'No se presentó al turno del ' + fechaLarga(AT.dia) + ' a las ' + AT.hora + '.');
    cerrarAtender(); recargarPantalla();
    return;
  }

  if(AT.pre === null || AT.post === null){
    document.getElementById('atAviso').innerHTML =
      '<div class="nota aviso">Marcá el dolor al llegar y al terminar. '
      + 'La diferencia entre los dos es el dato que sirve.</div>';
    return;
  }

  /* 1. la asistencia */
  t.estado = 'atendido';
  guardar('kine/agenda/turnos/' + AT.dia + '/' + AT.hora + '/estado', 'atendido');

  /* 2. la plata */
  var pl = planDe(p);
  consumirCredito(p.id);
  if(pl.sesiones === 1 && pl.precio > 0){
    anotarMovimiento({tipo:'ingreso', concepto:'Sesión — ' + p.nombre,
                      monto:pl.precio, pid:p.id, categoria:'sesiones'});
  }

  /* 3. la sesión en la ficha y en la historia clínica */
  var nota = (AT.nota || '').trim() || '—';
  if(L){
    L.sesiones.unshift({f:AT.dia, t:AT.tipo, pre:AT.pre, post:AT.post, nota:nota});
    guardar('kine/sesiones/' + L.id + '/' + AT.dia, {
      dorsal:p.dorsal, fecha:AT.dia, tipo:AT.tipo,
      dolor_pre:AT.pre, dolor_post:AT.post, notas:nota, fase:L.fase});
  }
  asentar(p.id, 'sesion', AT.tipo + '. Dolor al llegar ' + AT.pre + '/10, al terminar '
    + AT.post + '/10.' + (L ? ' Fase ' + L.fase + '.' : '') + ' ' + nota);

  if(p.estado === 'pendiente'){
    p.estado = 'activo';
    guardar('kine/pacientes/' + p.id + '/estado', 'activo');
  }

  /* 4. el próximo turno */
  if(AT.proximo){
    var d2 = proximoDia();
    (BASE.agenda[d2] || []).forEach(function(x){
      if(x.h === AT.proximo){
        x.pid = p.id; x.dorsal = p.dorsal || null;
        x.tipo = AT.tipo; x.estado = 'reservado';
        guardar('kine/agenda/turnos/' + d2 + '/' + x.h,
                {pid:p.id, dorsal:x.dorsal, tipo:x.tipo, estado:'reservado'});
        asentar(p.id, 'turno', 'Próximo turno para el ' + fechaLarga(d2) + ' a las ' + x.h + '.');
      }
    });
  }

  cerrarAtender();
  recargarPantalla();
}

function cerrarAtender(silencioso){
  var c = document.getElementById('cajaAtender');
  if(c) c.remove();
  if(!silencioso) document.body.style.overflow = '';
}

/* Cada pantalla define su propio pintar(); esto la refresca sin recargar. */
function recargarPantalla(){
  if(typeof pintar === 'function') pintar();
}

/* ══════════════════════════════════════════════════════════════════════
   DINERO — los planes, los créditos y la caja del estudio

   Es la parte que no existía y sin la cual el portal no sirve para vivir
   de esto. Tres cosas:

   PLANES     cómo paga cada paciente
   CREDITOS   las sesiones que le quedan, que se descuentan solas
   CAJA       lo que entra y lo que sale

   La decisión importante: el crédito se descuenta cuando la sesión se
   marca como ATENDIDA, no cuando se reserva el turno. Si se descontara al
   reservar, una cancelación a tiempo le comería una sesión al paciente y
   el estudio quedaría discutiendo por WhatsApp.
   ══════════════════════════════════════════════════════════════════════ */

var PLANES = {
  club:   {nombre:'Plantel del club', sesiones:0,  precio:0,
           detalle:'Lo cubre el club. No se factura por sesión.'},
  sesion: {nombre:'Sesión a sesión',  sesiones:1,  precio:18000,
           detalle:'Paga cada vez que viene.'},

function planDe(p){
  return PLANES[p && p.plan ? p.plan : 'sesion'] || PLANES.sesion;
}

function precioSesion(p){
  var pl = planDe(p);
  if(pl.sesiones === 0) return pl.precio;
  return Math.round(pl.precio / pl.sesiones);
}


/* ── LA CAJA ─────────────────────────────────────────────────────── */
function movimientos(){
  if(!BASE.caja) BASE.caja = [];
  return BASE.caja;
}

function anotarMovimiento(m){
  var t = (typeof ahora === 'function') ? ahora() : {fecha:HOY, sello:HOY};
  var mov = {
    id: 'M' + (movimientos().length + 1) + String(Date.now()).slice(-4),
    fecha: m.fecha || t.fecha,
    tipo: m.tipo,                 /* 'ingreso' o 'egreso' */
    concepto: m.concepto,
    monto: Math.round(m.monto),
    pid: m.pid || null,
    metodo: m.metodo || 'efectivo',
    categoria: m.categoria || (m.tipo === 'ingreso' ? 'sesiones' : 'gastos')
  };
  movimientos().push(mov);
  guardar('kine/caja/' + mov.id, mov);
  return mov;
}

function delMes(mes){
  mes = mes || HOY.slice(0, 7);
  return movimientos().filter(function(m){ return m.fecha.slice(0, 7) === mes; });
}

function resumenMes(mes){
  var m = delMes(mes), ing = 0, egr = 0;
  m.forEach(function(x){
    if(x.tipo === 'ingreso') ing += x.monto; else egr += x.monto;
  });
  return {ingresos: ing, egresos: egr, saldo: ing - egr, movimientos: m.length};
}


/* ── CREDITOS ────────────────────────────────────────────────────────
   Se descuenta al ATENDER, no al reservar. Ver la nota de arriba.     */
function venderPlan(pid, clave){
  var p = paciente(pid), pl = PLANES[clave];
  if(!p || !pl) return null;
  p.plan = clave;
  p.creditos = (p.creditos || 0) + pl.sesiones;
  guardar('kine/pacientes/' + pid + '/plan', clave);
  guardar('kine/pacientes/' + pid + '/creditos', p.creditos);
  if(pl.precio > 0){
    anotarMovimiento({tipo:'ingreso', concepto:pl.nombre + ' — ' + p.nombre,
                      monto:pl.precio, pid:pid, categoria:'planes'});
  }
  if(typeof asentar === 'function'){
    asentar(pid, 'nota', 'Se le asignó el plan "' + pl.nombre + '"'
      + (pl.sesiones ? ' con ' + pl.sesiones + ' sesiones.' : '.'));
  }
  return p;
}

function consumirCredito(pid){
  var p = paciente(pid);
  if(!p) return null;
  var pl = planDe(p);
  if(pl.sesiones === 0 || pl.precio === 0) return p;   /* club u online */
  if(pl.sesiones >= 99) return p;                      /* libre: no descuenta */
  p.creditos = Math.max(0, (p.creditos || 0) - 1);
  guardar('kine/pacientes/' + pid + '/creditos', p.creditos);
  return p;
}

function avisoCreditos(p){
  var pl = planDe(p);
  if(pl.sesiones === 0 || pl.sesiones >= 99) return null;
  var c = p.creditos || 0;
  if(c === 0) return {nivel:'reserva', txt:'Sin sesiones. Hay que renovarle el plan.'};
  if(c <= 2)  return {nivel:'aviso',   txt:'Le quedan ' + c + ' sesiones. Conviene avisarle.'};
  return {nivel:'bien', txt:'Le quedan ' + c + ' sesiones.'};
}


/* ── CANCELACIONES ───────────────────────────────────────────────────
   El porcentaje de ausencias es el indicador que más plata mueve en un
   estudio: cada hueco es una hora que no se recupera. Los estudios de
   kinesiología ambulatoria manejan entre 8% y 25%, más alto que otras
   especialidades porque el tratamiento exige sostenerse semanas.      */
function estadisticaTurnos(mes){
  mes = mes || HOY.slice(0, 7);
  var total = 0, atendidos = 0, ausentes = 0, cancelados = 0;
  for(var d in BASE.agenda){
    if(d.slice(0, 7) !== mes) continue;
    BASE.agenda[d].forEach(function(t){
      if(!t.dorsal && !t.pid) return;
      total++;
      if(t.estado === 'atendido')  atendidos++;
      if(t.estado === 'ausente')   ausentes++;
      if(t.estado === 'cancelado') cancelados++;
    });
  }
  return {
    total: total, atendidos: atendidos, ausentes: ausentes, cancelados: cancelados,
    pendientes: total - atendidos - ausentes - cancelados,
    porcentajeAusencia: total ? Math.round((ausentes + cancelados) * 100 / total) : 0
  };
}

function plata(n){
  return '$' + Math.round(n).toLocaleString('es-AR');
}

/* ══════════════════════════════════════════════════════════════════════
   HISTORIA CLINICA — la capa que exige la ley

   La Ley 26.529 permite llevar la historia clínica en soporte informático,
   pero pide asegurar integridad, autenticidad, inalterabilidad,
   perdurabilidad y recuperabilidad. Y pide, textualmente, control de
   modificación de campos.

   Un sistema que sobrescribe un registro anterior no cumple nada de eso.

   Cómo se resuelve acá:

   ASIENTOS, NO EDICIONES. Cada actuación genera un asiento nuevo,
   numerado correlativo, con fecha, hora y autor. Corregir algo no borra
   lo anterior: agrega un asiento de rectificación que apunta al viejo.
   Es exactamente cómo funciona una historia clínica en papel, donde uno
   no arranca la hoja: tacha y firma al lado.

   CADENA DE FIRMAS. Cada asiento guarda la huella del anterior. Si
   alguien edita un asiento viejo por atrás, la cadena se corta y el
   sistema lo detecta. No impide el cambio, pero lo hace visible, que es
   lo que la ley pide: control de modificación.

   BITACORA DE ACCESOS. Queda registrado quién miró qué historia y cuándo.

   Nada de esto se le muestra al kinesiólogo mientras trabaja. Corre solo
   por abajo y aparece cuando hace falta: al exportar la historia, o al
   verificar que nadie la tocó.
   ══════════════════════════════════════════════════════════════════════ */


/* ── SHA-256, escrito acá para que funcione sin internet y sin librerías.
      Es el algoritmo estándar; no hay nada casero en la matemática.   ── */
var SHA_K = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];

function sha256(txt){
  function rot(x,n){ return (x>>>n)|(x<<(32-n)); }
  var bytes = [], i;
  for(i = 0; i < txt.length; i++){
    var c = txt.charCodeAt(i);
    if(c < 128) bytes.push(c);
    else if(c < 2048) bytes.push(192|(c>>6), 128|(c&63));
    else bytes.push(224|(c>>12), 128|((c>>6)&63), 128|(c&63));
  }
  var largo = bytes.length * 8;
  bytes.push(0x80);
  while(bytes.length % 64 !== 56) bytes.push(0);
  for(i = 7; i >= 0; i--) bytes.push((largo / Math.pow(2, i*8)) & 255);

  var h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
           0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];

  for(var b = 0; b < bytes.length; b += 64){
    var w = new Array(64);
    for(i = 0; i < 16; i++)
      w[i] = (bytes[b+i*4]<<24)|(bytes[b+i*4+1]<<16)|(bytes[b+i*4+2]<<8)|bytes[b+i*4+3];
    for(i = 16; i < 64; i++){
      var s0 = rot(w[i-15],7) ^ rot(w[i-15],18) ^ (w[i-15]>>>3);
      var s1 = rot(w[i-2],17) ^ rot(w[i-2],19)  ^ (w[i-2]>>>10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    var a=h[0],bb=h[1],c2=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
    for(i = 0; i < 64; i++){
      var S1 = rot(e,6) ^ rot(e,11) ^ rot(e,25);
      var ch = (e & f) ^ (~e & g);
      var t1 = (hh + S1 + ch + SHA_K[i] + w[i]) | 0;
      var S0 = rot(a,2) ^ rot(a,13) ^ rot(a,22);
      var mj = (a & bb) ^ (a & c2) ^ (bb & c2);
      var t2 = (S0 + mj) | 0;
      hh=g; g=f; f=e; e=(d+t1)|0; d=c2; c2=bb; bb=a; a=(t1+t2)|0;
    }
    h[0]=(h[0]+a)|0;  h[1]=(h[1]+bb)|0; h[2]=(h[2]+c2)|0; h[3]=(h[3]+d)|0;
    h[4]=(h[4]+e)|0;  h[5]=(h[5]+f)|0;  h[6]=(h[6]+g)|0;  h[7]=(h[7]+hh)|0;
  }
  return h.map(function(x){ return ('00000000' + (x>>>0).toString(16)).slice(-8); }).join('');
}

function ahora(){

          hora: d.toTimeString().slice(0,8),
          sello: d.toISOString()};
}


/* ── EL ASIENTO ─────────────────────────────────────────────────────
   Es la única forma de escribir algo clínico. Nunca se edita, nunca se
   borra: se agrega. Corregir es asentar una rectificación que apunta al
   asiento equivocado, igual que tachar y firmar al lado en papel.     */
function historiaDe(pid){
  if(!BASE.historia) BASE.historia = {};
  if(!BASE.historia[pid]) BASE.historia[pid] = [];
  return BASE.historia[pid];
}

function asentar(pid, tipo, contenido, rectifica){
  var h = historiaDe(pid);
  var t = ahora(), a = autorActual();
  var previo = h.length ? h[h.length-1] : null;

  var asiento = {
    n: h.length + 1,                       /* foliado correlativo, sin saltos */
    fecha: t.fecha,
    hora: t.hora,
    sello: t.sello,
    autor: a.nombre,
    autor_id: a.id,
    matricula: a.matricula,
    tipo: tipo,
    contenido: contenido,
    rectifica: rectifica || null,
    huella_previa: previo ? previo.huella : '0'
  };

  /* La huella se calcula sobre el asiento entero MAS la del anterior.
     Eso encadena todo: tocar un asiento viejo invalida todos los que
     vienen después, y el sistema lo puede demostrar. */
  asiento.huella = sha256(JSON.stringify({
    n: asiento.n, sello: asiento.sello, autor_id: asiento.autor_id,
    tipo: asiento.tipo, contenido: asiento.contenido,
    rectifica: asiento.rectifica, previa: asiento.huella_previa
  }));

  h.push(asiento);
  guardar('kine/historia/' + pid + '/' + asiento.n, asiento);
  return asiento;
}


/* ── Verificar que nadie tocó nada ──────────────────────────────── */
function verificarHistoria(pid){
  var h = historiaDe(pid);
  for(var i = 0; i < h.length; i++){
    var a = h[i];
    var esperada = sha256(JSON.stringify({
      n: a.n, sello: a.sello, autor_id: a.autor_id,
      tipo: a.tipo, contenido: a.contenido,
      rectifica: a.rectifica, previa: a.huella_previa
    }));
    if(esperada !== a.huella)
      return {ok:false, motivo:'El asiento ' + a.n + ' fue modificado.', asiento:a.n};
    if(a.n !== i + 1)
      return {ok:false, motivo:'Falta el asiento ' + (i+1) + '. La numeración tiene un salto.', asiento:i+1};
    if(i > 0 && a.huella_previa !== h[i-1].huella)
      return {ok:false, motivo:'La cadena se corta entre el asiento ' + (i) + ' y el ' + a.n + '.', asiento:a.n};
  }
  return {ok:true, asientos:h.length};
}

/* ══════════════════════════════════════════════════════════════════════
   QR — el generador de códigos del estudio

   Está escrito acá, entero, a propósito. Los generadores de QR que se
   usan por internet reciben el enlace que uno quiere codificar: mandarles
   la dirección del portal del estudio es filtrar algo que no hace falta
   filtrar, y encima ata el portal a que ese servicio siga existiendo.

   Esto no depende de nada. Funciona sin internet y va a seguir andando
   dentro de diez años.

   Genera QR modelo 2, modo binario, corrección de errores nivel M
   (recupera hasta el 15% del código dañado, que es lo razonable para un
   cartel pegado en una pared que se ensucia). Versiones 1 a 10, que
   alcanzan para cualquier dirección web normal.
   ══════════════════════════════════════════════════════════════════════ */

/* Cuántos datos entran en cada versión, y cómo se reparten los bloques.
   ec = bytes de corrección por bloque. g1/g2 = grupos de bloques.       */
var QR_VER = {
  1:  {ec:10, g1:1, d1:16},
  2:  {ec:16, g1:1, d1:28},
  3:  {ec:26, g1:1, d1:44},
  4:  {ec:18, g1:2, d1:32},
  5:  {ec:24, g1:2, d1:43},
  6:  {ec:16, g1:4, d1:27},
  7:  {ec:18, g1:4, d1:31},
  8:  {ec:22, g1:2, d1:38, g2:2, d2:39},
  9:  {ec:22, g1:3, d1:36, g2:2, d2:37},
  10: {ec:26, g1:4, d1:43, g2:1, d2:44}
};

var QR_ALINEACION = {
  1:[], 2:[6,18], 3:[6,22], 4:[6,26], 5:[6,30],
  6:[6,34], 7:[6,22,38], 8:[6,24,42], 9:[6,26,46], 10:[6,28,50]
};

/* Los 15 bits de formato para nivel M y cada una de las 8 máscaras. */
var QR_FORMATO = [
  '101010000010010','101000100100101','101111001111100','101101101001011',
  '100010111111001','100000011001110','100111110010111','100101010100000'
];

/* Los 18 bits de versión, solo desde la 7 en adelante. */
var QR_VERSION_BITS = {
  7:'000111110010010100', 8:'001000010110111100',
  9:'001001101010011001', 10:'001010010011010011'
};

/* Aritmética en el campo de Galois 256, que es la que usa la corrección
   de errores Reed-Solomon. */
var QR_EXP = new Array(512), QR_LOG = new Array(256);
(function(){
  var x = 1;
  for(var i = 0; i < 255; i++){
    QR_EXP[i] = x;
    QR_LOG[x] = i;
    x <<= 1;
    if(x & 0x100) x ^= 0x11D;
  }
  for(var j = 255; j < 512; j++) QR_EXP[j] = QR_EXP[j - 255];
})();

function qrMul(a, b){
  if(a === 0 || b === 0) return 0;
  return QR_EXP[QR_LOG[a] + QR_LOG[b]];
}

/* El polinomio generador para n bytes de corrección. */
function qrGenerador(n){
  var p = [1];
  for(var i = 0; i < n; i++){
    var q = [];
    for(var j = 0; j <= p.length; j++){
      var v = 0;
      if(j < p.length) v ^= p[j];
      if(j > 0) v ^= qrMul(p[j-1], QR_EXP[i]);
      q[j] = v;
    }
    p = q;
  }
  return p;
}

function qrCorreccion(datos, n){
  var g = qrGenerador(n);
  var r = datos.slice().concat(new Array(n).fill(0));
  for(var i = 0; i < datos.length; i++){
    var c = r[i];
    if(c === 0) continue;
    for(var j = 0; j < g.length; j++) r[i+j] ^= qrMul(g[j], c);
  }
  return r.slice(datos.length);
}

/* ── Las ocho máscaras que se prueban para elegir la más legible ── */
var QR_MASCARAS = [
  function(f,c){ return (f + c) % 2 === 0; },
  function(f){   return f % 2 === 0; },
  function(f,c){ return c % 3 === 0; },
  function(f,c){ return (f + c) % 3 === 0; },
  function(f,c){ return (Math.floor(f/2) + Math.floor(c/3)) % 2 === 0; },
  function(f,c){ return (f*c) % 2 + (f*c) % 3 === 0; },
  function(f,c){ return ((f*c) % 2 + (f*c) % 3) % 2 === 0; },
  function(f,c){ return ((f+c) % 2 + (f*c) % 3) % 2 === 0; }
];

function qrGenerar(texto){
  var bytes = [];
  for(var i = 0; i < texto.length; i++){
    var c = texto.charCodeAt(i);
    if(c < 128) bytes.push(c);
    else if(c < 2048){ bytes.push(192 | (c >> 6), 128 | (c & 63)); }
    else { bytes.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63)); }
  }

  /* La versión más chica en la que entra el texto. */
  var ver = 0;
  for(var v = 1; v <= 10; v++){
    var d = QR_VER[v];
    var cap = d.g1 * d.d1 + (d.g2 || 0) * (d.d2 || 0);
    var cabecera = 4 + (v < 10 ? 8 : 16);
    if(bytes.length + Math.ceil(cabecera/8) <= cap){ ver = v; break; }
  }
  if(!ver) return null;

  var info = QR_VER[ver];
  var totalDatos = info.g1 * info.d1 + (info.g2 || 0) * (info.d2 || 0);

  /* Modo binario (0100), longitud, datos, y relleno hasta llenar. */
  var bits = '0100';
  var largoBits = ver < 10 ? 8 : 16;
  bits += bytes.length.toString(2).padStart(largoBits, '0');
  bytes.forEach(function(b){ bits += b.toString(2).padStart(8, '0'); });
  bits += '0000';
  bits = bits.slice(0, totalDatos * 8);
  while(bits.length % 8) bits += '0';

  var cw = [];
  for(var k = 0; k < bits.length; k += 8) cw.push(parseInt(bits.substr(k, 8), 2));
  var relleno = [236, 17], r = 0;
  while(cw.length < totalDatos) cw.push(relleno[r++ % 2]);

  /* Partir en bloques, calcular corrección, y entrelazar. */
  var bloques = [], ecs = [], pos = 0;
  for(var g = 0; g < info.g1; g++){
    var b = cw.slice(pos, pos + info.d1); pos += info.d1;
    bloques.push(b); ecs.push(qrCorreccion(b, info.ec));
  }
  for(var g2 = 0; g2 < (info.g2 || 0); g2++){
    var b2 = cw.slice(pos, pos + info.d2); pos += info.d2;
    bloques.push(b2); ecs.push(qrCorreccion(b2, info.ec));
  }

  var final = [];
  var maxD = Math.max.apply(null, bloques.map(function(b){ return b.length; }));
  for(var i2 = 0; i2 < maxD; i2++)
    bloques.forEach(function(b){ if(i2 < b.length) final.push(b[i2]); });
  for(var i3 = 0; i3 < info.ec; i3++)
    ecs.forEach(function(e){ final.push(e[i3]); });

  /* ── Armar la matriz ── */
  var n = 17 + ver * 4;
  var m = [], res = [];
  for(var f = 0; f < n; f++){
    m.push(new Array(n).fill(0));
    res.push(new Array(n).fill(false));
  }

  function poner(f, c, v2b){ m[f][c] = v2b ? 1 : 0; res[f][c] = true; }

  /* Los tres cuadrados de las esquinas, con su margen. */
  [[0,0],[0,n-7],[n-7,0]].forEach(function(p){
    for(var f = -1; f <= 7; f++) for(var c = -1; c <= 7; c++){
      var ff = p[0]+f, cc = p[1]+c;
      if(ff < 0 || cc < 0 || ff >= n || cc >= n) continue;
      var borde = (f >= 0 && f <= 6 && (c === 0 || c === 6))
               || (c >= 0 && c <= 6 && (f === 0 || f === 6));
      var centro = f >= 2 && f <= 4 && c >= 2 && c <= 4;
      poner(ff, cc, borde || centro);
    }
  });

  /* Las líneas de sincronismo. */
  for(var i4 = 8; i4 < n - 8; i4++){
    poner(6, i4, i4 % 2 === 0);
    poner(i4, 6, i4 % 2 === 0);
  }

  /* Los cuadraditos de alineación. */
  var al = QR_ALINEACION[ver];
  al.forEach(function(a){
    al.forEach(function(b){
      if((a === 6 && b === 6) || (a === 6 && b === n-7) || (a === n-7 && b === 6)) return;
      for(var f2 = -2; f2 <= 2; f2++) for(var c2 = -2; c2 <= 2; c2++)
        poner(a+f2, b+c2, Math.max(Math.abs(f2), Math.abs(c2)) !== 1);
    });
  });

  poner(n-8, 8, true);                       /* módulo siempre negro */
  for(var i5 = 0; i5 < 9; i5++){             /* reservar el formato */
    if(i5 !== 6){ res[8][i5] = true; res[i5][8] = true; }
  }
  res[8][6] = true; res[6][8] = true;
  for(var i6 = 0; i6 < 8; i6++){ res[8][n-1-i6] = true; res[n-1-i6][8] = true; }
  if(ver >= 7){
    for(var f3 = 0; f3 < 6; f3++) for(var c3 = 0; c3 < 3; c3++){
      res[f3][n-11+c3] = true; res[n-11+c3][f3] = true;
    }
  }

  /* Volcar los datos en zigzag, de abajo a la derecha hacia arriba. */
  var bitsFinal = '';
  final.forEach(function(b){ bitsFinal += b.toString(2).padStart(8, '0'); });
  var idx = 0, arriba = true;
  for(var col = n - 1; col > 0; col -= 2){
    if(col === 6) col--;
    for(var paso = 0; paso < n; paso++){
      var fila = arriba ? n - 1 - paso : paso;
      for(var d2 = 0; d2 < 2; d2++){
        var cc2 = col - d2;
        if(res[fila][cc2]) continue;
        m[fila][cc2] = (idx < bitsFinal.length && bitsFinal[idx] === '1') ? 1 : 0;
        idx++;
      }
    }
    arriba = !arriba;
  }

  /* Probar las ocho máscaras y quedarse con la que menos penaliza. */
  var mejor = null, mejorP = Infinity;
  for(var mk = 0; mk < 8; mk++){
    var t = m.map(function(f4){ return f4.slice(); });
    for(var f5 = 0; f5 < n; f5++) for(var c5 = 0; c5 < n; c5++)
      if(!res[f5][c5] && QR_MASCARAS[mk](f5, c5)) t[f5][c5] ^= 1;

    var fmt = QR_FORMATO[mk];
    for(var i7 = 0; i7 < 15; i7++){
      var bit = fmt[i7] === '1' ? 1 : 0;
      if(i7 < 6) t[8][i7] = bit;
      else if(i7 === 6) t[8][7] = bit;
      else if(i7 === 7) t[8][8] = bit;
      else if(i7 === 8) t[7][8] = bit;
      else t[14 - i7][8] = bit;

      if(i7 < 8) t[n-1-i7][8] = bit;
      else t[8][n-15+i7] = bit;
    }
    if(ver >= 7){
      var vb = QR_VERSION_BITS[ver];
      for(var i8 = 0; i8 < 18; i8++){
        var b3 = vb[17-i8] === '1' ? 1 : 0;
        t[Math.floor(i8/3)][n-11+(i8%3)] = b3;
        t[n-11+(i8%3)][Math.floor(i8/3)] = b3;
      }
    }
    var p = qrPenalizacion(t, n);
    if(p < mejorP){ mejorP = p; mejor = t; }
  }
  return mejor;
}

/* Las cuatro reglas de penalización del estándar. Sirven para elegir la
   máscara que produce el dibujo más fácil de leer para una cámara. */
function qrPenalizacion(m, n){
  var p = 0, i, j, k;
  for(i = 0; i < n; i++){
    for(var dir = 0; dir < 2; dir++){
      var run = 1;
      for(j = 1; j < n; j++){
        var a = dir ? m[j][i] : m[i][j];
        var b = dir ? m[j-1][i] : m[i][j-1];
        if(a === b) run++;
        else { if(run >= 5) p += 3 + (run - 5); run = 1; }
      }
      if(run >= 5) p += 3 + (run - 5);
    }
  }
  for(i = 0; i < n-1; i++) for(j = 0; j < n-1; j++){
    var v = m[i][j];
    if(v === m[i][j+1] && v === m[i+1][j] && v === m[i+1][j+1]) p += 3;
  }
  var patron = [1,0,1,1,1,0,1,0,0,0,0];
  for(i = 0; i < n; i++) for(j = 0; j <= n - 11; j++){
    var okF = true, okC = true;
    for(k = 0; k < 11; k++){
      if(m[i][j+k] !== patron[k]) okF = false;
      if(m[j+k][i] !== patron[k]) okC = false;
    }
    if(okF) p += 40;
    if(okC) p += 40;
  }
  var negros = 0;
  for(i = 0; i < n; i++) for(j = 0; j < n; j++) negros += m[i][j];
  p += Math.floor(Math.abs(negros * 100 / (n*n) - 50) / 5) * 10;
  return p;
}

/* Dibuja el QR como SVG. El margen blanco alrededor no es decoración:
   sin él muchas cámaras no encuentran el código. */
function qrSVG(texto, opciones){
  var o = opciones || {};
  var m = qrGenerar(texto);
  if(!m) return '<p>El texto es demasiado largo para un código QR.</p>';

  var n = m.length, borde = o.borde === undefined ? 4 : o.borde;
  var total = n + borde * 2;
  var fondo = o.fondo || '#FFFFFF';
  var tinta = o.tinta || '#000000';

  var d = '';
  for(var f = 0; f < n; f++) for(var c = 0; c < n; c++)
    if(m[f][c]) d += 'M' + (c + borde) + ',' + (f + borde) + 'h1v1h-1z';

  return '<svg viewBox="0 0 ' + total + ' ' + total + '" xmlns="http://www.w3.org/2000/svg" '
       + 'style="width:100%;height:auto;display:block;shape-rendering:crispEdges" '
       + 'role="img" aria-label="Código QR">'
       + '<rect width="' + total + '" height="' + total + '" fill="' + fondo + '"/>'
       + '<path d="' + d + '" fill="' + tinta + '"/></svg>';
}

/* ══════════════════════════════════════════════════════════════════

var PAGINAS = {"agenda": {"pag": "agenda", "cuerpo": "<div class=\"hoja\">\n  <h1 class=\"tit\" id=\"tit\">Agenda</h1>\n  <p class=\"bajada\" id=\"baj\"></p>\n\n  <div class=\"pestanias\">\n    <button class=\"pest on\" data-d=\"2026-08-28\">Viernes 28</button>\n    <button class=\"pest\" data-d=\"2026-08-31\">Lunes 31</button>\n  </div>\n\n  <div class=\"tarjeta\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\" id=\"subDia\"></h2>\n      <span class=\"eti\" id=\"cuenta\"></span></div>\n    <div id=\"grilla\"></div>\n  </div>\n\n  <div class=\"tarjeta\" id=\"cajaCfg\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">Horario del estudio</h2>\n      <span class=\"eti\">Se aplica a toda la semana</span></div>\n    <div class=\"rejilla c3\">\n      <label class=\"campo\"><span class=\"eti\">Abre</span><input type=\"text\" value=\"08:30\"></label>\n      <label class=\"campo\"><span class=\"eti\">Cierra</span><input type=\"text\" value=\"12:30\"></label>\n      <label class=\"campo\"><span class=\"eti\">Minutos por turno</span><input type=\"number\" value=\"30\"></label>\n    </div>\n    <button class=\"bt hueco\" onclick=\"alert('Guardado. La grilla se rearma con estos horarios.')\">Guardar horario</button>\n  </div>\n</div>", "js": "\nvar dia = HOY, esKine = rol() === 'kine';\n\nif(!esKine){\n  document.getElementById('cajaCfg').style.display = 'none';\n  document.getElementById('tit').textContent = 'Mis turnos';\n}\n\ndocument.querySelectorAll('.pest[data-d]').forEach(function(b){\n  b.onclick = function(){\n    document.querySelectorAll('.pest[data-d]').forEach(function(x){ x.classList.remove('on'); });\n    b.classList.add('on'); dia = b.dataset.d; pintar();\n  };\n});\n\nfunction pintar(){\n  var lista = BASE.agenda[dia] || [];\n  var tomados = lista.filter(function(t){ return t.dorsal; }).length;\n  var M = ['viernes 28 de agosto','lunes 31 de agosto'];\n  document.getElementById('subDia').textContent = dia === HOY ? M[0] : M[1];\n  document.getElementById('cuenta').textContent = tomados + ' de ' + lista.length + ' ocupados';\n  document.getElementById('baj').textContent = esKine\n    ? 'Tocá un turno ocupado para abrir la ficha, o uno libre para asignarlo.'\n    : 'Tocá un horario libre para reservarlo. Te llega un aviso una hora antes.';\n\n  document.getElementById('grilla').innerHTML = lista.map(function(t, i){\n    if(!t.dorsal){\n      return '<button class=\"fila libre\" onclick=\"reservar(' + i + ')\">'\n        + '<span class=\"hh\">' + t.h + '</span>'\n        + '<span class=\"cu\"><b>' + (esKine ? 'Libre — asignar' : 'Libre — reservar') + '</b></span></button>';\n    }\n    if(!esKine && t.dorsal !== miDorsal()){\n      return '<div class=\"fila libre\" style=\"opacity:.5\"><span class=\"hh\">' + t.h + '</span>'\n        + '<span class=\"cu\"><b>Ocupado</b></span></div>';\n    }\n    var L = lesionDe(t.dorsal);\n    var mio = t.dorsal === miDorsal();\n    return '<button class=\"fila\" onclick=\"' + (esKine && L ? 'irA(\\'lesiones.html?f=' + L.id + '\\')' : 'void 0') + '\">'\n      + '<span class=\"hh\">' + t.h + '</span>'\n      + '<span class=\"cu\"><b>' + (esKine ? (t.pid ? paciente(t.pid).nombre : nombre(t.dorsal)) : 'Tu turno') + '</b>'\n      + '<small>' + t.tipo + (esKine && L ? ' · ' + L.zona.toLowerCase() : ' · con Vero') + '</small></span>'\n      + '<span class=\"pin ' + (mio && !esKine ? 'reservado' : t.estado) + '\">'\n      + (mio && !esKine ? 'tuyo' : t.estado) + '</span>'\n      + (esKine && t.estado === 'reservado'\n          ? '<button class=\"bt hueco chico\" onclick=\"event.stopPropagation();atender(dia,\\'' + t.h + '\\')\">Atender</button>'\n          : '')\n      + '</button>';\n  }).join('');\n}\n\n/* Antes esto pedía el dorsal con una ventanita del navegador. No servía:\n   los pacientes particulares no tienen dorsal, y había que acordarse el\n   número de memoria. Ahora se elige del padrón. */\nvar TURNO = null;\n\nfunction reservar(i){\n  var t = (BASE.agenda[dia] || [])[i];\n  if(!t) return;\n\n  if(!esKine){\n    var p = pacientePorDorsal(miDorsal());\n    t.pid = p ? p.id : null;\n    t.dorsal = miDorsal(); t.tipo = 'Tratamiento'; t.estado = 'reservado';\n    guardar('kine/agenda/turnos/' + dia + '/' + t.h,\n            {pid:t.pid, dorsal:t.dorsal, tipo:t.tipo, estado:'reservado'});\n    if(p) asentar(p.id, 'turno', 'Reservó turno para el ' + fechaLarga(dia) + ' a las ' + t.h + '.');\n    avisarDelTurno(p, dia, t.h);\n    pintar();\n    return;\n  }\n\n  TURNO = {i: i, hora: t.h, pid: null, tipo: 'Tratamiento'};\n  var caja = document.createElement('div');\n  caja.className = 'ayuda-fondo';\n  caja.id = 'cajaTurno';\n  caja.innerHTML =\n    '<div class=\"ayuda-caja\">'\n    + '<button class=\"cerrar\" onclick=\"cerrarTurno()\" aria-label=\"Cerrar\">&times;</button>'\n    + '<span class=\"eti\">Turno nuevo</span>'\n    + '<h2>' + t.h + '</h2>'\n    + '<p>' + (dia === HOY ? 'Viernes 28 de agosto' : 'Lunes 31 de agosto') + '</p>'\n\n    + '<label class=\"campo\"><span class=\"eti\">Quién viene</span>'\n    + '<select id=\"tPac\"><option value=\"\">Elegí un paciente</option>'\n    + BASE.pacientes.map(function(p){\n        var l = lesionDePaciente(p.id);\n        return '<option value=\"' + p.id + '\">' + p.nombre\n             + (p.dorsal ? ' (#' + p.dorsal + ')' : '')\n             + (l ? ' — ' + l.zona.toLowerCase() : '') + '</option>';\n      }).join('') + '</select></label>'\n\n    + '<label class=\"campo\"><span class=\"eti\">Qué tipo de sesión</span>'\n    + '<div class=\"pestanias\" id=\"tTipo\" style=\"margin-bottom:0\">'\n    + ['Evaluación','Tratamiento','Gimnasio','Campo'].map(function(x){\n        return '<button class=\"pest' + (x === 'Tratamiento' ? ' on' : '') + '\" data-t=\"' + x + '\">' + x + '</button>';\n      }).join('') + '</div></label>'\n\n    + '<div id=\"avisoTurno\"></div>'\n    + '<button class=\"bt ancho\" onclick=\"guardarTurno()\">Dar el turno</button>'\n    + '</div>';\n  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarTurno(); });\n  document.body.appendChild(caja);\n  document.body.style.overflow = 'hidden';\n\n  document.querySelectorAll('#tTipo .pest').forEach(function(b){\n    b.onclick = function(){\n      document.querySelectorAll('#tTipo .pest').forEach(function(x){ x.classList.remove('on'); });\n      b.classList.add('on'); TURNO.tipo = b.dataset.t;\n    };\n  });\n}\n\n/* Cuando un paciente reserva, el kinesiólogo se tiene que enterar.\n   Hasta que estén los avisos push, se le arma el mensaje de WhatsApp y\n   se le ofrece mandarlo: un toque, sin copiar y pegar nada. */\nfunction avisarDelTurno(p, fecha, hora){\n  if(!p) return;\n  var telKine = (BASE.perfil && BASE.perfil.tel) ? BASE.perfil.tel.replace(/\\D/g,'') : '';\n  var txt = 'Turno nuevo: ' + p.nombre + ' reservó para el ' + fechaLarga(fecha)\n          + ' a las ' + hora + '. Teléfono: ' + p.tel + '.';\n  var caja = document.createElement('div');\n  caja.className = 'ayuda-fondo'; caja.id = 'cajaAviso';\n  caja.innerHTML = '<div class=\"ayuda-caja\">'\n    + '<button class=\"cerrar\" onclick=\"cerrarAviso()\" aria-label=\"Cerrar\">&times;</button>'\n    + '<span class=\"eti\">Turno reservado</span>'\n    + '<h2>' + hora + ' · ' + fechaLarga(fecha) + '</h2>'\n    + '<div class=\"nota bien\">Listo. Te va a llegar un recordatorio una hora antes.</div>'\n    + '<p>Si querés, avisale al estudio ahora mismo:</p>'\n    + '<a class=\"bt ancho\" style=\"text-decoration:none;text-align:center\" target=\"_blank\" rel=\"noopener\" '\n    + 'href=\"https://wa.me/' + telKine + '?text=' + encodeURIComponent(txt) + '\">Avisar por WhatsApp</a>'\n    + '<button class=\"bt neutro ancho\" style=\"margin-top:8px\" onclick=\"cerrarAviso()\">Listo</button>'\n    + '</div>';\n  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarAviso(); });\n  document.body.appendChild(caja);\n  document.body.style.overflow = 'hidden';\n}\nfunction cerrarAviso(){\n  var c = document.getElementById('cajaAviso');\n  if(c) c.remove();\n  document.body.style.overflow = '';\n}\n\nfunction lesionDePaciente(pid){\n  for(var i=0;i<BASE.lesiones.length;i++)\n    if(BASE.lesiones[i].pid === pid && BASE.lesiones[i].estado === 'activa') return BASE.lesiones[i];\n  return null;\n}\n\nfunction cerrarTurno(){\n  var c = document.getElementById('cajaTurno');\n  if(c) c.remove();\n  document.body.style.overflow = '';\n}\n\n/* Marcar atendido descuenta el crédito y anota el cobro si paga por\n   sesión. Es el único momento en que se toca la plata: si se cobrara al\n   reservar, una cancelación a tiempo generaría una discusión. */\nfunction marcarAtendido(i){\n  var t = BASE.agenda[dia][i];\n  if(!t || !t.pid) return;\n  t.estado = 'atendido';\n  var p = paciente(t.pid), pl = planDe(p);\n  consumirCredito(t.pid);\n  if(pl.sesiones === 1 && pl.precio > 0){\n    anotarMovimiento({tipo:'ingreso', concepto:'Sesión suelta — ' + p.nombre,\n                      monto:pl.precio, pid:t.pid, categoria:'sesiones'});\n  }\n  guardar('kine/agenda/turnos/' + dia + '/' + t.h + '/estado', 'atendido');\n  pintar();\n}\nfunction marcarAusente(i){\n  var t = BASE.agenda[dia][i];\n  if(!t || !t.pid) return;\n  t.estado = 'ausente';\n  guardar('kine/agenda/turnos/' + dia + '/' + t.h + '/estado', 'ausente');\n  pintar();\n}\n\nfunction guardarTurno(){\n  var pid = document.getElementById('tPac').value;\n  if(!pid){\n    document.getElementById('avisoTurno').innerHTML =\n      '<div class=\"nota aviso\">Elegí a quién le das el turno.</div>';\n    return;\n  }\n  var p = paciente(pid), t = BASE.agenda[dia][TURNO.i];\n  t.pid = pid; t.dorsal = p.dorsal || null; t.tipo = TURNO.tipo; t.estado = 'reservado';\n  guardar('kine/agenda/turnos/' + dia + '/' + t.h,\n          {pid:pid, dorsal:t.dorsal, tipo:t.tipo, estado:'reservado'});\n  cerrarTurno();\n  pintar();\n}\npintar();\n\n\n/* Registra el sw para que el portal ande sin internet. Falla en silencio\n   si se abre con doble clic desde el disco: eso es normal. */\nif('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});\n"}, "alta": {"pag": "alta", "cuerpo": "<!-- PANTALLA PUBLICA — no lleva base.js a propósito: es pública. El que entra\n     todavía no es paciente y no tiene rol, así que no hay menú ni sesión.\n     Se llega por un enlace o un código QR pegado en el estudio. -->\n\n<div class=\"top\"><div class=\"top-in\">\n  <a class=\"marca\" href=\"index.html\"><span class=\"sig\"></span>\n  <span><b>ESTUDIO</b><span>Kinesiología del club</span></span></a>\n  <div class=\"quien\" style=\"margin-left:auto\">\n    <button class=\"ayuda-bt\" onclick=\"abrirAyuda('alta')\" title=\"Cómo funciona\">?</button>\n  </div>\n</div></div>\n\n<div class=\"hoja angosta\" id=\"todo\"></div>", "js": "\nvar F = {};\n\nfunction pintar(){\n  document.getElementById('todo').innerHTML =\n\n    '<h1 class=\"tit\">Darse de alta</h1>'\n    + '<p class=\"bajada\">Completá esto una sola vez. Después vas a poder pedir turno, '\n    + 'ver tus ejercicios y seguir tu recuperación desde el celular.</p>'\n\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Quién sos</h2></div>'\n\n    + '<label class=\"campo\"><span class=\"eti\">¿Sos del plantel del club?</span>'\n    + '<div class=\"pestanias\" id=\"tipo\" style=\"margin-bottom:0\">'\n    + '<button class=\"pest\" data-t=\"plantel\">Sí, juego en el club</button>'\n    + '<button class=\"pest\" data-t=\"particular\">No, vengo por mi cuenta</button>'\n    + '</div></label>'\n\n    + '<div id=\"camposTipo\"></div>'\n\n    + '<div style=\"display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap\">'\n    + (F.foto ? '<img src=\"' + F.foto + '\" style=\"width:86px;height:86px;border-radius:50%;'\n        + 'object-fit:cover;border:2px solid var(--acc)\">'\n        : '<div style=\"width:86px;height:86px;border-radius:50%;border:2px dashed var(--linea2);'\n        + 'background:var(--sup2);display:flex;align-items:center;justify-content:center;'\n        + 'color:var(--tinta3);font-family:var(--dat);font-size:10px\">SIN FOTO</div>')\n    + '<div style=\"flex:1;min-width:180px\">'\n    + '<input type=\"file\" id=\"f_foto\" accept=\"image/*\" capture=\"user\" style=\"display:none\" '\n    + 'onchange=\"subirFoto(this)\">'\n    + '<button class=\"bt hueco chico\" onclick=\"document.getElementById(\\'f_foto\\').click()\">'\n    + (F.foto ? 'Cambiar la foto' : 'Sacate una foto') + '</button>'\n    + '<p style=\"font-size:12.5px;color:var(--tinta3);margin-top:8px\">Es optativa. Sirve para '\n    + 'que el kinesiólogo te reconozca cuando llegás.</p></div></div>'\n\n    + '<label class=\"campo\"><span class=\"eti\">Nombre y apellido</span>'\n    + '<input type=\"text\" id=\"f_nombre\" placeholder=\"Como figura en tu documento\"></label>'\n\n    + '<div class=\"rejilla c2\">'\n    + '<label class=\"campo\"><span class=\"eti\">Documento</span>'\n    + '<input type=\"text\" id=\"f_doc\" inputmode=\"numeric\" placeholder=\"Sin puntos\"></label>'\n    + '<label class=\"campo\"><span class=\"eti\">Fecha de nacimiento</span>'\n    + '<input type=\"date\" id=\"f_nac\" onchange=\"revisarEdad()\"></label>'\n    + '</div>'\n\n    + '<div id=\"cajaTutor\"></div>'\n    + '</div>'\n\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Cómo te ubicamos</h2>'\n    + '<span class=\"eti\">Para el aviso del turno</span></div>'\n    + '<div class=\"rejilla c2\">'\n    + '<label class=\"campo\"><span class=\"eti\">Teléfono</span>'\n    + '<input type=\"text\" id=\"f_tel\" inputmode=\"tel\" placeholder=\"11 5555 0000\"></label>'\n    + '<label class=\"campo\"><span class=\"eti\">Correo</span>'\n    + '<input type=\"text\" id=\"f_mail\" inputmode=\"email\" placeholder=\"vos@mail.com\"></label>'\n    + '</div>'\n    + '<label class=\"campo\"><span class=\"eti\">¿Por qué venís? (en tus palabras)</span>'\n    + '<textarea id=\"f_motivo\" placeholder=\"Me duele el hombro cuando levanto el brazo, hace tres semanas...\"></textarea></label>'\n    + '</div>'\n\n    /* Admisión. Estos datos cambian el tratamiento: no es lo mismo un\n       dolor lumbar en alguien que pasa ocho horas sentado que en un\n       jugador de hockey. Y los antecedentes quirúrgicos pueden\n       contraindicar ejercicios enteros. */\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Tu vida y tu deporte</h2>'\n    + '<span class=\"eti\">Cambia el tratamiento</span></div>'\n    + '<div class=\"rejilla c2\">'\n    + '<label class=\"campo\"><span class=\"eti\">¿De qué trabajás?</span>'\n    + '<input type=\"text\" id=\"f_ocupacion\" placeholder=\"Contador, docente, albañil...\"></label>'\n    + '<label class=\"campo\"><span class=\"eti\">¿Qué deporte hacés?</span>'\n    + '<input type=\"text\" id=\"f_deporte\" placeholder=\"Fútbol, natación, ninguno...\"></label>'\n    + '</div>'\n    + '<label class=\"campo\"><span class=\"eti\">¿Con qué frecuencia?</span>'\n    + '<div class=\"pestanias\" id=\"frec\" style=\"margin-bottom:0\">'\n    + ['Sedentario','1 a 2 por semana','3 a 4 por semana','5 o más','Todos los días'].map(function(x){\n        return '<button class=\"pest\" data-f=\"' + x + '\">' + x + '</button>';\n      }).join('') + '</div></label>'\n    + '<label class=\"campo\"><span class=\"eti\">Cirugías o lesiones anteriores</span>'\n    + '<textarea id=\"f_antecedentes\" placeholder=\"Operación de menisco en 2019, esguinces de tobillo a repetición... Si no tuviste, poné ninguna.\"></textarea></label>'\n    + '<label class=\"campo\"><span class=\"eti\">¿Qué querés poder volver a hacer?</span>'\n    + '<textarea id=\"f_objetivos\" placeholder=\"Correr 10 kilómetros, levantar a mi hija, jugar el torneo de primavera...\"></textarea></label>'\n    + '<div class=\"nota info\" style=\"margin-bottom:0\">Esta última es la más importante. '\n    + 'Es contra lo que se va a medir si el tratamiento sirvió.</div>'\n    + '</div>'\n\n    /* El consentimiento no es un trámite: son datos de salud y sin esto\n       no se pueden guardar. Va explicado en castellano, no en jurídico. */\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Tus datos</h2></div>'\n    + '<p style=\"color:var(--tinta2);font-size:14px;margin-bottom:14px\">'\n    + 'Lo que cargues acá es información de salud y se trata como tal. '\n    + 'Lo ve el kinesiólogo que te atiende y lo ves vos. Nadie más: ni el entrenador, '\n    + 'ni los otros pacientes. Si sos del plantel, el cuerpo técnico ve solamente si '\n    + 'estás disponible para entrenar, nunca tu diagnóstico.</p>'\n    + '<label class=\"crit\"><input type=\"checkbox\" id=\"f_ok\">'\n    + '<span>Entiendo y autorizo al estudio a guardar mis datos para mi tratamiento.</span></label>'\n    + '</div>'\n\n    + '<div id=\"aviso\"></div>'\n    + '<button class=\"bt ancho\" onclick=\"enviar()\">Darme de alta</button>'\n    + '<p style=\"text-align:center;color:var(--tinta3);font-size:13px;margin-top:14px\">'\n    + '¿Ya te diste de alta antes? <a href=\"index.html\" style=\"color:var(--acc-texto)\">Entrá por acá</a></p>';\n\n  document.querySelectorAll('#frec .pest').forEach(function(b){\n    if(F.frecuencia === b.dataset.f) b.classList.add('on');\n    b.onclick = function(){\n      document.querySelectorAll('#frec .pest').forEach(function(x){ x.classList.remove('on'); });\n      b.classList.add('on'); F.frecuencia = b.dataset.f;\n    };\n  });\n  document.querySelectorAll('#tipo .pest').forEach(function(b){\n    b.onclick = function(){\n      document.querySelectorAll('#tipo .pest').forEach(function(x){ x.classList.remove('on'); });\n      b.classList.add('on'); F.tipo = b.dataset.t; pintarTipo();\n    };\n  });\n  if(F.tipo){\n    var sel = document.querySelector('#tipo .pest[data-t=' + F.tipo + ']');\n    if(sel) sel.classList.add('on');\n    pintarTipo();\n  }\n  ['nombre','doc','nac','tel','mail','motivo','ocupacion','deporte','antecedentes','objetivos'].forEach(function(k){\n    var e = document.getElementById('f_' + k);\n    if(e && F[k]) e.value = F[k];\n    if(e) e.oninput = function(){ F[k] = e.value; };\n  });\n  if(F.nac) revisarEdad();\n}\n\nfunction pintarTipo(){\n  var c = document.getElementById('camposTipo');\n  if(F.tipo === 'plantel'){\n    c.innerHTML = '<label class=\"campo\"><span class=\"eti\">Tu número de camiseta</span>'\n      + '<input type=\"number\" id=\"f_dorsal\" inputmode=\"numeric\" placeholder=\"Ej: 7\"></label>';\n    var e = document.getElementById('f_dorsal');\n    if(F.dorsal) e.value = F.dorsal;\n    e.oninput = function(){ F.dorsal = e.value; };\n  }else if(F.tipo === 'particular'){\n    c.innerHTML = '<label class=\"campo\"><span class=\"eti\">Obra social o prepaga</span>'\n      + '<input type=\"text\" id=\"f_obra\" placeholder=\"Si no tenés, poné Particular\"></label>';\n    var o = document.getElementById('f_obra');\n    if(F.obra) o.value = F.obra;\n    o.oninput = function(){ F.obra = o.value; };\n  }else{\n    c.innerHTML = '';\n  }\n}\n\n/* Si el paciente es menor, hacen falta los datos de quien lo autoriza.\n   No es opcional: un menor no puede consentir su propio tratamiento. */\nfunction revisarEdad(){\n  var e = document.getElementById('f_nac');\n  F.nac = e.value;\n  var caja = document.getElementById('cajaTutor');\n  if(F.nac && esMenor(F.nac)){\n    if(caja.innerHTML) return;\n    caja.innerHTML =\n      '<div class=\"nota info\">Sos menor de edad, así que necesitamos los datos '\n      + 'de tu mamá, tu papá o quien te acompañe.</div>'\n      + '<div class=\"rejilla c2\">'\n      + '<label class=\"campo\"><span class=\"eti\">Nombre del adulto</span>'\n      + '<input type=\"text\" id=\"f_tutor\"></label>'\n      + '<label class=\"campo\"><span class=\"eti\">Su teléfono</span>'\n      + '<input type=\"text\" id=\"f_tutortel\" inputmode=\"tel\"></label></div>'\n      + '<label class=\"campo\"><span class=\"eti\">¿Qué es tuyo?</span>'\n      + '<input type=\"text\" id=\"f_vinculo\" placeholder=\"Madre, padre, tutor...\"></label>';\n    ['tutor','tutortel','vinculo'].forEach(function(k){\n      var x = document.getElementById('f_' + k);\n      if(F[k]) x.value = F[k];\n      x.oninput = function(){ F[k] = x.value; };\n    });\n  }else{\n    caja.innerHTML = '';\n  }\n}\n\n/* Al enviar, TODO se lee del formulario y nada de la memoria.\n   Guardar en memoria depende de que el usuario tipee, y el celular\n   muchas veces autocompleta sin disparar ese aviso: el campo se ve\n   lleno en pantalla y el sistema lo cree vacío. */\nfunction leer(id){ var e = document.getElementById(id); return e ? (e.value || '').trim() : ''; }\n\n/* La foto se achica a 300 píxeles antes de guardarse. Una foto de\n   celular pesa cuatro megas; así pesa treinta kilos. */\nfunction subirFoto(input){\n  var f = input.files && input.files[0];\n  if(!f) return;\n  var lector = new FileReader();\n  lector.onload = function(ev){\n    var img = new Image();\n    img.onload = function(){\n      var esc = Math.min(1, 300 / Math.max(img.width, img.height));\n      var c = document.createElement('canvas');\n      c.width = Math.round(img.width * esc);\n      c.height = Math.round(img.height * esc);\n      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);\n      F.foto = c.toDataURL('image/jpeg', 0.8);\n      pintar();\n    };\n    img.src = ev.target.result;\n  };\n  lector.readAsDataURL(f);\n}\n\nfunction enviar(){\n  var av = document.getElementById('aviso'), falta = [];\n  F.nombre   = leer('f_nombre');\n  F.doc      = leer('f_doc');\n  F.nac      = leer('f_nac');\n  F.tel      = leer('f_tel');\n  F.motivo   = leer('f_motivo');\n  F.dorsal   = leer('f_dorsal');\n  F.obra     = leer('f_obra');\n  F.tutor    = leer('f_tutor');\n  F.tutortel = leer('f_tutortel');\n  F.vinculo  = leer('f_vinculo');\n  F.ocupacion    = leer('f_ocupacion');\n  F.deporte      = leer('f_deporte');\n  F.antecedentes = leer('f_antecedentes');\n  F.objetivos    = leer(
