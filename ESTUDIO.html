'f_objetivos');\n\n  if(!F.tipo)             falta.push('si sos del plantel o venís por tu cuenta');\n  if(F.nombre.length < 4) falta.push('tu nombre y apellido');\n  if(F.doc.length < 6)    falta.push('tu documento');\n  if(!F.nac)              falta.push('tu fecha de nacimiento');\n  if(F.tel.length < 6)    falta.push('un teléfono');\n  if(F.nac && esMenor(F.nac) && !F.tutor)\n    falta.push('el nombre del adulto responsable');\n  if(!document.getElementById('f_ok').checked)\n    falta.push('tu autorización para guardar los datos');\n\n  if(falta.length){\n    av.innerHTML = '<div class=\"nota aviso\">Falta ' + falta.join(', ') + '.</div>';\n    av.scrollIntoView({block:'center'});\n    return;\n  }\n\n  /* Mismo documento = misma persona. Evita que alguien se cargue dos veces\n     y termine con dos historias clínicas partidas al medio. */\n  var repetido = null;\n  BASE.pacientes.forEach(function(p){ if(p.doc === F.doc) repetido = p; });\n  if(repetido){\n    av.innerHTML = '<div class=\"nota info\">Ya estás en el sistema, ' + repetido.nombre.split(' ')[0]\n      + '. No hace falta que te des de alta de nuevo — '\n      + '<a href=\"index.html\" style=\"color:var(--acc-texto)\">entrá por acá</a>.</div>';\n    av.scrollIntoView({block:'center'});\n    return;\n  }\n\n  var nuevo = {\n    id: nuevoIdPaciente(),\n    tipo: F.tipo,\n    nombre: F.nombre,\n    nacimiento: F.nac,\n    doc: F.doc,\n    tel: F.tel,\n    email: leer('f_mail'),\n    motivo: F.motivo,\n    estado: 'pendiente',\n    alta: HOY,\n    ocupacion: F.ocupacion || '—',\n    deporte: F.deporte || '—',\n    frecuencia: F.frecuencia || '—',\n    antecedentes: F.antecedentes || 'No declaró.',\n    objetivos: F.objetivos || '—',\n    plan: 'sesion', creditos: 0,\n    foto: F.foto || null,\n    consentimiento: {aceptado:true, fecha:HOY}\n  };\n  if(F.tipo === 'plantel' && F.dorsal) nuevo.dorsal = +F.dorsal;\n  if(F.tipo === 'particular') nuevo.obra_social = F.obra || 'Particular';\n  if(esMenor(F.nac)) nuevo.tutor = {nombre:F.tutor, tel:F.tutortel || F.tel, vinculo:F.vinculo || '—'};\n\n  BASE.pacientes.push(nuevo);\n  guardar('kine/pacientes/' + nuevo.id, nuevo);\n\n  /* Primeros dos asientos de la historia: el alta y el consentimiento.\n     El consentimiento es un asiento propio porque la ley pide que conste\n     de forma expresa y destacada, con fecha. */\n  try{ ponerRol('jugador'); localStorage.setItem('estudio_pid', nuevo.id); }catch(e){}\n  asentar(nuevo.id, 'alta_paciente',\n          'Se dio de alta en el padrón como ' + (nuevo.tipo === 'plantel' ? 'jugador del plantel' : 'paciente particular')\n          + '. Ocupación: ' + nuevo.ocupacion + '. Deporte: ' + nuevo.deporte\n          + ' (' + nuevo.frecuencia + '). Antecedentes: ' + nuevo.antecedentes\n          + ' Motivo de consulta declarado: ' + (nuevo.motivo || 'no lo indicó')\n          + '. Objetivo del paciente: ' + nuevo.objetivos);\n  asentar(nuevo.id, 'consentimiento',\n          'Otorgó consentimiento informado para el tratamiento de sus datos de salud'\n          + (esMenor(nuevo.nac || F.nac) && nuevo.tutor\n             ? ', con autorización de ' + nuevo.tutor.nombre + ' (' + nuevo.tutor.vinculo + ')' : '')\n          + '.');\n\n  document.getElementById('todo').innerHTML =\n    '<div class=\"tarjeta\" style=\"margin-top:30px\">'\n    + '<div class=\"vacio\"><b>Listo, ' + F.nombre.split(' ')[0] + '</b>'\n    + 'Ya estás en el sistema. El kinesiólogo te va a ver en la lista y '\n    + 'podés pedir turno cuando quieras.</div>'\n    + '<a class=\"bt ancho\" href=\"agenda.html\" style=\"text-decoration:none;text-align:center\">Pedir mi primer turno</a>'\n    + '<a class=\"bt neutro ancho\" href=\"index.html\" style=\"text-decoration:none;text-align:center;margin-top:8px\">Ir al inicio</a>'\n    + '</div>';\n  scrollTo(0, 0);\n}\n\npintar();\n"}, "caja": {"pag": "caja", "cuerpo": "<div class=\"hoja\">\n  <h1 class=\"tit\">Caja</h1>\n  <p class=\"bajada\">Lo que entra y lo que sale. Las sesiones y los planes se anotan solos;\n  los gastos los cargás vos.</p>\n\n  <div class=\"rejilla c4\" style=\"margin-bottom:20px\">\n    <div class=\"dato\"><div class=\"v\" id=\"kIng\" style=\"color:var(--verde)\">—</div><div class=\"l\">Ingresos del mes</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kEgr\" style=\"color:var(--rojo)\">—</div><div class=\"l\">Egresos del mes</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kSal\">—</div><div class=\"l\">Saldo</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kAus\" style=\"color:var(--ambar)\">—</div><div class=\"l\">Ausencias</div></div>\n  </div>\n\n  <div class=\"rejilla c2\">\n    <div class=\"tarjeta\">\n      <div class=\"tarjeta-cab\"><h2 class=\"sub\">Los últimos seis meses</h2>\n        <span class=\"eti\">Verde entra · rojo sale</span></div>\n      <div class=\"barras\" id=\"barras\"></div>\n      <div class=\"barras-pie\" id=\"barrasPie\"></div>\n    </div>\n\n    <div class=\"tarjeta\">\n      <div class=\"tarjeta-cab\"><h2 class=\"sub\">Anotar un movimiento</h2></div>\n      <div class=\"pestanias\" id=\"tipoMov\" style=\"margin-bottom:12px\">\n        <button class=\"pest on\" data-t=\"egreso\">Un gasto</button>\n        <button class=\"pest\" data-t=\"ingreso\">Un cobro suelto</button>\n      </div>\n      <label class=\"campo\"><span class=\"eti\">Concepto</span>\n        <input type=\"text\" id=\"mConcepto\" placeholder=\"Alquiler, camilla, insumos...\"></label>\n      <label class=\"campo\"><span class=\"eti\">Monto</span>\n        <input type=\"number\" id=\"mMonto\" inputmode=\"numeric\" placeholder=\"0\"></label>\n      <div id=\"avisoMov\"></div>\n      <button class=\"bt ancho\" onclick=\"anotar()\">Anotar</button>\n    </div>\n  </div>\n\n  <div class=\"tarjeta\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">Planes de cada paciente</h2>\n      <span class=\"eti\">El crédito se descuenta al atender, no al reservar</span></div>\n    <div id=\"planes\"></div>\n  </div>\n\n  <div class=\"tarjeta\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">Movimientos del mes</h2>\n      <span class=\"eti\" id=\"cuentaMov\"></span></div>\n    <div id=\"lista\"></div>\n  </div>\n</div>", "js": "\nvar tipoMov = 'egreso';\n\n/* Algunos movimientos de ejemplo, para que la pantalla tenga qué mostrar. */\nif(!movimientos().length){\n  [['2026-08-02','egreso','Alquiler del local',420000,'fijos'],\n   ['2026-08-03','ingreso','Plan de 10 — Marcela Ríos',150000,'planes'],\n   ['2026-08-05','egreso','Insumos: vendas y bandas',38000,'insumos'],\n   ['2026-08-08','ingreso','Sesión suelta — Diego Sosa',18000,'sesiones'],\n   ['2026-08-12','ingreso','Plan de 10 — Camila Ferreyra',150000,'planes'],\n   ['2026-08-14','egreso','Luz y gas',56000,'fijos'],\n   ['2026-08-19','ingreso','Sesión suelta — Diego Sosa',18000,'sesiones'],\n   ['2026-08-21','ingreso','Convenio con el club — agosto',380000,'club'],\n   ['2026-08-24','egreso','Camilla nueva',290000,'equipamiento'],\n   ['2026-08-26','ingreso','Sesión suelta — Diego Sosa',18000,'sesiones']\n  ].forEach(function(m){\n    movimientos().push({id:'M'+m[0]+m[3], fecha:m[0], tipo:m[1], concepto:m[2],\n                        monto:m[3], categoria:m[4], metodo:'efectivo', pid:null});\n  });\n  /* meses anteriores, solo para el gráfico */\n  [['2026-03',980000,640000],['2026-04',1120000,690000],['2026-05',1040000,720000],\n   ['2026-06',1260000,700000],['2026-07',1180000,760000]].forEach(function(m){\n    movimientos().push({id:'H'+m[0]+'i', fecha:m[0]+'-15', tipo:'ingreso',\n                        concepto:'Cierre de mes', monto:m[1], categoria:'historico'});\n    movimientos().push({id:'H'+m[0]+'e', fecha:m[0]+'-15', tipo:'egreso',\n                        concepto:'Cierre de mes', monto:m[2], categoria:'historico'});\n  });\n}\n\ndocument.querySelectorAll('#tipoMov .pest').forEach(function(b){\n  b.onclick = function(){\n    document.querySelectorAll('#tipoMov .pest').forEach(function(x){ x.classList.remove('on'); });\n    b.classList.add('on'); tipoMov = b.dataset.t;\n  };\n});\n\nfunction anotar(){\n  var c = (document.getElementById('mConcepto').value || '').trim();\n  var m = +document.getElementById('mMonto').value;\n  if(!c || !m){\n    document.getElementById('avisoMov').innerHTML =\n      '<div class=\"nota aviso\">Poné un concepto y un monto.</div>';\n    return;\n  }\n  anotarMovimiento({tipo:tipoMov, concepto:c, monto:m});\n  document.getElementById('mConcepto').value = '';\n  document.getElementById('mMonto').value = '';\n  document.getElementById('avisoMov').innerHTML = '';\n  pintar();\n}\n\nfunction pintar(){\n  var r = resumenMes(), t = estadisticaTurnos();\n  document.getElementById('kIng').textContent = plata(r.ingresos);\n  document.getElementById('kEgr').textContent = plata(r.egresos);\n  document.getElementById('kSal').textContent = plata(r.saldo);\n  document.getElementById('kSal').style.color = r.saldo >= 0 ? 'var(--verde)' : 'var(--rojo)';\n  document.getElementById('kAus').textContent = t.porcentajeAusencia + '%';\n\n  /* gráfico de seis meses */\n  var meses = [], d = new Date(HOY);\n  for(var i = 5; i >= 0; i--){\n    var x = new Date(d.getFullYear(), d.getMonth() - i, 1);\n    meses.push(x.toISOString().slice(0, 7));\n  }\n  var datos = meses.map(function(m){ return resumenMes(m); });\n  var tope = Math.max.apply(null, datos.map(function(x){ return Math.max(x.ingresos, x.egresos); })) || 1;\n\n  document.getElementById('barras').innerHTML = datos.map(function(x){\n    return '<div style=\"display:flex;gap:3px;align-items:flex-end;height:100%\">'\n      + '<div class=\"ing\" style=\"flex:1;height:' + Math.max(2, x.ingresos/tope*100) + '%\" '\n      + 'title=\"' + plata(x.ingresos) + '\"></div>'\n      + '<div class=\"egr\" style=\"flex:1;height:' + Math.max(2, x.egresos/tope*100) + '%\" '\n      + 'title=\"' + plata(x.egresos) + '\"></div></div>';\n  }).join('');\n  var M = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];\n  document.getElementById('barrasPie').innerHTML = meses.map(function(m){\n    return '<span>' + M[+m.slice(5) - 1] + '</span>';\n  }).join('');\n\n  /* planes */\n  document.getElementById('planes').innerHTML = BASE.pacientes.map(function(p){\n    var pl = planDe(p), av = avisoCreditos(p);\n    return '<div class=\"fila\" style=\"cursor:default;flex-wrap:wrap\">'\n      + '<span class=\"hh\">' + (p.dorsal ? '#' + p.dorsal : 'P') + '</span>'\n      + '<span class=\"cu\"><b>' + p.nombre + '</b><small>' + pl.nombre\n      + (pl.precio ? ' · ' + plata(pl.precio) : '') + '</small></span>'\n      + (av ? '<span class=\"pin ' + (av.nivel === 'reserva' ? 'ausente'\n              : av.nivel === 'aviso' ? 'limitado' : 'atendido') + '\">'\n              + (p.creditos || 0) + ' sesiones</span>'\n            : '<span class=\"pin gris\">' + (pl.precio ? 'sin créditos' : 'lo cubre el club') + '</span>')\n      + '<button class=\"bt hueco chico\" onclick=\"cambiarPlan(\\'' + p.id + '\\')\">Cambiar plan</button>'\n      + '</div>';\n  }).join('');\n\n  /* movimientos */\n  var m = delMes().filter(function(x){ return x.categoria !== 'historico'; })\n                  .sort(function(a, b){ return a.fecha < b.fecha ? 1 : -1; });\n  document.getElementById('cuentaMov').textContent = m.length + ' movimientos';\n  document.getElementById('lista').innerHTML = m.length\n    ? m.map(function(x){\n        return '<div class=\"fila\" style=\"cursor:default\">'\n          + '<span class=\"hh\">' + fechaCorta(x.fecha) + '</span>'\n          + '<span class=\"cu\"><b>' + x.concepto + '</b><small>' + x.categoria + '</small></span>'\n          + '<span class=\"pin ' + (x.tipo === 'ingreso' ? 'atendido' : 'ausente') + '\">'\n          + (x.tipo === 'ingreso' ? '+' : '−') + plata(x.monto) + '</span></div>';\n      }).join('')\n    : '<div class=\"vacio\"><b>Sin movimientos este mes</b>Anotá el primero arriba.</div>';\n}\n\nfunction cambiarPlan(pid){\n  var p = paciente(pid);\n  var caja = document.createElement('div');\n  caja.className = 'ayuda-fondo'; caja.id = 'cajaPlan';\n  caja.innerHTML = '<div class=\"ayuda-caja\">'\n    + '<button class=\"cerrar\" onclick=\"cerrarPlan()\" aria-label=\"Cerrar\">&times;</button>'\n    + '<span class=\"eti\">Plan</span><h2>' + p.nombre + '</h2>'\n    + '<p>Hoy tiene: ' + planDe(p).nombre + ', con ' + (p.creditos || 0) + ' sesiones.</p>'\n    + Object.keys(PLANES).map(function(k){\n        var pl = PLANES[k];\n        return '<button class=\"fila\" onclick=\"asignar(\\'' + pid + '\\',\\'' + k + '\\')\">'\n          + '<span class=\"cu\"><b>' + pl.nombre + '</b><small>' + pl.detalle + '</small></span>'\n          + '<span class=\"pin ' + (k === p.plan ? 'reservado' : 'gris') + '\">'\n          + (pl.precio ? plata(pl.precio) : 'sin cargo') + '</span></button>';\n      }).join('')\n    + '<div class=\"nota info\" style=\"margin-top:14px\">Al asignar un plan con precio se anota '\n    + 'el cobro en la caja automáticamente.</div></div>';\n  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarPlan(); });\n  document.body.appendChild(caja);\n  document.body.style.overflow = 'hidden';\n}\nfunction cerrarPlan(){\n  var c = document.getElementById('cajaPlan');\n  if(c) c.remove();\n  document.body.style.overflow = '';\n}\nfunction asignar(pid, clave){\n  venderPlan(pid, clave);\n  cerrarPlan();\n  pintar();\n}\n\npintar();\n"}, "cartel": {"pag": "cartel", "cuerpo": "<div class=\"hoja angosta\">\n  <div class=\"no-imprimir\">\n    <h1 class=\"tit\">El cartel del estudio</h1>\n    <p class=\"bajada\">Imprimilo y pegalo en la recepción, o mandá el enlace por WhatsApp.\n    El paciente escanea, se carga solo, y aparece en tu padrón.</p>\n\n    <div class=\"tarjeta\">\n      <div class=\"tarjeta-cab\"><h2 class=\"sub\">Repartir</h2></div>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <button class=\"bt\" onclick=\"window.print()\">Imprimir el cartel</button>\n        <button class=\"bt hueco\" onclick=\"compartir()\">Compartir el enlace</button>\n        <button class=\"bt hueco\" onclick=\"porWhatsapp()\">Mandar por WhatsApp</button>\n        <button class=\"bt neutro\" onclick=\"bajarQR()\">Bajar el QR</button>\n      </div>\n      <div class=\"nota bien\" id=\"hecho\" style=\"display:none;margin-top:12px\"></div>\n    </div>\n  </div>\n\n  <div class=\"cartel\" id=\"cartel\"></div>\n\n  <p class=\"no-imprimir\" style=\"text-align:center;color:var(--tinta3);font-size:13px;margin-top:16px\">\n    El código se genera acá adentro, sin mandarle la dirección a ningún servicio de afuera.\n  </p>\n</div>", "js": "\nfunction enlaceAlta(){\n  var u = location.href.split('?')[0].replace(/[^\\/]*$/, 'alta.html');\n  return u.indexOf('file:') === 0 ? 'https://estudio-kine.vercel.app/alta.html' : u;\n}\nvar URL_ALTA = enlaceAlta();\n\ndocument.getElementById('cartel').innerHTML =\n  '<h2>' + (BASE.club || 'Estudio de kinesiología') + '</h2>'\n  + '<p class=\"lema\">Si venís a tratarte, cargá tus datos una sola vez desde el celular.</p>'\n  + '<div class=\"qr\">' + qrSVG(URL_ALTA, {tinta:'#000000', fondo:'#FFFFFF'}) + '</div>'\n  + '<p class=\"dir\">' + URL_ALTA + '</p>'\n  + '<div class=\"pasos\">'\n  + '<div><b>1.</b><span>Apuntá la cámara del celular al código.</span></div>'\n  + '<div><b>2.</b><span>Completá tus datos. Son dos minutos, una sola vez.</span></div>'\n  + '<div><b>3.</b><span>Listo: pedís turno y ves tus ejercicios desde el celular.</span></div>'\n  + '</div>'\n  + '<p class=\"pie\">Tus datos son información de salud. Los ve el kinesiólogo que te atiende '\n  + 'y los ves vos. Nadie más.</p>';\n\nfunction avisar(t){\n  var e = document.getElementById('hecho');\n  e.textContent = t; e.style.display = 'block';\n}\n\n/* En el celular abre el menú de compartir del sistema; en la computadora\n   no existe, así que copia al portapapeles. */\nfunction compartir(){\n  var datos = {title:'Estudio de kinesiología',\n               text:'Cargá tus datos para atenderte en el estudio:', url:URL_ALTA};\n  if(navigator.share){\n    navigator.share(datos).catch(function(){});\n  }else if(navigator.clipboard){\n    navigator.clipboard.writeText(URL_ALTA);\n    avisar('Enlace copiado. Pegalo donde quieras.');\n  }else{\n    avisar(URL_ALTA);\n  }\n}\n\nfunction porWhatsapp(){\n  var t = 'Hola. Para atenderte en el estudio, cargá tus datos acá una sola vez: ' + URL_ALTA;\n  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');\n}\n\n/* Baja el QR como imagen suelta, para meterlo en un folleto o un flyer. */\nfunction bajarQR(){\n  var svg = document.querySelector('#cartel .qr svg').cloneNode(true);\n  svg.setAttribute('width', 1000); svg.setAttribute('height', 1000);\n  var img = new Image();\n  img.onload = function(){\n    var c = document.createElement('canvas');\n    c.width = 1000; c.height = 1000;\n    var x = c.getContext('2d');\n    x.fillStyle = '#fff'; x.fillRect(0, 0, 1000, 1000);\n    x.drawImage(img, 0, 0);\n    var a = document.createElement('a');\n    a.href = c.toDataURL('image/png');\n    a.download = 'qr-alta-estudio.png';\n    a.click();\n    avisar('Bajado como qr-alta-estudio.png');\n  };\n  img.src = 'data:image/svg+xml;base64,'\n          + btoa(unescape(encodeURIComponent(new XMLSerializer().serializeToString(svg))));\n}\n"}, "diario": {"pag": "diario", "cuerpo": "<div class=\"hoja angosta\">\n  <h1 class=\"tit\">Cómo estás hoy</h1>\n  <p class=\"bajada\">Cinco preguntas, medio minuto. Se completa <b>después</b> de entrenar,\n  no antes. Es la señal más temprana que tiene el kinesiólogo: si el dolor sube tres días\n  seguidos lo ve antes de que se lo cuentes.</p>\n\n  <div class=\"tarjeta\" id=\"preguntas\"></div>\n\n  <button class=\"bt ancho\" onclick=\"enviar()\">Guardar</button>\n  <div class=\"nota bien\" id=\"listo\" style=\"display:none;margin-top:12px\">\n    Guardado. Gracias — con esto se ajusta tu carga de mañana.</div>\n\n  <div class=\"tarjeta\" style=\"margin-top:20px\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">Tus últimos días</h2>\n      <span class=\"eti\">1 mal · 5 muy bien</span></div>\n    <div id=\"historial\"></div>\n  </div>\n</div>", "js": "\n/* Las cinco métricas son las del índice de Hooper, las mismas que ya usa la app\n   del club. Si los dos sistemas usan las mismas cinco, el día que se quieran\n   cruzar los datos hablan el mismo idioma. */\nvar PREGUNTAS = [\n  {id:'sueno',  t:'Cómo dormiste',        ext:['Malísimo','Regular','Normal','Bien','Muy bien']},\n  {id:'fatiga', t:'Qué tan cansado estás', ext:['Agotado','Bastante','Normal','Descansado','Como nuevo']},\n  {id:'dolor',  t:'Dolor muscular',        ext:['Mucho','Bastante','Algo','Poco','Nada']},\n  {id:'animo',  t:'Cómo andás de ánimo',   ext:['Bajón','Flojo','Normal','Bien','Muy bien']},\n  {id:'estres', t:'Nivel de estrés',       ext:['Altísimo','Alto','Normal','Bajo','Nada']}\n];\nvar HISTORIAL = [\n  {f:'2026-08-27', v:3.6}, {f:'2026-08-26', v:3.2}, {f:'2026-08-25', v:2.8},\n  {f:'2026-08-24', v:3.0}, {f:'2026-08-23', v:3.8}\n];\nvar resp = {};\n\ndocument.getElementById('preguntas').innerHTML = PREGUNTAS.map(function(p){\n  return '<label class=\"campo\"><span class=\"eti\">' + p.t + '</span>'\n    + '<div class=\"escala palabras\" id=\"e_' + p.id + '\">'\n    + p.ext.map(function(x, i){\n        return '<button type=\"button\" data-v=\"' + (i+1) + '\">'\n             + x + '</button>';\n      }).join('')\n    + '</div></label>';\n}).join('');\n\nPREGUNTAS.forEach(function(p){\n  var caja = document.getElementById('e_' + p.id);\n  caja.querySelectorAll('button').forEach(function(b){\n    b.onclick = function(){\n      caja.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });\n      b.classList.add('on'); resp[p.id] = +b.dataset.v;\n    };\n  });\n});\n\ndocument.getElementById('historial').innerHTML = HISTORIAL.map(function(h){\n  var col = h.v >= 3.5 ? 'atendido' : (h.v >= 3 ? 'reservado' : 'ausente');\n  return '<div class=\"fila\" style=\"cursor:default\"><span class=\"hh\">' + fechaCorta(h.f) + '</span>'\n    + '<span class=\"cu\"><b>' + (h.v >= 3.5 ? 'Bien' : h.v >= 3 ? 'Normal' : 'Flojo') + '</b></span>'\n    + '<span class=\"pin ' + col + '\">' + h.v.toFixed(1) + '</span></div>';\n}).join('');\n\nfunction enviar(){\n  if(Object.keys(resp).length < 5){ alert('Contestá las cinco antes de guardar.'); return; }\n  guardar('kine/wellness/' + miDorsal() + '/' + HOY, resp);\n  document.getElementById('listo').style.display = 'block';\n}\n\n\n/* Registra el sw para que el portal ande sin internet. Falla en silencio\n   si se abre con doble clic desde el disco: eso es normal. */\nif('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});\n"}, "ejercicios": {"pag": "ejercicios", "cuerpo": "<div class=\"hoja\">\n  <h1 class=\"tit\">Biblioteca del estudio</h1>\n  <p class=\"bajada\">Los circuitos que se dibujan en el pizarrón y los ejercicios sueltos con su\n  video. Se filma una vez y se reusa en cada programa.</p>\n\n  <div class=\"pestanias\">\n    <button class=\"pest on\" data-f=\"todos\">Todos</button>\n    <button class=\"pest\" data-f=\"Tobillo\">Tobillo</button>\n    <button class=\"pest\" data-f=\"Rodilla\">Rodilla</button>\n    <button class=\"pest\" data-f=\"Hombro\">Hombro</button>\n    <button class=\"pest\" data-f=\"Lumbar\">Lumbar</button>\n  </div>\n\n  <div class=\"tarjeta\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">Circuitos en cancha</h2>\n      <a class=\"eti\" href=\"pizarron.html\" style=\"text-decoration:none\">Dibujar uno nuevo →</a></div>\n    <div class=\"ejs\" id=\"circuitos\"></div>\n  </div>\n\n  <div class=\"tarjeta\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">Ejercicios sueltos</h2>\n      <span class=\"eti\" id=\"cuenta\"></span></div>\n    <div class=\"ejs\" id=\"sueltos\"></div>\n  </div>\n</div>", "js": "\nvar SUELTOS = [\n  {n:'Movilidad de tobillo con banda', z:'Tobillo', f:2, lugar:'gym', video:true},\n  {n:'Eversión con banda',             z:'Tobillo', f:2, lugar:'gym', video:true},\n  {n:'Elevación de talones sentado',   z:'Tobillo', f:2, lugar:'gym', video:false},\n  {n:'Apoyo en un pie',                z:'Tobillo', f:2, lugar:'gym', video:true},\n  {n:'Saltos con aterrizaje',          z:'Rodilla', f:3, lugar:'cancha', video:true},\n  {n:'Sentadilla búlgara',             z:'Rodilla', f:3, lugar:'gym', video:true},\n  {n:'Nórdico de isquiotibiales',      z:'Rodilla', f:3, lugar:'gym', video:true},\n  {n:'Rotación externa con banda',     z:'Hombro',  f:3, lugar:'gym', video:true},\n  {n:'Remo con banda',                 z:'Hombro',  f:2, lugar:'gym', video:false},\n  {n:'Elevación en Y boca abajo',      z:'Hombro',  f:3, lugar:'gym', video:true},\n  {n:'Puente de glúteo',               z:'Lumbar',  f:2, lugar:'gym', video:true},\n  {n:'Plancha lateral',                z:'Lumbar',  f:3, lugar:'gym', video:false},\n  {n:'Bird dog',                       z:'Lumbar',  f:2, lugar:'gym', video:true}\n];\nvar filtro = 'todos';\n\ndocument.querySelectorAll('.pest[data-f]').forEach(function(b){\n  b.onclick = function(){\n    document.querySelectorAll('.pest[data-f]').forEach(function(x){ x.classList.remove('on'); });\n    b.classList.add('on'); filtro = b.dataset.f; pintar();\n  };\n});\n\nfunction tarjeta(e){\n  return '<button class=\"ej\" onclick=\"verSuelto(\\'' + e.n.replace(/'/g,\"\") + '\\')\">'\n    + '<div class=\"mini ' + (e.lugar === 'gym' ? 'gym' : '') + '\">'\n    + '<span>' + (e.video ? 'Con video' : 'Sin video') + '</span></div>'\n    + '<div class=\"cu\"><b>' + e.n + '</b>'\n    + '<small class=\"mono\">' + e.z.toUpperCase() + ' · DESDE FASE ' + e.f + '</small></div></button>';\n}\n\n/* Un video de ejemplo para los que lo tienen cargado. En producción\n   el enlace sale de kine/ejercicios/<id>/video. */\nvar VIDEO_DEMO = 'https://www.youtube.com/watch?v=IODxDxX7oi4';\nfunction verSuelto(nom){\n  var e = null;\n  SUELTOS.forEach(function(x){ if(x.n.replace(/'/g,\"\") === nom) e = x; });\n  if(!e) return;\n  abrirVideo(e.n, e.video ? VIDEO_DEMO : null,\n             e.z + ' · desde fase ' + e.f + '. Se suma al programa desde la ficha del paciente.');\n}\nfunction pintar(){\n  var c = BASE.ejercicios.filter(function(e){ return filtro === 'todos' || e.zona === filtro; });\n  document.getElementById('circuitos').innerHTML = c.length\n    ? c.map(function(e){\n        return '<button class=\"ej\" onclick=\"irA(\\'pizarron.html\\')\">'\n          + '<div class=\"mini\"><span>4 postas</span></div>'\n          + '<div class=\"cu\"><b>' + e.nombre + '</b>'\n          + '<small class=\"mono\">' + e.zona.toUpperCase() + ' · FASE ' + e.fase + '</small></div></button>';\n      }).join('')\n    : '<div class=\"vacio\" style=\"grid-column:1/-1\"><b>Sin circuitos para esa zona</b>'\n      + 'Dibujá uno en el pizarrón y queda guardado acá.</div>';\n\n  var s = SUELTOS.filter(function(e){ return filtro === 'todos' || e.z === filtro; });\n  document.getElementById('sueltos').innerHTML = s.map(tarjeta).join('');\n  document.getElementById('cuenta').textContent = s.length + ' ejercicios · '\n    + s.filter(function(e){ return e.video; }).length + ' con video';\n}\npintar();\n\n\n/* Registra el sw para que el portal ande sin internet. Falla en silencio\n   si se abre con doble clic desde el disco: eso es normal. */\nif('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});\n"}, "historia": {"pag": "historia", "cuerpo": "<div class=\"hoja angosta\" id=\"todo\"></div>", "js": "\nvar pid = PARAM('p') || (rol() === 'kine' ? null : miPid());\n\n/* Mirar una historia clínica ya es un acceso, y queda registrado. */\nif(pid) registrarAcceso(pid, 'lectura de historia clínica');\n\nfunction pintar(){\n  var caja = document.getElementById('todo');\n\n  if(!pid){\n    caja.innerHTML = '<h1 class=\"tit\">Historia clínica</h1>'\n      + '<p class=\"bajada\">Elegí un paciente para ver su historia completa.</p>'\n      + '<div class=\"tarjeta\">' + BASE.pacientes.map(function(p){\n          return '<button class=\"fila\" onclick=\"irA(\\'historia.html?p=' + p.id + '\\')\">'\n            + '<span class=\"hh\">' + (p.dorsal ? '#' + p.dorsal : 'P') + '</span>'\n            + '<span class=\"cu\"><b>' + p.nombre + '</b><small>'\n            + historiaDe(p.id).length + ' asientos</small></span></button>';\n        }).join('') + '</div>';\n    return;\n  }\n\n  var p = paciente(pid);\n  if(!p){ caja.innerHTML = '<div class=\"vacio\"><b>No existe ese paciente</b></div>'; return; }\n\n  var h = historiaDe(pid);\n  var v = verificarHistoria(pid);\n  var acc = accesosDe(pid);\n  var esKine = rol() === 'kine';\n\n  caja.innerHTML =\n\n    '<h1 class=\"tit\">Historia clínica</h1>'\n    + '<p class=\"bajada\">' + p.nombre + ' · documento ' + p.doc\n    + ' · nacido el ' + fechaLarga(p.nacimiento) + '</p>'\n\n    + '<div class=\"no-imprimir\" style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px\">'\n    + '<button class=\"bt\" onclick=\"window.print()\">Descargar en PDF</button>'\n    + (esKine ? '<button class=\"bt hueco\" onclick=\"agregarNota()\">Agregar una nota</button>' : '')\n    + (esKine ? '<button class=\"bt neutro\" onclick=\"irA(\\'historia.html\\')\">Otro paciente</button>' : '')\n    + '</div>'\n\n    /* La verificación de integridad es lo que convierte esto en un\n       documento defendible y no en una lista de textos. */\n    + (v.ok\n        ? '<div class=\"nota bien\"><b>Historia íntegra.</b> ' + v.asientos + ' asientos correlativos, '\n          + 'encadenados y sin modificaciones. Cada uno guarda la huella del anterior.</div>'\n        : '<div class=\"nota reserva\"><b>Atención:</b> ' + v.motivo\n          + ' Esta historia fue alterada después de escrita.</div>')\n\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Datos del paciente</h2></div>'\n    + '<div class=\"rejilla c2\">'\n    + dato('Documento', p.doc)\n    + dato('Fecha de nacimiento', fechaLarga(p.nacimiento) + ' (' + edad(p.nacimiento) + ' años)')\n    + dato('Teléfono', p.tel)\n    + dato('Correo', p.email || '—')\n    + dato('Condición', p.tipo === 'plantel' ? 'Plantel del club, camiseta ' + (p.dorsal || '?')\n                                             : (p.obra_social || 'Particular'))\n    + dato('En el padrón desde', fechaLarga(p.alta))\n    + '</div>'\n    + '</div>'\n\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Admisión</h2></div>'\n    + '<div class=\"rejilla c2\">'\n    + dato('Ocupación', p.ocupacion || '—')\n    + dato('Deporte', (p.deporte || '—') + (p.frecuencia ? ' · ' + p.frecuencia : ''))\n    + '</div>'\n    + '<label class=\"campo\"><span class=\"eti\">Motivo de consulta</span>'\n    + '<p style=\"color:var(--tinta2)\">' + (p.motivo || '—') + '</p></label>'\n    + '<label class=\"campo\"><span class=\"eti\">Antecedentes: cirugías y lesiones previas</span>'\n    + '<p style=\"color:var(--tinta2)\">' + (p.antecedentes || 'No declaró.') + '</p></label>'\n    + '<label class=\"campo\" style=\"margin-bottom:0\"><span class=\"eti\">Objetivo del paciente</span>'\n    + '<p style=\"color:var(--tinta2)\">' + (p.objetivos || '—') + '</p></label>'\n    + '</div>'\n\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Plan y sesiones</h2></div>'\n    + '<div class=\"rejilla c2\">'\n    + dato('Plan', planDe(p).nombre)\n    + dato('Sesiones que le quedan', (p.creditos || 0) + '')\n    + '</div>'\n    + (p.tutor ? '<div class=\"nota info\">Menor de edad. Autoriza ' + p.tutor.nombre\n        + ' (' + p.tutor.vinculo + '), teléfono ' + p.tutor.tel + '.</div>' : '')\n    + (p.consentimiento && p.consentimiento.aceptado\n        ? '<div class=\"nota bien\" style=\"margin-bottom:0\">Consentimiento otorgado el '\n          + fechaCorta(p.consentimiento.fecha) + '.'\n          + (esKine ? '' : ' <a href=\"#\" onclick=\"revocar();return false\" style=\"color:inherit;'\n            + 'text-decoration:underline\">Revocarlo</a>')\n          + '</div>'\n        : '<div class=\"nota aviso\" style=\"margin-bottom:0\">Sin consentimiento vigente. '\n          + 'No se pueden registrar datos clínicos nuevos.</div>')\n    + '</div>'\n\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Evolución</h2>'\n    + '<span class=\"eti\">' + h.length + ' asientos</span></div>'\n    + (h.length\n        ? h.slice().reverse().map(asientoHTML).join('')\n        : '<div class=\"vacio\"><b>Sin asientos</b>Todavía no se registró ninguna actuación.</div>')\n    + '</div>'\n\n    + (esKine\n        ? '<div class=\"tarjeta no-imprimir\">'\n          + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Quién vio esta historia</h2>'\n          + '<span class=\"eti\">' + acc.length + ' accesos</span></div>'\n          + (acc.length\n              ? acc.slice().reverse().slice(0, 20).map(function(a){\n                  return '<div class=\"fila\" style=\"cursor:default\"><span class=\"hh\">'\n                    + a.sello.slice(11,16) + '</span>'\n                    + '<span class=\"cu\"><b>' + a.quien + '</b><small>' + a.que + '</small></span>'\n                    + '<span class=\"pin gris\">' + fechaCorta(a.sello.slice(0,10)) + '</span></div>';\n                }).join('')\n              : '<div class=\"vacio\">Sin accesos registrados.</div>')\n          + '</div>'\n        : '')\n\n    + '<p style=\"font-size:12px;color:var(--tinta3);margin-top:20px;text-align:center\">'\n    + 'Documento emitido el ' + fechaLarga(HOY) + '. El paciente es el titular de su historia '\n    + 'clínica y puede pedir copia en cualquier momento (Ley 26.529, artículo 14).</p>';\n}\n\nfunction asientoHTML(a){\n  return '<div class=\"asiento' + (a.rectifica ? ' rect' : '') + '\">'\n    + '<div class=\"asiento-cab\"><span class=\"folio\">' + a.n + '</span>'\n    + '<b>' + tituloAsiento(a) + '</b>'\n    + '<span class=\"cuando\">' + fechaLarga(a.fecha) + ' · ' + a.hora + ' · ' + a.autor + '</span></div>'\n    + (a.rectifica ? '<div class=\"nota aviso\" style=\"margin:4px 0 6px;padding:7px 11px;font-size:13px\">'\n        + 'Rectifica el asiento ' + a.rectifica + '. El original no se borra.</div>' : '')\n    + '<div class=\"cuerpo\">' + a.contenido + '</div>'\n    + '<div class=\"huella\">huella ' + a.huella.slice(0, 32) + '…</div>'\n    + '</div>';\n}\n\nfunction dato(l, v){\n  return '<div style=\"margin-bottom:12px\"><span class=\"eti\">' + l + '</span>'\n       + '<div class=\"mono\" style=\"font-size:15px;margin-top:3px\">' + v + '</div></div>';\n}\n\nfunction agregarNota(){\n  var t = prompt('¿Qué querés dejar asentado?');\n  if(!t || !t.trim()) return;\n  asentar(pid, 'nota', t.trim());\n  pintar();\n}\n\n/* El consentimiento es revocable por ley. Revocarlo no borra la historia\n   (que hay que conservar), pero corta el registro de datos nuevos. */\nfunction revocar(){\n  if(!confirm('Al revocar el consentimiento el estudio deja de registrar datos nuevos '\n    + 'sobre tu tratamiento. La historia ya escrita se conserva, porque la ley obliga a '\n    + 'guardarla. ¿Confirmás?')) return;\n  var p = paciente(pid);\n  p.consentimiento = {aceptado:false, fecha:HOY, revocado:HOY};\n  guardar('kine/pacientes/' + pid + '/consentimiento', p.consentimiento);\n  asentar(pid, 'revocacion', 'El paciente revocó el consentimiento para el tratamiento de sus datos.');\n  pintar();\n}\n\npintar();\n"}, "inicio": {"pag": "inicio", "cuerpo": "<div class=\"hoja angosta\">\n\n  <h1 class=\"tit\">El estudio, en un solo lugar</h1>\n  <p class=\"bajada\">Turnos, fichas de lesión, circuitos de readaptación y el programa de cada\n  jugador. El kinesiólogo carga una vez; el jugador ve lo suyo desde el celular.</p>\n\n  <div class=\"rejilla c3\" style=\"margin-bottom:26px\">\n    <div class=\"dato\"><div class=\"v\" id=\"dOk\">—</div><div class=\"l\">Disponibles</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"dLim\" style=\"color:var(--ambar)\">—</div><div class=\"l\">Limitados</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"dBaja\" style=\"color:var(--rojo)\">—</div><div class=\"l\">De baja</div></div>\n  </div>\n\n  <div class=\"tarjeta\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">Entrar</h2>\n      <span class=\"eti\">Elegí cómo mirar</span></div>\n\n    <button class=\"fila\" onclick=\"entrar('kine')\">\n      <span class=\"hh\">▤</span>\n      <span class=\"cu\"><b>Soy el kinesiólogo</b>\n        <small>Agenda del día, fichas, pizarrón de circuitos y biblioteca.</small></span>\n      <span class=\"pin reservado\">Panel</span>\n    </button>\n\n    <button class=\"fila\" onclick=\"entrar('jugador')\">\n      <span class=\"hh\">◉</span>\n      <span class=\"cu\"><b>Estoy lesionado</b>\n        <small>Mi fase, mi turno, mis ejercicios de hoy y cómo me siento.</small></span>\n      <span class=\"pin gris\">Mi vista</span>\n    </button>\n\n    <a class=\"fila\" href=\"alta.html\" style=\"text-decoration:none;color:inherit\">\n      <span class=\"hh\">+</span>\n      <span class=\"cu\"><b>Es mi primera vez</b>\n        <small>Darme de alta. Dos minutos, una sola vez.</small></span>\n      <span class=\"pin limitado\">Alta</span>\n    </a>\n\n    <label class=\"campo\" style=\"margin-top:16px\">\n      <span class=\"eti\">Si entrás como jugador, ¿cuál sos?</span>\n      <select id=\"quien\"></select>\n    </label>\n\n    <p style=\"font-size:13px;color:var(--tinta2)\">\n      Esta pantalla existe para probar las dos vistas sin crear cuentas. En el portal\n      publicado el rol viene de la cuenta y no se puede elegir.\n    </p>\n  </div>\n\n  <div class=\"tarjeta\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">Quién ve qué</h2></div>\n    <p style=\"font-size:14px;color:var(--tinta2);margin-bottom:14px\">\n      El diagnóstico es un dato de salud y vive separado de la disponibilidad. El cuerpo\n      técnico ve si un jugador está, no qué tiene.</p>\n    <div class=\"fila\" style=\"cursor:default\">\n      <span class=\"cu\"><b>Kinesiólogo</b><small>Todo: fichas, sesiones, agenda, programas.</small></span></div>\n    <div class=\"fila\" style=\"cursor:default\">\n      <span class=\"cu\"><b>Jugador</b><small>Su ficha, su turno, su programa. Nada de los demás.</small></span></div>\n    <div class=\"fila\" style=\"cursor:default\">\n      <span class=\"cu\"><b>Cuerpo técnico</b><small>Solo el semáforo de disponibilidad y la fecha estimada.</small></span></div>\n  </div>\n\n</div>", "js": "\n/* contadores */\nvar c = {ok:0, limitado:0, baja:0};\nBASE.plantel.forEach(function(j){ c[estadoDe(j.d).estado]++; });\ndocument.getElementById('dOk').textContent   = c.ok;\ndocument.getElementById('dLim').textContent  = c.limitado;\ndocument.getElementById('dBaja').textContent = c.baja;\n\n/* quién */\ndocument.getElementById('quien').innerHTML = BASE.plantel.map(function(j){\n  var e = estadoDe(j.d);\n  var t = e.estado === 'ok' ? 'sin lesión' : e.motivo;\n  return '<option value=\"' + j.d + '\"' + (j.d === miDorsal() ? ' selected' : '') + '>'\n       + j.d + ' · ' + j.n + ' — ' + t + '</option>';\n}).join('');\n\nfunction entrar(r){\n  ponerRol(r);\n  if(r === 'jugador'){\n    ponerDorsal(+document.getElementById('quien').value);\n    irA('mi.html');\n  }else{\n    irA('panel.html');\n  }\n}\n\n\n/* Registra el sw para que el portal ande sin internet. Falla en silencio\n   si se abre con doble clic desde el disco: eso es normal. */\nif('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});\n"}, "ficha": {"pag": "ficha", "cuerpo": "<div class=\"hoja\">\n  <h1 class=\"tit\" id=\"titulo\">Lesiones</h1>\n  <p class=\"bajada\" id=\"bajada\">Cada ficha avanza por criterios, no por calendario.</p>\n\n  <div id=\"lista\"></div>\n  <div id=\"ficha\"></div>\n</div>", "js": "\nvar abierta = PARAM('f');\nvar ALTA_DADA = null;\n\nfunction pintar(){\n  var lista = document.getElementById('lista'), ficha = document.getElementById('ficha');\n\n  if(!abierta){\n    document.getElementById('titulo').textContent = 'Lesiones';\n    document.getElementById('bajada').textContent =\n      'Tres en tratamiento. Cada ficha avanza por criterios cumplidos, no por días transcurridos.';\n    ficha.innerHTML = '';\n    var activas = BASE.lesiones.filter(function(L){ return L.estado === 'activa'; });\n    lista.innerHTML = (ALTA_DADA\n        ? '<div class=\"nota bien\"><b>' + ALTA_DADA + '</b> recibió el alta. '\n          + 'Ya figura disponible en el parte médico y su ficha pasó al historial.</div>'\n        : '')\n      + '<div class=\"tarjeta\">' + activas.map(function(L){\n      var listos = criteriosListos(L);\n      return '<button class=\"fila\" style=\"align-items:flex-start\" onclick=\"abrir(\\'' + L.id + '\\')\">'\n        + '<span class=\"hh\">' + (L.dorsal ? '#' + L.dorsal : 'P') + '</span>'\n        + '<span class=\"cu\"><b>' + nombrePaciente(L) + ' — ' + L.zona + ' ' + L.lado + '</b>'\n        + '<small>' + L.diagnostico + '</small>' + pista(L.fase, false) + '</span>'\n        + '<span class=\"pin reservado\">' + listos + '/' + L.criterios.length + '</span></button>';\n    }).join('') + '</div>';\n    return;\n  }\n\n  var L = lesionPorId(abierta);\n  if(!L){ abierta = null; return pintar(); }\n  lista.innerHTML = '<button class=\"bt neutro chico\" style=\"margin-bottom:16px\" onclick=\"abrir(null)\">← Todas las lesiones</button>';\n\n  document.getElementById('titulo').textContent = nombrePaciente(L) + ' · ' + L.zona.toLowerCase() + ' ' + L.lado;\n  document.getElementById('bajada').textContent = L.diagnostico + '. Lesionado el ' + fechaCorta(L.fecha) + '.';\n\n  var sigue  = Math.min(L.fase + 1, 5);\n  var faltanC = L.criterios.length - criteriosListos(L);\n\n  ficha.innerHTML =\n\n    /* estado */\n    '<div class=\"tarjeta\">'\n    + '<div class=\"rejilla c4\" style=\"margin-bottom:18px\">'\n    + '<div class=\"dato\"><div class=\"v\">' + dias(L.fecha) + '</div><div class=\"l\">Días de baja</div></div>'\n    + '<div class=\"dato\"><div class=\"v\" style=\"color:var(--azul)\">' + L.fase + '</div><div class=\"l\">Fase actual</div></div>'\n    + '<div class=\"dato\"><div class=\"v\">' + faltan(L.alta) + '</div><div class=\"l\">Días para el alta</div></div>'\n    + '<div class=\"dato\"><div class=\"v\">' + L.sesiones.length + '</div><div class=\"l\">Sesiones</div></div>'\n    + '</div>'\n    + pista(L.fase)\n    + '<p style=\"font-size:14px;color:var(--tinta2);margin-top:14px\">' + FASES[L.fase-1].d + '</p>'\n    + '</div>'\n\n    /* criterios */\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Para pasar a fase ' + sigue + ' — ' + FASES[sigue-1].t + '</h2></div>'\n    + (faltanC\n        ? '<div class=\"nota aviso\">Falta' + (faltanC > 1 ? 'n ' + faltanC + ' criterios' : ' un criterio') + '. Hasta que estén, no avanza.</div>'\n        : '<div class=\"nota bien\">Todos los criterios cumplidos. Se puede avanzar.</div>')\n    + L.criterios.map(function(c, i){\n        return '<label class=\"crit ' + (c.ok ? '' : 'falta') + '\">'\n          + '<input type=\"checkbox\" ' + (c.ok ? 'checked' : '') + ' onchange=\"tildar(' + i + ',this.checked)\">'\n          + '<span>' + c.t + '</span></label>';\n      }).join('')\n    + '<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:16px\">'\n    + '<button class=\"bt\" ' + (faltanC ? 'disabled' : '') + ' onclick=\"avanzar()\">Pasar a fase ' + sigue + '</button>'\n    + '<a class=\"bt neutro\" href=\"historia.html?p=' + L.pid + '\" style=\"text-decoration:none\">Historia clínica</a>'\n    + '</div></div>'\n\n    /* mecanismo */\n    + '<div class=\"tarjeta\"><div class=\"tarjeta-cab\"><h2 class=\"sub\">Cómo se lesionó</h2></div>'\n    + '<p style=\"color:var(--tinta2)\">' + L.mecanismo + '</p></div>'\n\n    /* programa */\n    + '<div class=\"tarjeta\"><div class=\"tarjeta-cab\"><h2 class=\"sub\">Programa de esta fase</h2>'\n    + '<a class=\"eti\" href=\"ejercicios.html\" style=\"text-decoration:none\">Biblioteca →</a></div>'\n    + (programaDe(L).length\n        ? programaDe(L).map(function(e){\n            return '<div class=\"fila\" style=\"cursor:default\"><span class=\"cu\"><b>' + e.n + '</b>'\n              + '<small>' + dosis(e) + ' — ' + e.nota + '</small></span></div>';\n          }).join('')\n        : '<div class=\"vacio\"><b>Sin programa cargado para la fase ' + L.fase + '</b>'\n          + 'Armalo desde la biblioteca o dibujá un circuito en el pizarrón.</div>')\n    + '</div>'\n\n    /* sesiones */\n    + '<div class=\"tarjeta\"><div class=\"tarjeta-cab\"><h2 class=\"sub\">Sesiones</h2>'\n    + '<span class=\"eti\">Dolor antes → después</span></div>'\n    + L.sesiones.map(function(s){\n        var baja = s.post < s.pre;\n        return '<div class=\"fila\" style=\"cursor:default;align-items:flex-start\">'\n          + '<span class=\"hh\">' + fechaCorta(s.f) + '</span>'\n          + '<span class=\"cu\"><b>' + s.t + '</b><small>' + s.nota + '</small></span>'\n          + '<span class=\"pin ' + (baja ? 'atendido' : 'gris') + '\">' + s.pre + ' → ' + s.post + '</span></div>';\n      }).join('')\n    + '<button class=\"bt hueco ancho\" style=\"margin-top:12px\" onclick=\"abrirSesion()\">Cargar sesión de hoy</button>'\n    + '</div>';\n}\n\n/* ── Cargar la sesión del día ──────────────────────────────────────\n   Es la pantalla que el kinesiólogo usa quince veces por día, así que\n   tiene que ser rápida: el tipo y las dos escalas de dolor se tocan,\n   no se escriben. Solo la nota se tipea, y es opcional.\n\n   El dolor antes y después es el dato que importa: la diferencia entre\n   los dos es lo que muestra si la sesión sirvió. Por eso los dos son\n   obligatorios y la nota no.                                          */\nvar sesionNueva = null;\n\nfunction abrirSesion(){\n  var L = lesionPorId(abierta);\n  if(!L) return;\n  sesionNueva = {tipo:'Tratamiento', pre:null, post:null, nota:''};\n\n  var caja = document.createElement('div');\n  caja.className = 'ayuda-fondo';\n  caja.id = 'cajaSesion';\n  caja.innerHTML =\n    '<div class=\"ayuda-caja\">'\n    + '<button class=\"cerrar\" onclick=\"cerrarSesion()\" aria-label=\"Cerrar\">&times;</button>'\n    + '<span class=\"eti\">Sesión de hoy</span>'\n    + '<h2>' + nombrePaciente(L) + ' · ' + L.zona.toLowerCase() + '</h2>'\n    + '<p>Día ' + dias(L.fecha) + ' · fase ' + L.fase + ', ' + FASES[L.fase-1].t.toLowerCase() + '</p>'\n\n    + '<label class=\"campo\"><span class=\"eti\">Qué tipo de sesión</span>'\n    + '<div class=\"pestanias\" id=\"tipoSes\" style=\"margin-bottom:0\">'\n    + ['Evaluación','Tratamiento','Gimnasio','Campo'].map(function(t){\n        return '<button class=\"pest' + (t === 'Tratamiento' ? ' on' : '') + '\" data-t=\"' + t + '\">' + t + '</button>';\n      }).join('')\n    + '</div></label>'\n\n    + '<label class=\"campo\"><span class=\"eti\">Dolor al llegar</span><div id=\"esPre\"></div></label>'\n    + '<label class=\"campo\"><span class=\"eti\">Dolor al terminar</span><div id=\"esPost\"></div></label>'\n    + '<label class=\"campo\"><span class=\"eti\">Qué se hizo (opcional)</span>'\n    + '<textarea id=\"notaSes\" placeholder=\"Movilidad articular, isométricos de eversión...\"></textarea></label>'\n\n    + '<div id=\"avisoSes\"></div>'\n    + '<button class=\"bt ancho\" onclick=\"guardarSesion()\">Guardar sesión</button>'\n    + '</div>';\n\n  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarSesion(); });\n  document.body.appendChild(caja);\n  document.body.style.overflow = 'hidden';\n\n  var tipos = document.getElementById('tipoSes');\n  tipos.querySelectorAll('.pest').forEach(function(b){\n    b.onclick = function(){\n      tipos.querySelectorAll('.pest').forEach(function(x){ x.classList.remove('on'); });\n      b.classList.add('on'); sesionNueva.tipo = b.dataset.t;\n    };\n  });\n  escala(document.getElementById('esPre'),  function(v){ sesionNueva.pre = v; });\n  escala(document.getElementById('esPost'), function(v){ sesionNueva.post = v; });\n}\n\nfunction cerrarSesion(){\n  var c = document.getElementById('cajaSesion');\n  if(c) c.remove();\n  document.body.style.overflow = '';\n}\n\nfunction guardarSesion(){\n  var av = document.getElementById('avisoSes');\n  if(sesionNueva.pre === null || sesionNueva.post === null){\n    av.innerHTML = '<div class=\"nota aviso\">Marcá el dolor al llegar y al terminar. '\n      + 'La diferencia entre los dos es el dato que sirve.</div>';\n    return;\n  }\n  var L = lesionPorId(abierta);\n  sesionNueva.nota = document.getElementById('notaSes').value.trim() || '—';\n\n  L.sesiones.unshift({f:HOY, t:sesionNueva.tipo, pre:sesionNueva.pre,\n                      post:sesionNueva.post, nota:sesionNueva.nota});\n  asentar(L.pid, 'sesion',\n    sesionNueva.tipo + '. Dolor al llegar ' + sesionNueva.pre + '/10, al terminar '\n    + sesionNueva.post + '/10. Fase ' + L.fase + '. ' + sesionNueva.nota);\n  guardar('kine/sesiones/' + L.id + '/' + HOY, {\n    dorsal:L.dorsal, fecha:HOY, tipo:sesionNueva.tipo,\n    dolor_pre:sesionNueva.pre, dolor_post:sesionNueva.post,\n    notas:sesionNueva.nota, fase:L.fase\n  });\n  var pac = L.pid ? paciente(L.pid) : null;\n  if(pac && pac.estado === 'pendiente'){\n    pac.estado = 'activo';\n    guardar('kine/pacientes/' + pac.id + '/estado', 'activo');\n  }\n  cerrarSesion();\n  pintar();\n}\n\nfunction abrir(id){\n  abierta = id;\n  PARAMSET('f', id);\n  pintar(); scrollTo(0, 0);\n}\nfunction tildar(i, v){\n  var L = lesionPorId(abierta);\n  L.criterios[i].ok = v;\n  guardar('kine/lesiones/' + L.id + '/criterios/' + i + '/ok', v);\n  asentar(L.pid, 'criterio',\n    (v ? 'Cumple' : 'Deja de cumplir') + ' el criterio de fase ' + L.fase\n    + ': ' + L.criterios[i].t + '.');\n  pintar();\n}\nfunction avanzar(){\n  var L = lesionPorId(abierta);\n  if(L.fase >= 5) return;\n  L.fase++;\n\n  /* Los criterios de la fase nueva salen de la plantilla de esa zona.\n     El kine no los escribe: aparecen. */\n  L.criterios = (L.fase <= 4) ? criteriosDe(L.zona, L.fase) : [];\n\n  /* El parte médico se mueve solo con la fase. De baja hasta la 3,\n     limitado en la 4, disponible al llegar a la 5. Nadie lo carga a\n     mano, así que no se puede quedar viejo. */\n  var d = L.dorsal;\n  if(d){\n    if(L.fase >= 5){\n      delete BASE.disponibilidad[d];\n      guardar('kine/disponibilidad/' + d, null);\n    }else{\n      BASE.disponibilidad[d] = {\n        estado: estadoPorFase(L.fase), motivo: L.zona.toLowerCase(),\n        desde: L.fecha, hasta: L.alta\n      };\n      guardar('kine/disponibilidad/' + d, BASE.disponibilidad[d]);\n    }\n  }\n\n  /* Fase 5 es el alta. La lesión se cierra y deja de figurar entre las\n     activas, pero queda en el historial del paciente. */\n  if(L.fase >= 5){\n    L.estado = 'alta';\n    L.alta_real = HOY;\n    guardar('kine/lesiones/' + L.id, L);\n    asentar(L.pid, 'alta_medica',\n      'Alta. ' + L.diagnostico + ', ' + dias(L.fecha) + ' días de tratamiento y '\n      + L.sesiones.length + ' sesiones. Completó las cinco fases cumpliendo los criterios '\n      + 'de cada una. Queda disponible sin restricciones.');\n    ALTA_DADA = nombrePaciente(L);\n    abrir(null);\n    return;\n  }\n\n  asentar(L.pid, 'cambio_fase',\n    'Pasa a fase ' + L.fase + ', ' + FASES[L.fase-1].t.toLowerCase()\n    + ', tras cumplir todos los criterios de la anterior. '\n    + 'Se cargan ' + L.criterios.length + ' criterios nuevos. '\n    + 'Disponibilidad: ' + estadoPorFase(L.fase) + '.');\n  guardar('kine/lesiones/' + L.id, L);\n  pintar();\n}\npintar();\n\n\n/* Registra el sw para que el portal ande sin internet. Falla en silencio\n   si se abre con doble clic desde el disco: eso es normal. */\nif('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});\n"}, "mi": {"pag": "mi", "cuerpo": "<div class=\"hoja angosta\" id=\"todo\"></div>", "js": "\nvar L = lesionDe(miDorsal());\nvar hechos = {}, dolor = null, esfuerzo = null;\n\nif(!L){\n  document.getElementById('todo').innerHTML =\n    '<h1 class=\"tit\">Estás al día</h1>'\n    + '<p class=\"bajada\">No tenés ninguna lesión abierta. Si te empezó a molestar algo, '\n    + 'pedí un turno y lo vemos.</p>'\n    + '<a class=\"bt\" href=\"agenda.html\" style=\"text-decoration:none;display:inline-block\">Pedir un turno</a>';\n}else{\n  pintar();\n}\n\nfunction pintar(){\n  var prog = programaDe(L);\n  var prox = null;\n  (BASE.agenda[HOY] || []).concat(BASE.agenda['2026-08-31'] || []).forEach(function(t){\n    if(!prox && t.dorsal === miDorsal() && t.estado === 'reservado') prox = t;\n  });\n\n  document.getElementById('todo').innerHTML =\n\n    '<h1 class=\"tit\">' + L.zona + ' ' + (L.lado === '—' ? '' : L.lado) + '</h1>'\n    + '<p class=\"bajada\">' + L.diagnostico + '. Llevás ' + dias(L.fecha)\n    + ' días y faltan ' + faltan(L.alta) + ' para el alta prevista.</p>'\n\n    /* dónde estás */\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Dónde estás</h2>'\n    + '<span class=\"eti\">Día ' + dias(L.fecha) + '</span></div>'\n    + pista(L.fase)\n    + '<p style=\"margin-top:14px\">' + FASES[L.fase-1].d + '</p>'\n    + '<div class=\"nota info\" style=\"margin-top:14px\">'\n    + 'Para pasar a <b>' + FASES[Math.min(L.fase,4)].t.toLowerCase() + '</b> te falta: '\n    + L.criterios.filter(function(c){ return !c.ok; }).map(function(c){ return c.t.toLowerCase(); }).join('; ')\n    + '.</div></div>'\n\n    /* turno */\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Tu próximo turno</h2>'\n    + '<a class=\"eti\" href=\"agenda.html\" style=\"text-decoration:none\">Cambiar →</a></div>'\n    + (prox\n        ? '<div class=\"fila\" style=\"cursor:default;border-color:var(--azul)\">'\n          + '<span class=\"hh\">' + prox.h + '</span>'\n          + '<span class=\"cu\"><b>' + prox.tipo + ' con Vero</b>'\n          + '<small>En el estudio. Te avisamos una hora antes.</small></span>'\n          + '<span class=\"pin reservado\">reservado</span></div>'\n        : '<div class=\"vacio\"><b>No tenés turno reservado</b>Pedilo desde la agenda.</div>')\n    + '</div>'\n\n    /* programa */\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Tus ejercicios de hoy</h2>'\n    + '<span class=\"eti\" id=\"cuenta\">0 de ' + prog.length + '</span></div>'\n    + (prog.length\n        ? prog.map(function(e, i){\n            return '<div class=\"fila\" style=\"align-items:flex-start;cursor:pointer\" onclick=\"marcar(' + i + ')\" id=\"ej' + i + '\">'\n              + '<input type=\"checkbox\" style=\"width:19px;height:19px;accent-color:var(--azul);margin-top:3px\" '\n              + 'onclick=\"event.stopPropagation();marcar(' + i + ')\">'\n              + '<span class=\"cu\"><b>' + e.n + '</b>'\n              + '<small class=\"mono\" style=\"color:var(--acc-texto)\">' + dosis(e) + '</small>'\n              + '<small>' + e.nota + '</small></span>'\n              + '<span class=\"pin ' + (e.video ? 'reservado' : 'gris') + '\" '\n              + 'onclick=\"event.stopPropagation();verEjercicio(' + i + ')\">'\n              + (e.video ? 'Ver video' : 'Sin video') + '</span>'\n              + '</div>';\n          }).join('')\n        : '<div class=\"vacio\"><b>Todavía no hay programa</b>Vero lo carga después de tu próximo turno.</div>')\n\n    + (prog.length\n        ? '<label class=\"campo\" style=\"margin-top:18px\"><span class=\"eti\">Cuánto te dolió mientras los hacías</span>'\n          + '<div id=\"esDolor\"></div></label>'\n          + '<label class=\"campo\"><span class=\"eti\">Qué tan exigente te resultó</span>'\n          + '<div id=\"esEsf\"></div></label>'\n          + '<button class=\"bt ancho\" onclick=\"enviar()\">Enviar al kinesiólogo</button>'\n          + '<div class=\"nota bien\" id=\"listo\" style=\"display:none;margin-top:12px\">'\n          + 'Enviado. Vero lo ve antes de tu próximo turno.</div>'\n        : '')\n    + '</div>'\n\n    /* historial */\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Lo que llevás hecho</h2>'\n    + '<span class=\"eti\">' + L.sesiones.length + ' sesiones</span></div>'\n    + L.sesiones.map(function(s){\n        return '<div class=\"fila\" style=\"cursor:default\"><span class=\"hh\">' + fechaCorta(s.f) + '</span>'\n          + '<span class=\"cu\"><b>' + s.t + '</b></span>'\n          + '<span class=\"pin ' + (s.post < s.pre ? 'atendido' : 'gris') + '\">dolor ' + s.pre + ' → ' + s.post + '</span></div>';\n      }).join('')\n    + '</div>';\n\n  if(prog.length){\n    escala(document.getElementById('esDolor'), function(v){ dolor = v; }, dolor);\n    escala(document.getElementById('esEsf'),  function(v){ esfuerzo = v; }, esfuerzo);\n  }\n  actualizarCuenta();\n}\n\nfunction verEjercicio(i){\n  var e = programaDe(L)[i];\n  abrirVideo(e.n, e.video, dosis(e) + ' — ' + e.nota);\n}\nfunction marcar(i){\n  hechos[i] = !hechos[i];\n  var f = document.getElementById('ej' + i);\n  f.querySelector('input').checked = hechos[i];\n  f.style.background = hechos[i] ? 'var(--verde-suave)' : '';\n  f.style.borderColor = hechos[i] ? '#BCDCC9' : '';\n  actualizarCuenta();\n}\nfunction actualizarCuenta(){\n  var c = document.getElementById('cuenta');\n  if(!c) return;\n  var n = 0; for(var k in hechos) if(hechos[k]) n++;\n  c.textContent = n + ' de ' + programaDe(L).length;\n}\nfunction enviar(){\n  if(dolor === null || esfuerzo === null){\n    alert('Marcá cuánto te dolió y qué tan exigente te resultó.'); return;\n  }\n  guardar('kine/adherencia/' + miDorsal() + '/' + HOY,\n          {hechos:hechos, dolor:dolor, esfuerzo:esfuerzo});\n  document.getElementById('listo').style.display = 'block';\n}\n\n\n/* Registra el sw para que el portal ande sin internet. Falla en silencio\n   si se abre con doble clic desde el disco: eso es normal. */\nif('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});\n"}, "pacientes": {"pag": "pacientes", "cuerpo": "<div class=\"hoja\">\n  <h1 class=\"tit\">Pacientes</h1>\n  <p class=\"bajada\">Todos los que pasaron por el estudio. Se dan de alta solos desde el\n  enlace de abajo: vos no cargás datos a mano, solo atendés.</p>\n\n  <div class=\"rejilla c4\" style=\"margin-bottom:20px\">\n    <div class=\"dato\"><div class=\"v\" id=\"kTotal\">—</div><div class=\"l\">En el padrón</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kPlantel\">—</div><div class=\"l\">Del plantel</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kPart\">—</div><div class=\"l\">Particulares</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kPend\" style=\"color:var(--ambar)\">—</div><div class=\"l\">Sin atender</div></div>\n  </div>\n\n  <div class=\"tarjeta\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">El enlace para darse de alta</h2>\n      <span class=\"eti\">Pegalo en la puerta del estudio</span></div>\n    <p style=\"color:var(--tinta2);font-size:14px;margin-bottom:12px\">\n      Mandáselo por WhatsApp al paciente nuevo, o dejalo a la vista en la recepción.\n      Se completa en dos minutos desde el celular y queda cargado acá solo.</p>\n    <div style=\"display:flex;gap:18px;align-items:center;flex-wrap:wrap\">\n      <div style=\"width:150px;flex-shrink:0\" id=\"qrChico\"></div>\n      <div style=\"flex:1;min-width:220px\">\n        <div class=\"fila\" style=\"cursor:default\">\n          <span class=\"cu mono\" id=\"enlace\" style=\"overflow-wrap:anywhere;font-size:14px\"></span>\n        </div>\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:8px\">\n          <button class=\"bt hueco chico\" onclick=\"compartirAlta()\">Compartir</button>\n          <button class=\"bt hueco chico\" onclick=\"porWhatsapp()\">WhatsApp</button>\n          <a class=\"bt neutro chico\" href=\"cartel.html\" style=\"text-decoration:none\">Ver el cartel</a>\n        </div>\n      </div>\n    </div>\n    <div class=\"nota bien\" id=\"copiado\" style=\"display:none\">Copiado. Pegalo donde quieras.</div>\n  </div>\n\n  <div class=\"pestanias\">\n    <button class=\"pest on\" data-f=\"todos\">Todos</button>\n    <button class=\"pest\" data-f=\"pendiente\">Sin atender</button>\n    <button class=\"pest\" data-f=\"plantel\">Plantel</button>\n    <button class=\"pest\" data-f=\"particular\">Particulares</button>\n  </div>\n\n  <div class=\"tarjeta\">\n    <label class=\"campo\"><span class=\"eti\">Buscar</span>\n      <input type=\"text\" id=\"buscar\" placeholder=\"Nombre o documento\"></label>\n    <div id=\"lista\"></div>\n  </div>\n\n  <div id=\"detalle\"></div>\n</div>", "js": "\nvar filtro = 'todos', abierto = null;\n\ndocument.getElementById('enlace').textContent = enlaceAlta();\nfunction enlaceAlta(){\n  var u = location.href.split('?')[0].replace(/[^\\/]*$/, 'alta.html');\n  return u.indexOf('file:') === 0 ? 'https://estudio-kine.vercel.app/alta.html' : u;\n}\ndocument.getElementById('qrChico').innerHTML =\n  qrSVG(enlaceAlta(), {tinta:'#000000', fondo:'#FFFFFF'});\n\n/* En el celular abre el menú de compartir del sistema. En la computadora\n   ese menú no existe, así que copia el enlace al portapapeles. */\nfunction compartirAlta(){\n  var u = enlaceAlta();\n  if(navigator.share){\n    navigator.share({title:'Estudio de kinesiología',\n      text:'Cargá tus datos para atenderte en el estudio:', url:u}).catch(function(){});\n  }else if(navigator.clipboard){\n    navigator.clipboard.writeText(u);\n    document.getElementById('copiado').style.display = 'block';\n  }\n}\nfunction porWhatsapp(){\n  var t = 'Hola. Para atenderte en el estudio, cargá tus datos acá una sola vez: ' + enlaceAlta();\n  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');\n}\n\ndocument.querySelectorAll('.pest[data-f]').forEach(function(b){\n  b.onclick = function(){\n    document.querySelectorAll('.pest[data-f]').forEach(function(x){ x.classList.remove('on'); });\n    b.classList.add('on'); filtro = b.dataset.f; pintar();\n  };\n});\ndocument.getElementById('buscar').oninput = pintar;\n\nfunction pintar(){\n  var q = (document.getElementById('buscar').value || '').toLowerCase().trim();\n  var todos = BASE.pacientes;\n\n  document.getElementById('kTotal').textContent   = todos.length;\n  document.getElementById('kPlantel').textContent = todos.filter(function(p){ return p.tipo === 'plantel'; }).length;\n  document.getElementById('kPart').textContent    = todos.filter(function(p){ return p.tipo === 'particular'; }).length;\n  document.getElementById('kPend').textContent    = todos.filter(function(p){ return p.estado === 'pendiente'; }).length;\n\n  var l = todos.filter(function(p){\n    if(filtro === 'pendiente' && p.estado !== 'pendiente') return false;\n    if((filtro === 'plantel' || filtro === 'particular') && p.tipo !== filtro) return false;\n    if(q && (p.nombre + ' ' + p.doc).toLowerCase().indexOf(q) < 0) return false;\n    return true;\n  });\n\n  document.getElementById('lista').innerHTML = l.length\n    ? l.map(function(p){\n        var L = lesionesDe(p);\n        var marca = p.estado === 'pendiente' ? '<span class=\"pin limitado\">sin atender</span>'\n                  : (L ? '<span class=\"pin reservado\">en tratamiento</span>'\n                       : '<span class=\"pin gris\">al día</span>');\n        return '<button class=\"fila\" onclick=\"abrir(\\'' + p.id + '\\')\">'\n          + (p.foto\n              ? '<img src=\"' + p.foto + '\" style=\"width:38px;height:38px;border-radius:50%;'\n                + 'object-fit:cover;flex-shrink:0\">'\n              : '<span class=\"hh\">' + (p.tipo === 'plantel' ? '#' + (p.dorsal || '?') : 'P') + '</span>')\n          + '<span class=\"cu\"><b>' + p.nombre + '</b><small>'\n          + (edad(p.nacimiento) !== null ? edad(p.nacimiento) + ' años · ' : '')\n          + (p.tipo === 'plantel' ? 'plantel del club' : (p.obra_social || 'particular'))\n          + '</small></span>' + marca + '</button>';\n      }).join('')\n    : '<div class=\"vacio\"><b>Nadie con ese filtro</b>Probá con otro, o borrá la búsqueda.</div>';\n}\n\nfunction lesionesDe(p){\n  for(var i=0;i<BASE.lesiones.length;i++)\n    if(BASE.lesiones[i].pid === p.id && BASE.lesiones[i].estado === 'activa') return BASE.lesiones[i];\n  return null;\n}\n\nfunction abrir(id){\n  abierto = id;\n  var p = paciente(id), L = lesionesDe(p);\n  var menor = esMenor(p.nacimiento);\n\n  document.getElementById('detalle').innerHTML =\n    '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">' + p.nombre + '</h2>'\n    + '<span class=\"eti\">' + p.id + '</span></div>'\n\n    + (p.estado === 'pendiente'\n        ? '<div class=\"nota aviso\">Se dio de alta solo el ' + fechaCorta(p.alta)\n          + ' y todavía no lo atendiste. Cuando le cargues la primera sesión pasa a activo.</div>'\n        : '')\n    + (menor\n        ? '<div class=\"nota info\">Es menor de edad. Autoriza <b>' + (p.tutor ? p.tutor.nombre : '—')\n          + '</b> (' + (p.tutor ? p.tutor.vinculo : '—') + '), tel ' + (p.tutor ? p.tutor.tel : '—') + '.</div>'\n        : '')\n\n    + '<div class=\"rejilla c2\">'\n    + campo('Documento', p.doc) + campo('Edad', edad(p.nacimiento) + ' años')\n    + campo('Teléfono', p.tel) + campo('Correo', p.email || '—')\n    + campo(p.tipo === 'plantel' ? 'Camiseta' : 'Obra social',\n            p.tipo === 'plantel' ? '#' + (p.dorsal || '?') : (p.obra_social || 'Particular'))\n    + campo('En el padrón desde', fechaCorta(p.alta))\n    + '</div>'\n\n    + (p.motivo ? '<label class=\"campo\"><span class=\"eti\">Por qué vino, en sus palabras</span>'\n        + '<p style=\"color:var(--tinta2)\">' + p.motivo + '</p></label>' : '')\n\n    + '<div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:14px\">'\n    + (L ? '<a class=\"bt\" href=\"lesiones.html?f=' + L.id + '\" style=\"text-decoration:none\">Ver su ficha</a>'\n         : '<button class=\"bt\" onclick=\"abrirLesion(\\'' + p.id + '\\')\">Abrir una lesión</button>')\n    + '<a class=\"bt neutro\" href=\"agenda.html\" style=\"text-decoration:none\">Darle un turno</a>'\n    + '<button class=\"bt neutro\" onclick=\"cerrar()\">Cerrar</button>'\n    + '</div></div>';\n  document.getElementById('detalle').scrollIntoView({behavior:'smooth', block:'start'});\n}\n/* ── ABRIR UNA LESION ──────────────────────────────────────────────\n   Se eligen zona, gravedad y diagnóstico. Todo lo demás lo pone el\n   sistema: los criterios de la fase 1 salen de plantillas.js, la fecha\n   estimada de alta sale de la zona más la gravedad, y la disponibilidad\n   que ve el cuerpo técnico se deduce de la fase.\n\n   El kine no escribe nada de eso, y aun así puede corregirlo después\n   desde la ficha.                                                     */\nvar NL = {};\n\nfunction abrirLesion(pid){\n  var p = paciente(pid);\n  NL = {pid: pid, zona: 'Tobillo', lado: 'derecho', gravedad: 2,\n        diagnostico: '', mecanismo: '', fecha: HOY};\n\n  var caja = document.createElement('div');\n  caja.className = 'ayuda-fondo';\n  caja.id = 'cajaLesion';\n  caja.innerHTML = '<div class=\"ayuda-caja\"><div id=\"cuerpoLesion\"></div></div>';\n  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarLesion(); });\n  document.body.appendChild(caja);\n  document.body.style.overflow = 'hidden';\n  pintarLesion();\n}\n\nfunction pintarLesion(){\n  var p = paciente(NL.pid);\n  var pl = PLANTILLAS[NL.zona] || PLANTILLAS.Otra;\n  NL.alta = altaEstimada(NL.zona, NL.gravedad, NL.fecha);\n  var crit = criteriosDe(NL.zona, 1);\n\n  document.getElementById('cuerpoLesion').innerHTML =\n    '<button class=\"cerrar\" onclick=\"cerrarLesion()\" aria-label=\"Cerrar\">&times;</button>'\n    + '<span class=\"eti\">Lesión nueva</span>'\n    + '<h2>' + p.nombre + '</h2>'\n    + '<p>' + (p.tipo === 'plantel' ? 'Plantel · camiseta ' + (p.dorsal || '?') : (p.obra_social || 'Particular'))\n    + ' · ' + edad(p.nacimiento) + ' años</p>'\n\n    + '<label class=\"campo\"><span class=\"eti\">Zona</span>'\n    + '<div class=\"pestanias\" id=\"lZona\" style=\"margin-bottom:0\">'\n    + ZONAS.map(function(z){\n        return '<button class=\"pest' + (z === NL.zona ? ' on' : '') + '\" data-z=\"' + z + '\">' + z + '</button>';\n      }).join('') + '</div></label>'\n\n    + '<label class=\"campo\"><span class=\"eti\">Lado</span>'\n    + '<div class=\"pestanias\" id=\"lLado\" style=\"margin-bottom:0\">'\n    + ['derecho','izquierdo','—'].map(function(x){\n        return '<button class=\"pest' + (x === NL.lado ? ' on' : '') + '\" data-l=\"' + x + '\">' + x + '</button>';\n      }).join('') + '</div></label>'\n\n    + '<label class=\"campo\"><span class=\"eti\">Qué tiene</span>'\n    + '<select id=\"lDiag\">'\n    + pl.diagnosticos.map(function(d){\n        return '<option' + (d === NL.diagnostico ? ' selected' : '') + '>' + d + '</option>';\n      }).join('') + '</select></label>'\n\n    + '<label class=\"campo\"><span class=\"eti\">Gravedad</span>'\n    + '<div class=\"pestanias\" id=\"lGrav\" style=\"margin-bottom:0\">'\n    + GRAVEDAD.map(function(g){\n        return '<button class=\"pest' + (g.n === NL.gravedad ? ' on' : '') + '\" data-g=\"' + g.n + '\">' + g.t + '</button>';\n      }).join('') + '</div>'\n    + '<small style=\"color:var(--tinta3);font-size:13px\">'\n    + GRAVEDAD[NL.gravedad-1].d + '</small></label>'\n\n    + '<label class=\"campo\"><span class=\"eti\">Cómo se lesionó</span>'\n    + '<textarea id=\"lMec\" placeholder=\"Caída tras disputa aérea, apoyo sobre el pie de un rival...\">'\n    + (NL.mecanismo || '') + '</textarea></label>'\n\n    + '<label class=\"campo\"><span class=\"eti\">Cuándo</span>'\n    + '<input type=\"date\" id=\"lFecha\" value=\"' + NL.fecha + '\"></label>'\n\n    /* Lo que el sistema completa solo: se muestra para que el kine lo\n       vea antes de guardar, no para que lo escriba. */\n    + '<div class=\"nota info\"><b>Se va a completar solo:</b><br>'\n    + 'Alta estimada el ' + fechaCorta(NL.alta) + ' (' + faltan(NL.alta) + ' días).<br>'\n    + 'Arranca en fase 1 con ' + crit.length + ' criterios de ' + NL.zona.toLowerCase() + '.<br>'\n    + 'El parte médico lo va a mostrar como <b>de baja</b>.</div>'\n\n    + '<button class=\"bt ancho\" onclick=\"guardarLesion()\">Abrir la lesión</button>';\n\n  document.querySelectorAll('#lZona .pest').forEach(function(b){\n    b.onclick = function(){ NL.zona = b.dataset.z; NL.diagnostico = ''; pintarLesion(); };\n  });\n  document.querySelectorAll('#lLado .pest').forEach(function(b){\n    b.onclick = function(){ NL.lado = b.dataset.l; pintarLesion(); };\n  });\n  document.querySelectorAll('#lGrav .pest').forEach(function(b){\n    b.onclick = function(){ NL.gravedad = +b.dataset.g; pintarLesion(); };\n  });\n  ['lDiag','lMec','lFecha'].forEach(function(id){\n    var e = document.getElementById(id);\n    e.onchange = e.oninput = function(){\n      if(id === 'lDiag')  NL.diagnostico = e.value;\n      if(id === 'lMec')   NL.mecanismo = e.value;\n      if(id === 'lFecha'){ NL.fecha = e.value; pintarLesion(); }\n    };\n  });\n}\n\nfunction cerrarLesion(){\n  var c = document.getElementById('cajaLesion');\n  if(c) c.remove();\n  document.body.style.overflow = '';\n}\n\nfunction guardarLesion(){\n  var p = paciente(NL.pid);\n  var diag = document.getElementById('lDiag').value;\n  var mec  = (document.getElementById('lMec').value || '').trim();\n  var fec  = document.getElementById('lFecha').value || HOY;\n\n  var id = 'L' + (BASE.lesiones.length + 1) + Date.now().toString().slice(-4);\n  var L = {\n    id: id, pid: NL.pid, dorsal: p.dorsal || null,\n    zona: NL.zona, lado: NL.lado,\n    diagnostico: diag, mecanismo: mec || '—',\n    fecha: fec, gravedad: NL.gravedad,\n    fase: 1, estado: 'activa',\n    alta: altaEstimada(NL.zona, NL.gravedad, fec),\n    kine: 'Vero',\n    criterios: criteriosDe(NL.zona, 1),\n    sesiones: []\n  };\n  BASE.lesiones.push(L);\n  guardar('kine/lesiones/' + id, L);\n  asentar(NL.pid, 'lesion_abierta',\n    L.diagnostico + '. ' + L.zona + ' ' + L.lado + ', gravedad ' + L.gravedad + ' de 4. '\n    + 'Mecanismo: ' + L.mecanismo + ' Se inicia en fase 1 con ' + L.criterios.length\n    + ' criterios de pase. Alta estimada para el ' + fechaCorta(L.alta) + '.');\n\n  /* El parte médico se actualiza solo. Es la parte que más se olvida\n     cuando se carga a mano, y la que más le importa al entrenador. */\n  if(p.dorsal){\n    BASE.disponibilidad[p.dorsal] = {\n      estado: estadoPorFase(1), motivo: NL.zona.toLowerCase(),\n      desde: fec, hasta: L.alta\n    };\n    guardar('kine/disponibilidad/' + p.dorsal, BASE.disponibilidad[p.dorsal]);\n  }\n  if(p.estado === 'pendiente'){\n    p.estado = 'activo';\n    guardar('kine/pacientes/' + p.id + '/estado', 'activo');\n  }\n\n  cerrarLesion();\n  irA('lesiones.html?f=' + id);\n}\n\nfunction campo(l, v){\n  return '<div style=\"margin-bottom:12px\"><span class=\"eti\">' + l + '</span>'\n       + '<div class=\"mono\" style=\"font-size:15px;margin-top:3px\">' + v + '</div></div>';\n}\nfunction cerrar(){ abierto = null; document.getElementById('detalle').innerHTML = ''; }\n\npintar();\n"}, "panel": {"pag": "panel", "cuerpo": "<div class=\"hoja\">\n  <h1 class=\"tit\">Viernes 28 de agosto</h1>\n  <p class=\"bajada\">Lo que hay que resolver hoy, y cómo está el plantel.</p>\n\n  <div class=\"rejilla c4\" style=\"margin-bottom:14px\">\n    <div class=\"dato\"><div class=\"v\" id=\"kPac\">—</div><div class=\"l\">Pacientes</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kMes\">—</div><div class=\"l\">Sesiones del mes</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kPend\" style=\"color:var(--ambar)\">—</div><div class=\"l\">Pendientes</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kTurnos\">—</div><div class=\"l\">Turnos hoy</div></div>\n  </div>\n  <div class=\"rejilla c4\" style=\"margin-bottom:20px\">\n    <div class=\"dato\"><div class=\"v\" id=\"kIng\" style=\"color:var(--verde)\">—</div><div class=\"l\">Ingresos del mes</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kEgr\" style=\"color:var(--rojo)\">—</div><div class=\"l\">Egresos del mes</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kSal\">—</div><div class=\"l\">Saldo</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kAus\" style=\"color:var(--ambar)\">—</div><div class=\"l\">Ausencias</div></div>\n  </div>\n  <div class=\"rejilla c3\" style=\"margin-bottom:20px\">\n    <div class=\"dato\"><div class=\"v\" id=\"kOk\" style=\"color:var(--verde)\">—</div><div class=\"l\">Disponibles</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kLim\" style=\"color:var(--ambar)\">—</div><div class=\"l\">Limitados</div></div>\n    <div class=\"dato\"><div class=\"v\" id=\"kBaja\" style=\"color:var(--rojo)\">—</div><div class=\"l\">De baja</div></div>\n  </div>\n\n  <div class=\"rejilla c2\">\n    <div>\n      <div class=\"tarjeta\">\n        <div class=\"tarjeta-cab\"><h2 class=\"sub\">Turnos de hoy</h2>\n          <a class=\"eti\" href=\"agenda.html\" style=\"text-decoration:none\">Ver agenda →</a></div>\n        <div id=\"turnos\"></div>\n      </div>\n    </div>\n\n    <div>\n      <div class=\"tarjeta\">\n        <div class=\"tarjeta-cab\"><h2 class=\"sub\">En tratamiento</h2>\n          <a class=\"eti\" href=\"lesiones.html\" style=\"text-decoration:none\">Todas →</a></div>\n        <div id=\"activas\"></div>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"tarjeta\">\n    <div class=\"tarjeta-cab\"><h2 class=\"sub\">Parte médico</h2>\n      <span class=\"eti\">Lo único que ve el cuerpo técnico</span></div>\n    <div class=\"plantel\" id=\"plantel\"></div>\n  </div>\n</div>", "js": "\nfunction pintar(){\n/* ── contadores ── */\nvar c = {ok:0, limitado:0, baja:0};\nBASE.plantel.forEach(function(j){ c[estadoDe(j.d).estado]++; });\nvar turnos = BASE.agenda[HOY] || [];\ndocument.getElementById('kTurnos').textContent = turnos.filter(function(t){ return t.dorsal || t.pid; }).length;\n\n/* Los indicadores del negocio, no solo los clínicos. */\nvar est = estadisticaTurnos(), rc = resumenMes();\ndocument.getElementById('kPac').textContent  = BASE.pacientes.length;\ndocument.getElementById('kMes').textContent  = est.atendidos;\ndocument.getElementById('kPend').textContent = est.pendientes;\ndocument.getElementById('kIng').textContent  = plata(rc.ingresos);\ndocument.getElementById('kEgr').textContent  = plata(rc.egresos);\ndocument.getElementById('kSal').textContent  = plata(rc.saldo);\ndocument.getElementById('kSal').style.color  = rc.saldo >= 0 ? 'var(--verde)' : 'var(--rojo)';\ndocument.getElementById('kAus').textContent  = est.porcentajeAusencia + '%';\ndocument.getElementById('kOk').textContent   = c.ok;\ndocument.getElementById('kLim').textContent  = c.limitado;\ndocument.getElementById('kBaja').textContent = c.baja;\n\n/* ── turnos ── */\ndocument.getElementById('turnos').innerHTML = turnos.map(function(t){\n  if(!t.dorsal)\n    return '<div class=\"fila libre\"><span class=\"hh\">' + t.h + '</span>'\n         + '<span class=\"cu\"><b>Libre</b></span></div>';\n  var L = lesionDe(t.dorsal);\n  var nom = t.pid ? paciente(t.pid).nombre : nombre(t.dorsal);\n  var pendiente = t.estado === 'reservado';\n  return '<button class=\"fila\" onclick=\"' + (pendiente\n            ? 'atender(HOY,\\'' + t.h + '\\')'\n            : 'irA(\\'lesiones.html?f=' + (L ? L.id : '') + '\\')') + '\">'\n       + '<span class=\"hh\">' + t.h + '</span>'\n       + '<span class=\"cu\"><b>' + nom + '</b>'\n       + '<small>' + (t.dorsal ? '#' + t.dorsal + ' · ' : '') + t.tipo\n       + (L ? ' · ' + L.zona.toLowerCase() : '') + '</small></span>'\n       + '<span class=\"pin ' + (pendiente ? 'reservado' : t.estado) + '\">'\n       + (pendiente ? 'atender' : t.estado) + '</span></button>';\n}).join('');\n\n/* ── lesiones activas ── */\ndocument.getElementById('activas').innerHTML = BASE.lesiones.filter(function(L){\n  return L.estado === 'activa'; }).map(function(L){\n  var listos = criteriosListos(L), tot = L.criterios.length;\n  return '<button class=\"fila\" style=\"align-items:flex-start\" onclick=\"irA(\\'lesiones.html?f=' + L.id + '\\')\">'\n    + '<span class=\"cu\"><b>' + nombrePaciente(L) + ' · ' + L.zona.toLowerCase() + '</b>'\n    + '<small>' + L.diagnostico + ' — día ' + dias(L.fecha) + '</small>'\n    + pista(L.fase, false)\n    + '<small class=\"mono\" style=\"margin-top:6px\">FASE ' + L.fase + ' · ' + FASES[L.fase-1].t.toUpperCase()\n    + ' · ' + listos + '/' + tot + ' CRITERIOS</small></span></button>';\n}).join('');\n\n/* ── semáforo ── */\ndocument.getElementById('plantel').innerHTML = BASE.plantel.map(function(j){\n  var e = estadoDe(j.d), L = lesionDe(j.d);\n  var txt = e.estado === 'ok' ? 'Disponible'\n          : e.motivo + ' · vuelve en ' + faltan(e.hasta) + ' d';\n  return '<button class=\"at ' + e.estado + '\" onclick=\"' + (L ? 'irA(\\'lesiones.html?f=' + L.id + '\\')' : 'void 0') + '\">'\n    + '<span class=\"d\">' + j.d + '</span><div class=\"n\">' + j.n + '</div>'\n    + '<div class=\"e\">' + txt + '</div></button>';\n}).join('');\n}\npintar();\n\n\n/* Registra el sw para que el portal ande sin internet. Falla en silencio\n   si se abre con doble clic desde el disco: eso es normal. */\nif('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});\n"}, "perfil": {"pag": "perfil", "cuerpo": "<div class=\"hoja angosta\" id=\"todo\"></div>", "js": "\n/* El perfil vive en config.json en producción. Acá se guarda igual que\n   todo lo demás, para poder editarlo desde la app sin tocar archivos. */\nfunction perfil(){\n  if(!BASE.perfil) BASE.perfil = {\n    nombre: 'Verónica Ramírez',\n    matricula: 'MP 12345 — Kinesióloga Fisiatra',\n    estudio: 'Estudio de kinesiología',\n    club: 'Club Atlético',\n    tel: '11 5555 0000',\n    email: 'vero@estudiokine.com',\n    direccion: 'Av. Siempreviva 742',\n    presentacion: 'Kinesióloga con quince años de trabajo en deporte. Me formé en '\n      + 'readaptación de lesiones deportivas y trabajo con el plantel del club desde 2019. '\n      + 'Atiendo también consultas particulares, con o sin lesión deportiva.',\n    foto: null, logo: null\n  };\n  return BASE.perfil;\n}\n\nfunction pintar(){\n  var P = perfil();\n  document.getElementById('todo').innerHTML =\n\n    '<h1 class=\"tit\">Mi perfil</h1>'\n    + '<p class=\"bajada\">Esto es lo que ve el paciente cuando entra al portal, y lo que sale '\n    + 'impreso en el cartel y en la historia clínica.</p>'\n\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">Tu foto</h2>'\n    + '<span class=\"eti\">Se ve en el cartel y en el inicio</span></div>'\n    + '<div style=\"display:flex;gap:20px;align-items:center;flex-wrap:wrap\">'\n    + (P.foto ? '<img class=\"retrato\" src=\"' + P.foto + '\" alt=\"Tu foto\">'\n              : '<div class=\"retrato-vacio\">Sin foto</div>')\n    + '<div style=\"flex:1;min-width:200px\">'\n    + '<input type=\"file\" id=\"fFoto\" accept=\"image/*\" style=\"display:none\" '\n    + 'onchange=\"subirImagen(this,\\'foto\\',400)\">'\n    + '<button class=\"bt hueco\" onclick=\"document.getElementById(\\'fFoto\\').click()\">'\n    + (P.foto ? 'Cambiar la foto' : 'Elegir una foto') + '</button>'\n    + (P.foto ? ' <button class=\"bt neutro\" onclick=\"borrar(\\'foto\\')\">Quitar</button>' : '')\n    + '<p style=\"font-size:13px;color:var(--tinta3);margin-top:10px\">Se achica sola a 400 '\n    + 'píxeles antes de guardarse, así no pesa.</p></div></div></div>'\n\n    + '<div class=\"tarjeta\">'\n    + '<div class=\"tarjeta-cab\"><h2 class=\"sub\">El logo del estudio</h2></div>'\n    + '<div style=\"display:flex;gap:20px;align-items:center;flex-wrap:wrap\">'\n    + (P.logo ? '<img class=\"logo-prev\" src=\"' + P.logo + '\" alt=\"Logo\">'\n              : '<div class=\"retrato-vacio\" sty
