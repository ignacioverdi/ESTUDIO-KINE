<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda · Estudio</title>
<link rel="icon" href="img/icono-192.png">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1D3E6E">
<link rel="stylesheet" href="css/tema.css">
<link rel="stylesheet" href="css/estudio.css">
<script src="js/firebase.js" onerror="void 0"></script>
<script src="js/datos.js"></script><script src="js/plantillas.js"></script><script src="js/qr.js"></script><script src="js/historia.js"></script><script src="js/dinero.js"></script><script src="js/atender.js"></script><script src="js/ayuda.js"></script><script src="js/base.js"></script>
</head>
<body data-pag="agenda">

<div class="hoja">
  <h1 class="tit" id="tit">Agenda</h1>
  <p class="bajada" id="baj"></p>

  <div class="pestanias">
    <button class="pest on" data-d="2026-08-28">Viernes 28</button>
    <button class="pest" data-d="2026-08-31">Lunes 31</button>
  </div>

  <div class="tarjeta">
    <div class="tarjeta-cab"><h2 class="sub" id="subDia"></h2>
      <span class="eti" id="cuenta"></span></div>
    <div id="grilla"></div>
  </div>

  <div class="tarjeta" id="cajaCfg">
    <div class="tarjeta-cab"><h2 class="sub">Horario del estudio</h2>
      <span class="eti">Se aplica a toda la semana</span></div>
    <div class="rejilla c3">
      <label class="campo"><span class="eti">Abre</span><input type="text" value="08:30"></label>
      <label class="campo"><span class="eti">Cierra</span><input type="text" value="12:30"></label>
      <label class="campo"><span class="eti">Minutos por turno</span><input type="number" value="30"></label>
    </div>
    <button class="bt hueco" onclick="alert('Guardado. La grilla se rearma con estos horarios.')">Guardar horario</button>
  </div>
</div>

<script>
var dia = HOY, esKine = rol() === 'kine';

if(!esKine){
  document.getElementById('cajaCfg').style.display = 'none';
  document.getElementById('tit').textContent = 'Mis turnos';
}

document.querySelectorAll('.pest[data-d]').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('.pest[data-d]').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); dia = b.dataset.d; pintar();
  };
});

function pintar(){
  var lista = BASE.agenda[dia] || [];
  var tomados = lista.filter(function(t){ return t.dorsal; }).length;
  var M = ['viernes 28 de agosto','lunes 31 de agosto'];
  document.getElementById('subDia').textContent = dia === HOY ? M[0] : M[1];
  document.getElementById('cuenta').textContent = tomados + ' de ' + lista.length + ' ocupados';
  document.getElementById('baj').textContent = esKine
    ? 'Tocá un turno ocupado para abrir la ficha, o uno libre para asignarlo.'
    : 'Tocá un horario libre para reservarlo. Te llega un aviso una hora antes.';

  document.getElementById('grilla').innerHTML = lista.map(function(t, i){
    if(!t.dorsal){
      return '<button class="fila libre" onclick="reservar(' + i + ')">'
        + '<span class="hh">' + t.h + '</span>'
        + '<span class="cu"><b>' + (esKine ? 'Libre — asignar' : 'Libre — reservar') + '</b></span></button>';
    }
    if(!esKine && t.dorsal !== miDorsal()){
      return '<div class="fila libre" style="opacity:.5"><span class="hh">' + t.h + '</span>'
        + '<span class="cu"><b>Ocupado</b></span></div>';
    }
    var L = lesionDe(t.dorsal);
    var mio = t.dorsal === miDorsal();
    return '<button class="fila" onclick="' + (esKine && L ? 'irA(\'lesiones.html?f=' + L.id + '\')' : 'void 0') + '">'
      + '<span class="hh">' + t.h + '</span>'
      + '<span class="cu"><b>' + (esKine ? (t.pid ? paciente(t.pid).nombre : nombre(t.dorsal)) : 'Tu turno') + '</b>'
      + '<small>' + t.tipo + (esKine && L ? ' · ' + L.zona.toLowerCase() : ' · con Vero') + '</small></span>'
      + '<span class="pin ' + (mio && !esKine ? 'reservado' : t.estado) + '">'
      + (mio && !esKine ? 'tuyo' : t.estado) + '</span>'
      + (esKine && t.estado === 'reservado'
          ? '<button class="bt hueco chico" onclick="event.stopPropagation();atender(dia,\'' + t.h + '\')">Atender</button>'
          : '')
      + '</button>';
  }).join('');
}

/* Antes esto pedía el dorsal con una ventanita del navegador. No servía:
   los pacientes particulares no tienen dorsal, y había que acordarse el
   número de memoria. Ahora se elige del padrón. */
var TURNO = null;

function reservar(i){
  var t = (BASE.agenda[dia] || [])[i];
  if(!t) return;

  if(!esKine){
    var p = pacientePorDorsal(miDorsal());
    t.pid = p ? p.id : null;
    t.dorsal = miDorsal(); t.tipo = 'Tratamiento'; t.estado = 'reservado';
    guardar('kine/agenda/turnos/' + dia + '/' + t.h,
            {pid:t.pid, dorsal:t.dorsal, tipo:t.tipo, estado:'reservado'});
    if(p) asentar(p.id, 'turno', 'Reservó turno para el ' + fechaLarga(dia) + ' a las ' + t.h + '.');
    avisarDelTurno(p, dia, t.h);
    pintar();
    return;
  }

  TURNO = {i: i, hora: t.h, pid: null, tipo: 'Tratamiento'};
  var caja = document.createElement('div');
  caja.className = 'ayuda-fondo';
  caja.id = 'cajaTurno';
  caja.innerHTML =
    '<div class="ayuda-caja">'
    + '<button class="cerrar" onclick="cerrarTurno()" aria-label="Cerrar">&times;</button>'
    + '<span class="eti">Turno nuevo</span>'
    + '<h2>' + t.h + '</h2>'
    + '<p>' + (dia === HOY ? 'Viernes 28 de agosto' : 'Lunes 31 de agosto') + '</p>'

    + '<label class="campo"><span class="eti">Quién viene</span>'
    + '<select id="tPac"><option value="">Elegí un paciente</option>'
    + BASE.pacientes.map(function(p){
        var l = lesionDePaciente(p.id);
        return '<option value="' + p.id + '">' + p.nombre
             + (p.dorsal ? ' (#' + p.dorsal + ')' : '')
             + (l ? ' — ' + l.zona.toLowerCase() : '') + '</option>';
      }).join('') + '</select></label>'

    + '<label class="campo"><span class="eti">Qué tipo de sesión</span>'
    + '<div class="pestanias" id="tTipo" style="margin-bottom:0">'
    + ['Evaluación','Tratamiento','Gimnasio','Campo'].map(function(x){
        return '<button class="pest' + (x === 'Tratamiento' ? ' on' : '') + '" data-t="' + x + '">' + x + '</button>';
      }).join('') + '</div></label>'

    + '<div id="avisoTurno"></div>'
    + '<button class="bt ancho" onclick="guardarTurno()">Dar el turno</button>'
    + '</div>';
  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarTurno(); });
  document.body.appendChild(caja);
  document.body.style.overflow = 'hidden';

  document.querySelectorAll('#tTipo .pest').forEach(function(b){
    b.onclick = function(){
      document.querySelectorAll('#tTipo .pest').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on'); TURNO.tipo = b.dataset.t;
    };
  });
}

/* Cuando un paciente reserva, el kinesiólogo se tiene que enterar.
   Hasta que estén los avisos push, se le arma el mensaje de WhatsApp y
   se le ofrece mandarlo: un toque, sin copiar y pegar nada. */
function avisarDelTurno(p, fecha, hora){
  if(!p) return;
  var telKine = (BASE.perfil && BASE.perfil.tel) ? BASE.perfil.tel.replace(/\D/g,'') : '';
  var txt = 'Turno nuevo: ' + p.nombre + ' reservó para el ' + fechaLarga(fecha)
          + ' a las ' + hora + '. Teléfono: ' + p.tel + '.';
  var caja = document.createElement('div');
  caja.className = 'ayuda-fondo'; caja.id = 'cajaAviso';
  caja.innerHTML = '<div class="ayuda-caja">'
    + '<button class="cerrar" onclick="cerrarAviso()" aria-label="Cerrar">&times;</button>'
    + '<span class="eti">Turno reservado</span>'
    + '<h2>' + hora + ' · ' + fechaLarga(fecha) + '</h2>'
    + '<div class="nota bien">Listo. Te va a llegar un recordatorio una hora antes.</div>'
    + '<p>Si querés, avisale al estudio ahora mismo:</p>'
    + '<a class="bt ancho" style="text-decoration:none;text-align:center" target="_blank" rel="noopener" '
    + 'href="https://wa.me/' + telKine + '?text=' + encodeURIComponent(txt) + '">Avisar por WhatsApp</a>'
    + '<button class="bt neutro ancho" style="margin-top:8px" onclick="cerrarAviso()">Listo</button>'
    + '</div>';
  caja.addEventListener('click', function(e){ if(e.target === caja) cerrarAviso(); });
  document.body.appendChild(caja);
  document.body.style.overflow = 'hidden';
}
function cerrarAviso(){
  var c = document.getElementById('cajaAviso');
  if(c) c.remove();
  document.body.style.overflow = '';
}

function lesionDePaciente(pid){
  for(var i=0;i<BASE.lesiones.length;i++)
    if(BASE.lesiones[i].pid === pid && BASE.lesiones[i].estado === 'activa') return BASE.lesiones[i];
  return null;
}

function cerrarTurno(){
  var c = document.getElementById('cajaTurno');
  if(c) c.remove();
  document.body.style.overflow = '';
}

/* Marcar atendido descuenta el crédito y anota el cobro si paga por
   sesión. Es el único momento en que se toca la plata: si se cobrara al
   reservar, una cancelación a tiempo generaría una discusión. */
function marcarAtendido(i){
  var t = BASE.agenda[dia][i];
  if(!t || !t.pid) return;
  t.estado = 'atendido';
  var p = paciente(t.pid), pl = planDe(p);
  consumirCredito(t.pid);
  if(pl.sesiones === 1 && pl.precio > 0){
    anotarMovimiento({tipo:'ingreso', concepto:'Sesión suelta — ' + p.nombre,
                      monto:pl.precio, pid:t.pid, categoria:'sesiones'});
  }
  guardar('kine/agenda/turnos/' + dia + '/' + t.h + '/estado', 'atendido');
  pintar();
}
function marcarAusente(i){
  var t = BASE.agenda[dia][i];
  if(!t || !t.pid) return;
  t.estado = 'ausente';
  guardar('kine/agenda/turnos/' + dia + '/' + t.h + '/estado', 'ausente');
  pintar();
}

function guardarTurno(){
  var pid = document.getElementById('tPac').value;
  if(!pid){
    document.getElementById('avisoTurno').innerHTML =
      '<div class="nota aviso">Elegí a quién le das el turno.</div>';
    return;
  }
  var p = paciente(pid), t = BASE.agenda[dia][TURNO.i];
  t.pid = pid; t.dorsal = p.dorsal || null; t.tipo = TURNO.tipo; t.estado = 'reservado';
  guardar('kine/agenda/turnos/' + dia + '/' + t.h,
          {pid:pid, dorsal:t.dorsal, tipo:t.tipo, estado:'reservado'});
  cerrarTurno();
  pintar();
}
pintar();
</script>
<script>
/* Registra el sw para que el portal ande sin internet. Falla en silencio
   si se abre con doble clic desde el disco: eso es normal. */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body></html>
